<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF9F0;
    --ink: #1D1D1D;
    --red: #D7263D;
    --strings: #A8D8DC;
    --woodwinds: #BBA6D0;
    --brass: #F8D67B;
    --percussion: #F29E6B;
    --font: "Figtree", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); }

  /* Map stage: sized to fit both the width and the height of the window/iframe */
  .stage {
    position: relative;
    width: min(100%, calc((100vh - 16px) * 1760 / 1270));
    aspect-ratio: 1760 / 1270;
    margin: 8px auto;
    container-type: inline-size;
  }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Regions */
  .region { cursor: pointer; outline: none; transform-box: fill-box; transform-origin: center;
            transition: transform .2s ease; }
  .region .shape { stroke: var(--bg); stroke-width: 14; transition: opacity .2s ease; }
  #map image { pointer-events: none; transform-box: fill-box; transform-origin: center;
               transition: opacity .2s ease, transform .2s ease; }
  #photos { pointer-events: none; }
  .region.active { transform: scale(1.05); }
  .region.active image { transform: translate(var(--sx, 0px), var(--sy, 0px)) scale(1.15); }
  .focusing .region:not(.active) .shape { opacity: .14; }
  /* Fade whole photo groups, not single photos, so overlapping photos
     don't stack their transparency and look darker where they cross */
  #photos, .photo-set { transition: opacity .2s ease; }
  .focusing #photos { opacity: .3; }
  .focusing .region:not(.active) .photo-set { opacity: .3; }

  /* Labels */
  .label {
    /* Anchor by the name line (padding .3em + line 1.3em + padding .3em = 1.9em),
       so an added family line grows the box downward instead of shifting the name */
    position: absolute; transform: translate(-50%, -0.95em);
    background: #FFFFFF; color: var(--ink);
    padding: .3em .6em; font-size: max(11px, 1.3cqw); line-height: 1.3;
    text-align: center; white-space: nowrap; pointer-events: none;
    transition: opacity .15s ease; z-index: 2;
  }
  .label .fam { display: none; }
  .label.tip .name { color: var(--red); }
  .label.tip .fam { display: block; }
  .focusing .label:not(.tip) { opacity: 0; }
  .label.family-label { display: none; }
  .mode-families .label.inst { display: none; }
  .mode-families .label.family-label { display: block; }

  /* Corner controls */
  .corner {
    position: absolute; transform: translate(-50%, -50%); z-index: 3;
    font-family: var(--font); font-size: max(12px, 1.3cqw);
    transition: opacity .15s ease;
  }
  .focusing .corner { opacity: 0; pointer-events: none; }
  .corner button {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--ink); padding: .45em .9em; cursor: pointer;
  }
  .corner button:hover { background: #FFFFFF; }
  .corner button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .toggle { display: flex; }
  .toggle button + button { border-left: 0; }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }

  /* Info card */
  .overlay {
    position: fixed; inset: 0; background: rgba(40, 30, 20, .45);
    display: grid; place-items: center; padding: 16px; z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: #FFFFFF; width: 100%; max-width: 720px;
    max-height: calc(100vh - 32px); overflow: auto;
    box-shadow: 0 12px 40px rgba(40, 30, 20, .25);
    animation: pop .16s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  .card-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; padding: 16px 16px 14px 22px;
  }
  .card-head h2 { font-size: clamp(26px, 4vw, 34px); line-height: 1.1; margin: 0; font-weight: 700; }
  .card-head p { margin: 4px 0 0; font-size: 17px; }
  .close {
    flex: none; width: 42px; height: 42px; border: 1px solid var(--ink);
    background: #FFFFFF; cursor: pointer; font-size: 26px; line-height: 1; color: var(--ink);
  }
  .close:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .card-body { padding: 18px 22px 22px; }
  .video { position: relative; aspect-ratio: 16 / 9; background: #F1EBE0; overflow: hidden; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video .empty { position: absolute; inset: 0; display: grid; place-items: center; font-size: 19px; color: #7A6F63; }
  .facts { margin: 18px 0 0; padding-left: 22px; font-size: 18px; line-height: 1.5; }
  .facts li { margin-bottom: 8px; max-width: 62ch; }
  .buttons { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .buttons button {
    font: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
    border: 1px solid var(--ink); padding: 6px 14px; cursor: pointer;
  }
  .buttons button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .region, .region .shape, .region image, .label, .card { transition: none; animation: none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <svg id="map" viewBox="-880 -1215 1760 1270" aria-label="Orchestra seating map">
    <g id="regions"></g>
    <g id="shrinking"></g>
    <g id="photos"></g>
    <g id="active"></g>
  </svg>

<div class="overlay" id="overlay" hidden>

      <button type="button" class="close" id="close" aria-label="Close">&times;</button>
    </div>
    <div class="card-body">
      <div class="video" id="video"></div>
      <ul class="facts" id="facts"></ul>
      <div class="buttons" id="buttons"></div>
    </div>
  </div>
</div>

/* ============================================================
   DRAWING - no need to edit below this line
   ============================================================ */
const VB = { x: -880, y: -1215, w: 1760, h: 1270 };
const SVG_NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById("stage");
const layer = document.getElementById("regions");
const photoLayer = document.getElementById("photos");
const activeLayer = document.getElementById("active");
const shrinkLayer = document.getElementById("shrinking");
const svgEl = document.getElementById("map");
let mode = "instruments";
let current = null;
let hovering = false;
let openedByKeyboard = false;
let lastFocus = null;

document.title = CONFIG.title;

function xy(r, a) {
  const t = a * Math.PI / 180;
  return [+(r * Math.cos(t)).toFixed(2), +(-r * Math.sin(t)).toFixed(2)];
}

function seg(r1, a1, r2, a2) {
  const [x, y] = xy(r2, a2);
  if (r1 === r2 && a1 !== a2) {
    const sweep = a2 < a1 ? 1 : 0;
    return `A${r2} ${r2} 0 0 ${sweep} ${x} ${y}`;
  }
  return `L${x} ${y}`;
}

function shapePath(pts) {
  const [sx, sy] = xy(pts[0][0], pts[0][1]);
  let d = `M${sx} ${sy}`;
  for (let i = 1; i < pts.length; i++) d += seg(...pts[i - 1], ...pts[i]);
  d += seg(...pts[pts.length - 1], ...pts[0]) + "Z";
  return d;
}

function el(tag, attrs) {
  const n = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function pos(node, [x, y]) {
  node.style.left = ((x - VB.x) / VB.w * 100) + "%";
  node.style.top = ((y - VB.y) / VB.h * 100) + "%";
}

function drawPhotos(g, src, lay) {
  const rot = lay.rotate || 0;
  const copies = lay.pair ? [[0, 0], lay.pair] : [[0, 0]];
  const items = [];
  lay.photos.forEach(([cx, cy, w, h, file]) => {
    copies.forEach(([dx, dy]) => items.push({ x: cx + dx, y: cy + dy, w, h, file }));
  });
  // Center of the whole group, used to push photos apart on hover
  const gx = items.reduce((t, i) => t + i.x, 0) / items.length;
  const gy = items.reduce((t, i) => t + i.y, 0) / items.length;
  const t = rot * Math.PI / 180;
  items.forEach(({ x, y, w, h, file }) => {
    const href = file ? fileSrc(file) : src;
    {
      const img = el("image", { href: href, x: x - w / 2, y: y - h / 2, width: w, height: h,
                                preserveAspectRatio: "xMidYMid meet" });
      if (lay.spread) {
        const dx = (x - gx) * lay.spread, dy = (y - gy) * lay.spread;
        // Undo the photo's rotation so the push goes straight out on screen
        img.style.setProperty("--sx", (dx * Math.cos(t) + dy * Math.sin(t)).toFixed(1) + "px");
        img.style.setProperty("--sy", (-dx * Math.sin(t) + dy * Math.cos(t)).toFixed(1) + "px");
      }
      img.addEventListener("error", () => img.remove());
      if (rot) {
        // Rotation lives on a wrapper so the hover grow can scale the photo itself
        const wrap = el("g", { transform: `rotate(${rot} ${x} ${y})` });
        wrap.appendChild(img);
        g.appendChild(wrap);
      } else {
        g.appendChild(img);
      }
    }
  });
}

function imageSrc(id) {
  return fileSrc(INSTRUMENTS[id].image || `${id}.png`);
}

function fileSrc(file) {
  if (EMBEDDED_IMAGES[file]) return EMBEDDED_IMAGES[file];
  if (/^(data:|https?:)/.test(file)) return file;
  return CONFIG.imageFolder + file;
}

function drawConductor(g, pg) {
  const r = R0 - 7;
  g.appendChild(el("path", { class: "shape", d: `M${-r} 0 A${r} ${r} 0 0 1 ${r} 0Z`, fill: "var(--bg)", stroke: "none" }));
  if (INSTRUMENTS.conductor.image) {
    const probe = new Image();
    probe.onload = () => drawPhotos(pg, probe.src, LAYOUT.conductor);
    probe.onerror = () => drawSilhouette(pg);
    probe.src = imageSrc("conductor");
  } else {
    drawSilhouette(pg);
  }
}

function drawSilhouette(g) {
  const s = el("g", { class: "silhouette", fill: "#111" });
  s.appendChild(el("line", { x1: 38, y1: -62, x2: -30, y2: -140, stroke: "#111", "stroke-width": 4, "stroke-linecap": "round" }));
  s.appendChild(el("path", { d: "M-100 40 L-86 -6 Q-80 -38 -56 -46 L-28 -52 Q-18 -46 -32 -38 L-46 -34 Q-36 -18 -46 2 L-58 40 Z" }));
  s.appendChild(el("path", { d: "M40 40 L30 -18 Q24 -56 44 -70 Q70 -74 76 -46 Q80 -14 90 40 Z" }));
  g.appendChild(s);
}

/*
  Layering: normally every colored shape sits in one layer and every photo
  sits in a layer above ALL shapes, so a photo that pokes out of its own
  section is never covered by a neighbor. While a section is highlighted,
  its photos move inside it and the pair is lifted into the top layer so
  they grow together. After the shrink animation, both go back home.
*/
function drawRegions() {
  Object.keys(INSTRUMENTS).forEach((id, i) => {
    const inst = INSTRUMENTS[id];
    const lay = LAYOUT[id];
    const g = el("g", { class: "region", "data-id": id, "data-family": inst.family || "",
                        tabindex: "0", role: "button", "aria-label": inst.name });
    const pg = el("g", { class: "photo-set", "data-id": id });
    if (id === "conductor") {
      drawConductor(g, pg);
    } else {
      g.appendChild(el("path", { class: "shape", d: shapePath(lay.shape), fill: FAMILIES[inst.family].color }));
      drawPhotos(pg, imageSrc(id), lay);
    }
    g.dataset.order = pg.dataset.order = i;
    layer.appendChild(g);
    photoLayer.appendChild(pg);
    inst._photos = pg;

    // Label
    const lab = document.createElement("div");
    lab.className = "label inst";
    lab.dataset.id = id;
    const fam = inst.family ? FAMILIES[inst.family].label : "";
    lab.innerHTML = `<span class="name"></span><span class="fam"></span>`;
    lab.querySelector(".name").textContent = inst.name;
    lab.querySelector(".fam").textContent = fam;
    pos(lab, lay.label);
    stage.appendChild(lab);
    inst._g = g;
    inst._label = lab;

    // Events
    g.addEventListener("pointerover", () => { hovering = true; activate(g, true); });
    g.addEventListener("focus", () => activate(g, false));
    g.addEventListener("blur", () => { if (!hovering) activate(null); });
    g.addEventListener("click", () => { openedByKeyboard = false; openRegion(id); });
    g.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openedByKeyboard = true; openRegion(id); }
    });
  });

  // Family labels (Families view)
  Object.keys(FAMILY_LABELS).forEach(key => {
    FAMILY_LABELS[key].forEach(p => {
      const lab = document.createElement("div");
      lab.className = "label family-label";
      lab.dataset.family = key;
      lab.innerHTML = `<span class="name"></span>`;
      lab.querySelector(".name").textContent = FAMILIES[key].label;
      pos(lab, p);
      stage.appendChild(lab);
    });
  });

  const svg = svgEl;
  svg.addEventListener("pointerover", e => { if (!e.target.closest(".region")) { hovering = false; activate(null); } });
  svg.addEventListener("pointerleave", () => { hovering = false; activate(null); });

}

function insertInOrder(parent, node) {
  const order = +node.dataset.order;
  const next = [...parent.children].find(c => +c.dataset.order > order);
  if (node.parentNode === parent && node.nextElementSibling === (next || null)) return;
  parent.insertBefore(node, next || null);
}

function sendHome(inst) {
  clearTimeout(inst._timer);
  inst._timer = null;
  if (inst._g.parentNode !== layer) insertInOrder(layer, inst._g);
  if (inst._photos.parentNode !== photoLayer) insertInOrder(photoLayer, inst._photos);
}

function lift(inst, toTop) {
  clearTimeout(inst._timer);
  inst._timer = null;
  const g = inst._g;
  if (inst._photos.parentNode !== g) g.appendChild(inst._photos);
  // Moving a focused element would drop keyboard focus, so skip that for focus
  if (toTop && g.parentNode !== activeLayer) activeLayer.appendChild(g);
  else if (toTop) activeLayer.appendChild(g);
}

function activate(g, bringToFront) {
  if (g === current) return;
  current = g;
  stage.classList.toggle("focusing", !!g);
  const id = g ? g.dataset.id : null;
  const family = g ? g.dataset.family : null;
  const byFamily = mode === "families" && family;

  const turningOn = [];
  const turningOff = [];
  Object.keys(INSTRUMENTS).forEach(k => {
    const inst = INSTRUMENTS[k];
    const on = !!g && (byFamily ? inst.family === family : k === id);
    inst._label.classList.toggle("tip", !!g && k === id && !byFamily);
    if (on) {
      lift(inst, bringToFront);
      turningOn.push(inst);
    } else if (inst._g.classList.contains("active") || inst._photos.parentNode === inst._g) {
      // Drop it below the photo layer right away (still at full size),
      // so the baton and other overlapping photos are back on top instantly
      if (inst._g.parentNode === activeLayer) shrinkLayer.appendChild(inst._g);
      turningOff.push(inst);
    }
  });
  if (turningOff.length) {
    void svgEl.getBoundingClientRect();   // settle the move so the shrink still animates
    turningOff.forEach(inst => {
      inst._g.classList.remove("active");
      clearTimeout(inst._timer);
      inst._timer = setTimeout(() => sendHome(inst), 230);   // after the shrink animation
    });
  }
  if (turningOn.length) {
    void svgEl.getBoundingClientRect();   // let moved elements settle so the grow animates
    turningOn.forEach(inst => inst._g.classList.add("active"));
  }
  document.querySelectorAll(".family-label").forEach(l => {
    l.classList.toggle("tip", !!byFamily && l.dataset.family === family);
  });
  // Conductor hovered in Families view still gets its own label
  if (g && mode === "families" && !family) INSTRUMENTS.conductor._label.classList.add("tip");
}

/* ============================================================
   YOUTUBE
   ============================================================ */
function toSeconds(t) {
  if (!t) return 0;
  if (/^\d+$/.test(t)) return parseInt(t, 10);
  const m = t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
  if (!m) return 0;
  return (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0));
}

function parseYouTube(input) {
  if (!input) return null;
  input = input.trim();
  if (/^[\w-]{11}$/.test(input)) return { id: input, start: 0 };
  try {
    const u = new URL(input);
    let id = null;
    if (u.hostname.includes("youtu.be")) id = u.pathname.slice(1, 12);
    else if (u.searchParams.get("v")) id = u.searchParams.get("v");
    else {
      const m = u.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/);
      if (m) id = m[2];
    }
    if (!id) return null;
    return { id, start: 0 };   // timestamps in pasted links are ignored on purpose
  } catch (e) {
    return null;
  }
}

function renderVideo(item) {
  const box = document.getElementById("video");
  box.innerHTML = "";
  const yt = parseYouTube(item.video);
  if (!yt) { box.innerHTML = `<div class="empty">Video coming soon</div>`; return; }
  const params = new URLSearchParams({ rel: "0", playsinline: "1" });
  if (CONFIG.autoplay) params.set("autoplay", "1");
  const start = item.start != null ? item.start : yt.start;
  if (start) params.set("start", String(start));
  if (item.end) params.set("end", String(item.end));
  const f = document.createElement("iframe");
  f.src = `https://www.youtube-nocookie.com/embed/${yt.id}?${params}`;
  f.title = `${item.name} video`;
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  box.appendChild(f);
}

/* ============================================================
   CARDS
   ============================================================ */
const overlay = document.getElementById("overlay");

function openCard({ title, sub, color, item, facts, buttons }) {
  if (overlay.hidden) lastFocus = document.activeElement;
  document.getElementById("card-title").textContent = title;
  document.getElementById("card-sub").textContent = sub || "";
  document.getElementById("card-head").style.background = color;
  renderVideo(item);
  const ul = document.getElementById("facts");
  ul.innerHTML = "";
  facts.forEach(f => { const li = document.createElement("li"); li.textContent = f; ul.appendChild(li); });
  const bw = document.getElementById("buttons");
  bw.innerHTML = "";
  (buttons || []).forEach(b => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = b.label;
    if (b.color) btn.style.background = b.color;
    btn.addEventListener("click", b.onClick);
    bw.appendChild(btn);
  });
  overlay.hidden = false;
  document.getElementById("close").focus();
}

function openInstrument(id) {
  const inst = INSTRUMENTS[id];
  if (!inst.family) {
    openCard({ title: inst.name, sub: "Leader of the orchestra", color: "#F1EBE0", item: inst, facts: inst.facts });
    return;
  }
  const fam = FAMILIES[inst.family];
  openCard({ title: inst.name, sub: fam.label, color: fam.color, item: inst, facts: inst.facts,
    buttons: [{ label: `More from the ${fam.label}`, onClick: () => openFamily(inst.family) }] });
}

function openFamily(key) {
  const fam = FAMILIES[key];
  const members = Object.keys(INSTRUMENTS).filter(k => INSTRUMENTS[k].family === key);
  openCard({ title: fam.label, sub: "Pick an instrument to meet it", color: fam.color,
    item: { name: fam.label, video: fam.video }, facts: fam.facts,
    buttons: members.map(k => ({ label: INSTRUMENTS[k].name, onClick: () => openInstrument(k) })) });
}

function openOrchestra() {
  openCard({ title: ORCHESTRA.name, sub: "", color: "#F1EBE0", item: ORCHESTRA, facts: ORCHESTRA.facts,
    buttons: Object.keys(FAMILIES).map(k => ({ label: FAMILIES[k].label, color: FAMILIES[k].color,
                                               onClick: () => openFamily(k) })) });
}

function openRegion(id) {
  if (id === "conductor") { openOrchestra(); return; }   // the conductor opens the orchestra overview
  const fam = INSTRUMENTS[id].family;
  if (mode === "families" && fam) openFamily(fam);
  else openInstrument(id);
}

function closeCard() {
  overlay.hidden = true;
  document.getElementById("video").innerHTML = "";   // stops the video
  if (openedByKeyboard && lastFocus && lastFocus.focus) lastFocus.focus();
  else { hovering = false; activate(null); }
}

document.getElementById("close").addEventListener("click", closeCard);
overlay.addEventListener("click", e => { if (e.target === overlay) closeCard(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) closeCard(); });

/* ============================================================
   VIEW TOGGLE
   ============================================================ */
document.querySelectorAll(".toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    stage.classList.toggle("mode-families", mode === "families");
    document.querySelectorAll(".toggle button")
      .forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    activate(null);
  });
});

drawRegions();
</script>
</body>
</html>
