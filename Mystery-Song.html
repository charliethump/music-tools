<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mystery Song - Step Bells</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231f2740%22/%3E%3Cpath d=%22M16 50V16H48V50%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%227%22/%3E%3Cpath d=%22M26.5 30q0-6 5.5-6t5.5 5q0 3-3 4.5q-2.5 1.3-2.5 4%22 fill=%22none%22 stroke=%22%23ffd24a%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2232%22 cy=%2245.5%22 r=%222.6%22 fill=%22%23ffd24a%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f1f2f4;
  --ink:#1f2740;
  --soft:#5d6680;
  --todo:#c5c9d0;
  --title:#b3202b;
  --barline:#aab0bb;
  --accent:#a3222a;
  --accent-ink:#ffffff;
  --panel:#ffffff;
  --panel-2:#f6f6f7;
  --ui-ink:#23262d;
  --muted:#686c75;
  --line:#d8d9dc;
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --story:Constantia,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --round:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ui-ink);background:var(--bg);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;position:relative}

#notation{flex:0 0 auto;height:clamp(150px,33vh,380px);padding:1.2vh 3vw 0;position:relative}
#nsvg{width:100%;height:100%;display:block;overflow:visible}
#stageWrap{flex:1 1 auto;min-height:0;position:relative}
#stage{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}

/* notation */
.bt{transform-box:fill-box;transform-origin:50% 100%}
.bt .s{fill:none;stroke-width:12;stroke-linejoin:miter;stroke-linecap:butt;stroke:var(--todo);transition:stroke .35s ease}
.bt .o{fill:none;stroke-width:15;stroke-linejoin:miter;stroke-linecap:butt;stroke:transparent}
.bt.ask .s,.bt.restDone .s{stroke:var(--ink)}
.bt.col .o{stroke:rgba(20,24,40,.5)}
.bt.pulse{animation:pulse .32s ease-out}
@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.08,1.14)}100%{transform:scale(1)}}
.bt.wobble{animation:wobble .45s ease-in-out}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.bt.win{animation:win .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes win{0%{transform:scale(1)}40%{transform:scale(1.16,1.22)}100%{transform:scale(1)}}
.barline{stroke:var(--barline);stroke-width:3;stroke-linecap:round}
#arrow{fill:var(--ink);transition:opacity .25s}
#arrow path{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-7px)}50%{transform:translateY(5px)}}
.chip{stroke:rgba(0,0,0,.35);stroke-width:1.5}
.nm{font-family:var(--round);font-weight:800;text-anchor:middle;dominant-baseline:central}
.tried circle,.tried ellipse{stroke:rgba(0,0,0,.35);stroke-width:1.5;opacity:.75}
.tried line{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.spark{transform-box:fill-box;transform-origin:center;animation:spark .75s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg);opacity:0}}

/* stage */
.bell{cursor:pointer}
.bell polygon,.bell ellipse{stroke:#4a4a4a;stroke-width:1.5}
.bellLetter{display:none;font-family:var(--round);font-weight:800;font-size:44px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#stage.letters .bellLetter{display:block}
.mallet,.shadow,.fx{pointer-events:none}
#titleText{font-family:var(--story);font-weight:700;font-size:118px;fill:var(--title);letter-spacing:-.5px}
#titleText.hidden{fill:var(--ink);font-style:italic;font-weight:400}
#titleText tspan{animation:letter .5s ease-out both}
@keyframes letter{0%{opacity:0}100%{opacity:1}}
#promptText{font-family:var(--story);font-size:60px;fill:var(--ink)}
#promptText.count{font-family:var(--round);font-weight:850;font-size:150px;fill:var(--accent)}

/* control bar */
#bar{flex:0 0 auto;display:flex;flex-wrap:nowrap;height:61px;overflow:hidden;align-items:center;gap:10px 14px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);position:relative;z-index:3;min-height:60px}
.grp{display:flex;align-items:center;gap:8px}
.grp.right{margin-left:auto}
button,select,input{font:inherit;color:inherit}
button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
button svg{width:18px;height:18px;fill:currentColor}
#nextBtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:184px;flex:0 0 auto;padding:0 8px;justify-content:center;font-weight:650}
#hearBtn{width:190px;flex:0 0 auto;padding:0 8px;justify-content:center}
#titleBtn{width:112px;flex:0 0 auto;padding:0 8px;justify-content:center}
#stepInfo{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;width:92px;flex:0 0 auto}
.grp{flex:0 0 auto}
@media (max-width:1240px){#stepInfo,label[for="tempo"]{display:none}}
@media (max-width:1060px){#tempoOut{display:none}#tempo{width:80px}}
select{height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);padding:0 8px}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
#tempo{width:110px;accent-color:var(--accent)}
#tempoOut{min-width:62px;font-variant-numeric:tabular-nums;color:var(--muted)}
#optPanel{position:fixed;right:16px;bottom:72px;z-index:20;width:310px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:grid;gap:10px}
#optPanel[hidden]{display:none}
#optPanel h2{font-size:15px;margin:0 0 2px;font-weight:650}
#optPanel .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
#optPanel hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
#optPanel p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
</style>
</head>

<!-- The mystery song. One bell per beat: [] = shh, one note = du, two notes = du-de. Notes are C D E F G A B and c for high C.
     "given" = how many beats at the start the teacher simply reveals (no guessing). The rest can be guessed on the bells. -->
<script type="application/json" id="mystery-data">
{
  "title": "Bjørnen Sover",
  "hiddenTitle": "Mystery song",
  "tempo": 66,
  "beatsPerBar": 4,
  "given": 4,
  "beats": [
    {"n":["C","C"]},
    {"n":["E","E"]},
    {"n":["D","D"]},
    {"n":["F","F"]},
    {"n":["E","E"]},
    {"n":["D","D"]},
    {"n":["C"]},
    {"n":[]}
  ]
}
</script>
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";

/* ---------- bells (positions match the photo, in image pixels) ---------- */
const BELLS = [
  {n:"C", s:"Do",  f:261.63, col:"#e33059", txt:"#ffffff", poly:"334,803 402,871 504,853 436,784",    cx:419.1,  cy:827.7},
  {n:"D", s:"Re",  f:293.66, col:"#ff9900", txt:"#2b1a00", poly:"492,693 560,761 662,743 594,674",    cx:577.1,  cy:717.7},
  {n:"E", s:"Mi",  f:329.63, col:"#ffff00", txt:"#2b2b00", poly:"645,585 712,654 815,635 747,567",    cx:729.8,  cy:610.4},
  {n:"F", s:"Fa",  f:349.23, col:"#94c631", txt:"#1b2a05", ell:true, rx:45.7, ry:26.3, rot:28.1,      cx:888.5,  cy:539.5},
  {n:"G", s:"Sol", f:392.00, col:"#13826d", txt:"#ffffff", poly:"959,407 1027,476 1129,458 1062,389", cx:1044.1, cy:432.3},
  {n:"A", s:"La",  f:440.00, col:"#5b37cc", txt:"#ffffff", poly:"1117,312 1191,375 1291,349 1217,285",cx:1204.1, cy:330.2},
  {n:"B", s:"Ti",  f:493.88, col:"#ea57b2", txt:"#2b0a1d", poly:"1268,208 1342,263 1424,235 1350,180",cx:1346.0, cy:221.5},
  {n:"c", s:"Do",  f:523.25, col:"#e33059", txt:"#ffffff", poly:"1424,142 1503,199 1575,174 1495,117",cx:1499.3, cy:158.0}
];
const IDX = {C:0,D:1,E:2,F:3,G:4,A:5,B:6,c:7};
const COUNT = ["1","2","Ready","Go!"];
const label = i => BELLS[i].n.toUpperCase();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);

/* ---------- the mystery song ---------- */
let cfg;
try { cfg = JSON.parse($("#mystery-data").textContent); } catch (e) { cfg = {}; }
const TITLE = String(cfg.title || "Mystery song");
const HIDDEN = String(cfg.hiddenTitle || "Mystery song");
const PER_BAR = clamp(Math.round(+cfg.beatsPerBar || 4), 1, 16);
const beats = (cfg.beats || []).map(b => (b.n || []).filter(x => x in IDX).slice(0, 2).map(x => IDX[x]));
const N = beats.length;
const GIVEN = clamp(Math.round(+cfg.given || 0), 0, N);

/* ---------- options ---------- */
const DEF = {autoHear:true, names:"off", bellLetters:false, ripples:true, octave:2, countIn:false, tempo:clamp(Math.round(+cfg.tempo || 80), 40, 160)};
let opts = {...DEF};
try { Object.assign(opts, JSON.parse(localStorage.getItem("mysterySong.opts") || "{}")); } catch (e) {}
function saveOpts() { try { localStorage.setItem("mysterySong.opts", JSON.stringify(opts)); } catch (e) {} }

/* ---------- stage ---------- */
const bellEls = BELLS.map((b, i) => {
  const g = document.createElementNS(SVGNS, "g");
  g.setAttribute("class", "bell");
  const shape = b.ell
    ? `<ellipse cx="${b.cx}" cy="${b.cy}" rx="${b.rx}" ry="${b.ry}" transform="rotate(${b.rot} ${b.cx} ${b.cy})" fill="${b.col}"/>`
    : `<polygon points="${b.poly}" fill="${b.col}"/>`;
  g.innerHTML = shape + `<text class="bellLetter" x="${b.cx}" y="${b.cy}" fill="${b.txt}">${label(i)}</text>`;
  g.addEventListener("pointerdown", e => { e.preventDefault(); bellClicked(i); });
  $("#bellsG").appendChild(g);
  return {g, scale:1};

/* ---------- audio ---------- */
let ac = null, master = null, noiseBuf = null, sched = [];
function ensureAudio() {

    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master = ac.createGain(); master.gain.value = 0.8;
    master.connect(comp); comp.connect(ac.destination);

    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

}
const lat = () => ac ? (ac.outputLatency || ac.baseLatency || 0) : 0;
const vnow = () => ac ? ac.currentTime - lat() : 0;

// Synthesized metal bar: inharmonic partials + a short mallet tick.
function strike(i, t) {
  const f = BELLS[i].f * (+opts.octave || 2) * 2;
  const nodes = [];
  const out = ac.createGain(); out.gain.value = 0.42; out.connect(master);
  [[1, 1, 1.9], [2.76, 0.3, 0.55], [5.4, 0.11, 0.22], [8.93, 0.045, 0.1]].forEach(([r, a, dec]) => {
    const fr = f * r; if (fr > 16000) return;
    const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = fr;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(a, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dec + 0.05); nodes.push(o);
  });

  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = Math.min(f * 3, 9000); bp.Q.value = 1.2;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(0.22, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t); n.stop(t + 0.05); nodes.push(n);
  sched.push({t, nodes});
}
// A whispered "shh" for the rest.
function shh(t) {
  const n = ac.createBufferSource(); n.buffer = noiseBuf;
  const hp = ac.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 5200; hp.Q.value = 0.7;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
  n.connect(hp); hp.connect(g); g.connect(master); n.start(t); n.stop(t + 0.45);
  sched.push({t, nodes:[n]});
}
function click(t, accent) {
  const o = ac.createOscillator(); o.type = "triangle"; o.frequency.value = accent ? 1760 : 1320;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.001);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);

}

  if (!ac) return;

  sched = [];
  pops = [];
}

/* ---------- discovery state ---------- */
// phase: "intro" (all gray), "ask" (beat `done` is black, waiting for a guess),
// "shown" (beat done-1 was just found), "finale" (everything found).
const S = {phase:"intro", done:0, tried:[], guess:null, title:false, msg:"", win:-1};
let run = null, pops = [], later = null;
let lastPose = null;

function seqFor(from, to) {
  const list = [];
  for (let k = from; k < to; k++) {
    const b = beats[k], off = k - from;
    if (!b.length) list.push({b:off, bell:-1, beat:k});
    else if (b.length === 1) list.push({b:off, bell:b[0], beat:k});
    else { list.push({b:off, bell:b[0], beat:k}); list.push({b:off + 0.5, bell:b[1], beat:k}); }
  }
  return list;
}
// Plays a list of {b, bell, beat}. All sound is scheduled up front; the mallet follows the same clock.
function playSeq(list, len, o = {}) {
  stopRun();
  ensureAudio();
  const spb = 60 / opts.tempo;
  const lead = o.lead == null ? 0.32 : o.lead;
  const start = ac.currentTime + 0.05;
  const cb = o.count ? 4 : 0;
  const t0 = start + lead + cb * spb;
  for (let k = 0; k < cb; k++) click(t0 - (4 - k) * spb, k === 0);
  const E = [];
  list.forEach(e => {
    const T = t0 + e.b * spb;
    if (e.bell >= 0) { strike(e.bell, T); E.push({T, bell:e.bell}); }
    else shh(T);
    pops.push({t:T, i:e.bell, beat:e.beat});
  });
  run = {E, t0, spb, cb, vs:start - lat(), end:t0 + len * spb, from:lastPose || idleStart(), then:o.then, kind:o.kind || ""};

}
function stopRun() {
  clearTimeout(later); later = null;
  cancelFuture();
  run = null;
  setCount("");
}

function advance() {
  stopRun();
  if (S.guess) {
    if (!S.guess.bad) { verdict(); return; }      // the class has voted: show whether the guess was right
    settleWrong();                                // pressed again during the "wrong" shake
  }
  S.msg = ""; S.win = -1;
  if (S.phase === "intro") { if (GIVEN > 0) reveal(); else { S.phase = "ask"; S.tried = []; } }
  else if (S.phase === "ask") reveal();
  else if (S.phase === "shown") {
    if (S.done < GIVEN) reveal();
    else if (S.done < N) { S.phase = "ask"; S.tried = []; }
    else enterFinale();
  }
  else if (S.phase === "finale") playAll();
  render();
}
function back() {
  stopRun();
  if (S.phase === "ask" && S.guess) { S.guess = null; S.msg = ""; render(); return; }   // take the guess back
  S.guess = null; S.msg = ""; S.win = -1; S.tried = [];
  if (S.phase === "finale") S.phase = "shown";
  else if (S.phase === "shown") {
    S.done--;
    S.phase = S.done < GIVEN ? (S.done > 0 ? "shown" : "intro") : "ask";
  }
  else if (S.phase === "ask") S.phase = S.done > 0 ? "shown" : "intro";
  render();
}
function reset() {
  stopRun();
  Object.assign(S, {phase:"intro", done:0, tried:[], guess:null, title:false, msg:"", win:-1});
  render();
}
// Teacher shows the answer for the black beat.
function reveal() {
  const k = S.done;
  S.done++; S.phase = "shown"; S.tried = [];
  playSeq(seqFor(k, k + 1), 1, {kind:"beat"});
}
function enterFinale() {
  S.phase = "finale"; S.title = true;
  later = setTimeout(playAll, 1500);
}
function playAll() {
  playSeq(seqFor(0, N), N, {count:opts.countIn, kind:"hear"});
}
function hear() {
  if (run && run.kind === "hear") { stopRun(); syncUI(); return; }
  if (S.guess) {
    // hear the guess in context: everything found so far, then the guessed beat
    if (S.guess.bad) return;
    playSeq(seqFor(0, S.done).concat(guessSeq(S.done)), S.done + 1, {count:opts.countIn, kind:"hear"});
    return;
  }
  if (!S.done) return;
  playSeq(seqFor(0, S.done), S.done, {count:opts.countIn, kind:"hear"});
}
function bellClicked(j) {
  if (S.guess && S.guess.bad) return;
  if (S.phase !== "ask") {
    if (run && run.kind === "hear") return;
    playSeq([{b:0, bell:j, beat:-1}], 0.5, {lead:0.1, kind:"live"});
    return;
  }
  // A guess: play the black beat's rhythm on that bell and color it. No verdict yet:
  // the class listens and votes, then the teacher presses Next to see if it was right.
  S.guess = {bell:j, bad:false}; S.msg = ""; S.win = -1;
  render();
  playSeq(guessSeq(0), 1, {kind:"guess", lead:0.2});
}
function guessSeq(off) {
  const k = S.done, j = S.guess.bell;
  return beats[k].length === 2 ? [{b:off, bell:j, beat:k}, {b:off + 0.5, bell:j, beat:k}] : [{b:off, bell:j, beat:k}];
}
function verdict() {
  const k = S.done, b = beats[k], j = S.guess.bell;
  if (b.length > 0 && b.every(x => x === j)) {
    S.guess = null; S.done++; S.phase = "shown"; S.tried = []; S.win = k; S.msg = "yes";
    render(); sparkle(k, j);
    if (opts.autoHear && S.done > 1) later = setTimeout(() => { S.win = -1; hear(); }, 900);
  } else {
    S.guess.bad = true; S.msg = "no";

}
function settleWrong() {
  if (!S.guess) return;
  if (!S.tried.includes(S.guess.bell)) S.tried.push(S.guess.bell);

}
function toggleTitle() { S.title = !S.title; render(); }

/* ---------- notation ---------- */
const CW = 120, PADX = 34, BARGAP = 34, TOP = 78, STH = 112;
const cellX = k => PADX + k * CW + Math.floor(k / PER_BAR) * BARGAP;
const NW = PADX * 2 + N * CW + Math.floor((N - 1) / PER_BAR) * BARGAP;
function sticks(b, cls) {
  const y = TOP;
  let d;
  if (!b.length) d = `M44,${y + 30} H76 L44,${y + 88} H76`;
  else if (b.length === 1) d = `M60,${y + 12} V${y + 100}`;
  else d = `M36,${y + 100} V${y + 18} H84 V${y + 100}`;
  return `<path class="o" d="${d}"/><path class="s" d="${d}"${cls}/>`;
}
function chip(i, x, y, small) {
  const b = BELLS[i];
  if (small) return b.ell ? `<ellipse cx="${x}" cy="${y}" rx="14" ry="11" fill="${b.col}"/>` : `<circle cx="${x}" cy="${y}" r="12" fill="${b.col}"/>`;
  const txt = opts.names === "solfege" ? b.s : label(i);
  const fs = opts.names === "solfege" ? 20 : 27;
  const shape = b.ell
    ? `<ellipse class="chip" cx="${x}" cy="${y}" rx="23" ry="18" fill="${b.col}"/>`
    : `<rect class="chip" x="${x - 20}" y="${y - 20}" width="40" height="40" rx="7" fill="${b.col}"/>`;
  return shape + `<text class="nm" x="${x}" y="${y}" font-size="${fs}" fill="${b.txt}">${txt}</text>`;
}
function renderNotation() {
  const namesOn = opts.names !== "off";
  const H = TOP + STH + 58;
  let out = "";
  for (let k = 0; k < N; k++) {
    const b = beats[k], x = cellX(k);
    if (k && k % PER_BAR === 0) out += `<line class="barline" x1="${x - BARGAP / 2}" y1="${TOP - 2}" x2="${x - BARGAP / 2}" y2="${TOP + STH + 6}"/>`;

    const asking = S.phase === "ask" && k === S.done;
    if (k < S.done) {
      if (b.length) { cls += " col"; style = ` style="stroke:${BELLS[b[0]].col}"`; }
      else cls += " restDone";
      if (k === S.win) cls += " win";
    } else if (asking) {
      if (S.guess) { cls += " col"; style = ` style="stroke:${BELLS[S.guess.bell].col}"`; if (S.guess.bad) cls += " wobble"; }
      else cls += " ask";
    }
    out += `<g transform="translate(${x} 0)"><g class="${cls}" id="bt${k}">${sticks(b, style)}</g>`;
    if (namesOn && k < S.done) {
      const xs = b.length === 2 ? [36, 84] : [60];
      b.forEach((i, j) => { out += chip(i, xs[j], TOP + STH + 30); });
    }
    if (asking && S.tried.length) {
      const n = S.tried.length, sp = 31, x0 = 60 - (n - 1) * sp / 2;
      out += '<g class="tried">';
      S.tried.forEach((i, j) => { const cx = x0 + j * sp, cy = TOP + STH + 30; out += chip(i, cx, cy, true) + `<line x1="${cx - 11}" y1="${cy + 11}" x2="${cx + 11}" y2="${cy - 11}"/>`; });
      out += "</g>";
    }
    out += "</g>";
  }
  if (S.phase === "ask") out += `<g id="arrow" transform="translate(${cellX(S.done) + 60} ${TOP - 6})"><path d="M-13,-62 H13 V-30 H30 L0,0 L-30,-30 H-13 Z" stroke="var(--bg)" stroke-width="3" stroke-linejoin="round"/></g>`;
  const svg = $("#nsvg");
  svg.setAttribute("viewBox", `0 0 ${NW} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  $("#nBeats").innerHTML = out;
}
function sparkle(k, bell) {
  const cx = cellX(k) + 60, cy = TOP + 56, col = BELLS[bell].col;
  let out = "";
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + 0.2, r = 95 + (i % 3) * 28;
    const s = 9 + (i % 4) * 3;
    out += `<g transform="translate(${cx} ${cy})"><path class="spark" d="M0,${-s} L${s * 0.32},${-s * 0.32} L${s},0 L${s * 0.32},${s * 0.32} L0,${s} L${-s * 0.32},${s * 0.32} L${-s},0 L${-s * 0.32},${-s * 0.32} Z" fill="${i % 2 ? col : "#ffd24a"}" stroke="rgba(0,0,0,.3)" stroke-width="1" style="--dx:${(Math.cos(a) * r).toFixed(0)}px;--dy:${(Math.sin(a) * r * 0.6).toFixed(0)}px;animation-delay:${(i % 3) * 0.04}s"/></g>`;

function pulseBeat(k) {

  if (!el) return;
  el.classList.remove("pulse", "win"); void el.getBoundingClientRect(); el.classList.add("pulse");
}

/* ---------- words on the stage ---------- */
let shownTitle = null, countTxt = "";
function promptFor() {
  if (S.msg === "yes") return S.done >= N ? "That's it! You found every beat." : "Yes! That's the one.";
  if (S.msg === "no") return "Not that one. Let's try another bell.";
  if (S.guess) return "Does that sound right? Thumbs up or down?";
  if (S.phase === "intro") return "A song is hiding in this rhythm.";
  if (S.phase === "ask") {
    if (!beats[S.done].length) return "What happens on this beat?";
    return S.done === 0 ? "Which bell starts the song?" : "Which bell comes next?";
  }
  if (S.phase === "shown") {
    if (S.done >= N) return "That's the whole song!";
    if (!S.title && S.done >= Math.max(2, GIVEN)) return "Do you know this song yet?";
    return "";
  }
  return "";
}
function setCount(t) {
  if (t === countTxt) return;
  countTxt = t;
  const p = $("#promptText");
  p.classList.toggle("count", !!t);
  p.setAttribute("y", t ? 400 : (250));
  p.textContent = t || promptFor();
}
function renderWords() {
  const want = S.title ? TITLE : HIDDEN;
  const tt = $("#titleText");
  if (want !== shownTitle) {
    shownTitle = want;
    tt.classList.toggle("hidden", !S.title);
    tt.textContent = "";
    [...want].forEach((ch, i) => {
      const ts = document.createElementNS(SVGNS, "tspan");
      ts.textContent = ch;
      ts.style.animationDelay = (S.title ? i * 0.06 : 0) + "s";
      tt.appendChild(ts);
    });
  }
  if (!countTxt) {
    const p = $("#promptText");
    p.setAttribute("y", 250);
    p.textContent = promptFor();
  }
}

/* ---------- mallet ---------- */
const HOVER = 130;
const arc = sec => Math.min(150, 30 + 200 * sec);
const BP = i => ({x:BELLS[i].cx, y:BELLS[i].cy - 16});
function idleStart() {
  const first = beats.find(b => b.length);
  const p = BP(first ? first[0] : 0);
  return {x:p.x, y:p.y, lift:HOVER};
}
function runPose(v) {
  const E = run.E;
  if (!E.length) return null;
  if (v < E[0].T) {
    const f = run.from, to = BP(E[0].bell);
    const span = Math.max(0.05, E[0].T - run.vs);
    const mv = smooth(clamp((v - run.vs) / Math.min(0.32, span), 0, 1));
    const dd = Math.min(run.spb, span);
    const d = clamp((v - (E[0].T - dd)) / dd, 0, 1);
    return {x:lerp(f.x, to.x, mv), y:lerp(f.y, to.y, mv), lift:lerp(f.lift, HOVER * (1 - d * d), mv) + (span < 0.5 ? 26 * Math.sin(Math.PI * mv) * (1 - d) : 0)};
  }

  while (j + 1 < E.length && E[j + 1].T <= v) j++;

  if (next) {
    const gap = next.T - prev.T, u = clamp((v - prev.T) / gap, 0, 1), e = smooth(u);
    const a = BP(prev.bell), b = BP(next.bell);
    return {x:lerp(a.x, b.x, e), y:lerp(a.y, b.y, e), lift:arc(gap) * Math.pow(Math.sin(Math.PI * u), 0.85)};
  }
  const u = clamp((v - prev.T) / 0.35, 0, 1), p = BP(prev.bell);
  return {x:p.x, y:p.y, lift:HOVER * Math.sin(Math.PI / 2 * u)};
}
function drawMallet(p) {
  const lift = Math.max(0, p.lift);
  const hy = p.y - lift;
  const ang = 50 - 14 * Math.min(lift / 150, 1);
  $("#mallet").setAttribute("transform", `translate(${p.x.toFixed(1)} ${hy.toFixed(1)}) rotate(${ang.toFixed(1)})`);
  const sx = p.x + 8 + lift * 0.35, sy = p.y + 14 + lift * 0.12;
  const sh = $("#mshadow");
  sh.setAttribute("transform", `translate(${sx.toFixed(1)} ${sy.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(1 0.8)`);
  sh.setAttribute("opacity", (0.3 * (1 - Math.min(lift / 260, 0.6))).toFixed(3));
}

/* ---------- strike ripples ---------- */
let ripples = [];
const lastHit = new Array(8).fill(null);
const pool = [];
const RING_DELAYS = [0, 0.12], RING_LIFE = 0.7;
const RIPPLE_COL = BELLS.map(b => b.col === "#ffff00" ? "#e8bf00" : b.col);
function drawRipples(v) {
  ripples = ripples.filter(r => v - r.t < RING_LIFE + 0.2);
  let used = 0;
  ripples.forEach(r => {
    const b = BELLS[r.i];
    RING_DELAYS.forEach(dl => {
      const a = v - r.t - dl;
      if (a < 0 || a >= RING_LIFE) return;
      const s = a / RING_LIFE, grow = 1 - Math.pow(1 - s, 2.2);
      let el = pool[used];
      if (!el) { el = document.createElementNS(SVGNS, "ellipse"); el.setAttribute("fill", "none"); $("#fx").appendChild(el); pool.push(el); }
      used++;
      const rx = 44 + 120 * grow;
      el.setAttribute("cx", b.cx); el.setAttribute("cy", b.cy);
      el.setAttribute("rx", rx.toFixed(1)); el.setAttribute("ry", (rx * 0.575).toFixed(1));
      el.setAttribute("transform", `rotate(28.1 ${b.cx} ${b.cy})`);
      el.setAttribute("stroke", RIPPLE_COL[r.i]);
      el.setAttribute("stroke-width", (8 * (1 - s) + 1.5).toFixed(2));
      el.setAttribute("opacity", (0.9 * Math.pow(1 - s, 1.4)).toFixed(3));
      el.style.display = "";
    });
  });
  for (let i = used; i < pool.length; i++) pool[i].style.display = "none";
}

/* ---------- animation loop ---------- */
function frame() {
  const v = vnow();
  if (pops.length) pops = pops.filter(p => {
    if (p.t <= v) {
      if (p.i >= 0) { lastHit[p.i] = p.t; if (opts.ripples) ripples.push(p); }
      if (p.beat >= 0) pulseBeat(p.beat);
      return false;
    }
    return true;
  });
  drawRipples(v);
  let pose = null;
  if (run) {
    if (run.cb && v < run.t0) {
      const n = Math.floor((v - (run.t0 - run.cb * run.spb)) / run.spb);
      setCount(n >= 0 ? COUNT[clamp(n, 0, 3)] : "");
    } else setCount("");
    pose = runPose(v);
    if (v >= run.end) { const r = run; run = null; syncUI(); if (r.then) r.then(); }
  }
  if (!pose) {
    // idle: float up above the last bell played
    const lp = lastPose || idleStart();
    pose = {x:lp.x, y:lp.y, lift:lp.lift + (HOVER - lp.lift) * 0.12};
  }
  drawMallet(pose); lastPose = pose;
  for (let i = 0; i < 8; i++) {
    let sc = 1;
    const h = lastHit[i];
    if (h !== null) { const d = v - h; if (d < 0.6) sc = 1 + 0.2 * Math.exp(-d / 0.09); else lastHit[i] = null; }
    const el = bellEls[i];
    if (Math.abs(sc - el.scale) > 0.0005 || (sc === 1 && el.scale !== 1)) {
      const b = BELLS[i];
      el.g.setAttribute("transform", sc === 1 ? "" : `translate(${b.cx} ${b.cy}) scale(${sc.toFixed(4)}) translate(${-b.cx} ${-b.cy})`);
      el.scale = sc;
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
function syncUI() {
  let lbl;
  if (S.phase === "intro") lbl = GIVEN > 0 ? "Show the first beat" : "Start";
  else if (S.phase === "ask") lbl = S.guess ? "Were we right?" : beats[S.done].length ? "Show the answer" : "Show the last beat";
  else if (S.phase === "shown") lbl = S.done < GIVEN ? "Show the next beat" : S.done < N ? "Next beat" : "Finish";
  else lbl = "Play the song";
  $("#nextLabel").textContent = lbl;
  $("#backBtn").disabled = S.phase === "intro";
  const hearing = !!(run && run.kind === "hear");
  const pending = !!(S.guess && !S.guess.bad);
  $("#hearLabel").textContent = hearing ? "Stop" : pending ? "Hear with this note" : (S.done >= N ? "Hear the song" : "Hear it so far");
  $("#hearIcon").setAttribute("d", hearing ? "M6 6h12v12H6z" : "M7 4.5v15l12-7.5z");
  $("#hearBtn").disabled = !S.done && !hearing && !pending;
  $("#titleBtn").textContent = S.title ? "Hide title" : "Reveal title";
  $("#stepInfo").textContent = N ? `${Math.min(S.done, N)} of ${N} found` : "";
}
function render() {
  $("#stage").classList.toggle("letters", !!opts.bellLetters);
  renderNotation();
  renderWords();
  syncUI();
}
function setTempo(v) {
  opts.tempo = clamp(Math.round(v), 40, 160);
  $("#tempo").value = opts.tempo; $("#tempoOut").textContent = opts.tempo + " bpm";
  saveOpts();
}
const tap = (id, fn) => $(id).addEventListener("click", e => { e.currentTarget.blur(); fn(); });
tap("#nextBtn", advance);
tap("#backBtn", back);
tap("#hearBtn", hear);
tap("#titleBtn", toggleTitle);
tap("#resetBtn", () => { reset(); $("#optPanel").hidden = true; $("#optBtn").setAttribute("aria-expanded", "false"); });
tap("#optBtn", () => { const p = $("#optPanel"); p.hidden = !p.hidden; $("#optBtn").setAttribute("aria-expanded", String(!p.hidden)); });
tap("#fsBtn", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});
document.addEventListener("fullscreenchange", () => {
  const fs = !!document.fullscreenElement;
  $("#fsIcon").setAttribute("d", fs ? "M8 4h2v6H4V8h4zm6 0h2v4h4v2h-6zM4 14h6v6H8v-4H4zm10 0h6v2h-4v4h-2z" : "M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z");
  $("#fsBtn").title = fs ? "Exit full screen" : "Full screen";
});
$("#tempo").addEventListener("input", e => setTempo(+e.target.value));
$("#tempo").addEventListener("change", e => e.target.blur());
$("#countChk").addEventListener("change", e => { opts.countIn = e.target.checked; saveOpts(); e.target.blur(); });
document.querySelectorAll("[data-opt]").forEach(el => {
  const k = el.dataset.opt;
  if (el.type === "checkbox") el.checked = !!opts[k]; else el.value = String(opts[k]);
  el.addEventListener("change", () => {
    opts[k] = el.type === "checkbox" ? el.checked : (k === "octave" ? +el.value : el.value);
    saveOpts(); el.blur(); render();
  });
});
document.addEventListener("pointerdown", e => {
  const p = $("#optPanel");
  if (!p.hidden && !p.contains(e.target) && !$("#optBtn").contains(e.target)) { p.hidden = true; $("#optBtn").setAttribute("aria-expanded", "false"); }
});

// Clicker and foot pedal: Page Down / Right / Down / Space / Enter go forward, Page Up / Left / Up go back.
const FWD = [" ", "Spacebar", "PageDown", "ArrowRight", "ArrowDown", "Enter"];
const BACK = ["PageUp", "ArrowLeft", "ArrowUp"];
window.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, tag = t && t.tagName;
  if (tag === "SELECT" || (tag === "INPUT" && t.type === "range")) return;
  if (FWD.includes(e.key)) { e.preventDefault(); if (tag === "BUTTON") t.blur(); if (!e.repeat) advance(); }
  else if (BACK.includes(e.key)) { e.preventDefault(); if (tag === "BUTTON") t.blur(); if (!e.repeat) back(); }
  else if (e.key >= "1" && e.key <= "8") { if (!e.repeat) bellClicked(+e.key - 1); }
  else if (e.key === "h" || e.key === "H") hear();
  else if (e.key === "t" || e.key === "T") toggleTitle();
  else if (e.key === "Escape") { $("#optPanel").hidden = true; }
});

$("#countChk").checked = !!opts.countIn;
setTempo(opts.tempo);
render();
requestAnimationFrame(frame);
})();
</script>
</body>
