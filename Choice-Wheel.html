<style>
  :root {
    --paper: #f5f6f8;
    --card: #ffffff;
    --ink: #1f2328;
    --ink-soft: #5b6470;
    --line: #d9dde3;
    --accent: #3369e8;
    --radius: 14px;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Nunito", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.4;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    flex: 1;
  }
  header h1 span { color: var(--accent); }
  .status { color: var(--ink-soft); font-size: 0.9rem; }

  button {
    font: inherit;
    font-weight: 700;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--ink-soft); }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #2a58c4; }
  button.icon {
    width: 34px; height: 34px; padding: 0;
    border-radius: 50%;
    font-size: 1.1rem; line-height: 1;
    color: var(--ink-soft);
  }
  button.icon:hover { color: #b3261e; border-color: #b3261e; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
    gap: 24px;
    padding: 24px;
    align-items: stretch;
    min-height: 0;
  }
  body[data-mode="play"] main { grid-template-columns: 1fr; }

  /* Wheel */
  .wheel-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 0;
  }
  .wheel-wrap {
    position: relative;
    width: min(100%, calc(100vh - 170px));
    aspect-ratio: 1;
  }
  #wheel {
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
    border-radius: 50%;
    filter: drop-shadow(0 10px 22px rgba(31, 35, 40, 0.18));
  }
  #wheel.spinning { cursor: wait; }
  .pointer {
    position: absolute;
    right: -4.5%;
    top: 50%;
    width: 12%;
    height: 12%;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .hub {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 12%;
    height: 12%;
    pointer-events: none;
  }
  .wheel-hint {
    color: var(--ink-soft);
    font-size: 0.95rem;
    min-height: 1.4em;
  }

  /* Choices panel */
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
    overflow: auto;
  }
  .panel h2 { margin: 0; font-size: 1.05rem; font-weight: 800; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .col-labels, .entry {
    display: grid;
    grid-template-columns: 26px 44px 1fr 34px;
    gap: 10px;
    align-items: center;
  }
  .col-labels { color: var(--ink-soft); font-size: 0.85rem; padding: 0 2px; }
  .entries { display: flex; flex-direction: column; gap: 8px; }
  .entry .num { color: var(--ink-soft); font-weight: 800; text-align: right; }
  .entry input[type="text"] {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    width: 100%;
    min-width: 0;
  }
  .entry input[type="color"] {
    width: 44px; height: 40px;
    padding: 0; border: 1px solid var(--line); border-radius: 10px;
    background: none; cursor: pointer;
  }
  .entry input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  .entry input[type="color"]::-webkit-color-swatch { border: none; border-radius: 7px; }
  .entry input[type="color"]::-moz-color-swatch { border: none; border-radius: 7px; }
  .note { color: var(--ink-soft); font-size: 0.85rem; margin: 0; }

  /* Result banner + confetti */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 60;
  }
  .result {
    position: fixed;
    top: 4vh;
    left: 50%;
    transform: translateX(-50%) scale(0.6);
    opacity: 0;
    z-index: 70;
    pointer-events: none;
    padding: 0.1em 0.5em;
    border-radius: 0.25em;
    background: var(--card);
    color: var(--ink);
    font-size: clamp(2.5rem, 9vw, 8rem);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.1;
    white-space: nowrap;
    max-width: 94vw;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 14px 40px rgba(31, 35, 40, 0.22);
    border-bottom: 0.12em solid var(--accent);
  }
  .result.show {
    pointer-events: auto;
    cursor: pointer;
    opacity: 1;
    transform: translateX(-50%) scale(1);
    transition: transform 380ms cubic-bezier(0.2, 1.4, 0.4, 1), opacity 200ms ease-out;
  }

  body[data-mode="play"] .panel { display: none; }
  body[data-mode="play"] .wheel-wrap { width: min(100%, calc(100vh - 150px)); }
  body[data-mode="edit"] #back { display: none; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    .wheel-wrap { width: min(100%, 78vh); }
  }
</style>
</head>
<body data-mode="edit">

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="result" id="result" role="status" aria-live="polite"></div>

<header>
  <h1>Choice <span>Wheel</span></h1>
  <span class="status" id="status"></span>
  <button id="copy">Copy link</button>
  <button id="back">Back to edit</button>
</header>

<main>
  <section class="wheel-area">
    <div class="wheel-wrap">
      <canvas id="wheel" width="900" height="900" aria-label="Choice wheel. Click to spin."></canvas>
      <svg class="hub" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48" fill="#fff" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
      </svg>
      <svg class="pointer" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="96,10 96,90 20,50" fill="#e6e8ec" stroke="#8a919c" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="wheel-hint" id="wheelHint">Click the wheel to open the spinning view</div>
  </section>

  <aside class="panel" aria-label="Wheel choices">
    <div class="panel-head">
      <h2>Choices</h2>
      <button id="add" class="primary">Add choice</button>
    </div>
    <div class="col-labels"><span>Key</span><span>Color</span><span>Name on wheel</span><span></span></div>
    <div class="entries" id="entries"></div>
    <p class="note">Clicking the wheel spins at random. Pressing a choice's key (1-9, 0 for the 10th) spins and lands on that choice. Changes save on this device; use Copy link to open the same wheel elsewhere.</p>
  </aside>
</main>

<script>
(() => {
  'use strict';

  // ---------- Data ----------
  const PRESET_COLORS = ['#3369e8', '#d50f25', '#eeb211', '#009925', '#7b3fe4', '#ff7a00', '#00a6b4', '#e0459b', '#6b8e23', '#8b5a2b'];
  const STORAGE_KEY = 'choice-wheel-v1';   // separate from the Metronome Choice Wheel
  const TAU = Math.PI * 2;

  const defaults = () => ({
    entries: [
      { name: 'Choice 1', color: PRESET_COLORS[0] },
      { name: 'Choice 2', color: PRESET_COLORS[1] },
      { name: 'Choice 3', color: PRESET_COLORS[2] },
    ],
  });

  let state = loadState();

  function loadState() {
    const fromHash = decodeHash();
    if (fromHash) return fromHash;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return sanitize(JSON.parse(raw));
    } catch (e) { /* ignore */ }
    return defaults();
  }

  function sanitize(obj) {
    const d = defaults();
    if (!obj || typeof obj !== 'object' || !Array.isArray(obj.entries)) return d;
    const entries = obj.entries.map((e, i) => ({
      name: typeof e.name === 'string' ? e.name.slice(0, 40) : '',
      color: /^#[0-9a-f]{6}$/i.test(e.color || '') ? e.color : PRESET_COLORS[i % PRESET_COLORS.length],
    }));
    return { entries: entries.length ? entries : d.entries };
  }

  function encodeState() {
    const json = JSON.stringify(state);
    return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeHash() {
    const m = location.hash.match(/^#w=([A-Za-z0-9\-_]+)$/);
    if (!m) return null;
    try {
      let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      return sanitize(JSON.parse(decodeURIComponent(escape(atob(b64)))));
    } catch (e) { return null; }
  }

  let saveTimer = null;
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    try { history.replaceState(null, '', '#w=' + encodeState()); } catch (e) { /* ignore */ }
    setStatus('Saved on this device');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => setStatus(''), 1800);
  }

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//tSxKGDwAABpAAAACAAADSAAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/+1LEoYPAAAGkAAAAIAAANIAAAARVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVQ==';
  let ctx = null, master = null, noiseBuffer = null, selectionBuffer = null;

  function base64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 0.03);
      noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      ctx.decodeAudioData(base64ToBytes(SAMPLE_SELECTION), b => { selectionBuffer = b; }, () => {});
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Ticking while the wheel spins.
  function tick() {
    const c = audio();
    const t = c.currentTime;
    const src = c.createBufferSource();
    src.buffer = noiseBuffer;
    const filter = c.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 2600;
    filter.Q.value = 1.2;
    const g = c.createGain();
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    src.connect(filter).connect(g).connect(master);
    src.start(t);
    src.stop(t + 0.035);
  }

  // Played once when the wheel lands on a choice.
  function playSelection() {
    if (!ctx || !selectionBuffer) return;
    const src = ctx.createBufferSource();
    src.buffer = selectionBuffer;
    const g = ctx.createGain();
    g.gain.value = 0.25;  // selection sound volume
    src.connect(g).connect(master);
    src.start(ctx.currentTime);
  }

  // ---------- Wheel ----------
  const canvas = document.getElementById('wheel');
  const cx2d = canvas.getContext('2d');
  const wheelHint = document.getElementById('wheelHint');
  const R = canvas.width / 2;
  let angle = 0;
  let spinning = false;
  let winner = null;
  let lastTickIndex = -1;
  let spinToken = 0;

  function activeEntries() {
    return state.entries.filter(e => e.name.trim() !== '');
  }

  function textColorFor(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 150 ? '#1a1a1a' : '#ffffff';
  }

  function drawWheel() {
    const entries = activeEntries();
    const n = entries.length;
    const c = cx2d;
    c.clearRect(0, 0, canvas.width, canvas.height);
    c.save();
    c.translate(R, R);
    if (n === 0) {
      c.fillStyle = '#e3e6ea';
      c.beginPath(); c.arc(0, 0, R - 6, 0, TAU); c.fill();
      c.restore();
      return;
    }
    const slice = TAU / n;
    for (let i = 0; i < n; i++) {
      const start = angle + i * slice;
      c.beginPath();
      c.moveTo(0, 0);
      c.arc(0, 0, R - 6, start, start + slice);
      c.closePath();
      c.fillStyle = entries[i].color;
      c.fill();
      if (n > 1) {
        c.strokeStyle = 'rgba(0,0,0,0.12)';
        c.lineWidth = 2;
        c.stroke();
      }
    }
    for (let i = 0; i < n; i++) {
      const mid = angle + (i + 0.5) * slice;
      c.save();
      c.rotate(mid);
      const label = entries[i].name.trim();
      let size = n <= 4 ? 64 : n <= 8 ? 50 : n <= 12 ? 40 : 32;
      c.textAlign = 'right';
      c.textBaseline = 'middle';
      const maxWidth = R - 6 - 40 - R * 0.15;
      do {
        c.font = `800 ${size}px Nunito, "Avenir Next", "Segoe UI", system-ui, sans-serif`;
        size -= 2;
      } while (c.measureText(label).width > maxWidth && size > 14);
      c.fillStyle = textColorFor(entries[i].color);
      c.shadowColor = 'rgba(0,0,0,0.25)';
      c.shadowBlur = 4;
      c.fillText(label, R - 40, 0);
      c.restore();
    }
    c.restore();
    c.beginPath();
    c.arc(R, R, R - 6, 0, TAU);
    c.strokeStyle = 'rgba(0,0,0,0.25)';
    c.lineWidth = 3;
    c.stroke();

  function pointerIndex(n) {
    const p = ((-angle) % TAU + TAU) % TAU;
    return Math.min(n - 1, Math.floor(p / (TAU / n)));
  }

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function readyToPlay() {
    return activeEntries().length >= 2;
  }

  // Edit page -> spinning view. Waits (slow rotation) until the user spins.
  function enterPlay() {
    if (!readyToPlay()) {
      alert('Add at least two named choices to use the wheel.');
      return false;
    }
    persist();
    renderEntries();
    audio();
    showPlayView();
    return true;
  }

  function showPlayView() {
    winner = null;
    hideResult();
    setMode('play');
    wheelHint.textContent = 'Click the wheel to spin';
    startIdle();

  const IDLE_SPEED = 0.22;   // radians per second
  function startIdle() {

    idling = true;
    let last = performance.now();
    function frame(now) {
      if (document.body.dataset.mode !== 'play' || spinning || winner) { idling = false; return; }
      angle += IDLE_SPEED * (now - last) / 1000;
      last = now;
      drawWheel();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // forced: the entry the wheel must land on (number keys). Omitted = truly random.
  function spin(forced) {
    if (spinning) return;
    const entries = activeEntries();
    if (entries.length < 2) return;
    winner = null;
    hideResult();
    audio();

    const n = entries.length;
    const slice = TAU / n;
    let pick = forced ? entries.indexOf(forced) : -1;
    if (pick < 0) pick = Math.floor(Math.random() * n);
    const target = (pick + 0.15 + Math.random() * 0.7) * slice;
    const desired = ((-target) % TAU + TAU) % TAU;
    const current = ((angle) % TAU + TAU) % TAU;
    const turns = 5 + Math.floor(Math.random() * 3);
    const delta = turns * TAU + ((desired - current) % TAU + TAU) % TAU;
    const from = angle;
    const duration = 5200 + Math.random() * 1600;
    const t0 = performance.now();

    canvas.classList.add('spinning');
    wheelHint.textContent = '';
    lastTickIndex = pointerIndex(n);
    const myToken = ++spinToken;

      if (myToken !== spinToken) return;   // cancelled
      const t = Math.min(1, (now - t0) / duration);

    spinToken++;

    if (document.body.dataset.mode === 'edit') enterPlay();
    else spin();

  // ---------- Keys ----------
  // 1-9 and 0 (for the 10th choice): spin and land on that choice.
  // Space, Page Up/Down and arrow keys (clicker, foot pedal): random spin in the spinning view.
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if ([' ', 'PageUp', 'PageDown', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
      e.preventDefault();
      if (!e.repeat && document.body.dataset.mode === 'play') spin();
      return;

    const index = e.key === '0' ? 9 : +e.key - 1;

    if (document.body.dataset.mode === 'edit' && !enterPlay()) return;

    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === ' ') e.preventDefault();

  const entriesEl = document.getElementById('entries');

  function keyLabel(i) { return i < 9 ? String(i + 1) : i === 9 ? '0' : ''; }

  function renderEntries() {
    entriesEl.innerHTML = '';
    state.entries.forEach((e, i) => {
      const row = document.createElement('div');
      row.className = 'entry';

      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = keyLabel(i);
      num.title = keyLabel(i) ? 'Press ' + keyLabel(i) + ' to land on this choice' : 'No key for choices past 10';

      color.type = 'color';
      color.value = e.color;
      color.title = 'Slice color';
      color.addEventListener('input', () => { e.color = color.value; drawWheel(); persist(); });

      name.type = 'text';
      name.value = e.name;
      name.placeholder = 'Name on wheel';
      name.maxLength = 40;
      name.setAttribute('aria-label', 'Name on wheel');
      name.addEventListener('input', () => { e.name = name.value; drawWheel(); persist(); });

      del.textContent = '\u00D7';

      entriesEl.appendChild(row);
    });
  }

  document.getElementById('add').addEventListener('click', () => {
    const used = new Set(state.entries.map(e => e.color.toLowerCase()));
    const color = PRESET_COLORS.find(c => !used.has(c)) || PRESET_COLORS[state.entries.length % PRESET_COLORS.length];
    state.entries.push({ name: '', color });
    renderEntries(); drawWheel(); persist();
    const inputs = entriesEl.querySelectorAll('input[type="text"]');
    inputs[inputs.length - 1].focus();
  });

  document.getElementById('copy').addEventListener('click', async () => {
    const url = location.origin + location.pathname + '#w=' + encodeState();
    try {
      await navigator.clipboard.writeText(url);
      setStatus('Link copied');
    } catch (e) {
      prompt('Copy this link:', url);
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => setStatus(''), 2200);
  });

  document.getElementById('back').addEventListener('click', () => {
    cancelSpin();
    hideResult();
    winner = null;
    setMode('edit');
    wheelHint.textContent = 'Click the wheel to open the spinning view';
  });

  function setMode(mode) {
    document.body.dataset.mode = mode;
    requestAnimationFrame(drawWheel);
  }

  // ---------- Result banner + confetti ----------
  const resultEl = document.getElementById('result');
  const confettiCanvas = document.getElementById('confetti');
  const confettiCtx = confettiCanvas.getContext('2d');
  let confettiPieces = [];
  let confettiRunning = false;

  function showResult(entry) {
    resultEl.textContent = entry.name.trim();
    resultEl.style.borderBottomColor = entry.color;
    resultEl.style.color = entry.color;
    resultEl.classList.remove('show');
    void resultEl.offsetWidth;
    resultEl.classList.add('show');
  }
  function hideResult() { resultEl.classList.remove('show'); }
  // Clicking the result clears it and puts the wheel back in its slow waiting rotation.
  resultEl.addEventListener('click', () => {
    if (spinning) return;
    showPlayView();
  });

  function sizeConfetti() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    confettiCanvas.width = Math.floor(window.innerWidth * dpr);
    confettiCanvas.height = Math.floor(window.innerHeight * dpr);
    confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', sizeConfetti);

  function launchConfetti(mainColor) {
    sizeConfetti();
    const W = window.innerWidth, H = window.innerHeight;
    const palette = [mainColor, mainColor, '#ffffff', '#ffd23f', '#3369e8', '#d50f25', '#009925'];
    const sources = [
      { x: W * 0.12, y: H * 0.9, dir: -1.1 },
      { x: W * 0.88, y: H * 0.9, dir: -2.0 },
      { x: W * 0.5, y: H * 0.35, dir: -1.57 },
    ];
    sources.forEach(src => {
      for (let i = 0; i < 70; i++) {
        const a = src.dir + (Math.random() - 0.5) * 1.1;
        const speed = 9 + Math.random() * 11;
        confettiPieces.push({
          x: src.x, y: src.y,
          vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
          w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
          rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.3,
          color: palette[Math.floor(Math.random() * palette.length)],
          life: 1,
        });
      }
    });
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiFrame); }
  }

  function confettiFrame() {
    const W = window.innerWidth, H = window.innerHeight;
    confettiCtx.clearRect(0, 0, W, H);
    confettiPieces = confettiPieces.filter(p => p.y < H + 20 && p.life > 0);
    for (const p of confettiPieces) {
      p.vy += 0.35;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      p.life -= 0.004;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)) + 1);
      confettiCtx.restore();
    }
    if (confettiPieces.length) {
      requestAnimationFrame(confettiFrame);
    } else {
      confettiRunning = false;
      confettiCtx.clearRect(0, 0, W, H);
    }
  }

  // ---------- Init ----------
  renderEntries();
  drawWheel();
  if (readyToPlay()) showPlayView();
  window.addEventListener('hashchange', () => {
    const s = decodeHash();
    if (s) { state = s; renderEntries(); drawWheel(); }
  });
})();
</script>
</body>
</html>
