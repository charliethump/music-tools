:root {
  --ocean: #d9effc;
  --land: #f2e1b9;
  --land-hover: #e8cf95;
  --border: #b3a58a;
  --red: #c20f08;
  --ink: #26323d;
  --vcold: #1f4e9e;
  --cold: #3a86d4;
  --medium: #7d5aa6;
  --warm: #e0861b;
  --rwarm: #de5a14;
  --hot: #c20f08;
  --display: "Comic Sans MS", "Comic Neue", "Chalkboard SE", "Marker Felt", sans-serif;
  --font: var(--display);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ocean);
  color: var(--ink);
  font-family: var(--font);
  height: 100vh; height: 100dvh;
  display: grid;
  grid-template-rows: 12vh minmax(0, 1fr) 18vh;
  grid-template-columns: minmax(0, 1fr);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
body.setup { grid-template-rows: 10vh minmax(0, 1fr) auto; }

/* ---------- header ---------- */
header { grid-row: 1; position: relative; z-index: 1; pointer-events: none; display: flex; align-items: center; justify-content: center; padding: 0 3vw; }
h1 {
  margin: 0;
  font-weight: 800;
  font-size: clamp(26px, min(5.2vw, 8.6vh), 104px);
  line-height: 1;
  text-align: center;
  color: var(--red);
  text-shadow: 0.045em 0.05em 0.035em rgba(0, 0, 0, 0.75);
  letter-spacing: 0.01em;
  width: 100%;
  min-width: 0;
  white-space: nowrap;
}
/* big alerts: same treatment as the Note Toss Game team names */
body.play h1, #msg.found #l1 {
  font-family: var(--display);
  font-weight: 900;
  font-style: italic;
  letter-spacing: 0.026em;
  color: var(--red);
  -webkit-text-stroke: 0.026em #000;
  paint-order: stroke fill;
  text-shadow: 0.04em 0.04em 0 #000, -0.013em -0.013em 0 #000;
}
body.setup h1 { color: var(--ink); text-shadow: none; font-family: var(--display); font-weight: 900; font-style: italic; letter-spacing: 0.02em; -webkit-text-stroke: 0.025em currentColor; paint-order: stroke fill; font-size: clamp(22px, min(3.4vw, 6vh), 64px); }

/* ---------- map ---------- */
main { position: fixed; inset: 0; z-index: 0; }
svg { display: block; width: 100%; height: 100%; }
.sea { fill: var(--ocean); }
.inert { fill: var(--land); stroke: var(--bc, var(--border)); stroke-width: var(--bw, 0.6px); transition: stroke 0.9s ease, stroke-width 0.9s ease; vector-effect: non-scaling-stroke; pointer-events: none; }
path.c {
  fill: var(--land);
  stroke: var(--border);
  stroke: var(--bc, var(--border));
  stroke-width: var(--bw, 0.6px);
  vector-effect: non-scaling-stroke;
  stroke-linejoin: round;
  transition: fill 0.7s ease, stroke 0.9s ease, stroke-width 0.9s ease;
}
body.setup path.c, body.play:not(.done) path.c { cursor: pointer; }
body.setup path.c:not(.picked):hover, body.play:not(.done) path.c:not(.picked):hover { fill: var(--land-hover); transition: fill 0.12s ease; }
path.c.picked { fill: var(--red); stroke: #7d0905; transition: fill 0.15s ease; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
#ring { fill: none; stroke: var(--red); stroke-width: 17; stroke-linecap: round; display: none; pointer-events: none; }

/* ---------- footer / messages ---------- */
footer { grid-row: 3; position: relative; z-index: 1; pointer-events: none; display: flex; align-items: center; justify-content: center; padding: 0 17vw; }
#msg { width: 100%; min-width: 0; text-align: center; font-family: var(--display); opacity: 0; transition: opacity 0.4s ease; }
#msg.show { opacity: 1; transition: opacity 0.15s ease; }
#l1 { text-shadow: 0 0 0.1em var(--ocean), 0 0 0.25em var(--ocean); white-space: nowrap; font-weight: 900; font-style: italic; letter-spacing: 0.02em; -webkit-text-stroke: 0.025em currentColor; paint-order: stroke fill; font-size: clamp(20px, min(3.5vw, 6vh), 68px); line-height: 1.1; }
#l2 { text-shadow: 0 0 0.12em var(--ocean), 0 0 0.25em var(--ocean), 0 0 0.4em var(--ocean); font-weight: 400; font-size: clamp(16px, min(2.5vw, 4.2vh), 46px); line-height: 1.2; margin-top: 0.25em; }
#l2:empty { display: none; }
#l2 b { font-weight: 800; }
#msg.found #l1 { font-size: clamp(26px, min(5vw, 8.4vh), 100px); }
.vcold { color: var(--vcold); } .cold { color: var(--cold); } .medium { color: var(--medium); }
.warm { color: var(--warm); } .rwarm { color: var(--rwarm); } .hot { color: var(--hot); }

#showme {
  pointer-events: auto;
  position: absolute; right: 2.2vw; bottom: 2.4vh;
  font: 700 clamp(15px, min(2vw, 3.4vh), 36px) var(--font);
  color: var(--red); background: #fff;
  border: 0.12em solid var(--red); border-radius: 999px;
  padding: 0.35em 0.9em 0.4em;
  cursor: pointer;
  box-shadow: 0 0.12em 0 rgba(125, 9, 5, 0.35);
}
#showme:hover { background: var(--red); color: #fff; }
#showme:active { transform: translateY(0.08em); box-shadow: 0 0.04em 0 rgba(125, 9, 5, 0.35); }
#toSetup {
  pointer-events: auto;
  position: absolute; left: 1.6vw; bottom: 1.6vh;
  font: 400 clamp(12px, 1.1vw, 18px) var(--font);
  color: var(--ink); opacity: 0.35; text-decoration: none; padding: 0.4em 0.6em;
}
#toSetup:hover { opacity: 0.9; }
body.done #showme { display: none; }
body.setup #msg, body.setup #showme, body.setup #toSetup { display: none; }

/* ---------- setup panel ---------- */
#setup { display: none; }
body.setup footer { padding: 1.4vh 2vw 2.4vh; }
body.setup #setup {
  pointer-events: auto;
  display: flex; flex-direction: column; gap: 12px; align-items: center;
  background: #fff; border: 2px solid #e6d3a6; border-radius: 18px;
  padding: 16px 22px; font-size: clamp(15px, 1.25vw, 20px); max-width: 1100px; width: 100%;
}
.row { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; justify-content: center; width: 100%; }
#setup label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
#setup select, #setup input[type=text] {
  font: inherit; color: var(--ink); background: #fff;
  border: 2px solid #cdbf9f; border-radius: 10px; padding: 6px 10px;
}
#pick { min-width: 16em; }
#setup input[type=checkbox] { width: 1.15em; height: 1.15em; accent-color: var(--red); cursor: pointer; }
#link { flex: 1 1 26em; min-width: 0; user-select: all; -webkit-user-select: all; }
#link:disabled { background: #f7f3ea; }
.btn {
  font: 700 1.05em var(--display); border-radius: 999px; padding: 6px 18px; cursor: pointer;
  border: 2px solid var(--red); background: #fff; color: var(--red);
}
.btn.solid { background: var(--red); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--cold); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>

const C = DATA.c, N = C.length;
const $ = id => document.getElementById(id);
const svg = $("map"), group = $("countries"), ring = $("ring");
const msg = $("msg"), l1 = $("l1"), l2 = $("l2");

// ---------- map ----------
svg.setAttribute("viewBox", "0 0 " + DATA.w + " " + DATA.h);
$("inert").setAttribute("d", DATA.inert);
$("edgeRect").setAttribute("width", DATA.w);
$("edgeRect").setAttribute("height", DATA.h);
const paths = C.map((c, i) => {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", c.d);
  p.setAttribute("class", "c");
  p.dataset.i = i;
  group.appendChild(p);
  return p;
});

// ---------- helpers ----------
const nameOf = i => (C[i].t ? "the " : "") + C[i].n;
function dist(i, j) {
  if (i === j) return 0;
  if (i > j) [i, j] = [j, i];
  return DIST[i * N - i * (i + 1) / 2 + (j - i - 1)];
}
const DIST = DATA.dist.split(",").map(Number);

function fmtMiles(d) {
  if (d < 10) return "less than 10 miles";
  if (d < 1000) return "about " + Math.round(d / 10) * 10 + " miles";
  return "about " + (Math.round(d / 100) * 100).toLocaleString("en-US") + " miles";
}

// 0 = hot (borders the target) ... 5 = very cold
const LEVELS = [
  { first: "Hot! You're right next door!", still: "hot", cls: "hot" },
  { first: "Really warm!", still: "really warm", cls: "rwarm" },
  { first: "Warm!", still: "warm", cls: "warm" },
  { first: "Medium!", still: "medium", cls: "medium" },
  { first: "Cold!", still: "cold", cls: "cold" },
  { first: "Very cold!", still: "very cold", cls: "vcold" },
];
function levelOf(d) {
  if (d === 0) return 0;
  if (d < 500) return 1;
  if (d < 1500) return 2;
  if (d < 3000) return 3;
  if (d < 6000) return 4;
  return 5;
}
const aboutSame = (a, b) => Math.abs(a - b) <= Math.max(50, 0.1 * Math.max(a, b));

function pick(i, on) {
  const p = paths[i];
  if (on) { group.appendChild(p); p.classList.add("picked"); }
  else p.classList.remove("picked");
}

function showRing(i, animate) {
  const o = C[i].o;
  if (!o) { ring.style.display = "none"; return; }
  const [cx, cy, r] = o, len = 2 * Math.PI * r;
  ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.setAttribute("r", r);
  ring.setAttribute("transform", "rotate(-90 " + cx + " " + cy + ")");
  ring.style.display = "block";
  ring.style.transition = "none";
  ring.style.strokeDasharray = len;
  ring.style.strokeDashoffset = animate ? len : 0;
  if (animate) {
    ring.getBoundingClientRect();
    ring.style.transition = "stroke-dashoffset 0.9s cubic-bezier(.55,.05,.3,1)";
    ring.style.strokeDashoffset = 0;
  }
}

function say(line1, parts, cls) {
  l1.textContent = line1;
  l2.replaceChildren();
  (parts || []).forEach((part, k) => {
    if (k) l2.append(" ");
    if (part.cls) { const b = document.createElement("b"); b.className = part.cls; b.textContent = part.text; l2.append(b); }
    else l2.append(part.text);
  });
  msg.className = "";
  void msg.offsetWidth;
  msg.className = "show" + (cls ? " " + cls : "");
  fit(l1);
}
const hush = () => msg.classList.remove("show");

// shrink one-line text so long country names still fit the screen
function fit(el) {
  el.style.fontSize = "";
  const size = parseFloat(getComputedStyle(el).fontSize);
  if (el.scrollWidth > el.clientWidth) el.style.fontSize = (size * el.clientWidth / el.scrollWidth * 0.98) + "px";
}
const fitAll = () => { fit($("title")); fit(l1); if (typeof setView === "function" && view) setView(view); };
addEventListener("resize", fitAll);
// load the backup fonts up front so the first message doesn't flash in a lighter style
Promise.all(["italic 900 1em 'Comic Neue'", "700 1em 'Comic Neue'", "400 1em 'Comic Neue'"].map(f => document.fonts.load(f))).catch(() => {});
document.fonts.ready.then(fitAll);

// ---------- zoom ----------
const FULL = [0, 0, DATA.w, DATA.h];
const STEP = 0.62;   // each zoom step shows 62% of the previous width
let view = FULL.slice(), anim = 0;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const headerEl = document.querySelector("header"), footerEl = document.querySelector("footer");
function band() {   // the open strip of screen between the header and the footer
  const top = headerEl.getBoundingClientRect().bottom;
  const h = Math.max(60, footerEl.getBoundingClientRect().top - top);
  return { top, h, w: svg.clientWidth || innerWidth };
}
// fit the view into that strip, but let the map keep going under the header and footer
function setView(v) {
  view = v;
  const b = band(), sw = svg.clientWidth || innerWidth, sh = svg.clientHeight || innerHeight;
  const [x, y, w, h] = v, s = Math.min(b.w / w, b.h / h);
  const vx = x + w / 2 - (sw / 2) / s, vy = y + h / 2 - (b.top + b.h / 2) / s;
  svg.setAttribute("viewBox", [vx, vy, sw / s, sh / s].map(n => n.toFixed(1)).join(" "));
}
addEventListener("resize", () => setView(view));
// borders get thicker and darker as the map zooms in, so they read from the back of the room
const BORDERS = [
  ["0.6px", "#b3a58a"], ["0.8px", "#ab9c80"], ["1.1px", "#a08f71"],
  ["1.6px", "#8d7b5b"], ["2px", "#7d6a4a"], ["2.4px", "#6e5b3c"],
];
function setBorders(level) {
  const [w, c] = BORDERS[Math.max(0, Math.min(5, level))];
  svg.style.setProperty("--bw", w);
  svg.style.setProperty("--bc", c);
}
function zoomTo(to, ms, done) {
  cancelAnimationFrame(anim);
  if (reduceMotion) { setView(to); if (done) done(); return; }
  const from = view.slice(), t0 = performance.now();
  const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  (function frame(now) {
    const k = Math.min(1, (now - t0) / ms), e = ease(k);
    setView(from.map((a, i) => a + (to[i] - a) * e));
    if (k < 1) anim = requestAnimationFrame(frame); else if (done) done();
  })(t0);
}
// a tighter view that keeps the target near the middle, a little off center
function viewAround(i, level) {
  const [W, H] = [DATA.w, DATA.h];
  // match the shape of the map area on screen so the off-center placement is what the class actually sees
  const b = band(), aspect = b.w / b.h || W / H;
  let w = W * Math.pow(STEP, level), h = w / aspect;
  if (h > H) { h = H; w = h * aspect; }
  const [bx0, by0, bx1, by1] = C[i].b;
  if (w < (bx1 - bx0) * 1.4 || h < (by1 - by0) * 1.4) return null;   // country would no longer fit
  // target lands 0-15% of the view away from center, in a random direction
  const rx = 0.5 + (Math.random() * 2 - 1) * 0.15, ry = 0.5 + (Math.random() * 2 - 1) * 0.15;
  const px = 0.07 * w, py = 0.1 * h;
  let x = (bx0 + bx1) / 2 - rx * w, y = (by0 + by1) / 2 - ry * h;
  x = Math.min(Math.max(x, bx1 + px - w), bx0 - px);
  y = Math.min(Math.max(y, by1 + py - h), by0 - py);
  x = w >= W ? (W - w) / 2 : Math.min(Math.max(x, 0), W - w);
  y = Math.min(Math.max(y, 0), H - h);
  return [x, y, w, h];
}

// ---------- confetti ----------
function rainConfetti(ms) {
  if (reduceMotion) return;
  const cv = document.createElement("canvas");
  cv.id = "confetti";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const colors = ["#c20f08", "#f4c20d", "#1f7fe0", "#2eaa4a", "#f07c16", "#8a4fc9", "#ff5fa2"];
  let W = 0, H = 0, scale = 1;
  function size() {
    const dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight; scale = W / 1440;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  addEventListener("resize", size);
  const bits = [];
  const t0 = performance.now();
  let last = t0, owed = 0;
  function add() {
    const w = (7 + Math.random() * 7) * scale;
    bits.push({
      x: Math.random() * W, y: -20 * scale,
      w, h: w * (0.4 + Math.random() * 0.3),
      vy: (120 + Math.random() * 140) * scale, vx: (Math.random() - 0.5) * 60 * scale,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 8,
      flip: Math.random() * Math.PI, vf: 4 + Math.random() * 6,
      sway: Math.random() * Math.PI * 2, color: colors[(Math.random() * colors.length) | 0],
    });
  }
  (function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (now - t0 < ms) {                        // keep pouring for the full time
      owed += dt * 110 * Math.max(0.6, scale);
      while (owed >= 1 && bits.length < 700) { add(); owed--; }
    }
    ctx.clearRect(0, 0, W, H);
    for (let k = bits.length - 1; k >= 0; k--) {
      const b = bits[k];
      b.sway += dt * 2.2; b.rot += b.vr * dt; b.flip += b.vf * dt;
      b.x += (b.vx + Math.sin(b.sway) * 40 * scale) * dt;
      b.y += b.vy * dt;
      if (b.y > H + 30 * scale) { bits.splice(k, 1); continue; }
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.scale(1, Math.cos(b.flip));
      ctx.fillStyle = b.color;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    }
    if (now - t0 < ms || bits.length) requestAnimationFrame(frame);
    else { removeEventListener("resize", size); cv.remove(); }
  })(t0);
}

setView(view);

// ---------- settings from the link ----------
const params = new URLSearchParams(location.search);
const norm = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "");
const findParam = norm(params.get("find"));
const target = findParam ? C.findIndex(c => norm(c.s) === findParam || norm(c.n) === findParam) : -1;
const optTemp = params.get("temp") === "1";
const optMiles = params.get("miles") === "1";
const optSound = params.get("sound") !== "0";        // on unless the link turns it off
const optConfetti = params.get("confetti") !== "0";
const optZoom = Math.max(0, Math.min(5, parseInt(params.get("zoom"), 10) || 0));

if (target < 0 || params.has("setup")) startSetup(); else startGame();
setView(view);

// ---------- game ----------
function startGame() {
  document.body.className = "play";
  const title = "Where is " + nameOf(target) + "?";
  $("title").textContent = title;
  document.title = title;
  fit($("title"));

  const yay = new Audio(SOUND);
  yay.volume = 0.3;
  yay.preload = "auto";

  let current = -1;     // wrong guess currently showing
  let prev = null;      // distance of the last wrong guess
  let done = false;
  let zoomLevel = 0;    // how many zoom steps have happened

  // after a wrong guess fades, move one step closer (if allowed); returns true if the map moved
  function zoomCloser() {
    if (zoomLevel >= optZoom) return false;
    const v = viewAround(target, zoomLevel + 1);
    if (!v) return false;
    zoomLevel++;
    setBorders(zoomLevel);
    zoomTo(v, 900);
    return true;
  }

  function clearWrong() {
    if (current < 0) return false;
    pick(current, false);
    current = -1;
    hush();
    return true;
  }

  function finish(found) {
    clearWrong();
    done = true;
    document.body.classList.add("done");
    pick(target, true);
    if (zoomLevel > 0) { ring.style.display = "none"; setBorders(0); zoomTo(FULL, 1100, () => showRing(target, true)); }
    else showRing(target, true);
    say((found ? "You found " : "Here's ") + nameOf(target) + "!", null, "found");
    if (found && optSound) { yay.currentTime = 0; yay.play().catch(() => {}); }
    if (found && optConfetti) rainConfetti(10000);
  }

  function guess(i) {
    const d = dist(i, target), lvl = levelOf(d), tName = nameOf(target);
    const parts = [];
    if (optTemp) {
      if (prev === null) parts.push({ text: LEVELS[lvl].first, cls: LEVELS[lvl].cls });
      else if (lvl === levelOf(prev) && aboutSame(d, prev)) parts.push({ text: "You're still " + LEVELS[lvl].still + "!", cls: LEVELS[lvl].cls });
      else if (d < prev) parts.push({ text: "Warmer!", cls: "rwarm" });
      else parts.push({ text: "Colder!", cls: "cold" });
    }
    if (optMiles) {
      if (d === 0) { if (!(optTemp && prev === null)) parts.push({ text: "It's right next door to " + tName + "!" }); }
      else parts.push({ text: "It's " + fmtMiles(d) + " from " + tName + "." });
    }
    prev = d;
    current = i;
    pick(i, true);
    say("That's " + nameOf(i) + "!", parts);
  }

  svg.addEventListener("click", e => {
    if (done) return;
    const p = e.target.closest("path.c");
    const i = p ? +p.dataset.i : -1;
    const wasShowing = current;
    if (clearWrong() && zoomCloser()) return;  // the map moved, so aim again
    if (i < 0 || i === wasShowing) return;   // a click on the sea or the same country just clears it
    if (i === target) finish(true); else guess(i);
  });
  // clicks in the header or message area also clear a wrong guess
  document.addEventListener("click", e => {
    if (done || svg.contains(e.target) || e.target.closest("#showme, #toSetup")) return;
    if (clearWrong()) zoomCloser();
  });

  $("showme").addEventListener("click", () => { if (!done) finish(false); });
  $("toSetup").addEventListener("click", e => {
    e.preventDefault();
    const q = new URLSearchParams({ setup: "1", find: C[target].s });
    if (optTemp) q.set("temp", "1");
    if (optMiles) q.set("miles", "1");
    if (optZoom) q.set("zoom", String(optZoom));
    if (!optSound) q.set("sound", "0");
    if (!optConfetti) q.set("confetti", "0");
    location.href = baseUrl() + "?" + q.toString();
  });
}

// ---------- setup ----------
function baseUrl() { return location.href.split(/[?#]/)[0]; }

function startSetup() {
  document.body.className = "setup";
  $("title").textContent = "Pick the country to find";
  document.title = "World Map Setup";
  const sel = $("pick"), temp = $("optTemp"), miles = $("optMiles"), zoom = $("optZoom");
  const sound = $("optSound"), conf = $("optConfetti");
  const link = $("link"), copy = $("copy"), open = $("open");

  C.forEach((c, i) => sel.add(new Option(c.n, i)));
  let chosen = -1;
  temp.checked = params.has("setup") ? optTemp : false;
  miles.checked = params.has("setup") ? optMiles : true;
  zoom.value = String(optZoom);
  sound.checked = optSound;
  conf.checked = optConfetti;

  function choose(i, animate) {
    if (chosen >= 0) pick(chosen, false);
    chosen = i;
    if (i < 0) { ring.style.display = "none"; }
    else { pick(i, true); showRing(i, animate); }
    sel.value = i < 0 ? "" : String(i);
    update();
  }
  function update() {
    const ok = chosen >= 0;
    [link, copy, open].forEach(el => el.disabled = !ok);
    if (!ok) { link.value = ""; return; }
    let url = baseUrl() + "?find=" + C[chosen].s;
    if (temp.checked) url += "&temp=1";
    if (miles.checked) url += "&miles=1";
    if (zoom.value !== "0") url += "&zoom=" + zoom.value;
    if (!sound.checked) url += "&sound=0";
    if (!conf.checked) url += "&confetti=0";
    link.value = url;
  }

  sel.addEventListener("change", () => choose(sel.value === "" ? -1 : +sel.value, true));
  temp.addEventListener("change", update);
  miles.addEventListener("change", update);
  zoom.addEventListener("change", update);
  sound.addEventListener("change", update);
  conf.addEventListener("change", update);
  svg.addEventListener("click", e => {
    const p = e.target.closest("path.c");
    if (p && +p.dataset.i !== chosen) choose(+p.dataset.i, true);
  });
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(link.value); }
    catch { link.disabled = false; link.select(); document.execCommand("copy"); }
    copy.textContent = "Copied!";
    setTimeout(() => copy.textContent = "Copy link", 1600);
  });
  open.addEventListener("click", () => { location.href = link.value; });

  choose(target, false);
}
</script>
</body>
</html>
