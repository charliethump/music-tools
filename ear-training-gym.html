function snapToResting(){
  // Instantly cancel all sleep/idle animation state before the jump
  isSleeping = false;
  clearTimeout(sleepTimer);
  clearTimeout(sleepZzzTimer);
  clearTimeout(blinkLoopTimer);
  clearTimeout(idleTimer);
  stopIdle();
  znEls.forEach(el => el.classList.remove('go'));

  // Kill all active transitions immediately so nothing fights the jump
  singerSvg.style.transition = '';
  singerSvg.style.transform  = '';
  la.style.transition     = '';
  laFore.style.transition = '';
  ra.style.transition     = '';
  raFore.style.transition = '';
  leye.style.transition   = '';
  reye.style.transition   = '';

  // Snap to neutral resting pose
  stopTalking();
  setArms(27,66, 25,77, 73,66, 75,77);
  leye.setAttribute('ry','2.5'); reye.setAttribute('ry','2.5');
  leye.setAttribute('cx','44');  reye.setAttribute('cx','56');
  lshine.setAttribute('r','1');  rshine.setAttribute('r','1');
}

function updatePaletteAvailability(pool){
  document.querySelectorAll('.chip[data-note]').forEach(chip => {
    const available = pool.includes(chip.dataset.note);
    chip.classList.toggle('unavailable', !available);
    chip.draggable = available;
  });
}

function setDifficulty(difficulty){
  currentDifficulty = difficulty;
  const newCount = getPatternLength();
  if(newCount !== SLOT_COUNT){
    SLOT_COUNT = newCount;
    buildSlots(SLOT_COUNT);
    melody = Array(SLOT_COUNT).fill(null);
    melodyHistory = [];
    render();
    syncUndoBtn();
  }
  updatePaletteAvailability(getActivePool());
  currentPattern = null;
  patternChecked = true;
}

function splashJump(difficulty){
  stopSplashCurl(); // stop curl RAF + remove dumbbells before anything else
  snapToResting();  // cancel any sleep/idle state before animating
  const singerEl  = document.getElementById('splash-singer');
  const svg       = singerEl ? singerEl.querySelector('.singer-svg') : null;
  const dest      = document.querySelector('.fig-wrap');
  if(!singerEl || !svg || !dest){
    document.body.classList.remove('tint-easy','tint-medium','tint-hard');
    if(difficulty) document.body.classList.add('tint-' + difficulty);
    setDifficulty(difficulty);
    dismissSplash(() => {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(startIdle, 10000);
      clearTimeout(sleepTimer);
      sleepTimer = setTimeout(fallAsleep, 60000);
    });
    return;
  }

  document.querySelectorAll('.diff-btn').forEach(b => b.disabled = true);
  document.body.classList.remove('tint-easy','tint-medium','tint-hard');
  if(difficulty) document.body.classList.add('tint-' + difficulty);

  setDifficulty(difficulty);

  // Remove float notes from singerEl so they don't travel with it
  singerEl.querySelectorAll('.splash-float-note').forEach(n => n.remove());

  const srcR = singerEl.getBoundingClientRect();
  const dstR = _singerDestRect; // exact rect of singer SVG in its card

  const naturalW = dstR.width;
  const naturalH = dstR.height;
  const endScale = naturalW / srcR.width;

  // Vector: center of singerEl → center of singer's card position
  const dx = (dstR.left + naturalW / 2) - (srcR.left + srcR.width  / 2);
  const dy = (dstR.top  + naturalH / 2) - (srcR.top  + srcR.height / 2);

  // Arc peak
  const peakX = dx * 0.4;
  const peakY = Math.min(dy - 120, -80);

  // Bend legs into jump pose
  function setLegs(llKneeX, llKneeY, llFootX, llFootY,
                   rlKneeX, rlKneeY, rlFootX, rlFootY){
    const llThigh = svg.getElementById ? svg.getElementById('ll-thigh') : document.getElementById('ll-thigh');
    const llShin  = svg.getElementById ? svg.getElementById('ll-shin')  : document.getElementById('ll-shin');
    const rlThigh = svg.getElementById ? svg.getElementById('rl-thigh') : document.getElementById('rl-thigh');
    const rlShin  = svg.getElementById ? svg.getElementById('rl-shin')  : document.getElementById('rl-shin');
    if(!llThigh) return;
    llThigh.setAttribute('x2', llKneeX); llThigh.setAttribute('y2', llKneeY);
    llShin.setAttribute('x1',  llKneeX); llShin.setAttribute('y1',  llKneeY);
    llShin.setAttribute('x2',  llFootX); llShin.setAttribute('y2',  llFootY);
    rlThigh.setAttribute('x2', rlKneeX); rlThigh.setAttribute('y2', rlKneeY);
    rlShin.setAttribute('x1',  rlKneeX); rlShin.setAttribute('y1',  rlKneeY);
    rlShin.setAttribute('x2',  rlFootX); rlShin.setAttribute('y2',  rlFootY);
  }

  // Jump pose: knees bent outward and up, feet tucked
  setLegs(32, 104, 36, 116,   68, 104, 64, 116);
  // Arms raised in excitement
  setArms(16, 48, 10, 38,   84, 48, 90, 38);

  const kfName = 'singerJump_' + Date.now();
  const styleEl = document.createElement('style');
  styleEl.textContent = `
    @keyframes ${kfName} {
      0%   { transform: translate(0, 0) scale(1); }
      35%  { transform: translate(${peakX}px, ${peakY}px) scale(${(1 + endScale * 0.5).toFixed(3)}); }
      100% { transform: translate(${dx}px, ${dy}px) scale(${endScale.toFixed(3)}); }
    }
  `;
  document.head.appendChild(styleEl);

  singerEl.style.animation = 'none';
  singerEl.style.animation = `${kfName} 0.7s cubic-bezier(.4,0,.2,1) forwards`;

  singerEl.addEventListener('animationend', () => {
    styleEl.remove();

    // Straighten legs back to standing pose
    const llThigh2 = svg.querySelector('#ll-thigh') || document.getElementById('ll-thigh');
    const llShin2  = svg.querySelector('#ll-shin')  || document.getElementById('ll-shin');
    const rlThigh2 = svg.querySelector('#rl-thigh') || document.getElementById('rl-thigh');
    const rlShin2  = svg.querySelector('#rl-shin')  || document.getElementById('rl-shin');
    if(llThigh2){
      llThigh2.setAttribute('x2','40'); llThigh2.setAttribute('y2','108');
      llShin2.setAttribute('x1','40');  llShin2.setAttribute('y1','108');
      llShin2.setAttribute('x2','41');  llShin2.setAttribute('y2','124');
      rlThigh2.setAttribute('x2','60'); rlThigh2.setAttribute('y2','108');
      rlShin2.setAttribute('x1','60');  rlShin2.setAttribute('y1','108');
      rlShin2.setAttribute('x2','59');  rlShin2.setAttribute('y2','124');
    }
    // Lower arms back to resting pose
    setArms(27,66, 25,77,  73,66, 75,77);

    // Float singer above everything, exactly over its card position, during the fade
    svg.style.position   = 'fixed';
    svg.style.left       = dstR.left + 'px';
    svg.style.top        = dstR.top  + 'px';
    svg.style.width      = naturalW  + 'px';
    svg.style.height     = naturalH  + 'px';
    svg.style.zIndex     = '9999999';
    svg.style.transition = 'none';
    document.body.appendChild(svg);

    dismissSplash(() => {
      svg.style.position   = '';
      svg.style.left       = '';
      svg.style.top        = '';
      svg.style.width      = '';
      svg.style.height     = '';
      svg.style.zIndex     = '';
      svg.style.transition = '';
      svg.style.transform  = '';
      if(_singerOriginalParent) _singerOriginalParent.appendChild(svg);
      // Clear any lingering arm transitions and reset to default resting pose
      la.style.transition = '';
      laFore.style.transition = '';
      ra.style.transition = '';
      raFore.style.transition = '';
      setArms(27,66, 25,77, 73,66, 75,77);
      // Restart blink, idle, and sleep cleanly
      clearTimeout(blinkLoopTimer);
      scheduleNextBlink();
      clearTimeout(idleTimer);
      idleTimer = setTimeout(startIdle, 10000);
      clearTimeout(sleepTimer);
      sleepTimer = setTimeout(fallAsleep, 60000);
    });
  }, { once: true });
}

function dismissSplash(onComplete){
  const s = document.getElementById('splash');
  const FADE_MS = 800;
  s.classList.add('hiding');
  setTimeout(() => {
    s.style.display = 'none';  // hide but keep in DOM so goHome() can reuse it
    s.classList.remove('hiding');
    if(onComplete) onComplete();
  }, FADE_MS);
}

function goHome(){
  if(streak > 2){
    if(!confirm(`Are you sure you want to go back? You'll lose your streak!`)) return;
  }
  // ── Reset game state ──────────────────────────────────────────────────────
  stopReq = true; playing = false;
  clearTimeout(idleTimer); clearTimeout(sleepTimer);
  stopIdle();
  if(isSleeping){ isSleeping = false; wakeUp(); }
  stopSplashCurl(); // stop any lingering splash anim (shouldn't be, but safe)

  // Reset streak (keep bestStreak as all-time record)
  streak = 0;
  updateStreakBadge(0);

  // Reset melody / pattern
  melody = Array(SLOT_COUNT).fill(null);
  currentPattern = null; patternChecked = true;
  hintedSlots.clear(); incorrectAttempts = 0;
  render();

  // Reset button states
  const checkBtn = document.getElementById('checkBtn');
  if(checkBtn) checkBtn.disabled = true;
  const pb = document.getElementById('practiceBtn');
  if(pb){ pb.classList.add('needs-practice'); pb.disabled = false; }

  // ── Move singer back into the splash ─────────────────────────────────────
  snapToResting();
  singerSvg.style.cssText = ''; // clear any lingering fixed-position styles
  const singerWrap = document.getElementById('splash-singer');
  if(singerWrap){
    // Restore float notes if they were removed during the jump animation
    if(!singerWrap.querySelector('.splash-float-note')){
      [['left:-18px;top:10px;animation-delay:0s','🎵'],
       ['right:-16px;top:18px;animation-delay:.9s','🎶'],
       ['left:4px;bottom:-4px;animation-delay:1.7s','🎵']
      ].forEach(([style, ch]) => {
        const sp = document.createElement('span');
        sp.className = 'splash-float-note'; sp.style.cssText = style; sp.textContent = ch;
        singerWrap.appendChild(sp);
      });
    }
    singerWrap.appendChild(singerSvg);
  }

  // Re-enable difficulty buttons
  document.querySelectorAll('.diff-btn').forEach(b => b.disabled = false);

  // ── Show the splash ───────────────────────────────────────────────────────
  const splash = document.getElementById('splash');
  splash.style.display = '';

  // Start a fresh random splash animation
  const r = Math.random();
  if     (r < 1/3) initSplashPress();
  else if(r < 2/3) initSplashTreadmill();
  else             initSplashJumpRope();

  // Restart blink loop
  clearTimeout(blinkLoopTimer);
  scheduleNextBlink();
}


/* ── Confetti ── */

// ── Practice mode ──
const NOTE_FREQS = {
  'Do' : 261.63,
  'Re' : 293.66,
  'Mi' : 329.63,
  'Fa' : 349.23,
  'Sol': 392.00,
  'La' : 440.00,
  'Ti' : 493.88,
  'Doh': 523.25,
};

const EASY_POOL   = ['Do', 'Mi', 'Sol', 'La'];
const ALL_NOTES   = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Ti', 'Doh'];

let currentDifficulty = 'easy';

function getActivePool(){ return currentDifficulty === 'easy' ? EASY_POOL : ALL_NOTES; }
function getPatternLength(){ return currentDifficulty === 'hard' ? 5 : 3; }

let currentPattern = null;
let patternChecked = true;  // true = ready to generate a new pattern
let practiceAudioPlaying = false;
let hintedSlots      = new Set();
let incorrectAttempts = 0;
let streak = 0;
let bestStreak = 0;
let streakTickTimer = null;

function updateStreakBadge(n){
  const badge = document.getElementById('streak-badge');
  document.getElementById('streak-num').textContent = n;
  badge.classList.toggle('zero', n === 0);
}

function updateBestBadge(){
  document.getElementById('best-num').textContent = bestStreak;
  document.getElementById('best-badge').classList.toggle('hidden', bestStreak === 0);
}

function bumpStreak(){
  streak++;
  if(streak > bestStreak){ bestStreak = streak; updateBestBadge(); }
  updateStreakBadge(streak);
  // brief scale-up pop on the topbar badge
  const badge = document.getElementById('streak-badge');
  badge.classList.add('bump');
  setTimeout(() => badge.classList.remove('bump'), 250);
  // overlay text (green screen)
  document.getElementById('overlay-streak').textContent =
    streak === 1 ? '🔥 1 in a row!' : `🔥 ${streak} in a row!`;
  // milestone: balloons + affirmation (every 5)
  if(streak % 5 === 0){ launchBalloons(); showAffirmation(); }
}

function resetStreakAnimated(){
  if(streakTickTimer) clearInterval(streakTickTimer);
  const start = streak;
  streak = 0;
  let cur = start;
  // show starting value immediately on the overlay
  const os = document.getElementById('overlay-streak');
  os.textContent = cur > 0 ? `🔥 ${cur}` : '';
  if(start === 0) return; // already at zero, nothing to animate
  const delay = Math.min(80, 600 / start); // faster for bigger streaks
  streakTickTimer = setInterval(() => {
    cur = Math.max(0, cur - 1);
    updateStreakBadge(cur);
    os.textContent = cur > 0 ? `🔥 ${cur}` : '💔 0';
    if(cur <= 0){ clearInterval(streakTickTimer); streakTickTimer = null; }
  }, delay);
}

function playPattern(){
  if(playing) return;  // don't interrupt Sing it!
  const btn = document.getElementById('practiceBtn');
  btn.disabled = true;
  pb.disabled = true;
  practiceAudioPlaying = true;

  const ctx = getCtx();
  const onsetSec = ONSET_MS.slow / 1000;
  const noteDur  = 0.65;

  currentPattern.forEach((note, i) => {
    const freq  = NOTE_FREQS[note];
    const start = ctx.currentTime + i * onsetSec;

    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.type = 'sine';
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.45, start + 0.04);
    gain.gain.setValueAtTime(0.45, start + noteDur - 0.12);
    gain.gain.linearRampToValueAtTime(0, start + noteDur);

    osc.start(start);
    osc.stop(start + noteDur);
  });

  const totalMs = (currentPattern.length - 1) * ONSET_MS.slow + noteDur * 1000 + 100;
  setTimeout(() => { practiceAudioPlaying = false; btn.disabled = false; pb.disabled = melody.some(n=>n===null); }, totalMs);
}

function practicePlay(){
  // Remove first-time halo on first click
  document.getElementById('practiceBtn').classList.remove('needs-practice');
  // Generate a new pattern only if the previous one has been checked (or none exists yet)
  if(!currentPattern || patternChecked){
    const pool = getActivePool();
    currentPattern = Array.from({length: getPatternLength()}, () =>
      pool[Math.floor(Math.random() * pool.length)]
    );
    patternChecked = false;
    hintedSlots = new Set();
    incorrectAttempts = 0;
    document.getElementById('hintBtn').disabled = true;
  }
  playPattern();
  document.getElementById('checkBtn').disabled = false;
}


// ── Check Answer ──
function flashScreen(color){
  const el = document.getElementById('result-flash');
  el.className = '';
  void el.offsetWidth; // force reflow so animation restarts cleanly
  el.className = color === 'green' ? 'flash-green' : 'flash-red';
}

function advanceQuestion(){
  // Called by the "Next Question" button on the green overlay
  hideAffirmation(); // dismiss speech bubble immediately if still showing
  document.getElementById('result-flash').className = '';
  clearMelody();
  const btn = document.getElementById('checkBtn');
  btn.textContent = 'Check Answer!';
  btn.style.background = '';
  btn.style.boxShadow = '';
  btn.disabled = true;
  btn.onclick = checkAnswer;
}

function checkAnswer(){
  const btn = document.getElementById('checkBtn');

  if(!currentPattern){
    btn.textContent = 'Hit Practice first!';
    btn.style.background = '#aaa';
    setTimeout(() => {
      btn.textContent = 'Check Answer!';
      btn.style.background = '';
    }, 1800);
    return;
  }

  if(melody.some(n => n === null)){
    btn.textContent = 'Fill all 3 notes!';
    btn.style.background = '#aaa';
    setTimeout(() => {
      btn.textContent = 'Check Answer!';
      btn.style.background = '';
    }, 1800);
    return;
  }

  const correct = currentPattern.every((n, i) => n === melody[i]);
  if(correct){
    patternChecked = true;
    hintedSlots = new Set();
    incorrectAttempts = 0;
    document.getElementById('hintBtn').disabled = true;
    bumpStreak();
    flashScreen('green');
    // Lock the check button while the green screen is up
    btn.textContent = 'Check Answer!';
    btn.style.background = '';
    btn.style.boxShadow = '';
    btn.disabled = true;
  } else {
    resetStreakAnimated();
    flashScreen('red');
    incorrectAttempts++;
    if(incorrectAttempts >= 1) document.getElementById('hintBtn').disabled = false;
    btn.textContent = '✗ Try Again';
    btn.style.background = '#E33059';
    btn.style.boxShadow = '0 3px 14px rgba(227,48,89,.5)';
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = 'Check Answer!';
      btn.style.background = '';
      btn.style.boxShadow = '';
      btn.disabled = false;
    }, 3600); // just after the red finishes fading
  }
}


// ── Hint ──
function giveHint(){
  if(!currentPattern) return;

  // Clear the melody instantly, then place one correct note
  melody = [null, null, null];
  melodyHistory = [];
  hintedSlots = new Set();

  // Pick a random slot
  const slot = Math.floor(Math.random() * SLOT_COUNT);
  melody[slot] = currentPattern[slot];
  hintedSlots.add(slot);

  render();
  syncUndoBtn();
  document.getElementById('hintBtn').disabled = true;
}

// ── Hint nudge (disabled-click tooltip) ──
(function(){
  let nudgeTimer = null;
  document.getElementById('hintWrap').addEventListener('click', function(e){
    const btn = document.getElementById('hintBtn');
    if(!btn.disabled) return; // let normal click through
    if(incorrectAttempts > 0) return; // hint was already legitimately used — stay silent
    e.stopPropagation();
    const nudge = document.getElementById('hint-nudge');
    nudge.classList.add('visible');
    clearTimeout(nudgeTimer);
    nudgeTimer = setTimeout(() => nudge.classList.remove('visible'), 2200);
  });
})();

// ── Milestone balloons ──
// Fixed pool: created once, reused every milestone — no GC pressure
const BALLOON_COLORS = ['🎈','🎈','🎈','🎈','🎈'];
const balloonEls = [];
(function initBalloons(){
  const pool = document.getElementById('balloon-pool');
  for(let i = 0; i < 12; i++){
    const b = document.createElement('span');
    b.className = 'balloon';
    b.textContent = BALLOON_COLORS[i % BALLOON_COLORS.length];
    b.addEventListener('animationend', () => {
      b.classList.remove('go'); // reset for next use
    });
    pool.appendChild(b);
    balloonEls.push(b);
  }
})();

function launchBalloons(){
  balloonEls.forEach((b, i) => {
    b.classList.remove('go');
    void b.offsetWidth; // force reflow so animation restarts
    b.style.left            = (4 + Math.random() * 88) + '%';
    b.style.animationDelay    = (i * 0.16) + 's';
    b.style.animationDuration = (3.6 + Math.random() * 0.8) + 's';
    b.classList.add('go');
  });
}

// ── Milestone affirmations ────────────────────────────────────────────────────
const AFFIRMATIONS = [
  "Your ears are getting stronger every round!",
  "You're listening like a true musician!",
  "Strong ears make strong musicians!",
  "Excellent musical detective work!",
  "Your musical instincts are getting stronger.",
  "Nice work, Maestro!",
  "Careful listening pays off!",
  "You're hearing patterns more clearly now!",
  "Wow!",
  "Your listening skills are leveling up.",
  "Your focus is impressive!",
  "If you keep this up, you could take your music teacher's job!",
  "The notes can't fool you anymore!",
  "I'm proud of you!"
];
let affirmQueue = [];
let affirmTimer = null;

function pickAffirmation(){
  if(affirmQueue.length === 0){
    // Shuffle the full list into the queue
    affirmQueue = [...AFFIRMATIONS].sort(() => Math.random() - 0.5);
  }
  return affirmQueue.pop();
}

// ── Talking mouth animation ───────────────────────────────────────────────────
const MOUTH_CLOSED = 'M 44 31 Q 50 34 56 31';                     // normal smile
const MOUTH_OPEN   = 'M 44 31 Q 50 37 56 31 Q 50 30 44 31';       // open oval

let talkRunning   = false;
let talkStepTimer = null;
let talkStopTimer = null;
let talkPhase     = false; // false = closed, true = open

function talkStep(){
  if(!talkRunning) return;
  talkPhase = !talkPhase;
  mth.setAttribute('d', talkPhase ? MOUTH_OPEN : MOUTH_CLOSED);
  // Vary the speed a little so it sounds natural
  talkStepTimer = setTimeout(talkStep, 110 + Math.floor(Math.random() * 130));
}

function startTalking(){
  stopTalking(); // clear any prior run
  talkRunning = true;
  talkPhase   = false;
  talkStep();
  talkStopTimer = setTimeout(stopTalking, 4000);
}

function stopTalking(){
  talkRunning = false;
  clearTimeout(talkStepTimer);
  clearTimeout(talkStopTimer);
  talkStepTimer = talkStopTimer = null;
  mth.setAttribute('d', MOUTH_CLOSED); // always leave a smile
}
// ─────────────────────────────────────────────────────────────────────────────

function showAffirmation(){
  const bubble = document.getElementById('affirmation-bubble');
  const text = pickAffirmation();
  bubble.textContent = text;

  // Position: centred horizontally over the singer SVG, just above its head.
  // We anchor to the head (top 12% of SVG), then shift up by the bubble's own
  // height via translateY(-100%) so the tail points down at the head.
  const rect = singerSvg.getBoundingClientRect();
  const centerX = rect.left + rect.width * 0.5;
  // Anchor just above the top of the SVG so the tail clears the head entirely
  const aboveHead = rect.top - 8;
  bubble.style.left      = centerX  + 'px';
  bubble.style.top       = aboveHead + 'px';
  bubble.style.transform = 'translateX(-50%) translateY(-100%)';

  document.body.classList.add('milestone-active');
  // Force reflow before adding .show so the transition fires
  void bubble.offsetWidth;
  bubble.classList.add('show');

  if(text === 'Wow!'){
    // Single open-then-close for "Wow!"
    mth.setAttribute('d', MOUTH_OPEN);
    setTimeout(() => mth.setAttribute('d', MOUTH_CLOSED), 400);
  } else {
    startTalking(); // continuous mouth animation for all other affirmations
  }

  clearTimeout(affirmTimer);
  affirmTimer = setTimeout(hideAffirmation, 10000);
}

function hideAffirmation(){
  clearTimeout(affirmTimer);
  stopTalking();
  const bubble = document.getElementById('affirmation-bubble');
  bubble.classList.remove('show');
  // Remove milestone-active after fade completes
  setTimeout(() => document.body.classList.remove('milestone-active'), 320);
}
