<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ear Training Gym</title>
  <style>
    /* ── Reset & base ── */
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body.tint-easy   { background: #e6f7ed; }
    body.tint-medium { background: #fef3e6; }
    body.tint-hard   { background: #fde8ec; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f4f0;
      transition: background 0.8s ease;
      display: flex;
      flex-direction: column;
      padding: clamp(16px,2.5vh,32px) clamp(6px,1vw,14px) clamp(6px,1vh,14px);
      gap: clamp(14px,2.5vh,28px);
    }

    /* ── Title bar ── */
    .topbar {
      display: flex; align-items: center;
      flex-shrink: 0; position: relative;
      padding: 0 clamp(4px,.5vw,8px);
      gap: clamp(6px,.8vw,12px);
    }
    .app-title { font-size: clamp(13px,1.6vw,22px); font-weight: 600; color: #1a1a2e; }
    #homeBtn {
      display: flex; align-items: center; justify-content: center;
      width: clamp(40px,4.5vw,60px); height: clamp(40px,4.5vw,60px);
      border: none; border-radius: 8px;
      background: transparent; cursor: pointer; color: #5B37CC;
      flex-shrink: 0;
      transition: background .15s, color .15s, transform .12s;
    }
    #homeBtn:hover { background: #ede9fb; transform: scale(1.1); }
    #homeBtn:active { transform: scale(.93); }
    /* Practice button — absolutely centred in the topbar */
    #practiceBtn {
      position: absolute; left: 50%; transform: translateX(-50%);
      width: clamp(160px,32vw,440px);
      display: flex; align-items: center; justify-content: center;
      gap: clamp(4px,.4vw,8px);
      padding: clamp(7px,.9vh,12px) 0;
      font-size: clamp(14px,1.55vw,20px); font-weight: 800;
      background: #1db954; color: #fff;
      border: none; border-radius: clamp(6px,.7vw,10px);
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 3px 12px rgba(29,185,84,.35);
      transition: transform .12s, box-shadow .12s, background .12s;
    }
    #practiceBtn:hover:not(:disabled) { background: #17a349; box-shadow: 0 5px 18px rgba(29,185,84,.5); transform: translateX(-50%) scale(1.04); }
    #practiceBtn:active:not(:disabled) { transform: translateX(-50%) scale(.97); }
    #practiceBtn:disabled { opacity: .55; cursor: not-allowed; }
    /* Red pulsing halo on first load */
    #practiceBtn.needs-practice {
      animation: practicePulse 2.4s ease-out infinite;
    }
    @keyframes practicePulse {
      0%   { box-shadow: 0 3px 12px rgba(29,185,84,.35), 0 0 0 0px  rgba(91,55,204,.75); }
      100% { box-shadow: 0 3px 12px rgba(29,185,84,.35), 0 0 0 22px rgba(91,55,204,0);   }
    }
    /* Streak group — right side */
    .topbar-right {
      margin-left: auto;
      display: flex; align-items: center; gap: clamp(8px,1vw,16px);
    }
    #streak-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: clamp(22px,2.6vw,38px); font-weight: 800;
      color: #1a1a2e; white-space: nowrap;
      transition: transform .15s;
    }
    #streak-badge .streak-fire { font-size: 1.15em; line-height: 1; }
    #streak-badge.bump { transform: scale(1.35); }
    #streak-badge.zero { opacity: .3; }
    #best-badge {
      display: flex; align-items: center; gap: 5px;
      font-size: clamp(15px,1.8vw,26px); font-weight: 700;
      color: #7a6a9a; white-space: nowrap;
    }
    #best-badge.hidden { opacity: 0; pointer-events: none; }
    /* Streak shown on overlays */
    #overlay-streak {
      display: none;
      font-size: clamp(20px,2.4vw,36px); font-weight: 900;
      color: rgba(255,255,255,0.93); letter-spacing: .03em;
      text-align: center;
    }
    #result-flash.flash-green #overlay-streak,
    #result-flash.flash-red   #overlay-streak { display: block; }


    /* ── Three-column layout ── */
    .main { display: flex; gap: clamp(6px,.8vw,12px); flex: 1; min-height: 0; }

    /* ── Shared card ── */
    .card {
      background: #fff;
      border-radius: clamp(8px,1vw,14px);
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
    }

    /* ── Shared label ── */
    .col-label {
      font-size: clamp(12px,1.4vw,17px);
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #444455;
      text-align: center;
      flex-shrink: 0;
      font-weight: 700;
    }

    /* ── Left: note palette ── */
    .palette-col {
      width: 15%; min-width: 0;
      display: flex; flex-direction: column;
      align-items: center;
      padding: clamp(6px,.8vh,14px) clamp(4px,.5vw,8px);
      gap: clamp(8px,1vh,14px);
    }
    .palette-notes {
      display: flex; flex-direction: column-reverse;
      align-items: center;
      gap: clamp(4px,.6vh,8px);
      flex: 1; justify-content: space-around; width: 100%;
    }
    .chip {
      width: clamp(41px,4.6vw,67px); height: clamp(41px,4.6vw,67px);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: grab; user-select: none;
      font-weight: 600; font-size: clamp(10px,1.27vw,17px);
      border: 2px solid rgba(0,0,0,.13);
      transition: transform .12s, box-shadow .12s;
      flex-shrink: 0; color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .chip:hover  { transform: scale(1.1); box-shadow: 0 4px 14px rgba(0,0,0,.2); }
    .chip:active { cursor: grabbing; transform: scale(1.13); }
    .chip.dark   { color: #1a1a00; text-shadow: none; }
    .chip.unavailable {
      opacity: 0.28; cursor: not-allowed;
      filter: grayscale(60%);
      pointer-events: none;
    }

    /* ── Middle: melody timeline ── */
    .timeline-col {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      padding: clamp(6px,.8vh,14px);
      gap: clamp(4px,.5vh,8px);
    }
    .track {
      flex: 1; position: relative;
      border-radius: 10px; border: 2px dashed #d0cfe8;
      overflow-x: auto; overflow-y: hidden;
      transition: border-color .15s, background .15s;
      scroll-behavior: smooth; min-height: 0;
    }
    .track.over { border-color: #5B37CC; background: #f2f0fd; }
    .track-inner { position: relative; height: 100%; min-width: 100%; }
    .empty {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      color: #b0b0c0; font-size: clamp(10px,1.1vw,13px);
      pointer-events: none; white-space: nowrap;
    }
    .contour-svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; overflow: visible;
      transition: opacity 0.25s ease-out;
    }
    .tnote {
      position: absolute;
      width: clamp(39px,4.37vw,62px); height: clamp(39px,4.37vw,62px);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: clamp(10px,1.15vw,15px);
      border: 2px solid rgba(0,0,0,.13);
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.3);
      transition: transform .12s; cursor: default;
    }
    .tnote.dark    { color: #1a1a00; text-shadow: none; }
    .tnote.playing { transform: scale(1.18); box-shadow: 0 0 0 4px rgba(91,55,204,.3); z-index: 10; }
    .rm {
      position: absolute; top: -4px; right: -4px;
      width: clamp(14px,1.2vw,18px); height: clamp(14px,1.2vw,18px);
      border-radius: 50%; background: #fff; border: 1px solid #d0cfe8;
      display: none; align-items: center; justify-content: center;
      font-size: clamp(9px,1vw,11px); cursor: pointer; color: #666; z-index: 10;
    }
    .tnote:hover .rm { display: flex; }

    /* ── Note poof animation ── */
    @keyframes poof {
      0%   { transform: scale(1);    opacity: 1;   filter: blur(0px); }
      40%  { transform: scale(1.35); opacity: 0.7; filter: blur(1px); }
      100% { transform: scale(0.1);  opacity: 0;   filter: blur(6px); }
    }
    .tnote.poofing { animation: poof 0.28s ease-out forwards; pointer-events: none; z-index: 20; }

    /* ── Right column ── */
    .right-col {
      width: 20%; min-width: 0;
      display: flex; flex-direction: column;
      gap: clamp(6px,.8vh,12px);
    }

    /* Singer card */
    .singer-card {
      flex: 2;
      display: flex; flex-direction: column;
      align-items: stretch; justify-content: center;
      padding: clamp(6px,.8vh,12px) clamp(6px,.8vw,12px);
      position: relative; overflow: visible;
    }
    .fig-wrap {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(3px,.4vh,6px);
      overflow: visible; flex: 1;
    }
    .syllable-display {
      font-size: clamp(36px,6vw,76px);
      font-weight: 700; color: #5B37CC;
      min-height: 1.1em; text-align: center;
      transition: color .1s; letter-spacing: 0.02em;
    }
    .singer-svg {
      width: clamp(78px,11.7vw,195px); height: auto;
      overflow: visible; cursor: pointer;
    }

    /* Floating music notes */
    .mnote {
      position: absolute; font-size: clamp(12px,1.6vw,20px);
      opacity: 0; pointer-events: none; user-select: none;
      bottom: 55%; left: 50%;
    }
    @keyframes floatUp {
      0%   { opacity: 0;   transform: translate(0,0)                         rotate(-5deg)  scale(0.6);  }
      20%  { opacity: 1;   transform: translate(var(--x1),var(--y1)) rotate(var(--r1)) scale(1.15); }
      70%  { opacity: 0.8; transform: translate(var(--x2),var(--y2)) rotate(var(--r2)) scale(1);    }
      100% { opacity: 0;   transform: translate(var(--x3),var(--y3)) rotate(var(--r3)) scale(0.7);  }
    }
    .mnote.go { animation: floatUp 1.0s ease-out forwards; }

    /* Floating Zzz */
    .znote {
      position: absolute; font-weight: 700;
      opacity: 0; pointer-events: none; user-select: none;
      bottom: 60%; left: 55%; color: #9999cc;
    }
    @keyframes floatZzz {
      0%   { opacity: 0;   transform: translate(0,0)        rotate(0deg)   scale(0.7); }
      20%  { opacity: 1;   transform: translate(6px,-15px)  rotate(8deg)  scale(1.1); }
      70%  { opacity: 0.7; transform: translate(14px,-40px) rotate(15deg) scale(1);   }
      100% { opacity: 0;   transform: translate(20px,-65px) rotate(20deg) scale(0.8); }
    }
    .znote.go { animation: floatZzz 2.2s ease-out forwards; }

    /* Playback/clear buttons */
    .btn-row { display: flex; flex-direction: column; gap: clamp(4px,.5vh,8px); }
    .bplay {
      width: 100%; display: flex; align-items: center; justify-content: center;
      gap: clamp(4px,.4vw,8px);
      padding: clamp(7px,1vh,13px) 10px;
      border-radius: clamp(6px,.7vw,10px);
      background: #5B37CC; color: #fff; border: none;
      font-size: clamp(11px,1.3vw,16px); font-weight: 700;
      cursor: pointer; transition: background .12s, transform .1s; white-space: nowrap;
    }
    .bplay:hover    { background: #4828a8; }
    .bplay:active   { transform: scale(.97); }
    .bplay:disabled { background: #e0e0e8; color: #aaa; cursor: not-allowed; }
    .bclr {
      width: 100%; display: flex; align-items: center; justify-content: center;
      gap: clamp(4px,.4vw,7px);
      padding: clamp(7px,1vh,13px) 10px;
      border-radius: clamp(6px,.7vw,10px);
      background: transparent; color: #6b6b80;
      border: 1.5px solid #d0d0dc;
      font-size: clamp(11px,1.3vw,16px); font-weight: 700;
      cursor: pointer; transition: background .12s; white-space: nowrap;
    }
    .bclr:hover { background: #ededf0; }

    /* ── Hint checkmark ── */
    .note-slot { overflow: visible; }
    @keyframes checkPop {
      from { transform: translateX(-50%) scale(0.3); opacity: 0; }
      to   { transform: translateX(-50%) scale(1);   opacity: 1; }
    }
    .hint-check {
      position: absolute;
      bottom: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(13px,1.5vw,20px);
      font-weight: 900;
      color: #1db954;
      text-shadow: 0 1px 6px rgba(29,185,84,.4);
      pointer-events: none;
      animation: checkPop 0.35s cubic-bezier(.175,.885,.32,1.275) forwards;
    }

    /* ── Hinted slot chip ── */
    .slot-chip.hinted {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.55),
                  0 0 12px 5px rgba(29,185,84,0.55),
                  0 0 28px 10px rgba(29,185,84,0.25);
      animation: hintPulse 2s ease-in-out infinite;
    }
    .slot-chip.hinted .rm { display: none !important; }
    @keyframes hintPulse {
      0%,100% { box-shadow: 0 0 0 3px rgba(255,255,255,0.55),
                             0 0 12px 5px rgba(29,185,84,0.55),
                             0 0 28px 10px rgba(29,185,84,0.25); }
      50%      { box-shadow: 0 0 0 3px rgba(255,255,255,0.75),
                             0 0 18px 8px rgba(29,185,84,0.75),
                             0 0 38px 14px rgba(29,185,84,0.35); }
    }

    /* ── Full-screen result flash ── */
    #result-flash {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9999;
      opacity: 0;
      display: flex; align-items: center; justify-content: center;
    }
    /* Green: stays solid until user clicks Next Question */
    #result-flash.flash-green {
      background: rgba(29,185,84,0.68);
      opacity: 1;
      pointer-events: auto;
      flex-direction: column;
      gap: clamp(16px,2.5vh,32px);
    }
    /* Red: 2s hold then 1.5s slow fade */
    #result-flash.flash-red {
      background: rgba(227,48,89,0.68);
      animation: flashRed 3.5s ease-out forwards;
      flex-direction: column;
      gap: clamp(10px,1.8vh,22px);
    }
    @keyframes flashRed {
      0%, 57% { opacity: 1; }
      100%    { opacity: 0; }
    }
    /* Correct / Try Again labels — hidden by default, shown by overlay class */
    #correct-label, #try-again-label {
      display: none;
      font-size: clamp(26px,3.2vw,48px); font-weight: 900;
      color: #fff; letter-spacing: .06em;
      text-align: center;
    }
    #result-flash.flash-green #correct-label  { display: block; }
    #result-flash.flash-red   #try-again-label { display: block; }
    /* Next Question button sits centred on the green overlay */
    #nextQBtn {
      display: none;
      padding: clamp(12px,1.4vh,20px) clamp(28px,3vw,52px);
      font-size: clamp(16px,1.8vw,24px); font-weight: 800;
      background: #fff; color: #1db954;
      border: 3px solid #1db954; border-radius: 999px;
      cursor: pointer; letter-spacing: .02em;
      box-shadow: 0 6px 28px rgba(0,0,0,.2);
      transition: transform .1s, box-shadow .1s;
    }
    #nextQBtn:hover  { transform: scale(1.05); box-shadow: 0 8px 36px rgba(0,0,0,.28); }
    #nextQBtn:active { transform: scale(.97); }
    #result-flash.flash-green #nextQBtn { display: block; }

    /* ── Milestone affirmation speech bubble ── */
    #affirmation-bubble {
      position: fixed;
      background: #fff;
      color: #333;
      font-size: clamp(13px,1.4vw,17px);
      font-weight: 650;
      line-height: 1.35;
      text-align: center;
      padding: clamp(10px,1.2vh,16px) clamp(14px,1.6vw,22px);
      border-radius: 18px;
      box-shadow: 0 6px 28px rgba(0,0,0,.22);
      max-width: clamp(180px,22vw,260px);
      pointer-events: none;
      z-index: 10004;
      opacity: 0;
      /* transform is set inline by JS; margin-top handles the float-in offset */
      margin-top: 8px;
      transition: opacity .3s ease, margin-top .35s ease;
    }
    /* Tail pointing down toward the singer */
    #affirmation-bubble::after {
      content: '';
      position: absolute;
      bottom: -13px; left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top: 8px solid #fff;
      border-bottom: none;
      filter: drop-shadow(0 3px 2px rgba(0,0,0,.1));
    }
    #affirmation-bubble.show {
      opacity: 1;
      margin-top: 0px;
    }
    /* Lift singer card above the green overlay during a milestone */
    body.milestone-active .singer-card {
      position: relative;
      z-index: 10002;
    }

    /* ── Treadmill belt animation ── */
    .splash-belt-anim {
      animation: splashBeltRoll 0.38s linear infinite;
    }
    @keyframes splashBeltRoll {
      from { stroke-dashoffset: 0;  }
      to   { stroke-dashoffset: 12; }
    }

    /* ── Milestone balloons ── */
    #balloon-pool {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 10001;
      overflow: hidden;
    }
    .balloon {
      position: absolute; bottom: -12%;
      font-size: clamp(28px,3.5vw,50px);
      opacity: 0;
      will-change: transform, opacity;
    }
    .balloon.go {
      animation: balloonFloat 4s linear forwards;
    }
    /* Sine-wave horizontal drift: X follows sin curve, Y rises steadily, opacity fades last 20% */
    @keyframes balloonFloat {
      0%   { opacity:1; transform:translateY(0)      translateX(0px)   rotate(0deg);  }
      8%   {            transform:translateY(-9vh)   translateX(7px)   rotate(4deg);  }
      17%  {            transform:translateY(-19vh)  translateX(13px)  rotate(7deg);  }
      25%  {            transform:translateY(-28vh)  translateX(16px)  rotate(8deg);  }
      33%  {            transform:translateY(-37vh)  translateX(13px)  rotate(6deg);  }
      42%  {            transform:translateY(-47vh)  translateX(6px)   rotate(2deg);  }
      50%  {            transform:translateY(-56vh)  translateX(-2px)  rotate(-1deg); }
      58%  {            transform:translateY(-65vh)  translateX(-9px)  rotate(-5deg); }
      67%  {            transform:translateY(-75vh)  translateX(-14px) rotate(-7deg); }
      75%  {            transform:translateY(-84vh)  translateX(-14px) rotate(-8deg); }
      83%  { opacity:1; transform:translateY(-93vh)  translateX(-9px)  rotate(-5deg); }
      100% { opacity:0; transform:translateY(-116vh) translateX(0px)   rotate(0deg);  }
    }

    /* ── Hint button ── */
    #hintBtn {
      width: 100%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      gap: clamp(4px,.4vw,7px);
      padding: clamp(7px,.9vh,11px) 10px;
      font-size: clamp(10px,1.1vw,14px); font-weight: 700;
      background: #e8e4ff; color: #5B37CC;
      border: 1.5px solid #c8bff0; border-radius: clamp(6px,.7vw,10px);
      cursor: pointer;
      transition: transform .12s, background .12s, opacity .2s;
      white-space: nowrap;
    }
    #hintBtn:hover:not(:disabled) { background: #d8d0ff; transform: scale(1.03); }
    #hintBtn:active:not(:disabled) { transform: scale(.97); }
    #hintBtn:disabled { opacity: .38; pointer-events: none; }
    .hint-wrap { position: relative; width: 100%; }
    .hint-wrap:has(#hintBtn:disabled) { cursor: not-allowed; }
    #hint-nudge {
      position: absolute; bottom: calc(100% + 8px); right: 0;
      transform: none;
      background: #1a1a2e; color: #e8e4ff;
      font-size: clamp(10px,1vw,13px); font-weight: 600;
      padding: 6px 12px; border-radius: 8px;
      white-space: normal; width: max-content; max-width: min(260px, 80vw);
      text-align: center; pointer-events: none;
      opacity: 0; transition: opacity .18s;
      z-index: 50;
    }
    #hint-nudge.visible { opacity: 1; }
    /* small arrow pointing down */
    #hint-nudge::after {
      content: ''; position: absolute; top: 100%; right: 16px;
      border: 5px solid transparent;
      border-top-color: #1a1a2e;
    }

    /* ── Splash screen ── */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 40px 10px #00ff88, 0 0 120px 40px #00cc66, inset 0 0 60px 10px #00ff8833; }
      50%       { box-shadow: 0 0 80px 30px #00ff88, 0 0 200px 80px #00cc66, inset 0 0 100px 30px #00ff8855; }
    }
    @keyframes textPulse {
      0%, 100% { text-shadow: 0 0 10px #00ff88, 0 0 30px #00ff88, 0 0 60px #00cc66; opacity: .9; }
      50%       { text-shadow: 0 0 20px #00ff88, 0 0 60px #00ff88, 0 0 120px #00cc66; opacity: 1; }
    }
    @keyframes scanline {
      0%   { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }
    @keyframes splashFadeOut {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes floatNote {
      0%   { transform: translateY(0)   rotate(-10deg); opacity: .7; }
      50%  { transform: translateY(-18px) rotate(8deg);  opacity: 1; }
      100% { transform: translateY(0)   rotate(-10deg); opacity: .7; }
    }
    @keyframes titleBounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    #splash {
      position: fixed; inset: 0; z-index: 999999;
      background: #1a1a2e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(10px,2vh,22px);
      padding: 24px;
    }
    #splash-dots {
      display: flex; gap: 10px; margin-bottom: 4px;
    }
    #splash-dots span {
      width: 14px; height: 14px; border-radius: 50%;
      display: inline-block;
    }
    #splash-title {
      font-size: clamp(30px, 5.5vw, 64px);
      font-weight: 900; letter-spacing: .01em;
      color: #fff;
      text-align: center; line-height: 1.1;
      text-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    #splash-sub {
      font-size: clamp(14px, 1.8vw, 20px);
      color: #a0a0c0; letter-spacing: .04em;
      text-align: center;
    }
    #splash-singer {
      position: relative;
      width: clamp(90px, 14vw, 160px);
      height: clamp(90px, 14vw, 160px);
      display: flex; align-items: center; justify-content: center;
    }
    #splash-singer .singer-svg {
      width: 100% !important; height: 100% !important;
    }
    .splash-float-note {
      position: absolute;
      font-size: clamp(18px,2.5vw,28px);
      pointer-events: none;
      animation: floatNote 2.8s ease-in-out infinite;
    }
    #difficulty-btns {
      display: flex; gap: clamp(10px,1.5vw,20px); margin-top: 4px;
    }
    #diff-tagline {
      min-height: 1.4em;
      font-size: clamp(13px,1.5vw,17px);
      color: #c0c0e0;
      font-style: italic;
      letter-spacing: .02em;
      text-align: center;
      opacity: 0;
      transition: opacity .18s;
      pointer-events: none;
    }
    #diff-tagline.visible { opacity: 1; }
    .diff-btn {
      padding: clamp(12px,1.8vh,20px) clamp(24px,3.5vw,52px);
      font-size: clamp(15px,1.9vw,22px); font-weight: 900;
      letter-spacing: .06em; color: #fff;
      border: none; border-radius: 50px;
      cursor: pointer;
      transition: transform .12s, box-shadow .12s, background .12s;
    }
    .diff-btn:active { transform: scale(.97); }
    .diff-btn:disabled { opacity: .5; cursor: default; }
    .easy-btn   { background: #1db954; box-shadow: 0 6px 28px rgba(29,185,84,.45); }
    .easy-btn:hover   { transform: scale(1.07); background: #23d45e; box-shadow: 0 8px 36px rgba(29,185,84,.6); }
    .medium-btn { background: #F7943D; box-shadow: 0 6px 28px rgba(247,148,61,.45); }
    .medium-btn:hover { transform: scale(1.07); background: #f9a455; box-shadow: 0 8px 36px rgba(247,148,61,.6); }
    .hard-btn   { background: #E33059; box-shadow: 0 6px 28px rgba(227,48,89,.45); }
    .hard-btn:hover   { transform: scale(1.07); background: #f03366; box-shadow: 0 8px 36px rgba(227,48,89,.6); }
    #splash.hiding {
      animation: splashFadeOut 1.2s ease-in forwards;
      pointer-events: none;
    }

    /* ── Question label ── */
    .question-label {
      font-size: clamp(13px,1.5vw,20px);
      font-weight: 800;
      color: #5B37CC;
      letter-spacing: .04em;
      padding: 3px 14px;
      background: #f0ecff;
      border-radius: 20px;
      border: 1.5px solid #c8bff0;
      white-space: nowrap;
    }


    /* Controls card */
    .controls-card {
      flex-shrink: 0;
      padding: clamp(6px,.8vh,12px) clamp(6px,.8vw,12px);
    }

    /* Check Answer button */
    #checkBtn {
      flex-shrink: 0;
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: clamp(13px,1.7vh,22px) 10px;
      font-size: clamp(14px,1.6vw,20px); font-weight: 900;
      letter-spacing: .03em;
      background: #F7943D; color: #fff;
      border: none; border-radius: clamp(6px,.7vw,10px);
      cursor: pointer;
      box-shadow: 0 3px 14px rgba(247,148,61,.4);
      transition: transform .12s, box-shadow .12s, background .12s;
      white-space: nowrap;
    }
    #checkBtn:hover { background: #e07e28; box-shadow: 0 5px 20px rgba(247,148,61,.55); transform: scale(1.03); }
    #checkBtn:active { transform: scale(.97); }
    #checkBtn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── Answer slots ── */
    /* slot-row is just a positioning context — slots are placed absolutely by JS */
    .slot-row {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .note-slot {
      position: absolute;
      border-radius: 50%;
      border: 3px dashed #c0bce8;
      background: #f8f7ff;
      display: flex; align-items: center; justify-content: center;
      pointer-events: all;
      transition: border-color .15s, background .15s, transform .15s, left .3s ease, bottom .3s ease;
      /* size set via CSS variable so JS can read it easily */
    }
    .note-slot.over {
      border-color: #5B37CC;
      background: #ece8ff;
      transform: scale(1.07);
    }
    .note-slot.filled {
      border-style: solid;
    }
    .slot-num {
      font-size: clamp(18px, 2.5vw, 32px);
      font-weight: 800;
      color: #c0bce8;
      pointer-events: none;
      user-select: none;
    }
    .note-slot.filled .slot-num { display: none; }
    .slot-chip {
      width: 100%; height: 100%;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: clamp(12px, 1.6vw, 20px);
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.3);
      position: absolute; inset: 0;
      cursor: pointer;
      transition: transform .12s;
    }
    .slot-chip.dark { color: #1a1a00; text-shadow: none; }
    .slot-chip:hover { transform: scale(1.06); }
    .slot-chip.hinted:hover { transform: none; }
    .slot-chip .rm {
      position: absolute; top: 2px; right: 2px;
      width: clamp(14px,1.2vw,18px); height: clamp(14px,1.2vw,18px);
      border-radius: 50%; background: #fff; border: 1px solid #d0cfe8;
      display: none; align-items: center; justify-content: center;
      font-size: clamp(9px,1vw,11px); cursor: pointer; color: #666; z-index: 10;
    }
    .slot-chip:hover .rm { display: flex; }
  </style>
</head>

  <!-- Balloon pool (fixed pool, reused on milestones) -->
  <div id="balloon-pool"></div>

  <!-- Milestone affirmation speech bubble -->
  <div id="affirmation-bubble"></div>

  <!-- Full-screen result flash overlay -->
  <div id="result-flash">
    <div id="correct-label">✓ Correct!</div>
    <div id="try-again-label">✗ Try Again!</div>
    <div id="overlay-streak"></div>
    <button id="nextQBtn" onclick="advanceQuestion()">→ Next Question</button>
  </div>

  <!-- Splash screen -->
  <div id="splash">
    <div id="splash-dots">
      <span style="background:#E33059"></span>
      <span style="background:#F7943D"></span>
      <span style="background:#EDD928"></span>
      <span style="background:#94C631"></span>
      <span style="background:#13826D"></span>
      <span style="background:#5B37CC"></span>
      <span style="background:#EA57B2"></span>
    </div>
    <div id="splash-title">Ear Training Gym</div>
    <div id="splash-singer">
      <span class="splash-float-note" style="left:-18px;top:10px;animation-delay:0s">🎵</span>
      <span class="splash-float-note" style="right:-16px;top:18px;animation-delay:.9s">🎶</span>
      <span class="splash-float-note" style="left:4px;bottom:-4px;animation-delay:1.7s">🎵</span>
    </div>
    <div id="splash-sub">Let's make our ears strong!<br>Match the sounds you hear with the solfège notes.</div>
    <div id="difficulty-btns">
      <button class="diff-btn easy-btn"   onclick="splashJump('easy')"
              data-tagline="Let's get it done!">Easy</button>
      <button class="diff-btn medium-btn" onclick="splashJump('medium')"
              data-tagline="Level up! Get ready to use the full scale.">Medium</button>
      <button class="diff-btn hard-btn"   onclick="splashJump('hard')"
              data-tagline="Are you ready for a true challenge?">Hard</button>
    </div>
    <div id="diff-tagline"></div>
  </div>

  <div class="topbar">
    <button id="homeBtn" onclick="goHome()" title="Change difficulty">
      <svg width="60%" height="60%" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </button>
    <div class="app-title">Ear Training Gym</div>
    <button id="practiceBtn" class="needs-practice" onclick="practicePlay()">
      <svg width="13" height="13" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,0 10,5 1,10"/></svg>
      Practice
    </button>
    <div class="topbar-right">
      <div id="streak-badge" class="zero">
        <span class="streak-fire">🔥</span>
        <span id="streak-num">0</span>
      </div>
      <div id="best-badge" class="hidden">
        ⭐ Best: <span id="best-num">0</span>
      </div>
    </div>
  </div>

  <div class="main">

    <!-- Left: note palette (Do at bottom, Do' at top) -->
    <div class="card palette-col">
      <div class="col-label">Notes</div>
      <div class="palette-notes">
        <div class="chip"      draggable="true" data-note="Do"  style="background:#E33059">Do</div>
        <div class="chip"      draggable="true" data-note="Re"  style="background:#F7943D">Re</div>
        <div class="chip dark" draggable="true" data-note="Mi"  style="background:#EDD928">Mi</div>

        <div class="chip"      draggable="true" data-note="Ti"  style="background:#EA57B2">Ti</div>

      </div>

        </div>
      </div>

      <!-- Controls card: sing, hint, clear, undo -->
      <div class="card controls-card">
        <div class="btn-row">
          <button class="bplay" id="pb" disabled>
            <svg width="14" height="14" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,0 10,5 1,10"/></svg>
            Sing it!
          </button>
          <div class="hint-wrap" id="hintWrap">
            <div id="hint-nudge">Check your answer before you ask for a hint!</div>
            <button id="hintBtn" onclick="giveHint()" disabled>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
              Give Me a Hint
            </button>
          </div>
          <button class="bclr" id="cb">
            <svg width="14" height="14" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
            Clear

          <button class="bclr" id="undoBtn" disabled>

            Undo
          </button>
        </div>
      </div>

      <!-- Check Answer button -->
      <button id="checkBtn" onclick="checkAnswer()" disabled>Check Answer!</button>

    </div>
  </div>

  'Do' :{bg:'#E33059',dark:false,degree:0},
  'Re' :{bg:'#F7943D',dark:false,degree:1},

const DEGREES=7;
function getNoteW(){
  const vw = window.innerWidth;
  return Math.min(62, Math.max(39, vw * 0.0437));
}
function getColW(){ return getNoteW() * 1.33; }
function getPadL(){ return getNoteW() * 0.33; }
function getTrackH(){return trk.clientHeight;}
function noteBottom(degree){
  const NOTE_W=getNoteW(),PAD_V=getNoteW()*0.65;
  const usable=getTrackH()-PAD_V*2-NOTE_W;
  return PAD_V+(degree/DEGREES)*usable;
}
function noteCenterY(degree){return getTrackH()-noteBottom(degree)-getNoteW()/2;}
function noteCenterX(index){return getPadL()+index*getColW()+getNoteW()/2;}
let actx=null;
const DECODED={slow:{}};
const decodedSpeeds={};
let currentSpeed='slow';

function getCtx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function b64ToAB(b64){
  const bin=atob(b64),buf=new ArrayBuffer(bin.length),v=new Uint8Array(buf);
  for(let i=0;i<bin.length;i++)v[i]=bin.charCodeAt(i);return buf;
}
async function decodeSpeed(speed){
  if(decodedSpeeds[speed])return;
  const ctx=getCtx();
  for(const [note,b64] of Object.entries(AUDIO_B64[speed])){
    try{DECODED[speed][note]=await ctx.decodeAudioData(b64ToAB(b64));}
    catch(e){console.warn('decode failed',speed,note,e);}
  }
  decodedSpeeds[speed]=true;
}
function fireNote(note,onsetMs){
  return new Promise(resolve=>{
    const ctx=getCtx(),buf=DECODED[currentSpeed][note];
    if(!buf){setTimeout(resolve,onsetMs);return;}
    const src=ctx.createBufferSource();
    src.buffer=buf;src.connect(ctx.destination);src.start(0);
    setTimeout(resolve,onsetMs);
  });
}
const mnEls=['mn0','mn1','mn2','mn3'].map(id=>document.getElementById(id));
let mnIdx=0;
function spawnNote(color){
  const el=mnEls[mnIdx%mnEls.length];mnIdx++;
  const side=Math.random()>0.5?1:-1;
  const x1=(8+Math.random()*12)*side, y1=-(12+Math.random()*8);
  const x2=(18+Math.random()*20)*side,y2=-(35+Math.random()*18);
  const x3=(24+Math.random()*22)*side,y3=-(58+Math.random()*22);
  el.style.setProperty('--x1',x1+'px');el.style.setProperty('--y1',y1+'px');
  el.style.setProperty('--x2',x2+'px');el.style.setProperty('--y2',y2+'px');
  el.style.setProperty('--x3',x3+'px');el.style.setProperty('--y3',y3+'px');
  el.style.setProperty('--r1',(Math.random()*20-10)+'deg');
  el.style.setProperty('--r2',(Math.random()*30-15)+'deg');
  el.style.setProperty('--r3',(Math.random()*40-20)+'deg');
  el.style.color=color;
  el.classList.remove('go');void el.offsetWidth;el.classList.add('go');
}

let melodyHistory = [];  // stack of melody snapshots before each change

function pushHistory(){
  melodyHistory.push([...melody]);
  if(undoBtn) undoBtn.disabled = false;
}

function syncUndoBtn(){
  if(undoBtn) undoBtn.disabled = melodyHistory.length === 0;
}
let SLOT_COUNT = 3;
let slotEls = Array.from(document.querySelectorAll('.note-slot'));

function attachSlotListeners(slot){
  // Drag-and-drop is handled at the trk level with a generous hit radius.
  // No per-slot listeners needed (avoids double-firing on exact hits).
}

function buildSlots(count){
  const row = document.getElementById('slotRow');
  row.innerHTML = '';
  slotEls = [];
  for(let i = 0; i < count; i++){
    const div = document.createElement('div');
    div.className = 'note-slot';
    div.dataset.slot = i;
    div.innerHTML = `<span class="slot-num">${i + 1}</span>`;
    attachSlotListeners(div);
    row.appendChild(div);
    slotEls.push(div);
  }
}

function getSlotSize(){ return Math.min(110, Math.max(60, window.innerWidth * 0.08)); }

// ── Forgiving drop: hit-test cursor against slot centers with generous radius ──
// Returns the nearest slot if within tolerance, else null.
function nearestDropSlot(clientX, clientY){
  let best = null, bestDist = Infinity;
  for(const slot of slotEls){
    const r    = slot.getBoundingClientRect();
    const cx   = r.left + r.width  / 2;
    const cy   = r.top  + r.height / 2;
    const dist = Math.hypot(clientX - cx, clientY - cy);
    // Tolerance = visual radius + ~40% extra on each side
    if(dist < r.width * 0.9 && dist < bestDist){ best = slot; bestDist = dist; }
  }
  return best;
}

trk.addEventListener('dragover', e => {
  e.preventDefault();
  const nearest = nearestDropSlot(e.clientX, e.clientY);
  slotEls.forEach(s => s.classList.toggle('over', s === nearest));
});

trk.addEventListener('dragleave', e => {
  // Only clear highlights when cursor leaves the whole track area
  if(!trk.contains(e.relatedTarget)) slotEls.forEach(s => s.classList.remove('over'));
});

trk.addEventListener('drop', e => {
  slotEls.forEach(s => s.classList.remove('over'));
  const note = e.dataTransfer.getData('note');
  if(!note) return;
  const nearest = nearestDropSlot(e.clientX, e.clientY);
  if(!nearest) return;
  e.preventDefault();
  pushHistory();
  melody[parseInt(nearest.dataset.slot)] = note;
  render();
  syncUndoBtn();
});

function render(){
  noteElems = [];
  contourSvg.innerHTML = '';
  trkInner.style.width = '100%';

  const trkW   = trk.clientWidth;
  const trkH   = getTrackH();
  const sz     = getSlotSize();
  const gap    = trkW / (SLOT_COUNT + 1);   // evenly space slots across width
  // slotX/slotY: center-of-slot coordinates in track space
  const slotCX = i => gap * (i + 1);
  const slotCY = i => {
    const note = melody[i];
    if(!note) return trkH / 2;               // empty → vertical center
    const deg = (NOTE_META[note] || NOTE_META['Do']).degree;
    return noteCenterY(deg);
  };

  slotEls.forEach((slot, i) => {
    // Remove chip and any hint checkmark
    const existing = slot.querySelector('.slot-chip');
    if(existing) existing.remove();
    const existingCheck = slot.querySelector('.hint-check');
    if(existingCheck) existingCheck.remove();
    // Reset classes and ALL inline styles from previous fill
    slot.classList.remove('filled');
    slot.style.borderColor = '';
    slot.style.background  = '';

    // Size & position (left/bottom so bottom=0 aligns with track bottom)
    slot.style.width  = sz + 'px';
    slot.style.height = sz + 'px';
    slot.style.left   = (slotCX(i) - sz / 2) + 'px';
    slot.style.bottom = (trkH - slotCY(i) - sz / 2) + 'px';

    const note = melody[i];
    if(!note) return;

    const m = NOTE_META[note] || NOTE_META['Do'];
    const label = note === 'Doh' ? "Do'" : note;
    slot.classList.add('filled');
    slot.style.borderColor = m.bg;
    slot.style.background  = m.bg + '22';

    const chip = document.createElement('div');
    chip.className = 'slot-chip' + (m.dark ? ' dark' : '') + (hintedSlots.has(i) ? ' hinted' : '');
    chip.style.background = m.bg;
    chip.innerHTML = label + '<span class="rm" title="Remove">×</span>';
    chip.querySelector('.rm').addEventListener('click', () => {
      if(hintedSlots.has(i)) return;  // hinted notes can't be removed
      chip.classList.add('poofing');
      pushHistory(); setTimeout(() => { melody[i] = null; render(); syncUndoBtn(); }, 260);
    });
    slot.appendChild(chip);
    noteElems[i] = chip;

    // Checkmark above hinted slot
    if(hintedSlots.has(i)){
      const chk = document.createElement('div');
      chk.className = 'hint-check';
      chk.textContent = '✓';
      slot.appendChild(chk);
    }
  });

  // Enable play only when all 3 slots filled
  pb.disabled = melody.some(n => n === null);

  // Set up SVG canvas (always, even if only 1 note filled so far)
  contourSvg.setAttribute('viewBox', `0 0 ${trkW} ${trkH}`);
  contourSvg.setAttribute('width',  trkW);
  contourSvg.setAttribute('height', trkH);
  contourSvg.innerHTML = '';

  const filled = melody.map((n,i) => n ? i : null).filter(i => i !== null);
  if(filled.length < 2) return;

  // Create the polyline now — points will be animated by rAF loop
  const poly = document.createElementNS('http://www.w3.org/2000/svg','polyline');
  poly.setAttribute('fill', 'none');
  poly.setAttribute('stroke', '#c8c4e8');
  poly.setAttribute('stroke-width', '2.5');
  poly.setAttribute('stroke-linejoin', 'round');
  poly.setAttribute('stroke-linecap', 'round');
  poly.setAttribute('stroke-dasharray', '5 4');
  contourSvg.appendChild(poly);

  // Animate contour to track chip positions in real time during CSS transition
  const trkRect  = trk.getBoundingClientRect();
  const DURATION = 320; // slightly longer than the 300ms CSS transition
  const start    = performance.now();

  function animateContour(now){
    const elapsed = now - start;

    const pts = filled.map(i => {
      const slot = slotEls[i];
      const r    = slot.getBoundingClientRect();
      // center of slot relative to the SVG (which is inside trkInner, same offset as trk)
      const cx = r.left - trkRect.left + r.width  / 2;
      const cy = r.top  - trkRect.top  + r.height / 2;
      return cx + ',' + cy;
    }).join(' ');

    poly.setAttribute('points', pts);

    if(elapsed < DURATION) requestAnimationFrame(animateContour);
  }

  requestAnimationFrame(animateContour);
}

async function playSong(){
  if(playing){stopReq=true;return;}
  if(practiceAudioPlaying) return;  // don't interrupt practice tones
  if(melody.every(n=>n===null)) return;
  if(!decodedSpeeds[currentSpeed]){
    pb.innerHTML='<svg width="16" height="16" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,0 10,5 1,10"/></svg> Loading...';
    pb.disabled=true;
    await decodeSpeed(currentSpeed);
    pb.disabled=false;
  }
  playing=true;stopReq=false;
  document.getElementById('practiceBtn').disabled = true;
  pb.innerHTML='<svg width="16" height="16" viewBox="0 0 10 10" fill="currentColor"><rect x="1" y="0" width="3" height="10" rx="1"/><rect x="6" y="0" width="3" height="10" rx="1"/></svg> Stop';
  const onsetMs=ONSET_MS[currentSpeed];
  await new Promise(r=>setTimeout(r,150));
  if(stopReq){playing=false;pb.innerHTML='<svg width="16" height="16" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,0 10,5 1,10"/></svg> Sing it!';return;}
  const betweenMs = Math.max(120, onsetMs * 0.20);
  const singMs    = onsetMs - betweenMs;

  const playable = melody.map((n,i)=>({note:n,i})).filter(x=>x.note);
  for(let pi=0;pi<playable.length;pi++){
    if(stopReq)break;
    const {note,i}=playable[pi];
    noteElems[i]&&noteElems[i].classList.add('playing');
    animOn(note);
    fireNote(note, onsetMs);
    await new Promise(r=>setTimeout(r,singMs));
    if(stopReq){ noteElems[i]&&noteElems[i].classList.remove('playing'); break; }
    noteElems[i]&&noteElems[i].classList.remove('playing');
    animBetween();
    await new Promise(r=>setTimeout(r,betweenMs));
  }
  await new Promise(r=>setTimeout(r,300));
  animOff();
  playing=false;
  document.getElementById('practiceBtn').disabled = false;
  pb.innerHTML='<svg width="16" height="16" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,0 10,5 1,10"/></svg> Sing it!';
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startIdle, 10000);
  render();
}

function startIdle(){
  if(playing) return;
  idleRunning = true;
  scheduleNextIdle();
}

function scheduleNextIdle(){
  if(!idleRunning) return;
  const delay = 4000 + Math.random()*6000;
  const t = setTimeout(()=>{
    if(!idleRunning) return;
    const roll = Math.random();
    if(roll < 0.22)      doFidget();
    else if(roll < 0.42) doArmWiggle();
    else if(roll < 0.57) doWeightShift();
    else if(roll < 0.72) doLookAround();
    else if(roll < 0.87) doBounce();
    else                 doStretch();
    scheduleNextIdle();
  }, delay);
  idleRAFs.push(t);
}

function doBlink(){
  leye.setAttribute('ry','0.4'); reye.setAttribute('ry','0.4');
  lshine.setAttribute('r','0');  rshine.setAttribute('r','0');
  const t = setTimeout(()=>{
    leye.setAttribute('ry','2.5'); reye.setAttribute('ry','2.5');
    lshine.setAttribute('r','1'); rshine.setAttribute('r','1');
  }, 130);
  idleRAFs.push(t);
}

  const t1 = setTimeout(()=>{

        singerSvg.style.transition = '';
      }, 260);
      idleRAFs.push(t3);
    }, 260);
    idleRAFs.push(t2);

}

function doWeightShift(){

function doLookAround(){
  if(playing) return;
  const lookLeft  = ()=>{ leye.setAttribute('cx','41'); reye.setAttribute('cx','53'); lshine.setAttribute('cx','42.2'); rshine.setAttribute('cx','54.2'); };
  const lookRight = ()=>{ leye.setAttribute('cx','47'); reye.setAttribute('cx','59'); lshine.setAttribute('cx','48.2'); rshine.setAttribute('cx','60.2'); };
  const lookFwd   = ()=>{ leye.setAttribute('cx','44'); reye.setAttribute('cx','56'); lshine.setAttribute('cx','45.2'); rshine.setAttribute('cx','57.2'); };
  lookLeft();
  const t1 = setTimeout(()=>{
    lookRight();
    const t2 = setTimeout(()=>{
      lookFwd();
    }, 500);
    idleRAFs.push(t2);
  }, 500);
  idleRAFs.push(t1);
}

function doBounce(){
  if(playing) return;
  let count = 0;
  singerSvg.style.transition = 'transform 0.15s ease-in-out';
  function step(){
    if(!idleRunning || playing) { singerSvg.style.transform=''; singerSvg.style.transition=''; return; }
    singerSvg.style.transform = count%2===0 ? 'translateY(-5px)' : 'translateY(0)';
    count++;
    if(count < 7){
      const t = setTimeout(step, 160);
      idleRAFs.push(t);
    } else {
      singerSvg.style.transform = '';
      const t = setTimeout(()=>{ singerSvg.style.transition=''; }, 160);
      idleRAFs.push(t);
    }
  }
  step();
}

function doStretch(){
  if(playing) return;
  singerSvg.style.transition = 'transform 0.4s ease-in-out';
  la.style.transition = 'all 0.4s ease-in-out';
  ra.style.transition = 'all 0.4s ease-in-out';

      la.style.transition = ''; laFore.style.transition = '';
      ra.style.transition = '';
      singerSvg.style.transition = '';
    }, 420);
    idleRAFs.push(t2);
  }, 700);
  idleRAFs.push(t1);
}

function spawnZzz(){

  const el = znEls[znIdx % znEls.length]; znIdx++;

  el.style.fontSize = sizes[znIdx % 3];

function fallAsleep(){
  if(playing) { sleepTimer = setTimeout(fallAsleep, 60000); return; }
  isSleeping = true;
  stopIdle();
  clearTimeout(idleTimer);
  clearTimeout(blinkLoopTimer);
  leye.style.transition = 'ry 1.5s ease-in-out';
  reye.style.transition = 'ry 1.5s ease-in-out';
  leye.setAttribute('ry','0.3');
  reye.setAttribute('ry','0.3');
  lshine.setAttribute('r','0');

  setTimeout(()=>{
    if(!isSleeping) return;
    singerSvg.style.transition = 'transform 2s ease-in-out';
    singerSvg.style.transform  = 'rotate(18deg) translateX(8px)';
    la.style.transition = 'all 2s ease-in-out';
    ra.style.transition = 'all 2s ease-in-out';
    setArms(27,70, 25,83, 73,70, 75,83);
  }, 800);
  setTimeout(()=>{

    spawnZzz();

function wakeUp(){
  isSleeping = false;
  clearTimeout(sleepZzzTimer);
  znEls.forEach(el=>{ el.classList.remove('go'); });
  leye.style.transition = 'ry 0.2s ease-out';
  reye.style.transition = 'ry 0.2s ease-out';
  leye.setAttribute('ry','2.5'); reye.setAttribute('ry','2.5');
  leye.setAttribute('cx','44'); reye.setAttribute('cx','56');
  lshine.setAttribute('r','1'); rshine.setAttribute('r','1');
  lshine.setAttribute('cx','45.2'); rshine.setAttribute('cx','57.2');
  singerSvg.style.transition = 'transform 0.3s ease-out';
  singerSvg.style.transform  = '';
  la.style.transition = 'all 0.3s ease-out';
  ra.style.transition = 'all 0.3s ease-out';
  setArms(27,66, 25,77, 73,66, 75,77);
  setTimeout(()=>{
    singerSvg.style.transition='';
    la.style.transition=''; ra.style.transition='';
    leye.style.transition=''; reye.style.transition='';
  }, 350);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startIdle, 10000);
  clearTimeout(blinkLoopTimer);
  scheduleNextBlink();
}

const SHOW_BARBELL = true;

let splashPressRAF   = null;
let splashPressTimer = null;
let splashBarbell    = null;

// pressPos = [lEx,lEy,lHx,lHy, rEx,rEy,rHx,rHy, barY]
// LOW  = bar at shoulder height; HIGH = bar pressed fully overhead
const PRESS_LOW  = [22, 62, 28, 54,  78, 62, 72, 54,  54];
const PRESS_HIGH = [32, 42, 36, 26,  68, 42, 64, 26,  26];
let pressPos = [...PRESS_LOW];

function easeOutPress(t)   { return t*(2-t); }
function easeInOutPress(t) { return t<.5 ? 2*t*t : -1+(4-2*t)*t; }

function pressTween(target, ms, ease, done){
  const from = [...pressPos];
  const t0   = performance.now();
  function step(now){
    const raw = Math.min((now - t0) / ms, 1);
    const e   = ease(raw);
    pressPos  = from.map((v,i) => v + (target[i]-v)*e);
    setArms(...pressPos.slice(0,8));
    if(SHOW_BARBELL) updateBarbell();
    if(raw < 1){ splashPressRAF = requestAnimationFrame(step); }
    else{ pressPos = [...target]; if(done) done(); }
  }
  splashPressRAF = requestAnimationFrame(step);
}

function updateBarbell(){
  if(!splashBarbell) return;
  splashBarbell.setAttribute('transform', `translate(0,${pressPos[8]})`);
}

function makeBarbell(){
  const NS = 'http://www.w3.org/2000/svg';
  const g  = document.createElementNS(NS,'g');
  function bRect(x,y,w,h,rx,fill){
    const r = document.createElementNS(NS,'rect');
    r.setAttribute('x',x); r.setAttribute('y',y);
    r.setAttribute('width',w); r.setAttribute('height',h);
    if(rx) r.setAttribute('rx',rx);
    r.setAttribute('fill',fill);
    return r;
  }
  // Barbell is drawn centred at local y=0; translate moves it into position.
  g.appendChild(bRect(16, -1.5, 68, 3,  1.5, '#9a9ab8')); // bar rod
  // Left plate + highlight
  g.appendChild(bRect(4,  -7,  12, 14, 1,   '#3a3a5a'));
  g.appendChild(bRect(5,  -5.5, 4, 11, 0.5, '#5a5a7a'));
  // Right plate + highlight
  g.appendChild(bRect(84, -7,  12, 14, 1,   '#3a3a5a'));
  g.appendChild(bRect(91, -5.5, 4, 11, 0.5, '#5a5a7a'));
  // Collars
  g.appendChild(bRect(16, -3.5, 6, 7, 0.5,  '#555570'));
  g.appendChild(bRect(78, -3.5, 6, 7, 0.5,  '#555570'));
  return g;
}

function runPressLoop(){
  // Press up — fast concentric phase
  pressTween(PRESS_HIGH, 650, easeOutPress, ()=>{
    splashPressTimer = setTimeout(()=>{           // brief lockout hold
      // Lower down — controlled eccentric phase
      pressTween(PRESS_LOW, 750, easeInOutPress, ()=>{
        splashPressTimer = setTimeout(runPressLoop, 480); // rest at bottom
      });
    }, 280);
  });
}

function initSplashPress(){
  _activeSplashAnim = 'press';
  clearTimeout(idleTimer);   // don't let idle fight the press
  clearTimeout(sleepTimer);  // don't fall asleep on the splash screen
  pressPos = [...PRESS_LOW];
  setArms(...pressPos.slice(0,8));

  // Move all four arm lines to the END of the SVG so they render on top
  // of the head/face elements. The barbell is appended after them.
  // Render order: body → head/face → arms → barbell (front-most)
  singerSvg.appendChild(la);
  singerSvg.appendChild(laFore);
  singerSvg.appendChild(ra);
  singerSvg.appendChild(raFore);

  if(SHOW_BARBELL){
    splashBarbell = makeBarbell();
    singerSvg.appendChild(splashBarbell); // last = on top of arms
    updateBarbell();
  }
  splashPressTimer = setTimeout(runPressLoop, 700);
}

// ─── Activity-aware stop (called by splashJump) ───────────────────────────────
let _activeSplashAnim = null; // 'press' | 'run' | 'rope'

function stopSplashCurl(){
  if(_activeSplashAnim === 'press') _stopSplashPress();
  else if(_activeSplashAnim === 'run')  _stopSplashRun();
  else if(_activeSplashAnim === 'rope') _stopSplashRope();
  _activeSplashAnim = null;
}

function _stopSplashPress(){
  cancelAnimationFrame(splashPressRAF);
  clearTimeout(splashPressTimer);
  splashPressRAF = splashPressTimer = null;
  if(splashBarbell){ splashBarbell.remove(); splashBarbell = null; }
  // Restore arm elements before the head circle
  const headCircle = singerSvg.querySelector('circle');
  singerSvg.insertBefore(la,     headCircle);
  singerSvg.insertBefore(laFore, headCircle);
  singerSvg.insertBefore(ra,     headCircle);
  singerSvg.insertBefore(raFore, headCircle);
  setArms(27,66, 25,77, 73,66, 75,77);
}

// Randomly launch one of the three splash animations
setTimeout(() => {
  const r = Math.random();
  if     (r < 1/3) initSplashPress();
  else if(r < 2/3) initSplashTreadmill();
  else             initSplashJumpRope();
}, 50);

// ── Splash treadmill run animation ────────────────────────────────────────────
let splashRunRAF   = null;
let splashRunTimer = null;
let treadmillEl    = null;

// Full pose: [lEx,lEy,lHx,lHy, rEx,rEy,rHx,rHy, llKnX,llKnY,llFtX,llFtY, rlKnX,rlKnY,rlFtX,rlFtY]
//
// Profile run — character faces right. Body rect is narrowed to a thin strip (x=46,w=8).
// la anchor → (46,54): the near shoulder, fully visible. Swings with a big arc.
// ra anchor → (54,54): the far shoulder, hidden BEHIND the narrow body (ra is moved earlier
//   in the DOM so the body rect paints over it). Only the arm tips that extend past the
//   body edges are visible — giving the "just a bit poking out" look.
// Both leg anchors → (50,90): single profile hip.
//
// RUN_A: la forward-right, ra peeks backward-left; rl strides forward, ll trails
const RUN_A = [53,63, 64,59,  47,63, 58,67,   44,102, 38,118,  58,97, 64,113];
// RUN_B: la backward-left, ra peeks forward-right; ll strides forward, rl trails
const RUN_B = [35,63, 46,67,  65,63, 76,59,   58,97, 64,113,  44,102, 38,118];
let runPos = [...RUN_A];

function easeInOutRun(t){ return t<.5 ? 2*t*t : -1+(4-2*t)*t; }

function applyRunPose(){
  setArms(...runPos.slice(0,8));
  setLegs(...runPos.slice(8,16));
}

function runTween(to, ms, done){
  const from = [...runPos];
  const t0   = performance.now();
  function step(now){
    const raw = Math.min((now - t0) / ms, 1);
    const e   = easeInOutRun(raw);
    runPos    = from.map((v,i) => v + (to[i]-v)*e);
    applyRunPose();
    if(raw < 1){ splashRunRAF = requestAnimationFrame(step); }
    else{ runPos = [...to]; if(done) done(); }
  }
  splashRunRAF = requestAnimationFrame(step);
}

function runCycle(){
  runTween(RUN_B, 280, ()=>{
    runTween(RUN_A, 280, ()=>{
      runCycle();
    });
  });
}

function makeTreadmill(){
  const NS = 'http://www.w3.org/2000/svg';
  const g  = document.createElementNS(NS,'g');

  function tRect(x,y,w,h,rx,fill){
    const r = document.createElementNS(NS,'rect');
    r.setAttribute('x',x); r.setAttribute('y',y);
    r.setAttribute('width',w); r.setAttribute('height',h);
    if(rx) r.setAttribute('rx',rx);
    r.setAttribute('fill',fill);
    return r;
  }
  function tLine(x1,y1,x2,y2,stroke,sw,extra){
    const l = document.createElementNS(NS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',stroke);
    l.setAttribute('stroke-width',sw);
    l.setAttribute('stroke-linecap','round');
    if(extra) Object.entries(extra).forEach(([k,v])=>l.setAttribute(k,v));
    return l;
  }

  // ── Belt / deck (wide — character is left of center, controls far right) ────
  g.appendChild(tRect(3, 117, 118, 11, 2, '#222233')); // deck base
  g.appendChild(tRect(3, 117, 118,  4, 2, '#38385a')); // belt surface
  g.appendChild(tLine(7, 120, 118, 120, '#5858a0', 1.2, {
    'stroke-dasharray':'8 6', 'class':'splash-belt-anim'
  }));
  // End caps / rollers
  g.appendChild(tRect(3,   125, 7, 3, 1, '#1a1a28')); // left roller cap
  g.appendChild(tRect(116, 125, 7, 3, 1, '#1a1a28')); // right roller cap

  // ── Right-side uprights — two angled bars from deck-right up to console ─────
  g.appendChild(tLine(118, 116,  110, 26, '#1e1e30', 4.5)); // rear upright
  g.appendChild(tLine(112, 116,  104, 26, '#32324e', 4));   // front upright
  // Mid cross-brace
  g.appendChild(tLine(115,  80,  107,  80, '#28283e', 2.5));

  // ── Console / control panel at top-right ────────────────────────────────────
  g.appendChild(tRect(99, 14, 20, 16, 3, '#28283e')); // console body
  g.appendChild(tRect(101, 16, 16,  9, 2, '#141420')); // screen bezel
  g.appendChild(tRect(102, 17, 14,  7, 1, '#2a2a50')); // screen face

  // ── Handgrips — short bars extending left from uprights at shoulder height ──
  g.appendChild(tLine(104, 46, 90, 46, '#32324e', 3.5)); // upper grip bar
  g.appendChild(tLine(104, 51, 90, 51, '#28283e', 3));   // lower grip bar
  // Grip end caps (rounded nubs toward the runner)
  g.appendChild(tLine(90, 46, 88, 46, '#484870', 4));
  g.appendChild(tLine(90, 51, 88, 51, '#484870', 4));

  return g;
}

function initSplashTreadmill(){
  _activeSplashAnim = 'run';
  clearTimeout(idleTimer);
  clearTimeout(sleepTimer);

  // ── 1. Narrow the body to a thin profile strip ──────────────────────────────
  const bodyEl   = document.getElementById('singer-body');
  const collarEl = document.getElementById('singer-collar');
  bodyEl.setAttribute('x', 44);   bodyEl.setAttribute('width', 12); bodyEl.setAttribute('rx', 4);
  collarEl.setAttribute('x', 44); collarEl.setAttribute('width', 12); collarEl.setAttribute('rx', 4);

  // ── 2. Move far arm (ra) BEHIND the body in render order ────────────────────
  // ra/raFore are inserted before the body rect so the body rect paints over them,
  // hiding the shoulder attachment. Only tips that extend past body edges are visible.
  singerSvg.insertBefore(ra,     bodyEl);
  singerSvg.insertBefore(raFore, bodyEl);

  // ── 3. Reposition arm anchors ────────────────────────────────────────────────
  la.setAttribute('x1', 44); la.setAttribute('y1', 54); // near shoulder (left edge of profile body)
  ra.setAttribute('x1', 56); ra.setAttribute('y1', 54); // far shoulder (right edge, behind body)

  // ── 4. Reposition leg anchors to single profile hip ─────────────────────────
  const llT = document.getElementById('ll-thigh');
  const rlT = document.getElementById('rl-thigh');
  llT.setAttribute('x1', 50); llT.setAttribute('y1', 90);
  rlT.setAttribute('x1', 50); rlT.setAttribute('y1', 90);

  runPos = [...RUN_A];
  applyRunPose();

  treadmillEl = makeTreadmill();
  singerSvg.insertBefore(treadmillEl, singerSvg.firstChild);

  splashRunTimer = setTimeout(runCycle, 350);
}

function _stopSplashRun(){
  cancelAnimationFrame(splashRunRAF);
  clearTimeout(splashRunTimer);
  splashRunRAF = splashRunTimer = null;
  if(treadmillEl){ treadmillEl.remove(); treadmillEl = null; }

  // ── Restore body to full front-view width ────────────────────────────────────
  const bodyEl   = document.getElementById('singer-body');
  const collarEl = document.getElementById('singer-collar');
  bodyEl.setAttribute('x', 32);   bodyEl.setAttribute('width', 36); bodyEl.setAttribute('rx', 8);
  collarEl.setAttribute('x', 38); collarEl.setAttribute('width', 24); collarEl.setAttribute('rx', 4);

  // ── Restore ra/raFore to their original position (after laFore, before head) ─
  const headCircle = singerSvg.querySelector('circle');
  singerSvg.insertBefore(ra,     headCircle);
  singerSvg.insertBefore(raFore, headCircle);

  // ── Restore arm anchor points ────────────────────────────────────────────────
  la.setAttribute('x1', 32); la.setAttribute('y1', 54);
  ra.setAttribute('x1', 68); ra.setAttribute('y1', 54);

  // ── Restore leg anchor points ────────────────────────────────────────────────
  const llT = document.getElementById('ll-thigh');
  const rlT = document.getElementById('rl-thigh');
  llT.setAttribute('x1', 42); llT.setAttribute('y1', 90);
  rlT.setAttribute('x1', 58); rlT.setAttribute('y1', 90);

  // ── Restore resting pose ─────────────────────────────────────────────────────
  setLegs(40,108, 41,124, 60,108, 59,124);
  setArms(27,66, 25,77, 73,66, 75,77);
}

// ── Splash jump-rope animation ────────────────────────────────────────────────
let splashRopeRAF   = null;
let splashRopeTimer = null;
let ropeEl          = null;

// Hand positions — where the rope ends attach (wider = more realistic rope width)
const ROPE_LHX = 16, ROPE_LHY = 80;
const ROPE_RHX = 84, ROPE_RHY = 80;
// Cubic bezier: M lhx,lhy C lhx,cy  rhx,cy  rhx,rhy
// Control points sit directly above/below each hand, creating a tall arch shape
// instead of a shallow quadratic arc. This clears both head and feet at the sides.
//   cy=160 → arc midpoint y≈139 (well below feet at y≈120-124)
//   cy=-50 → arc midpoint y≈-17 (well above head top at y≈9)
const ROPE_BOTTOM_Y = 160;
const ROPE_TOP_Y    = -50;
let ropeCtrlY = ROPE_BOTTOM_Y;

function setRopePath(cy){
  const c = cy.toFixed(1);
  ropeEl.setAttribute('d',
    `M ${ROPE_LHX},${ROPE_LHY} C ${ROPE_LHX},${c} ${ROPE_RHX},${c} ${ROPE_RHX},${ROPE_RHY}`);
}

function easeRope(t){ return t<.5 ? 2*t*t : -1+(4-2*t)*t; }

function ropeTween(from, to, ms, done){
  const t0 = performance.now();
  const span = ROPE_BOTTOM_Y - ROPE_TOP_Y; // 215
  function step(now){
    const raw = Math.min((now - t0) / ms, 1);
    const e   = easeRope(raw);
    ropeCtrlY = from + (to - from) * e;
    setRopePath(ropeCtrlY);

    // Hop: character lifts when rope is at the bottom (under feet), grounded at top
    const hopFraction = Math.max(0, (ropeCtrlY - ROPE_TOP_Y) / span);
    singerSvg.style.transform = `translateY(${(-8 * hopFraction).toFixed(2)}px)`;

    if(raw < 1){ splashRopeRAF = requestAnimationFrame(step); }
    else{ ropeCtrlY = to; if(done) done(); }
  }
  splashRopeRAF = requestAnimationFrame(step);
}

function ropeCycle(){
  // Rope sweeps up from under feet to over head, then back down
  ropeTween(ROPE_BOTTOM_Y, ROPE_TOP_Y, 380, () => {
    ropeTween(ROPE_TOP_Y, ROPE_BOTTOM_Y, 380, () => {
      ropeCycle();
    });
  });
}

function initSplashJumpRope(){
  _activeSplashAnim = 'rope';
  clearTimeout(idleTimer);
  clearTimeout(sleepTimer);

  // Arms out to sides, hands low holding rope handles — matches ROPE_LHX/RHX
  setArms(22,72, 16,80,  78,72, 84,80);

  // Create the rope path element — inserted just before the head circle so arms
  // render in front (hands grip the rope) and the head paints over it (rope goes
  // naturally behind the face when passing overhead).
  const NS = 'http://www.w3.org/2000/svg';
  ropeEl = document.createElementNS(NS, 'path');
  ropeEl.setAttribute('fill',             'none');
  ropeEl.setAttribute('stroke',           '#d4a030');
  ropeEl.setAttribute('stroke-width',     '2.5');
  ropeEl.setAttribute('stroke-linecap',   'round');
  ropeCtrlY = ROPE_BOTTOM_Y;
  setRopePath(ropeCtrlY);
  const headCircle = singerSvg.querySelector('circle');
  singerSvg.insertBefore(ropeEl, headCircle);

  splashRopeTimer = setTimeout(ropeCycle, 400);
}

function _stopSplashRope(){
  cancelAnimationFrame(splashRopeRAF);
  clearTimeout(splashRopeTimer);
  splashRopeRAF = splashRopeTimer = null;
  if(ropeEl){ ropeEl.remove(); ropeEl = null; }
  singerSvg.style.transform = '';
  setArms(27,66, 25,77, 73,66, 75,77);
}
