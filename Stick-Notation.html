<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stick Notation</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232B4C7E'/%3E%3Crect x='17' y='13' width='6' height='38' fill='white'/%3E%3Crect x='41' y='13' width='6' height='38' fill='white'/%3E%3Crect x='17' y='13' width='30' height='10' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #E9EDF2;
    --surface: #FFFFFF;
    --ink: #1B2430;
    --muted: #5A6676;
    --accent: #2B4C7E;
    --accent-ink: #FFFFFF;
    --line: #C9D1DB;
    --paper: #FBFCFD;
    --dot: #D3DAE3;
    --danger: #A33A3A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #151B23;
      --surface: #1F2731;
      --ink: #E7ECF2;
      --muted: #9AA6B5;
      --accent: #8FB0E0;
      --accent-ink: #0F1620;
      --line: #354252;
      --danger: #E08A8A;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 20px 48px; }
  header { margin-bottom: 18px; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  header p { margin: 0; color: var(--muted); }

  /* Preview stage: dotted paper shows the transparent area */
  .stage {
    background-color: var(--paper);
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.4px);
    background-size: 18px 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    min-height: 240px;
    padding: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: auto;
  }
  #preview { display: block; max-width: 100%; height: auto; }
  .empty { color: #5A6676; font-size: 1.05rem; text-align: center; }
  .count { color: var(--muted); font-size: 0.95rem; margin: 8px 2px 0; min-height: 1.4em; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-top: 16px;
  }
  .symbols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sym {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 14px 10px 12px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    font: inherit; font-weight: 700; font-size: 1.1rem;
    cursor: pointer;
  }
  .sym:hover { border-color: var(--accent); }
  .sym:active { transform: translateY(1px); }
  .sym svg { height: 46px; width: auto; }
  .sym svg rect { fill: currentColor; }
  .sym svg path { fill: none; stroke: currentColor; stroke-linejoin: miter; stroke-linecap: butt; stroke-miterlimit: 10; }
  .sym kbd { font-weight: 400; font-size: 0.8rem; color: var(--muted); font-family: inherit; }

  .groups { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
  .group + .group { border-left: 1px solid var(--line); padding-left: 28px; }
  .fields { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 0.92rem; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); padding-bottom: 6px; }
  label.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  input[type="number"], select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; min-width: 90px;
  }
  input[type="range"] { width: 140px; accent-color: var(--accent); }
  select:disabled, label.check input:disabled + span { opacity: 0.5; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .actions .spacer { flex: 1; }
  .btn {
    font: inherit; font-weight: 700;
    padding: 9px 16px; border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface); color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .status { min-height: 1.4em; margin-top: 10px; color: var(--muted); font-size: 0.95rem; }
  .hint { color: var(--muted); font-size: 0.88rem; margin: 10px 0 0; }

  @media (max-width: 720px) {
    .groups { grid-template-columns: 1fr; }
    .group + .group { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 16px; }
  }
  @media (max-width: 560px) {
    .symbols { grid-template-columns: repeat(2, 1fr); }
    .sym { font-size: 1rem; }
    .sym svg { height: 36px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Stick notation</h1>
    <p>Build a rhythm, then export it as a transparent PNG.</p>
  </header>

  <div class="stage" id="stage">
    <p class="empty" id="empty">Add a du, du-de, du-ta-de-ta or shh to start.</p>
    <canvas id="preview" hidden></canvas>
  </div>
  <p class="count" id="count"></p>

  <section class="panel" aria-label="Add symbols">
    <div class="symbols">
      <button class="sym" data-note="du" type="button">
        <svg viewBox="0 0 40 60" aria-hidden="true"><rect x="18" y="5" width="4" height="50"/></svg>
        du <kbd>key 1</kbd>
      </button>
      <button class="sym" data-note="dude" type="button">
        <svg viewBox="0 0 40 60" aria-hidden="true"><rect x="6" y="5" width="4" height="50"/><rect x="30" y="5" width="4" height="50"/><rect x="6" y="5" width="28" height="8"/></svg>
        du-de <kbd>key 2</kbd>
      </button>
      <button class="sym" data-note="dutadeta" type="button">
        <svg viewBox="0 0 64 60" aria-hidden="true"><rect x="4" y="5" width="4" height="50"/><rect x="22" y="5" width="4" height="50"/><rect x="40" y="5" width="4" height="50"/><rect x="58" y="5" width="4" height="50"/><rect x="4" y="5" width="58" height="7"/><rect x="4" y="16" width="58" height="7"/></svg>
        du-ta-de-ta <kbd>key 3</kbd>
      </button>
      <button class="sym" data-note="shh" type="button">
        <svg viewBox="0 0 40 60" aria-hidden="true"><path d="M9 7 H31 L9 53 H31" stroke-width="4"/></svg>
        shh <kbd>key 4</kbd>
      </button>
    </div>
  </section>

  <section class="panel" aria-label="Settings and export">
    <div class="groups">
      <div class="group">
        <h2>Layout</h2>
        <div class="fields">
          <label>Beats per row
            <input type="number" id="perRow" min="1" max="32" value="8">
          </label>
          <label>Meter
            <select id="meter">
              <option value="2">2/4</option>
              <option value="3">3/4</option>
              <option value="4" selected>4/4</option>
              <option value="5">5/4</option>
              <option value="6">6/4</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="bars" checked><span>Bar lines</span></label>
          <label>Line thickness
            <input type="range" id="weight" min="2" max="10" step="1" value="4">
          </label>
        </div>
      </div>
      <div class="group">
        <h2>Show and export</h2>
        <div class="fields">
          <label>Include
            <select id="mode">
              <option value="both">Notation and syllables</option>
              <option value="notes">Notation only</option>
              <option value="syl">Syllables only</option>
            </select>
          </label>
          <label>Export size
            <select id="size">
              <option value="1">Small</option>
              <option value="2">Medium</option>
              <option value="4" selected>Large</option>
              <option value="6">Extra large</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="color" checked><span>Colored syllables</span></label>
          <label class="check"><input type="checkbox" id="match" checked><span>Same size for every export</span></label>
        </div>
        <p class="hint">Same size keeps notation, syllables and both lined up when you stack them in Slides.</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="undo" type="button">Undo</button>
      <button class="btn danger" id="clear" type="button">Clear</button>
      <span class="spacer"></span>
      <button class="btn" id="copy" type="button">Copy image</button>
      <button class="btn primary" id="export" type="button">Export</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <p class="hint">Keys: 1 du, 2 du-de, 3 du-ta-de-ta, 4 shh, Backspace undo.</p>
  </section>
</main>

<script>
(() => {
  // Geometry in base units (stick height = 100)
  const H = 100;        // stick height
  const CELL = 140;     // width of one beat
  const CELL4 = 190;    // wider beat for du-ta-de-ta so its sticks and syllable fit
  const QSTEP = 40;     // space between du-ta-de-ta sticks
  const BEAM_GAP = 8;   // space between the two du-ta-de-ta beams
  const HALF = 30;      // half the gap between du-de sticks
  const ZW = 44;        // shh Z width
  const ROWGAP = 60;    // space between rows
  const SYL = 56;       // extra row space reserved for syllables
  const SYL_GAP = 16;   // gap between stick bottoms and syllable tops
  const SYL_SIZE = 30;  // syllable font size
  const BARGAP = 24;    // extra space added where a bar line sits
  const BAR_W = 1.5;    // bar line thickness
  const BAR_EXT = 12;   // bar line overhang above and below the sticks
  const BAR_COLOR = "#9E9E9E";
  const PAD = 40;       // drawing margin before crop
  const MARGIN = 8;     // margin kept around the cropped image

  const SYLLABLES = {
    du:   { text: "du",    color: "#0000FF", italic: false },
    dude: { text: "du–de", color: "#CC0000", italic: false },
    dutadeta: { text: "du-ta-de-ta", color: "#8E44AD", italic: false },
    shh:  { text: "shh!",  color: "#6AA84F", italic: true }
  };

  const notes = [];
  const $ = id => document.getElementById(id);
  const preview = $("preview");
  const statusEl = $("status");

  const opts = () => {
    const per = parseInt($("perRow").value, 10);
    return {
      per: Number.isFinite(per) && per > 0 ? Math.min(per, 32) : 4,
      meter: parseInt($("meter").value, 10) || 4,
      bars: $("bars").checked,
      w: parseInt($("weight").value, 10) || 4,
      mode: $("mode").value,
      color: $("color").checked,
      match: $("match").checked
    };
  };

  function drawNote(ctx, type, cx, top, w) {
    const beam = 11 + w;
    ctx.fillStyle = "#000";
    ctx.strokeStyle = "#000";
    if (type === "du") {
      ctx.fillRect(cx - w / 2, top, w, H);
    } else if (type === "dude") {
      const l = cx - HALF, r = cx + HALF;
      ctx.fillRect(l - w / 2, top, w, H);
      ctx.fillRect(r - w / 2, top, w, H);
      ctx.fillRect(l - w / 2, top, (r - l) + w, beam);
    } else if (type === "dutadeta") {
      const l = cx - QSTEP * 1.5, r = cx + QSTEP * 1.5;
      for (let k = 0; k < 4; k++) ctx.fillRect(l + k * QSTEP - w / 2, top, w, H);
      ctx.fillRect(l - w / 2, top, (r - l) + w, beam);
      ctx.fillRect(l - w / 2, top + beam + BEAM_GAP, (r - l) + w, beam);
    } else if (type === "shh") {
      ctx.lineWidth = w;
      ctx.lineJoin = "miter";
      ctx.miterLimit = 10;
      ctx.lineCap = "butt";
      ctx.beginPath();
      ctx.moveTo(cx - ZW / 2, top + w / 2);
      ctx.lineTo(cx + ZW / 2, top + w / 2);
      ctx.lineTo(cx - ZW / 2, top + H - w / 2);
      ctx.lineTo(cx + ZW / 2, top + H - w / 2);
      ctx.stroke();
    }
  }

  const cellWidth = type => type === "dutadeta" ? CELL4 : CELL;

  function drawSyllable(ctx, type, cx, top, colored) {
    const s = SYLLABLES[type];
    ctx.font = `${s.italic ? "italic " : ""}bold ${SYL_SIZE}px Arial, Helvetica, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillStyle = colored ? s.color : "#000";
    ctx.fillText(s.text, cx, top + H + SYL_GAP, cellWidth(type) - 12);
  }

  // Works out x positions for every beat and where bar lines fall.
  // Measures count from the start of the piece, so they carry across rows.
  function layout(o, reserveSyl) {
    const pitch = H + ROWGAP + (reserveSyl ? SYL : 0);
    const beats = [], barLines = [];
    let maxW = 0;
    for (let rowStart = 0, row = 0; rowStart < notes.length; rowStart += o.per, row++) {
      const top = PAD + row * pitch;
      let x = PAD;
      const end = Math.min(rowStart + o.per, notes.length);
      for (let i = rowStart; i < end; i++) {
        if (o.bars && i > rowStart && i % o.meter === 0) {
          barLines.push({ x: x + BARGAP / 2, top });
          x += BARGAP;
        }
        const cw = cellWidth(notes[i]);
        beats.push({ type: notes[i], cx: x + cw / 2, top });
        x += cw;
      }
      maxW = Math.max(maxW, x);
    }
    const rows = Math.ceil(notes.length / o.per);
    return { beats, barLines, width: maxW + PAD, height: PAD * 2 + rows * pitch };
  }

  // Draws one version of the rhythm (both, notes or syl) without cropping
  function drawFull(scale, o, mode, reserveSyl) {
    const L = layout(o, reserveSyl);
    const c = document.createElement("canvas");
    c.width = Math.ceil(L.width * scale);
    c.height = Math.ceil(L.height * scale);
    const ctx = c.getContext("2d");
    ctx.scale(scale, scale);
    if (mode !== "syl") {
      ctx.fillStyle = BAR_COLOR;
      L.barLines.forEach(b => ctx.fillRect(b.x - BAR_W / 2, b.top - BAR_EXT, BAR_W, H + BAR_EXT * 2));
      L.beats.forEach(b => drawNote(ctx, b.type, b.cx, b.top, o.w));
    }
    if (mode !== "notes") {
      L.beats.forEach(b => drawSyllable(ctx, b.type, b.cx, b.top, o.color));
    }
    return c;
  }

  function inkBox(c) {
    const { width, height } = c;
    const data = c.getContext("2d").getImageData(0, 0, width, height).data;
    let minX = width, minY = height, maxX = -1, maxY = -1;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (data[(y * width + x) * 4 + 3] > 0) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    return maxX < 0 ? null : { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
  }

  function cropTo(c, box, m) {
    const out = document.createElement("canvas");
    out.width = box.w + m * 2;
    out.height = box.h + m * 2;
    out.getContext("2d").drawImage(c, box.x, box.y, box.w, box.h, m, m, box.w, box.h);
    return out;
  }

  function render(scale) {
    if (!notes.length) return null;
    const o = opts();
    // With "same size" on, every mode uses the layout and crop of the full version
    const reserveSyl = o.match || o.mode !== "notes";
    const full = drawFull(scale, o, o.mode, reserveSyl);
    const ref = o.match && o.mode !== "both" ? drawFull(scale, o, "both", true) : full;
    const box = inkBox(ref) || { x: 0, y: 0, w: full.width, h: full.height };
    return cropTo(full, box, Math.round(MARGIN * scale));
  }

  function update() {
    const has = notes.length > 0;
    $("empty").hidden = has;
    preview.hidden = !has;
    ["undo", "clear", "copy", "export"].forEach(id => $(id).disabled = !has);
    $("meter").disabled = !$("bars").checked;
    $("color").disabled = $("mode").value === "notes";

    if (has) {
      const o = opts();
      const measures = Math.ceil(notes.length / o.meter);
      $("count").textContent = `${notes.length} beat${notes.length === 1 ? "" : "s"}` +
        (o.bars ? `, ${measures} measure${measures === 1 ? "" : "s"} of ${o.meter}/4` : "");
    } else {
      $("count").textContent = "";
      preview.getContext("2d").clearRect(0, 0, preview.width, preview.height);
      preview.width = 0;
      preview.height = 0;
      return;
    }

    const scale = 2;
    const img = render(scale);
    preview.width = img.width;
    preview.height = img.height;
    const pctx = preview.getContext("2d");
    pctx.clearRect(0, 0, img.width, img.height);
    pctx.drawImage(img, 0, 0);
    preview.style.width = (img.width / scale) + "px";
  }

  function setStatus(msg) { statusEl.textContent = msg; }
  function add(type) { notes.push(type); setStatus(""); update(); }
  function undo() { notes.pop(); setStatus(""); update(); }
  function clearAll() { notes.length = 0; setStatus(""); update(); }

  function fileName() {
    const names = { du: "du", dude: "du-de", dutadeta: "du-ta-de-ta", shh: "shh" };
    const suffix = { both: "", notes: "_notation", syl: "_syllables" }[$("mode").value];
    const base = notes.length <= 12
      ? "rhythm_" + notes.map(n => names[n]).join("_")
      : `rhythm_${notes.length}-beats`;
    return base + suffix + ".png";
  }

  function toBlob() {
    const img = render(parseFloat($("size").value) || 4);
    return new Promise(res => img.toBlob(res, "image/png"));
  }

  async function exportPng() {
    if (!notes.length) return;
    const blob = await toBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus(`Exported ${a.download}`);
  }

  async function copyPng() {
    if (!notes.length) return;
    try {
      if (!navigator.clipboard || typeof ClipboardItem === "undefined") throw new Error("unsupported");
      await navigator.clipboard.write([new ClipboardItem({ "image/png": toBlob() })]);
      setStatus("Copied image. Paste it into Slides or Docs.");
    } catch (e) {
      setStatus("This browser blocked copying. Use Export instead.");
    }
  }

  document.querySelectorAll(".sym").forEach(btn =>
    btn.addEventListener("click", () => add(btn.dataset.note))
  );
  $("undo").addEventListener("click", undo);
  $("clear").addEventListener("click", clearAll);
  $("export").addEventListener("click", exportPng);
  $("copy").addEventListener("click", copyPng);
  ["perRow", "weight"].forEach(id => $(id).addEventListener("input", update));
  ["meter", "bars", "mode", "color", "match"].forEach(id => $(id).addEventListener("change", update));

  document.addEventListener("keydown", e => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "1") add("du");
    else if (e.key === "2") add("dude");
    else if (e.key === "3") add("dutadeta");
    else if (e.key === "4") add("shh");
    else if (e.key === "Backspace") { e.preventDefault(); undo(); }
  });

  update();
})();
</script>
</body>
</html>
