  #bg, .team-name, .hline, .vline, .score, .win-btn, #controls { transition: opacity 0.6s ease; }
  #stage.winning #bg,
  #stage.winning .team-name, #stage.winning .hline, #stage.winning .vline,
  #stage.winning .score { opacity: 0.15; }
  #stage.winning .win-btn, #stage.winning #controls { opacity: 0; pointer-events: none; }

  /* Barely visible win buttons under each score */
  .win-btn {
    position: absolute; top: 420px; width: 70px; margin-left: -35px;
    font-size: 13px; padding: 2px 0; border: 1px solid #999; border-radius: 6px;
    background: transparent; color: #666; opacity: 0.12;
  }
  .win-btn:hover, .win-btn:focus-visible { opacity: 0.8; background: #fff; }
  #left-win  { left: 260px; }
  #right-win { left: 700px; }

  /* Win celebration */
  #confetti { position: absolute; inset: 0; width: 960px; height: 540px; pointer-events: none; z-index: 2; display: none; }
  #win {
    position: absolute; inset: 0; z-index: 3; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #stage.winning #confetti { display: block; }
  #stage.winning #win { display: flex; }
  #win-text {
    font-size: 120px; font-weight: 900; font-style: italic; line-height: 1.05;
    text-align: center; max-width: 920px; overflow-wrap: anywhere;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 5px 5px 0 var(--ink);
    animation: win-pop 0.6s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  #win-points {
    margin-top: 18px; font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    font-size: 56px; font-weight: 900; color: var(--ink);
    animation: win-pop 0.6s 0.25s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  @media (prefers-reduced-motion: reduce) { #win-points { animation: none; } }
  @keyframes win-pop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #win-text { animation: none; } }

  .team-name {
    position: absolute; top: 118px;
    width: 440px; text-align: center;
    font-size: 78px; font-weight: 900; font-style: italic;
    letter-spacing: 2px; line-height: 1;
    -webkit-text-stroke: 2px var(--ink);
    paint-order: stroke fill;
    text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #left-name  { left: 40px;  color: var(--left-color); }
  #right-name { left: 480px; color: var(--right-color); }
  .hline { position: absolute; left: 44px; top: 210px; width: 880px; height: 12px; background: var(--ink); }
  .vline { position: absolute; left: 474px; top: 125px; width: 12px; height: 375px; background: var(--ink); }
  .score {
    position: absolute; top: 280px; width: 440px; text-align: center;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    font-size: 120px; font-weight: 900; color: var(--ink); line-height: 1;
    transition: transform 0.15s ease;
  }
  .score.bump { transform: scale(1.25); }
  #left-score  { left: 40px; }
  #right-score { left: 480px; }

  /* Small correction controls along the bottom edge */
  #controls {
    position: absolute; left: 0; right: 0; bottom: 6px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; opacity: 0.35; transition: opacity 0.2s;
  }
  #controls:hover { opacity: 1; }
  .group { display: flex; gap: 6px; align-items: center; }
  button {
    font: inherit; font-size: 14px; font-weight: bold;
    padding: 4px 10px; border: 2px solid var(--ink); border-radius: 8px;
    background: #fff; color: var(--ink); cursor: pointer;
  }
  button:hover { background: #eee; }
  button:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
  .group .fix { min-width: 36px; }
  #left-fix  button.fix { border-color: var(--left-color); }
  #right-fix button.fix { border-color: var(--right-color); }
  .hint { font-size: 12px; color: #555; }

  /* Set up panel */
  #setup {
    position: absolute; inset: 0; display: none;
    background: rgba(0,0,0,0.55);
    align-items: center; justify-content: center;
  }
  #setup.open { display: flex; }
  .panel {
    background: #fff; border: 4px solid var(--ink); border-radius: 16px;
    padding: 24px 28px; width: 520px;
  }
  .panel h2 { margin: 0 0 16px; font-size: 28px; }
  .row { display: grid; grid-template-columns: 90px 1fr 60px; gap: 10px; align-items: center; margin-bottom: 12px; }
  .row label { font-weight: bold; }
  .row input[type="text"] { font: inherit; font-size: 18px; padding: 6px 10px; border: 2px solid #999; border-radius: 8px; }
  .row input[type="color"] { width: 56px; height: 40px; border: 2px solid #999; border-radius: 8px; padding: 2px; background: #fff; cursor: pointer; }
  .panel .actions { display: flex; justify-content: space-between; margin-top: 18px; }
  .panel .actions button { font-size: 16px; padding: 8px 16px; }
  .primary { background: var(--ink); color: #fff; }
  .primary:hover { background: #333; }
  .keys { font-size: 13px; color: #555; margin-top: 14px; }
  kbd { border: 1px solid #999; border-radius: 4px; padding: 0 5px; background: #f6f6f6; font-family: inherit; }
</style>
</head>

  <div class="vline"></div>
  <div class="score" id="left-score">0</div>

  <button class="win-btn" id="left-win" data-team="left" title="Left team wins">Win</button>

  <canvas id="confetti" width="960" height="540"></canvas>
  <div id="win">
    <div id="win-text"></div>
    <div id="win-points"></div>
  </div>

  <div id="controls">
    <div class="group" id="left-fix">
      <button class="fix" data-team="left" data-delta="-1" title="Left team minus 1">-1</button>
      <button class="fix" data-team="left" data-delta="1" title="Left team plus 1">+1</button>
    </div>
    <div class="group">
      <button id="reset-btn" title="Set both scores to 0">Reset</button>
      <button id="setup-btn" title="Team names and colors">Set up</button>
      <span class="hint">Clicker or arrow keys: up = left team, down = right team</span>
    </div>
    <div class="group" id="right-fix">
      <button class="fix" data-team="right" data-delta="-1" title="Right team minus 1">-1</button>
      <button class="fix" data-team="right" data-delta="1" title="Right team plus 1">+1</button>
    </div>
  </div>

  <div id="setup">
    <div class="panel">
      <h2>Set up teams</h2>
      <div class="row">
        <label for="left-name-in">Left team</label>
        <input type="text" id="left-name-in" maxlength="14">
        <input type="color" id="left-color-in">
      </div>
      <div class="row">
        <label for="right-name-in">Right team</label>
        <input type="text" id="right-name-in" maxlength="14">
        <input type="color" id="right-color-in">
      </div>
      <div class="keys">
        <kbd>&uarr;</kbd> or <kbd>Page Up</kbd> gives the left team a point, <kbd>&darr;</kbd> or <kbd>Page Down</kbd> gives the right team a point,
        <kbd>R</kbd> resets, <kbd>S</kbd> opens this panel, <kbd>Esc</kbd> closes it.
      </div>
      <div class="actions">
        <button id="defaults-btn">Back to Red / Yellow</button>
        <div>
          <button id="cancel-btn">Cancel</button>
          <button id="save-btn" class="primary">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = "noteTossGame";
  var DEFAULTS = { leftName: "RED", leftColor: "#C00000", rightName: "YELLOW", rightColor: "#FFC000", leftScore: 0, rightScore: 0 };
  var state = load();

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    leftName: $("left-name"), rightName: $("right-name"),
    leftScore: $("left-score"), rightScore: $("right-score"),
    setup: $("setup"),
    leftNameIn: $("left-name-in"), leftColorIn: $("left-color-in"),
    rightNameIn: $("right-name-in"), rightColorIn: $("right-color-in")
  };

  function load() {
    var s = Object.assign({}, DEFAULTS);
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      Object.keys(DEFAULTS).forEach(function (k) { if (saved[k] !== undefined) s[k] = saved[k]; });
    } catch (e) { /* storage unavailable or corrupt: use defaults */ }
    return s;
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  function render() {
    els.leftName.textContent = state.leftName || "LEFT";
    els.rightName.textContent = state.rightName || "RIGHT";
    document.documentElement.style.setProperty("--left-color", state.leftColor);
    document.documentElement.style.setProperty("--right-color", state.rightColor);
    els.leftScore.textContent = state.leftScore;
    els.rightScore.textContent = state.rightScore;
  }

  function addPoint(team, delta) {
    var key = team + "Score";
    state[key] = Math.max(0, state[key] + delta);
    var el = team === "left" ? els.leftScore : els.rightScore;
    el.classList.remove("bump");
    void el.offsetWidth; /* restart the animation */
    el.classList.add("bump");
    setTimeout(function () { el.classList.remove("bump"); }, 150);
    save();
    render();
  }

  function resetScores() {
    state.leftScore = 0; state.rightScore = 0;
    save(); render();
  }

  function openSetup() {
    els.leftNameIn.value = state.leftName;
    els.leftColorIn.value = state.leftColor;
    els.rightNameIn.value = state.rightName;
    els.rightColorIn.value = state.rightColor;
    els.setup.classList.add("open");
    els.leftNameIn.focus();
    els.leftNameIn.select();
  }
  function closeSetup() { els.setup.classList.remove("open"); }
  function saveSetup() {
    state.leftName = els.leftNameIn.value.trim() || "LEFT";
    state.rightName = els.rightNameIn.value.trim() || "RIGHT";
    state.leftColor = els.leftColorIn.value;
    state.rightColor = els.rightColorIn.value;
    save(); render(); closeSetup();
  }

  /* Buttons */
  document.querySelectorAll("button.fix").forEach(function (b) {
    b.addEventListener("click", function () {
      addPoint(b.dataset.team, parseInt(b.dataset.delta, 10));
      b.blur();
    });
  });
  $("reset-btn").addEventListener("click", function () { resetScores(); this.blur(); });
  $("setup-btn").addEventListener("click", openSetup);
  $("save-btn").addEventListener("click", saveSetup);
  $("cancel-btn").addEventListener("click", closeSetup);
  $("defaults-btn").addEventListener("click", function () {
    els.leftNameIn.value = DEFAULTS.leftName;  els.leftColorIn.value = DEFAULTS.leftColor;
    els.rightNameIn.value = DEFAULTS.rightName; els.rightColorIn.value = DEFAULTS.rightColor;
  });


  /* ---------- Win celebration ---------- */
  var stage = $("stage");
  var canvas = $("confetti");
  var ctx = canvas.getContext("2d");
  var pieces = [];
  var confettiRunning = false;

  function makePiece(color, startAbove) {
    return {
      x: Math.random() * 960,
      y: startAbove ? -20 - Math.random() * 540 : -20,
      w: 6 + Math.random() * 8,
      h: 10 + Math.random() * 10,
      vy: 1.2 + Math.random() * 2.2,
      vx: -0.8 + Math.random() * 1.6,
      rot: Math.random() * Math.PI * 2,
      vr: -0.15 + Math.random() * 0.3,
      sway: Math.random() * Math.PI * 2,
      color: color
    };
  }

  function startConfetti(teamColor) {
    var palette = [teamColor, teamColor, teamColor, "#ffffff", "#000000", "#3b82f6", "#22c55e", "#ec4899"];
    pieces = [];
    for (var i = 0; i < 160; i++) {
      pieces.push(makePiece(palette[i % palette.length], true));
    }
    if (!confettiRunning) {
      confettiRunning = true;
      requestAnimationFrame(drawConfetti);
    }
  }

  function drawConfetti() {
    if (!stage.classList.contains("winning")) {
      confettiRunning = false;
      ctx.clearRect(0, 0, 960, 540);
      return;
    }
    ctx.clearRect(0, 0, 960, 540);
    pieces.forEach(function (p) {
      p.sway += 0.05;
      p.x += p.vx + Math.sin(p.sway) * 0.6;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > 560) {           /* recycle at the top so it rains forever */
        p.y = -20;
        p.x = Math.random() * 960;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, Math.abs(Math.cos(p.rot)) * p.h + 2);
      ctx.restore();
    });
    requestAnimationFrame(drawConfetti);
  }

  function showWin(team) {
    var name = team === "left" ? state.leftName : state.rightName;
    var color = team === "left" ? state.leftColor : state.rightColor;
    var text = $("win-text");
    /* Match the name's capitalization: all-caps names get "WINS!" */
    var allCaps = name === name.toUpperCase() && name !== name.toLowerCase();
    text.textContent = name + (allCaps ? " WINS!" : " wins!");
    var pts = team === "left" ? state.leftScore : state.rightScore;
    var ptsEl = $("win-points");
    var label = pts === 1 ? " point" : " points";
    ptsEl.textContent = pts + (allCaps ? label.toUpperCase() : label);
    ptsEl.style.animation = "none"; void ptsEl.offsetWidth; ptsEl.style.animation = "";
    text.style.color = color;
    /* restart the pop animation */
    text.style.animation = "none"; void text.offsetWidth; text.style.animation = "";
    stage.classList.add("winning");
    var snd = $("win-sound");
    try { snd.currentTime = 0; } catch (e) {}
    var play = snd.play();
    if (play && play.catch) play.catch(function () { /* browser blocked audio; ignore */ });
    startConfetti(color);
  }

  function hideWin() {
    stage.classList.remove("winning");
    var snd = $("win-sound");
    snd.pause();
    try { snd.currentTime = 0; } catch (e) {}
  }

  document.querySelectorAll(".win-btn").forEach(function (b) {
    b.addEventListener("click", function () { b.blur(); showWin(b.dataset.team); });
  });
  $("win").addEventListener("click", hideWin);

  /* Keyboard */
  document.addEventListener("keydown", function (e) {
    if (stage.classList.contains("winning")) {
      if (e.key === "Escape") { e.preventDefault(); hideWin(); }
      else if (e.key !== "F5") { e.preventDefault(); }  /* ignore clicker/arrow presses so no stray points */
      return;
    }
    var setupOpen = els.setup.classList.contains("open");
    if (setupOpen) {
      if (e.key === "Escape") { e.preventDefault(); closeSetup(); }
      if (e.key === "Enter")  { e.preventDefault(); saveSetup(); }
      return;
    }
    switch (e.key) {
      /* Presentation clickers send Page Up / Page Down (or Left / Right in some modes) */
      case "ArrowUp": case "PageUp": case "ArrowLeft":
        e.preventDefault(); addPoint("left", 1);  break;
      case "ArrowDown": case "PageDown": case "ArrowRight":
        e.preventDefault(); addPoint("right", 1); break;
      case "r": case "R": resetScores(); break;
      case "s": case "S": e.preventDefault(); openSetup(); break;
    }
  });

  /* Scale the 960x540 stage to fit the window */
  function fit() {
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540);
    document.documentElement.style.setProperty("--scale", s);
  }
  window.addEventListener("resize", fit);
  fit();
  render();
})();
</script>
</body>
</html>
