<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bucket Drumming Composer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#eef0f5;display:flex;flex-direction:column;}
.app{max-width:1200px;margin:0 auto;width:100%;height:100vh;display:flex;flex-direction:column;padding:10px 16px;gap:8px;}
.app-title{font-size:clamp(45px,5.4vw,66px);font-weight:800;color:#1a1a2e;text-align:center;flex-shrink:0;}
.left-col{flex:0 0 48%;display:flex;flex-direction:column;gap:8px;min-height:0;}
.controls-col{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:8px;flex:1;min-height:0;}
.ctrl-row{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;}
.play-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;background:#1db954;color:#fff;font-size:1.15em;box-shadow:0 3px 10px rgba(29,185,84,.4);transition:all .12s;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;padding:0;}
.play-btn:hover{background:#17a349;}
.play-btn.playing{background:#E33059;box-shadow:0 3px 10px rgba(227,48,89,.4);}
.ctrl-btn{padding:6px 12px;border-radius:8px;font-size:clamp(10px,1vw,12px);font-weight:700;cursor:pointer;border:1.5px solid;transition:all .12s;white-space:nowrap;}
.play-btn-lg{width:90px;height:90px;font-size:2.4em;}
.ctrl-btn-lg{padding:12px 22px!important;font-size:clamp(20px,2vw,26px)!important;}
.loop-btn{border-color:#c8bff0;background:#f0ecff;color:#5B37CC;}
.loop-btn.active{background:#5B37CC;color:#fff;}
.clear-btn{border-color:#d0d0dc;background:transparent;color:#6b6b80;}
.clear-btn:hover{background:#ededf0;}
.staff-wrapper{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:8px 10px;flex-shrink:0;}
#staff-svg{width:100%;height:auto;display:block;cursor:crosshair;user-select:none;}
.bottom-row{display:flex;gap:10px;flex:1;min-height:0;}
.palette-col{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;min-height:80px;}
.palette-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#aaa;flex-shrink:0;}
.palette{display:flex;align-items:center;justify-content:space-around;flex:1;gap:8px;}
.palette-sym{cursor:pointer;opacity:0.35;transition:opacity .15s,transform .15s;user-select:none;display:flex;align-items:center;justify-content:center;padding:6px;}
.palette-sym:hover{opacity:0.65;transform:scale(1.15);}
.palette-sym.selected{opacity:1;transform:scale(1.2);}
.palette-sym.dragging{opacity:.2;cursor:grabbing;}
#note-ghost{position:fixed;pointer-events:none;z-index:9999;display:none;opacity:0.55;overflow:visible;transform:translate(-50%,-86%);width:80px;height:58px;}
.note-sym{font-size:clamp(1.2em,2vw,1.8em);line-height:1.1;}
.note-name{font-size:clamp(8px,.8vw,11px);font-weight:700;color:#333;}
.note-dur{font-size:clamp(7px,.7vw,10px);color:#aaa;}
.legend{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;font-size:clamp(8px,.7vw,10px);color:#888;align-items:center;}
.ldot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px;vertical-align:middle;}
#instrument-btn:disabled{opacity:0.35;cursor:not-allowed;}
.drummer-col{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;min-height:0;overflow:hidden;position:relative;}
#char-svg{width:100%;max-height:100%;height:auto;overflow:visible;}
.hit-label{position:absolute;left:50%;font-size:26px;font-weight:800;pointer-events:none;white-space:nowrap;transform:translateX(-50%);}
</style>
</head>
<body>
<div class="app">
  <div class="app-title">Bucket Drumming Composer</div>
  <div class="staff-wrapper">
    <svg id="staff-svg" viewBox="0 0 1956 274" xmlns="http://www.w3.org/2000/svg">
      <g id="staff-bg"></g>
      <rect id="zone-center" x="192" y="172" width="1729" height="32" fill="rgba(230,64,89,0.09)" rx="3"/>
      <rect id="zone-rim"    x="192" y="106" width="1729" height="34" fill="rgba(30,136,229,0.09)" rx="3"/>
      <g id="ghost-rests"></g>
      <g id="staff-slots"></g>
      <g id="staff-notes"></g>
      <g id="count-labels"></g>
    </svg>
  </div>

  <div class="bottom-row">
    <div class="left-col">
      <div class="palette-col">
        <div class="palette">
          <span class="palette-sym" data-note="quarter" draggable="true" title="Quarter Note"></span>
          <span class="palette-sym" data-note="rest" draggable="true" title="Quarter Rest"></span>
          <span class="palette-sym" data-note="eighth" draggable="true" title="Eighth Notes"></span>
          <span class="palette-sym" data-note="sixteenth" draggable="true" title="Sixteenth Notes"></span>
        </div>
        <div class="legend">
          <span><span class="ldot" style="background:#E33059"></span>Center</span>
          <span><span class="ldot" style="background:#1e88e5"></span>Rim</span>
          <span><span class="ldot" style="background:#2e7d32"></span>Stick click (× head)</span>
        </div>
      </div>
      <div class="controls-col">
        <div class="ctrl-row">
          <button id="play-btn" class="play-btn play-btn-lg"><svg id="play-icon" viewBox="0 0 24 24" width="40%" height="40%" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg></button>
        </div>
        <div class="ctrl-row">
          <button class="ctrl-btn loop-btn tempo-btn ctrl-btn-lg" data-bpm="60">Adagio</button>
          <button class="ctrl-btn loop-btn tempo-btn ctrl-btn-lg active" data-bpm="92">Moderato</button>
          <button class="ctrl-btn loop-btn tempo-btn ctrl-btn-lg" data-bpm="120">Allegro</button>
        </div>
        <div class="ctrl-row">
          <button id="loop-btn" class="ctrl-btn loop-btn ctrl-btn-lg">🔁 Loop</button>
          <button id="count-btn" class="ctrl-btn loop-btn ctrl-btn-lg">🔢 Count it out!</button>
          <button id="clear-btn" class="ctrl-btn clear-btn ctrl-btn-lg">🗑 Clear</button>
        </div>
      </div>
    </div>

    <div class="drummer-col">
      <img id="drum-img" src="stick neutral.webp" style="width:100%;object-fit:contain;display:block;flex:3;min-height:0;filter:drop-shadow(4px 6px 8px rgba(0,0,0,0.35));">
      <div style="flex:1;display:flex;align-items:center;justify-content:center;">
        <button id="instrument-btn" style="padding:8px 24px;border-radius:8px;border:1.5px solid #c8bff0;background:#f0ecff;color:#5B37CC;font-size:22px;font-weight:700;cursor:pointer;">Switch to Mallets</button>
      </div>
    </div>
  </div>
</div>
<svg id="note-ghost" viewBox="0 0 200 145" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
<script>

// Staff coords: PNG 1956x274, lines y=74,106,140,172,204
// Bottom space centre y=188 (center sound), 3rd space centre y=123 (rim/sticks)
// Fixed staff boundaries (never change)
// NOTE_X1=192: starts after time signature
const NOTE_X1=192, NOTE_X2=1921, NOTE_W=1729;
const MIN_BEAT_W=50; // minimum beat slot width: ensures notes never collide with bar lines
const ZONE_Y=155, CENTER_HY=188, RIM_HY=123, REST_HY=150;
const STEM_LEN=115, NRX=20, NRY=14, BEAM_H=9, BEAM2=14;
const SC={center:'#E33059',rim:'#1e88e5',sticks:'#2e7d32'};

// Pixel-perfect staff geometry from original PNG
const STAFF_LINES=[{y:74.5,w:4},{y:107,w:5},{y:140,w:3},{y:172,w:3},{y:205,w:3}];
const STAFF_X1=33, STAFF_X2=1924, STAFF_Y1=73, STAFF_Y2=207;

// Visual weight per beat: denser note types get proportionally more space
function beatWeight(notes){
  if(!notes.length) return 1;
  const t=notes[0].type;
  if(t==='quarter'||t==='rest') return 1;
  if(t==='eighth') return 2;
  if(t==='sixteenth') return 4;
  return 1;
}

let _layout=null;

function computeLayout(){
  // Step 1: proportional widths based on note density
  let totalW=0;
  const weights=[];
  for(let m=0;m<4;m++){weights.push([]);for(let b=0;b<4;b++){const w=beatWeight(state.timeline[m][b]);weights[m].push(w);totalW+=w;}}
  const scale=NOTE_W/totalW;
  const ideal=weights.map(row=>row.map(w=>w*scale));

  // Step 2: enforce minimum beat width (clamp constrained beats, rescale free beats)
  let constrainedW=0, freeIdealW=0;
  for(let m=0;m<4;m++) for(let b=0;b<4;b++){
    if(ideal[m][b]<MIN_BEAT_W) constrainedW+=MIN_BEAT_W;
    else freeIdealW+=ideal[m][b];
  }
  const freeSpace=NOTE_W-constrainedW;
  const freeScale=freeIdealW>0?freeSpace/freeIdealW:1;

  // Step 3: build absolute positions
  const mStarts=[],mEnds=[],beatStarts=[],beatWidths=[];
  let x=NOTE_X1;
  for(let m=0;m<4;m++){
    mStarts.push(x);beatStarts.push([]);beatWidths.push([]);
    for(let b=0;b<4;b++){
      beatStarts[m].push(x);
      const bw=ideal[m][b]<MIN_BEAT_W?MIN_BEAT_W:ideal[m][b]*freeScale;
      beatWidths[m].push(bw);x+=bw;
    }
    mEnds.push(x);
  }
  return{mStarts,mEnds,beatStarts,beatWidths};
}

function bx(m,b){return _layout.beatStarts[m][b]+_layout.beatWidths[m][b]/2;}
function slotX(m,b){return _layout.beatStarts[m][b];}
function slotW(m,b){return _layout.beatWidths[m][b];}

function toSvgY(clientY){const s=document.getElementById('staff-svg'),r=s.getBoundingClientRect();return(clientY-r.top)/r.height*274;}

const state={selectedNote:null,bpm:92,isPlaying:false,isLooping:false,showCount:false,timeline:mkEmpty(),activeBeat:null};
function mkEmpty(){return Array.from({length:4},()=>Array.from({length:4},()=>[])); }
function svgE(tag,a){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;}

function drawCountLabels(){
  const cl=document.getElementById('count-labels');
  cl.innerHTML='';
  if(!state.showCount)return;
  const Y=244;
  for(let m=0;m<4;m++)for(let b=0;b<4;b++){
    const notes=state.timeline[m][b];
    if(!notes.length)continue;
    const type=notes[0].type,cx=bx(m,b),sw=slotW(m,b);
    const bn=b+1;
    let items=[];
    if(type==='quarter') items=[{x:cx,t:`${bn}`,bold:true}];
    else if(type==='rest') items=[{x:cx,t:`(${bn})`,bold:true}];
    else if(type==='eighth') items=[{x:cx-sw*0.18,t:`${bn}`,bold:true},{x:cx+sw*0.18,t:'+',bold:false}];
    else if(type==='sixteenth') items=[{x:cx-sw*0.28,t:`${bn}`,bold:true},{x:cx-sw*0.09,t:'e',bold:false},{x:cx+sw*0.09,t:'+',bold:false},{x:cx+sw*0.28,t:'a',bold:false}];
    items.forEach(({x,t,bold})=>{
      const el=svgE('text',{x:Math.round(x),y:Y,'text-anchor':'middle','font-size':bold?'35':'28','font-weight':bold?'700':'400','font-family':'Segoe UI,system-ui,sans-serif',fill:bold?'#333':'#777'});
      el.textContent=t;
      cl.appendChild(el);
    });
  }
}

function render(){
  _layout=computeLayout();
  drawStaffBg();
  const ng=document.getElementById('staff-notes'),sg=document.getElementById('staff-slots');
  ng.innerHTML='';sg.innerHTML='';
  for(let m=0;m<4;m++)for(let b=0;b<4;b++){
    const cx=bx(m,b),notes=state.timeline[m][b];
    const isAct=state.activeBeat&&state.activeBeat.m===m&&state.activeBeat.b===b;
    const sx=slotX(m,b),sw=slotW(m,b);const _m=m,_b=b;
    const slot=svgE('rect',{x:sx,y:0,width:sw,height:274,fill:isAct?'rgba(91,55,204,0.13)':'rgba(0,0,0,0)',rx:4});
    slot.style.cursor='crosshair';
    slot.addEventListener('click',e=>{if(!state.selectedNote)return;placeNote(_m,_b,state.selectedNote,toSvgY(e.clientY));selectNote(null);});
    slot.addEventListener('contextmenu',e=>{e.preventDefault();state.timeline[_m][_b]=[];render();});
    slot.addEventListener('mouseenter',e=>{if(state.selectedNote){const zy=toSvgY(e.clientY);const zc=zy>ZONE_Y?SC.center:SC.rim;slot.setAttribute('fill',zy>ZONE_Y?'rgba(230,64,89,0.18)':'rgba(30,136,229,0.18)');setGhostColor(zc);}});
    slot.addEventListener('mousemove',e=>{if(state.selectedNote){const zy=toSvgY(e.clientY);const zc=zy>ZONE_Y?SC.center:SC.rim;slot.setAttribute('fill',zy>ZONE_Y?'rgba(230,64,89,0.18)':'rgba(30,136,229,0.18)');setGhostColor(zc);}});
    slot.addEventListener('mouseleave',()=>{slot.setAttribute('fill',isAct?'rgba(91,55,204,0.13)':'rgba(0,0,0,0)');setGhostColor('#888');});
    slot.addEventListener('dragover',e=>{e.preventDefault();const zy=toSvgY(e.clientY);slot.setAttribute('fill',zy>ZONE_Y?'rgba(230,64,89,0.18)':'rgba(30,136,229,0.18)');});
    slot.addEventListener('dragleave',()=>slot.setAttribute('fill',isAct?'rgba(91,55,204,0.13)':'rgba(0,0,0,0)'));
    slot.addEventListener('drop',e=>{e.preventDefault();slot.setAttribute('fill','rgba(0,0,0,0)');const nt=e.dataTransfer.getData('note-type');if(nt)placeNote(_m,_b,nt,toSvgY(e.clientY));});
    sg.appendChild(slot);
    if(!notes.length){ng.appendChild(svgE('circle',{cx,cy:230,r:6,fill:'#e8e4f8'}));}
    else{const g=svgE('g',{});drawBeat(g,notes,cx,m,b);ng.appendChild(g);}
  }
  drawCountLabels();
}

function drawBeat(g,notes,cx,m,b){
  const sw=slotW(m,b),n0=notes[0];
  if(n0.type==='rest'){drawRest(g,cx);return;}
  const suf=NRX-2;
  if(n0.type==='quarter'){
    const col=SC[n0.sound]||'#333',hy=n0.headY,st=hy-STEM_LEN;
    addHead(g,cx,hy,col,n0.xHead,m,b,0);
    g.appendChild(svgE('line',{x1:cx+suf,y1:hy,x2:cx+suf,y2:st,stroke:col,'stroke-width':'5','stroke-linecap':'round'}));
    return;
  }
  if(n0.type==='eighth'){
    const x1=cx-sw*0.18,x2=cx+sw*0.18;
    const c1=SC[notes[0].sound]||'#333',c2=SC[notes[1].sound]||c1;
    const h1=notes[0].headY,h2=notes[1].headY,st1=h1-STEM_LEN,st2=h2-STEM_LEN;
    addHead(g,x1,h1,c1,notes[0].xHead,m,b,0);addHead(g,x2,h2,c2,notes[1].xHead,m,b,1);
    g.appendChild(svgE('line',{x1:x1+suf,y1:h1,x2:x1+suf,y2:st1,stroke:c1,'stroke-width':'5','stroke-linecap':'round'}));
    g.appendChild(svgE('line',{x1:x2+suf,y1:h2,x2:x2+suf,y2:st2,stroke:c2,'stroke-width':'5','stroke-linecap':'round'}));
    const bTop=Math.min(st1,st2)-6,bCol=c1===c2?c1:'#444';
    g.appendChild(svgE('rect',{x:x1+suf,y:bTop,width:(x2-x1),height:BEAM_H,fill:bCol}));
    return;
  }
  if(n0.type==='sixteenth'){
    const offs=[-sw*0.28,-sw*0.09,sw*0.09,sw*0.28];
    const xs=offs.map(o=>cx+o),tops=[];
    offs.forEach((off,i)=>{
      const nx=cx+off,ni=notes[i],col_i=SC[ni.sound]||'#333',st_i=ni.headY-STEM_LEN;
      tops.push(st_i);
      addHead(g,nx,ni.headY,col_i,ni.xHead,m,b,i);
      g.appendChild(svgE('line',{x1:nx+suf,y1:ni.headY,x2:nx+suf,y2:st_i,stroke:col_i,'stroke-width':'4','stroke-linecap':'round'}));
    });
    const lx=xs[0]+suf,rx_=xs[3]+suf,topY=Math.min(...tops)-6;
    g.appendChild(svgE('rect',{x:lx,y:topY,       width:rx_-lx,height:BEAM_H,fill:'#444'}));
    g.appendChild(svgE('rect',{x:lx,y:topY+BEAM2, width:rx_-lx,height:BEAM_H,fill:'#444'}));
  }
}

function addHead(g,x,y,col,isX,m,b,idx){
  const _m=m,_b=b,_i=idx;

  function onClick(e){
    e.stopPropagation();
    const note=state.timeline[_m][_b][_i];
    if(!note) return;
    if(note.headY===RIM_HY){
      // Third-space note: toggle between rim (filled) and stick click (X)
      note.xHead=!note.xHead;
      note.sound=note.xHead?'sticks':'rim';
      render();
    } else {
      // Any other note: remove the beat
      state.timeline[_m][_b]=[];
      render();
      if(showGhosts) updateGhostRests();
    }
  }

  if(isX){
    [svgE('line',{x1:x-NRX,y1:y-NRY,x2:x+NRX,y2:y+NRY,stroke:col,'stroke-width':'8','stroke-linecap':'round'}),
     svgE('line',{x1:x+NRX,y1:y-NRY,x2:x-NRX,y2:y+NRY,stroke:col,'stroke-width':'8','stroke-linecap':'round'})
    ].forEach(el=>{
      el.style.cursor='pointer';
      el.title='Click to toggle back to rim';
      el.addEventListener('click',onClick);
      g.appendChild(el);
    });
  } else {
    const h=svgE('ellipse',{cx:x,cy:y,rx:NRX,ry:NRY,transform:`rotate(-15,${x},${y})`,fill:col});
    h.style.cursor='pointer';
    h.title=(y===RIM_HY)?'Click to toggle: rim ↔ stick click':'Click to remove';
    h.addEventListener('click',onClick);
    g.appendChild(h);
  }
}

function drawRest(g, cx, col){
  col = col || '#555';
  // Use the actual Unicode quarter rest character 𝄽 (U+1D13D)
  const t = svgE('text', {
    x: cx,
    y: 112,
    'dominant-baseline': 'central',
    'font-size': '120',
    'font-family': '"Segoe UI Symbol","Apple Symbols","Symbola","FreeSerif","Arial Unicode MS",serif',
    'text-anchor': 'middle',
    fill: col
  });
  t.textContent = '𝄽'; // 𝄽 surrogate pair
  g.appendChild(t);
}

function placeNote(m,b,tileType,dropY){
  let type,sound,headY,xHead;
  if(tileType==='rest'){type='rest';sound=null;headY=REST_HY;xHead=false;}
  else if(tileType.startsWith('x-')){type=tileType.slice(2);sound='sticks';headY=RIM_HY;xHead=true;}
  else{type=tileType;xHead=false;if(dropY>ZONE_Y){headY=CENTER_HY;sound='center';}else{headY=RIM_HY;sound='rim';}}
  const count={quarter:1,rest:1,eighth:2,sixteenth:4}[type]||1;
  state.timeline[m][b]=Array.from({length:count},()=>({type,sound,headY,xHead}));
  render();
  if(showGhosts) updateGhostRests();
}

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA',

const _audioBuffers={};
function preloadSounds(){
  Object.entries(SOUND_DATA).forEach(([k,dataUrl])=>{
    const b64=dataUrl.split(",")[1],bin=atob(b64),ab=new ArrayBuffer(bin.length),v=new Uint8Array(ab);
    for(let i=0;i<bin.length;i++)v[i]=bin.charCodeAt(i);
    actx().decodeAudioData(ab.slice(0)).then(buf=>{_audioBuffers[k]=buf;}).catch(e=>console.error(k,e));
  });
}
let _ctx=null;
function actx(){if(!_ctx){_ctx=new(window.AudioContext||window.webkitAudioContext)();preloadSounds();}return _ctx;}
// Preload sounds on first user interaction so buffers are ready before play
document.addEventListener('click',function _initAudio(){actx();document.removeEventListener('click',_initAudio);},{once:true,capture:true});
function playBuf(key,t){
  const buf=_audioBuffers[key];
  if(!buf)return;
  const c=actx(),src=c.createBufferSource();
  src.buffer=buf;src.connect(c.destination);
  src.start(Math.max(t,c.currentTime+0.001));
}
function playCenter(t){playBuf(instrument+'-center',t);}
function playRim(t){playBuf(instrument+'-rim',t);}
function playSticks(t){playBuf(instrument+'-sticks',t);}
function playSound(s,t){if(s==='center')playCenter(t);else if(s==='rim')playRim(t);else if(s==='sticks')playSticks(t);}


// Character animation
let animTimer=null;
let lastCenterHand='right',lastRimHand='right',lastClickHand='right';
let instrument='stick'; // 'stick' or 'mallet' (matches filename prefix)
const drumImg=document.getElementById('drum-img');

function imgSrc(type){return instrument+' '+type+'.webp';}

const HIT_COLORS={center:'#E33059',rim:'#1e88e5',sticks:'#2e7d32'};
function spawnHitLabel(text,sound){
  const col=document.querySelector('.drummer-col');
  const el=document.createElement('span');
  el.className='hit-label';
  el.textContent=text;
  el.style.color=HIT_COLORS[sound]||'#5B37CC';
  el.style.bottom='38%';
  col.appendChild(el);
  const dx=(Math.random()*40-20)+'px';
  el.animate(
    [{opacity:1,transform:`translateX(-50%) translateY(0)`},
     {opacity:0,transform:`translateX(calc(-50% + ${dx})) translateY(-44px)`}],
    {duration:500,easing:'ease-out',fill:'forwards'}
  );
  setTimeout(()=>el.remove(),520);
}
function triggerAnim(sound){
  if(animTimer)clearTimeout(animTimer);
  if(sound==='center'){
    spawnHitLabel('Center','center');
    drumImg.src=imgSrc((lastCenterHand==='right')?'center right':'center left');
    lastCenterHand=(lastCenterHand==='right')?'left':'right';
  }else if(sound==='rim'){
    spawnHitLabel('Rim','rim');
    drumImg.src=imgSrc((lastRimHand==='right')?'rim right':'rim left');
    lastRimHand=(lastRimHand==='right')?'left':'right';
  }else if(sound==='sticks'){
    spawnHitLabel('Click','sticks');
    drumImg.src=imgSrc((lastClickHand==='right')?'click right':'click left');
    lastClickHand=(lastClickHand==='right')?'left':'right';
  }
  animTimer=setTimeout(()=>{drumImg.src=imgSrc('neutral');},200);
}
function resetAnim(){drumImg.src=imgSrc('neutral');lastCenterHand='right';lastRimHand='right';lastClickHand='right';}

document.getElementById('instrument-btn').addEventListener('click',e=>{
  e.stopPropagation();
  const btn=e.currentTarget;
  btn.disabled=true;
  const col=document.querySelector('.drummer-col');
  const colH=col.getBoundingClientRect().height;
  // Fall out downward
  drumImg.animate(
    [{transform:'translateY(0)',opacity:1},{transform:`translateY(${colH}px)`,opacity:0}],
    {duration:280,easing:'ease-in',fill:'forwards'}
  ).finished.then(()=>{
    instrument=(instrument==='stick')?'mallet':'stick';
    btn.textContent=(instrument==='stick')?'Switch to Mallets':'Switch to Sticks';
    drumImg.src=imgSrc('neutral');
    // Fall in from top
    return drumImg.animate(
      [{transform:`translateY(-${colH}px)`,opacity:0},{transform:'translateY(0)',opacity:1}],
      {duration:280,easing:'ease-out',fill:'forwards'}
    ).finished;
  }).then(()=>{
    drumImg.getAnimations().forEach(a=>a.cancel());
    btn.disabled=false;
  });
});

// ── Ghost rests (shown on empty beats during playback, then fade out) ──
let showGhosts=false, ghostFadeTimer=null;

function updateGhostRests(){
  const gr=document.getElementById('ghost-rests');
  if(!gr) return;
  gr.innerHTML='';
  if(!showGhosts) return;
  for(let m=0;m<4;m++) for(let b=0;b<4;b++){
    if(!state.timeline[m][b].length){
      const g=svgE('g',{style:'opacity:0.3'});
      drawRest(g, bx(m,b), '#777');
      if(state.showCount){
        const t=svgE('text',{x:Math.round(bx(m,b)),y:244,'text-anchor':'middle','font-size':'35','font-weight':'700','font-family':'Segoe UI,system-ui,sans-serif',fill:'#555'});
        t.textContent=`(${b+1})`;
        g.appendChild(t);
      }
      gr.appendChild(g);
    }
  }
}

function fadeOutGhosts(){
  if(ghostFadeTimer) clearTimeout(ghostFadeTimer);
  const gr=document.getElementById('ghost-rests');
  if(gr){
    Array.from(gr.children).forEach(el=>{
      el.style.transition='opacity 0.7s ease-out';
      el.style.opacity='0';
    });
    ghostFadeTimer=setTimeout(()=>{showGhosts=false;if(gr)gr.innerHTML='';},750);
  }
}

// Playback
let pbTimers=[];
function startPlayback(){const c=actx();if(c.state==='suspended')c.resume();if(ghostFadeTimer){clearTimeout(ghostFadeTimer);ghostFadeTimer=null;}document.getElementById('instrument-btn').disabled=true;state.isPlaying=true;document.getElementById('play-icon').innerHTML='<rect x="4" y="3" width="5" height="18"/><rect x="15" y="3" width="5" height="18"/>';document.getElementById('play-btn').classList.add('playing');showGhosts=true;updateGhostRests();_sched();}
function _sched(nextSt){pbTimers.forEach(clearTimeout);pbTimers=[];const c=actx(),bs=60/state.bpm,st=nextSt||c.currentTime+0.06;let gb=0;for(let m=0;m<4;m++)for(let b=0;b<4;b++){const t0=st+gb*bs,ns=state.timeline[m][b],_m=m,_b=b;pbTimers.push(setTimeout(()=>{if(!state.isPlaying)return;state.activeBeat={m:_m,b:_b};render();},Math.max(0,(t0-c.currentTime)*1000-10)));ns.forEach((note,idx)=>{if(note.type==='rest')return;let off=0;if(note.type==='eighth')off=idx*bs/2;if(note.type==='sixteenth')off=idx*bs/4;const _s=note.sound;pbTimers.push(setTimeout(()=>{if(!state.isPlaying)return;playSound(_s,actx().currentTime+.015);triggerAnim(_s);},Math.max(0,(t0+off-c.currentTime)*1000-15)));});gb++;}pbTimers.push(setTimeout(()=>{if(!state.isPlaying)return;state.activeBeat=null;render();resetAnim();if(state.isLooping){updateGhostRests();_sched(st+16*bs);}else stopPlayback();},16*bs*1000+60));}
function stopPlayback(){pbTimers.forEach(clearTimeout);pbTimers=[];state.isPlaying=false;state.activeBeat=null;document.getElementById('instrument-btn').disabled=false;document.getElementById('play-icon').innerHTML='<polygon points="6,3 20,12 6,21"/>';document.getElementById('play-btn').classList.remove('playing');render();resetAnim();fadeOutGhosts();}

// UI events
document.getElementById('play-btn').addEventListener('click',()=>{if(state.isPlaying)stopPlayback();else startPlayback();});
document.querySelector('.drummer-col').addEventListener('click',()=>{if(state.isPlaying)stopPlayback();else startPlayback();});
document.getElementById('loop-btn').addEventListener('click',()=>{state.isLooping=!state.isLooping;document.getElementById('loop-btn').classList.toggle('active',state.isLooping);render();});
document.getElementById('count-btn').addEventListener('click',()=>{state.showCount=!state.showCount;document.getElementById('count-btn').classList.toggle('active',state.showCount);render();});
document.getElementById('clear-btn').addEventListener('click',()=>{if(confirm('Clear all notes?')){if(state.isPlaying)stopPlayback();state.timeline=mkEmpty();render();}});
document.querySelectorAll('.tempo-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tempo-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.bpm=+btn.dataset.bpm;
  });
});
const ghost=document.getElementById('note-ghost');
let _ghostColor='#888';

function drawNotePreview(svgEl,type,color){
  while(svgEl.firstChild)svgEl.removeChild(svgEl.firstChild);
  const NS='http://www.w3.org/2000/svg';
  function e(tag,attrs){const el=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);return el;}
  const c=color||'#888';
  const HY=124,suf=18;
  if(type==='quarter'){
    svgEl.appendChild(e('ellipse',{cx:100,cy:HY,rx:20,ry:14,transform:'rotate(-15,100,'+HY+')',fill:c}));
    svgEl.appendChild(e('line',{x1:100+suf,y1:HY,x2:100+suf,y2:20,stroke:c,'stroke-width':'5','stroke-linecap':'round'}));
  }else if(type==='rest'){
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x','100');t.setAttribute('y','116');t.setAttribute('font-size','62');t.setAttribute('text-anchor','middle');t.setAttribute('fill',c);
    t.textContent='𝄽';
    svgEl.appendChild(t);
  }else if(type==='eighth'){
    [[64],[136]].forEach(([hx])=>{
      svgEl.appendChild(e('ellipse',{cx:hx,cy:HY,rx:20,ry:14,transform:'rotate(-15,'+hx+','+HY+')',fill:c}));
      svgEl.appendChild(e('line',{x1:hx+suf,y1:HY,x2:hx+suf,y2:20,stroke:c,'stroke-width':'5','stroke-linecap':'round'}));
    });
    svgEl.appendChild(e('rect',{x:64+suf,y:14,width:136-64,height:9,fill:c,rx:2}));
  }else if(type==='sixteenth'){
    [44,82,118,156].forEach(hx=>{
      svgEl.appendChild(e('ellipse',{cx:hx,cy:HY,rx:18,ry:12,transform:'rotate(-15,'+hx+','+HY+')',fill:c}));
      svgEl.appendChild(e('line',{x1:hx+suf-2,y1:HY,x2:hx+suf-2,y2:20,stroke:c,'stroke-width':'4','stroke-linecap':'round'}));
    });
    const lx=44+suf-2,rx_=156+suf-2;
    svgEl.appendChild(e('rect',{x:lx,y:14,width:rx_-lx,height:8,fill:c,rx:1}));
    svgEl.appendChild(e('rect',{x:lx,y:27,width:rx_-lx,height:8,fill:c,rx:1}));
  }
}

function setGhostColor(color){
  _ghostColor=color;
  if(state.selectedNote&&ghost.style.display!=='none')drawNotePreview(ghost,state.selectedNote,color);
}

function sizeNotePreviews(){
  const staffRect=document.getElementById('staff-svg').getBoundingClientRect();
  const rawH=staffRect.height*(129/274);
  const noteH=rawH>10?rawH:50;
  const noteW=noteH*(200/145);
  document.querySelectorAll('.palette-sym svg').forEach(s=>{s.setAttribute('width',Math.round(noteW));s.setAttribute('height',Math.round(noteH));});
  ghost.setAttribute('width',Math.round(noteW));
  ghost.setAttribute('height',Math.round(noteH));
}

function initPalette(){
  document.querySelectorAll('.palette-sym').forEach(sym=>{
    const type=sym.dataset.note;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 200 145');
    svg.style.pointerEvents='none';
    drawNotePreview(svg,type,'#5B37CC');
    sym.appendChild(svg);
  });
  sizeNotePreviews();
  requestAnimationFrame(sizeNotePreviews);
}

function selectNote(type){
  document.querySelectorAll('.palette-sym').forEach(s=>s.classList.remove('selected'));
  if(type){
    const sym=document.querySelector(`.palette-sym[data-note="${type}"]`);
    if(sym)sym.classList.add('selected');
    state.selectedNote=type;
    drawNotePreview(ghost,type,_ghostColor);
    sizeNotePreviews();
    ghost.style.display='block';
    document.getElementById('staff-svg').style.cursor='none';
  }else{
    state.selectedNote=null;
    ghost.style.display='none';
    document.getElementById('staff-svg').style.cursor='crosshair';
  }
}

document.addEventListener('mousemove',e=>{
  if(ghost.style.display!=='none'){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';}
});

window.addEventListener('resize',sizeNotePreviews);

// Deselect on click outside staff and palette
document.addEventListener('click',e=>{
  if(state.selectedNote&&!e.target.closest('#staff-svg')&&!e.target.closest('.palette')){selectNote(null);}
});

document.querySelectorAll('.palette-sym').forEach(sym=>{
  sym.addEventListener('click',()=>selectNote(sym.dataset.note===state.selectedNote?null:sym.dataset.note));
  sym.addEventListener('dragstart',e=>{e.dataTransfer.setData('note-type',sym.dataset.note);sym.classList.add('dragging');selectNote(sym.dataset.note);});
  sym.addEventListener('dragend',()=>sym.classList.remove('dragging'));
});
render();
initPalette();
</script>
