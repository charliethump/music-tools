<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrument Invaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --space: #070418;
    --ink: #f4f1ff;
    --dim: #8f89b8;
    --strings: #ff6b7a;
    --woodwinds: #5ee08a;
    --brass: #ffcc3d;
    --percussion: #b48cff;
    --u: 1px; /* one game pixel, set by script */
    --pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--space); color: var(--ink); overflow: hidden; }
  body { display: grid; place-items: center; font-family: var(--pixel); }

  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    max-height: 100vh;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  .screen {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 11);
    padding: calc(var(--u) * 14);
    text-align: center;
    background: rgba(7, 4, 24, .86);
  }
  .screen.show { display: flex; }
  #title { background: rgba(7, 4, 24, .35); }

  h1 { margin: 0; font-size: calc(var(--u) * 26); line-height: 1.3; font-weight: 400; }
  h1 .line { display: block; }
  h2 { margin: 0; font-weight: 400; }
  .big { font-size: calc(var(--u) * 22); }
  p { margin: 0; font-size: calc(var(--u) * 7); line-height: 1.9; color: var(--dim); max-width: 52ch; }
  .final { font-size: calc(var(--u) * 11); color: var(--ink); }

  .choices { display: flex; gap: calc(var(--u) * 14); flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: var(--pixel);
    font-size: calc(var(--u) * 10);
    color: var(--brass);
    background: transparent;
    border: calc(var(--u) * 2) solid currentColor;
    padding: calc(var(--u) * 9) calc(var(--u) * 14);
    cursor: pointer;
  }
  .btn small { display: block; margin-top: calc(var(--u) * 6); font-size: calc(var(--u) * 6); color: var(--dim); }
  .btn:hover { background: rgba(255, 255, 255, .08); }
  .btn:focus-visible, .mini:focus-visible, #initials:focus-visible { outline: calc(var(--u) * 2) dashed var(--ink); outline-offset: calc(var(--u) * 3); }
  .btn.easy { color: var(--woodwinds); }
  .btn.medium { color: var(--brass); }
  .btn.hard { color: var(--strings); }
  .btn.britten { color: #c9d1e8; }
  .btn.britten.locked { opacity: .35; cursor: not-allowed; }
  .btn.quiet { color: var(--dim); }
  .btn:disabled { opacity: .4; cursor: wait; }

  .scores { display: flex; gap: calc(var(--u) * 26); }
  .scores h2 { font-size: calc(var(--u) * 7); color: var(--dim); margin-bottom: calc(var(--u) * 5); }
  ol { list-style: none; margin: 0; padding: 0; min-width: calc(var(--u) * 150); }
  li .lvl { color: var(--dim); }
  li { display: flex; justify-content: space-between; gap: calc(var(--u) * 16); font-size: calc(var(--u) * 7); line-height: 1.9; }
  li.empty { color: #3d3270; }
  .note { color: var(--brass); }
  .note:empty { display: none; }
  #test-wave { font-size: calc(var(--u) * 7); color: var(--brass); border: 1px dashed var(--brass); padding: calc(var(--u) * 4) calc(var(--u) * 8); }
  #test-wave[hidden] { display: none; }
  #unlock {
    position: absolute; right: calc(var(--u) * 8); bottom: calc(var(--u) * 8); z-index: 6;
    font-family: var(--pixel); font-size: calc(var(--u) * 7); width: 12ch;
    color: var(--ink); background: rgba(7, 4, 24, .9);
    border: 1px solid #3d3270; padding: calc(var(--u) * 4) calc(var(--u) * 6);
  }
  #unlock[hidden] { display: none; }
  #admin-note {
    position: absolute; right: calc(var(--u) * 8); bottom: calc(var(--u) * 24); z-index: 6;
    font-size: calc(var(--u) * 6); color: var(--brass); pointer-events: none;
    transition: opacity .4s; opacity: 0;
  }
  #admin-note.show { opacity: 1; }
  #start-wave { font-family: var(--pixel); font-size: calc(var(--u) * 8); width: 6ch; margin-left: calc(var(--u) * 6); text-align: center; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--brass); }

  #hs { display: none; flex-direction: column; align-items: center; gap: calc(var(--u) * 9); }
  #hs.show { display: flex; }
  #hs label { font-size: calc(var(--u) * 8); color: var(--brass); }
  #initials {
    font-family: var(--pixel); font-size: calc(var(--u) * 18);
    width: 5ch; text-align: center; text-transform: uppercase;
    color: var(--ink); background: transparent;
    border: 0; border-bottom: calc(var(--u) * 2) solid var(--ink);
    padding: calc(var(--u) * 4);
  }

  #corner {
    position: absolute; top: calc(var(--u) * 5); right: calc(var(--u) * 5); z-index: 5;
    display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * 3);
  }
  .mini {
    font-family: var(--pixel); font-size: calc(var(--u) * 5);
    color: var(--dim); background: rgba(7, 4, 24, .7);
    border: 1px solid #3d3270; padding: calc(var(--u) * 3) calc(var(--u) * 5);
    cursor: pointer;
  }
  .mini[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage" tabindex="0" aria-label="Instrument Invaders game">
  <canvas id="game"></canvas>

  <section id="title" class="screen show">
    <h1 id="logo" aria-label="Instrument Invaders"></h1>
    <p>Read the instrument name at the top, then help Mr.&nbsp;Larson blast it with the conductor's baton. Hit the wrong one and you lose a life.</p>
    <label id="test-wave" hidden>Test mode: start at wave<input id="start-wave" type="number" min="1" max="99" value="1"></label>
    <div class="choices">
      <button class="btn easy" data-diff="easy" disabled>Easy<small>slower</small></button>
      <button class="btn medium" data-diff="medium" disabled>Medium<small>families too</small></button>
      <button class="btn hard" data-diff="hard" disabled>Hard<small>fastest</small></button>
      <button class="btn britten locked" data-diff="britten" disabled>Britten Battle<small id="britten-sub">score 10000 to unlock</small></button>
    </div>
    <div class="scores">
      <div><h2>Top 5</h2><ol id="scores-all"></ol></div>
    </div>
    <p id="board-note" class="note"></p>
    <p>Move with the arrow keys or mouse. Fire with the space bar or a click. Press P to pause.</p>
  </section>

  <section id="pause" class="screen">
    <h2 class="big">Paused</h2>
    <div class="choices">
      <button class="btn" id="resume">Resume</button>
      <button class="btn quiet" id="quit">Quit to menu</button>
    </div>
  </section>

  <section id="over" class="screen">
    <h2 class="big" id="over-title">Game over</h2>
    <p class="final">Score <span id="final-score">0</span></p>
    <div id="hs">
      <label for="initials">New high score! Type your initials</label>
      <input id="initials" maxlength="3" autocomplete="off" spellcheck="false">
      <button class="btn" id="save">Save score</button>
    </div>
    <p id="over-note" class="note"></p>
    <div id="over-list" class="scores"><div><h2 id="over-list-title">Top 5</h2><ol id="scores-over"></ol></div></div>
    <div id="over-actions" class="choices">
      <button class="btn" id="again">Play again</button>
      <button class="btn quiet" id="menu">Menu</button>
    </div>
  </section>

  <input id="unlock" type="text" autocomplete="off" spellcheck="false" aria-label="Code" hidden>
  <div id="admin-note" aria-live="polite"></div>

  <div id="corner">
    <button id="pause-btn" class="mini" hidden>Pause</button>
    <button id="mute" class="mini">Sound on</button>
    <button id="fs" class="mini" hidden>Full screen</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ===== Settings you might want to change ===== */

  // Paste your Apps Script web app URL between the quotes.
  // Leave it empty to keep scores on each Chromebook only.
  const LEADERBOARD_URL = 'https://script.google.com/macros/s/AKfycbygdpcFEskES3ydIOcHfw-5nDZb64rpKd01_wNTwvbwjrW2sfkXSsQn9NPRaKE5JI50xQ/exec';

  // Initials filter. Keep this matching the list in Leaderboard.gs.
  const BLOCK_EXACT = ('ASS ASZ AZZ ARS AZS FCK PHK PHU PHC CUM KUM CUK COC COK KOK KOC CNT KNT ' +
    'DIK DIC DIQ DCK DIX VAG VAJ PNS SEX SXY SXE SXX XXX TIT TTS NIP PUS PIS PSS PEE POO BUM ' +
    'JIZ JZZ GAY GEY HOE HO HOR SLT FAG FGT FGG NIG NGR NGA NGG KKK KYS KMS STD WTF SOB POS ' +
    'MF BS SHT CRP DAM DMN BCH BIH DIE KIL KLL TWT WNK JAP GYP WOP RTD TRD SUK SUX SUC BBW ' +
    'NZI NAZ ANL PRN FAP NUD').split(' ');
  const BLOCK_ANYWHERE = ['FU', 'FK', 'BJ', 'PP'];

  function isBlocked(name) {
    const n = String(name).toUpperCase();
    const collapsed = n.replace(/(.)\1+/g, '$1'); // FUU -> FU
    if (BLOCK_ANYWHERE.some(b => n.includes(b) || collapsed.includes(b))) return true;
    return BLOCK_EXACT.includes(n) || BLOCK_EXACT.includes(collapsed);
  }

  // Images go in this folder, named with the "file" value plus .png
  const IMG_DIR = 'assets/instruments/';

  const FAMILIES = {
    strings:    { label: 'Strings',    color: '#ff6b7a' },
    woodwinds:  { label: 'Woodwinds',  color: '#5ee08a' },
    brass:      { label: 'Brass',      color: '#ffcc3d' },
    percussion: { label: 'Percussion', color: '#b48cff' },
    keyboard:   { label: 'Keyboard',   color: '#5fd8ff' } // color for instruments in more than one family
  };

  // An instrument can belong to more than one family, e.g. family: ['strings', 'percussion']
  const familiesOf = inst => Array.isArray(inst.family) ? inst.family : [inst.family];
  const colorOf = inst => {
    const f = familiesOf(inst);
    return f.length > 1 ? FAMILIES.keyboard.color : FAMILIES[f[0]].color;
  };

  // size: how much of its tile the picture fills (1 = full tile). Leave it off for full size.
  // Smaller instruments use a smaller size so they look smaller than big ones.
  const INSTRUMENTS = [
    // Woodwinds
    { name: 'Piccolo',       file: 'piccolo',       family: 'woodwinds', size: 0.55 },
    { name: 'Flute',         file: 'flute',         family: 'woodwinds', size: 0.8 },
    { name: 'Oboe',          file: 'oboe',          family: 'woodwinds', size: 0.8 },
    { name: 'Clarinet',      file: 'clarinet',      family: 'woodwinds', size: 0.8 },
    { name: 'Bassoon',       file: 'bassoon',       family: 'woodwinds' },
    // Strings (Viola shares the violin image)
    { name: 'Violin',        file: 'violin',        family: 'strings', size: 0.65 },
    { name: 'Viola',         file: 'violin',        family: 'strings', size: 0.65 },
    { name: 'Cello',         file: 'cello',         family: 'strings' },
    { name: 'Double Bass',   file: 'double-bass',   family: 'strings' },
    { name: 'Harp',          file: 'harp',          family: 'strings' },
    { name: 'Guitar',        file: 'guitar',        family: 'strings', size: 0.85 },
    // Brass
    { name: 'French Horn',   file: 'french-horn',   family: 'brass' },
    { name: 'Trumpet',       file: 'trumpet',       family: 'brass', size: 0.8 },
    { name: 'Trombone',      file: 'trombone',      family: 'brass' },
    { name: 'Tuba',          file: 'tuba',          family: 'brass' },
    // Percussion
    { name: 'Timpani',       file: 'timpani',       family: 'percussion' },
    { name: 'Crash Cymbals', file: 'crash-cymbals', family: 'percussion' },
    { name: 'Bass Drum',     file: 'bass-drum',     family: 'percussion' },
    { name: 'Snare Drum',    file: 'snare-drum',    family: 'percussion' },
    { name: 'Castanets',     file: 'castanets',     family: 'percussion' },
    { name: 'Tam-Tam',       file: 'tam-tam',       family: 'percussion' },
    { name: 'Woodblock',     file: 'woodblock',     family: 'percussion' },
    { name: 'Xylophone',     file: 'xylophone',     family: 'percussion' },
    { name: 'Triangle',      file: 'triangle',      family: 'percussion' },
    // Counts as both strings and percussion
    { name: 'Piano',         file: 'piano',         family: ['strings', 'percussion'] }
  ];

  // Look-alike pairs: only one of each pair appears in a wave
  const EXCLUSIVE_PAIRS = [['Violin', 'Viola'], ['Cello', 'Double Bass'], ['Clarinet', 'Oboe']];

  // Most percussion instruments allowed in one wave (out of 21 spots).
  // Piano doesn't count toward this, since it's also a string instrument.
  const MAX_PERCUSSION = 6;

  // Gold sticker bonus: worth points plus an extra life (if there's room),
  // and counts toward clearing the wave. bonusChance in LEVELS sets how often it appears.
  const REST_COLOR = '#9be07a';                 // quarter rest green
  const FERMATA_COLOR = '#7fb8ff';              // fermata blue
  const GOLD_GLOW = '255, 204, 61', REST_GLOW = '150, 225, 110', FERMATA_GLOW = '120, 180, 255';
  const BONUS = { name: 'Gold sticker', file: 'goldsticker', bonus: true, kind: 'sticker', color: GOLD_GLOW };

  // Quarter rest power-up: no new bombs for REST_SECONDS, plus points. It does NOT count
  // toward clearing the wave. restChance in LEVELS sets how often it appears,
  // using the same row chances (bonusRows) as the gold sticker.
  const REST = { name: 'Quarter rest', file: 'quarterrest', bonus: true, kind: 'rest', color: REST_GLOW };
  const REST_SECONDS = 10;
  const REST_POINTS = 250;
  // TESTING: put a quarter rest in the front row of every wave. Set to false when done.
  const TEST_FORCE_REST = false;

  // Fermata power-up: the invaders stop marching for FERMATA_SECONDS, plus points.
  // It does NOT count toward clearing the wave. Appears as often as the quarter rest
  // (restChance) with the same row chances as the gold sticker.
  const FERMATA = { name: 'Fermata', file: 'fermata', bonus: true, kind: 'fermata', color: FERMATA_GLOW };
  const FERMATA_SECONDS = 10;
  const FERMATA_POINTS = 250;
  // TESTING: put a fermata in the front row of every wave. Set to false when done.
  const TEST_FORCE_FERMATA = false;

  // ADMIN BOX: double-click the INSTRUMENT INVADERS title on the title screen, type a
  // code in the box at the bottom right and press Enter (not case sensitive):
  //   test    - shows or hides the "start at wave" box (test games are never saved)
  //   britten - unlocks or relocks Britten Battle on this device
  // Set to false to remove the admin box entirely.
  const TEST_WAVE_PICKER = true;
  const BONUS_IMG = 'assets/goldsticker.png';
  const BONUS_POINTS = 500;

  const START_LIVES = 3;
  const MAX_LIVES = 5;
  const EXTRA_LIFE_EVERY = 3000;     // points

  // Difficulty levels. Multipliers compare to Medium (1 = Medium's numbers).
  //   stepTime / bombTime: above 1 = slower marching / fewer bombs
  //   bombSpeed: below 1 = bombs fall slower
  //   hits: correct hits needed to clear a wave
  //   familyChance: share of prompts that ask for a whole family (wave 2 and up)
  //   pictureClue: show the instrument's picture next to its name in the prompt
  //   colorClue: color the instrument's name by family in the prompt
  //   bonusChance: chance each wave has a gold sticker (1 = every wave)
  //   restChance: chance each wave has a quarter rest
  //   bonusRows: when there is a sticker, the chance it lands in each row
  //              (front = closest to the player, top = farthest away)
  const LEVELS = {
    easy:   { label: 'Easy',   stepTime: 1.2, bombTime: 1.2, bombSpeed: 0.8, bombSpeedAdd: 0,  hits: 0.8, familyChance: 0,     pictureClue: true, colorClue: true, bonusChance: 1,    restChance: 1 / 3, bonusRows: { front: 0.20, middle: 0.40, top: 0.40 } },
    medium: { label: 'Medium', stepTime: 1,   bombTime: 1,   bombSpeed: 1,   bombSpeedAdd: 0,  hits: 1,   familyChance: 1 / 6, pictureClue: false, colorClue: true, bonusChance: 0.5,  restChance: 1 / 4, bonusRows: { front: 0.15, middle: 0.40, top: 0.45 } },
    hard:   { label: 'Hard',   stepTime: 0.8, bombTime: 0.8, bombSpeed: 1,   bombSpeedAdd: 20, hits: 1,   familyChance: 0.25,  pictureClue: false, colorClue: false, bonusChance: 0.25, restChance: 1 / 6, bonusRows: { front: 0.10, middle: 0.45, top: 0.45 } }
  };
  LEVELS.britten = Object.assign({}, LEVELS.medium, { label: 'Britten Battle', pictureClue: false, familyChance: 0 });
  // Points multiplier for each level (everything earned is multiplied, rounded to 25s).
  // Britten Battle has no leaderboard, so it stays at 1x.
  LEVELS.easy.points = 1;
  LEVELS.medium.points = 2;
  LEVELS.hard.points = 3;
  LEVELS.britten.points = 1;
  const LEVEL_TAGS = { easy: 'E', medium: 'M', hard: 'H' }; // shown next to scores on the board

  /* ===== Benjamin Britten Battle ===== */
  // Unlocks on this device once any Easy, Medium or Hard game reaches this score.
  const BRITTEN_UNLOCK_SCORE = 10000;
  const BRITTEN_UNLOCK_KEY = 'instrument-invaders-britten-unlocked';
  const BRITTEN_WAVE = 5;            // speeds and points match this wave of Medium
  const BRITTEN_HP = 10;             // hits needed to defeat him
  const BRITTEN_HIT_POINTS = 250;    // points per hit on Britten
  const BRITTEN_WIN_POINTS = 2000;   // bonus for defeating him
  const BRITTEN_LIFE_POINTS = 1000;  // bonus per life left at the win
  const BRITTEN_TIME_BONUS = 10000;  // time bonus for an instant win...
  const BRITTEN_TIME_RATE = 25;      // ...minus this many points per second (0 after 6:40)
  const BRITTEN_SPEED = 70;          // side-to-side speed (game px per second)
  const BRITTEN_THROW_EVERY = 2.0;   // seconds between clefs at full health...
  const BRITTEN_THROW_MIN = 1.2;     // ...getting faster as he weakens, down to this
  const CLEF_SPEED = 150;            // treble clef speed
  const BRITTEN_SPRITE = { frameW: 39.5, frameH: 62.0, ax: 26.3, ay: 60.9, tipX: -24.9, tipY: -54.7 };
  const CLEF_COLOR = '#ff6bd0';
  let brittenUnlocked = false;
  let brittenFrames = [];
  let clefSprite = null;


  /* ===== Layout (game pixels; the canvas scales to fit) ===== */

  const W = 640, H = 360;
  const COLS = 7, ROWS = 3, CELL_W = 60, CELL_H = 52, SPR = 44;
  const TOP_BAND = 48, GROUND_Y = 332;

  // The conductor (player). Frames are built into the file; these numbers
  // describe them in game pixels. ax/ay = where the feet center sits in the frame,
  // tipX/tipY = baton tip in the cue frame, measured from the feet center.
  const CONDUCTOR = { h: 60, frameW: 29.0, frameH: 73.5, ax: 17.4, ay: 72.6, tipX: -10.1, tipY: -71.6 };
  const FEET_Y = 331;                          // where the conductor stands
  const HEAD_TOP = FEET_Y - CONDUCTOR.h;       // top of the conductor's head
  const INVADE_Y = HEAD_TOP + 4;               // instruments reaching this line = "reached the stage"
  const CUE_TIME = 0.22;                       // seconds the baton stays up after a shot
  const PX_MIN = 14 - CONDUCTOR.tipX, PX_MAX = W - 14; // keeps the baton able to reach both edges
  const SPRITE_RES = 2;
  const FONT = '"Press Start 2P", ui-monospace, "Courier New", monospace';
  const INK = '#f4f1ff', DIM = '#8f89b8', GOLD = '#ffcc3d', BOMB = '#ff8a5b';
  const SCORE_KEY = 'instrument-invaders-scores-v3';
  const MUTE_KEY = 'instrument-invaders-muted';

  /* ===== Elements ===== */

  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const canvas = $('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const screens = { title: $('title'), pause: $('pause'), over: $('over') };

  /* ===== Helpers ===== */

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  /* ===== Storage (fails quietly if Canvas blocks it) ===== */

  const memStore = {};
  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return memStore[k] ?? null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } }

  // One combined top-5 list: [{ name, score, level }]
  function topFive(list) {
    return list.filter(e => e && e.name && e.score > 0).sort((a, b) => b.score - a.score).slice(0, 5);
  }
  function loadScores() {
    try {
      const s = JSON.parse(storeGet(SCORE_KEY));
      if (Array.isArray(s)) return topFive(s);
    } catch (e) {}
    // Carry over this device's older per-level lists, tagged with their level
    try {
      const old = JSON.parse(storeGet('instrument-invaders-scores-v2')) || {};
      return topFive(['easy', 'medium', 'hard'].flatMap(k => (old[k] || []).map(e => ({ name: e.name, score: e.score, level: k }))));
    } catch (e) {}
    return [];
  }
  let localScores = loadScores();
  let boardScores = null; // shared leaderboard, null when not loaded or unreachable
  const shownScores = () => boardScores || localScores;

  function saveLocal(entry) {
    localScores = topFive(localScores.concat([{ name: entry.name, score: entry.score, level: entry.level }]));
    storeSet(SCORE_KEY, JSON.stringify(localScores));
  }

  function fetchJSON(url, opts = {}, ms = 20000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, Object.assign({}, opts, { signal: ctrl.signal, redirect: 'follow' }))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

    o.start(when); o.stop(when + 0.09);

  // Drums for one beat: kick on 1, snare on 2 and 3, hi-hats on eighths,
  // a fill every 4th bar and a crash every 8th bar
  function musicBeat(beat, when, half) {
    const bar = Math.floor(beat / 3), pos = beat % 3;
    if (pos === 0) { musicKick(when, 0.55); if (bar % 8 === 0) musicNoise(when, 1.1, 3, 0.10, true); }
    else if (pos === 1) musicSnare(when, 0.22);
    else { musicSnare(when, 0.15); if (bar % 4 === 3) musicSnare(half, 0.18); }
    musicNoise(when, 0.04, 90, 0.06, true);
    musicNoise(half, 0.04, 90, 0.04, true);
  }
  function musicSeek(pos) { // jump the read heads to a spot in the song (seconds)
    const N = RONDEAU.notes.length / 4;
    music.ni = 0; while (music.ni < N && RONDEAU.notes[music.ni * 4] / 100 < pos) music.ni++;
    if (music.drumsOnly) music.ni = N; // drums only: skip every note
    music.bi = 0; while (music.bi < RONDEAU.beats.length && RONDEAU.beats[music.bi] / 1000 < pos) music.bi++;
  }
  // drumsOnly = just the Rondeau's drum part (the front-row phase of Britten Battle)
  function musicStart(pos = 0, drumsOnly = false) {
    if (!actx) return;
    musicSetup();
    musicStop();
    music.drumsOnly = drumsOnly;
    music.bus = actx.createGain();
    music.bus.gain.value = muted ? 0 : MUSIC_VOLUME;
    music.bus.connect(master);
    music.start = actx.currentTime + 0.05 - pos;
    music.on = true;
    musicSeek(pos);
  }
  function musicStop(fade = 0) {
    if (!music.bus) { music.on = false; return; }
    const bus = music.bus;
    if (fade > 0) {
      bus.gain.setValueAtTime(bus.gain.value, actx.currentTime);
      bus.gain.linearRampToValueAtTime(0, actx.currentTime + fade);
      setTimeout(() => bus.disconnect(), fade * 1000 + 100);
    } else bus.disconnect();
    music.bus = null;
    music.on = false;
  }
  function musicPause() {
    if (!music.on) return;
    music.pos = (actx.currentTime - music.start) % (RONDEAU.lengthMs / 1000);
    musicStop();
    music.paused = true;
  }
  function musicResume() {
    if (!music.paused) return;
    music.paused = false;
    musicStart(music.pos, music.drumsOnly);
  }
  function musicSetMuted() {
    if (music.bus) music.bus.gain.setValueAtTime(muted ? 0 : MUSIC_VOLUME, actx.currentTime);
  }
  // Called every frame: schedules the next sliver of notes and drums, looping at the end
  function musicSchedule() {
    if (!music.on || !actx) return;
    const until = actx.currentTime + MUSIC_LOOKAHEAD, L = RONDEAU.lengthMs / 1000;
    const notes = RONDEAU.notes, N = notes.length / 4;
    for (;;) {
      let progressed = false;
      while (music.ni < N && music.start + notes[music.ni * 4] / 100 < until) {
        const i = music.ni * 4, when = Math.max(actx.currentTime, music.start + notes[i] / 100);
        musicNote(when, notes[i + 1] / 100, notes[i + 2], notes[i + 3]);
        music.ni++; progressed = true;
      }
      while (music.bi < RONDEAU.beats.length && music.start + RONDEAU.beats[music.bi] / 1000 < until) {
        const when = Math.max(actx.currentTime, music.start + RONDEAU.beats[music.bi] / 1000);
        musicBeat(music.bi, when, music.start + RONDEAU.halves[music.bi] / 1000);
        if (music.bi === RONDEAU.beats.length - 1 && !music.drumsOnly) { // final chord: crash and kick
          musicNoise(when, 1.1, 3, 0.2, true); musicKick(when, 0.6);
        }
        music.bi++; progressed = true;
      }
      if (music.ni >= N && music.bi >= RONDEAU.beats.length && music.start + L < until) {
        music.start += L; music.ni = music.drumsOnly ? N : 0; music.bi = 0; continue; // loop back to the top
      }
      if (!progressed) break;
    }
  }

  function updateMuteLabel() { $('mute').textContent = muted ? 'Sound off' : 'Sound on'; }
  function toggleMute() {
    muted = !muted;
    storeSet(MUTE_KEY, muted ? '1' : '0');
    updateMuteLabel();
    musicSetMuted();
  }

  /* ===== Game state ===== */

  let state = 'loading'; // loading, title, playing, wavebreak, paused, dying, over
  let pausedFrom = 'playing';
  let difficulty = 'easy';
  let game = null;
  const keys = { left: false, right: false };
  let pointerX = null;
  let pendingFire = false;

  function newGame(diff) {
    musicStop();
    music.paused = false;
    initAudio();
    difficulty = diff;
    game = {
      score: 0, basePoints: 0, lives: START_LIVES, wave: 0, streak: 0, nextLifeAt: EXTRA_LIFE_EVERY,
      player: { x: W / 2, invuln: 0, cue: 0 },
      bullet: null, bombs: [], particles: [], texts: [], messages: [],
      invaders: [], fx: 0, fy: 0, dir: 1, stepTimer: 0, marchNote: 0, bombTimer: 0,
      target: null, lastInstName: null, hits: 0, hitsNeeded: 0,
      breakTimer: 0, dieTimer: 0, starY: 0, time: 0, restT: 0, holdT: 0
    };
    keys.left = keys.right = false;
    pointerX = null;
    pendingFire = false;
    let startAt = TEST_WAVE_PICKER && !$('test-wave').hidden ? clamp(parseInt($('start-wave').value, 10) || 1, 1, 99) : 1;
    game.britten = null;
    if (diff === 'britten') {
      startAt = BRITTEN_WAVE;
      game.britten = { phase: 'front', time: 0, hp: BRITTEN_HP, x: W / 2, y: -80, dir: 1, throwT: BRITTEN_THROW_EVERY, anim: -1, flash: 0, introT: 0 };
      game.clefs = [];
    }
    $('start-wave').value = startAt;
    game.wave = startAt - 1;   // startWave adds 1
    game.testStart = startAt > 1 && diff !== 'britten';
    startWave();
    setScreen(null);
    state = 'playing';
    if (diff === 'britten') musicStart(0, true); // drums only until Britten arrives
    stage.focus({ preventScroll: true });
  }

  function startWave() {
    const g = game;
    g.wave++;
    g.hits = 0;
    g.hitsNeeded = g.britten ? Infinity : Math.round(Math.min(5 + g.wave, 10) * LEVELS[difficulty].hits);
    // Sit out one instrument from each look-alike pair for this wave
    const sittingOut = new Set(EXCLUSIVE_PAIRS.map(pair => pick(pair)));
    const eligible = INSTRUMENTS.filter(i => !sittingOut.has(i.name));
    const isPercussionOnly = i => { const f = familiesOf(i); return f.length === 1 && f[0] === 'percussion'; };
    const maxPerc = MAX_PERCUSSION;

    // Deal instruments so most appear once, skipping percussion past the cap
    const picks = [];
    let perc = 0, deck = [];
    while (picks.length < ROWS * COLS) {
      if (!deck.length) deck = shuffle(eligible.slice());
      const inst = deck.pop();
      if (isPercussionOnly(inst)) {
        if (perc >= maxPerc) continue;
        perc++;
      }
      picks.push(inst);
    }
    shuffle(picks);

    const cells = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        cells.push({ col: c, row: r, inst: picks[r * COLS + c], alive: true });
      }
    }
    const lvl = LEVELS[difficulty];
    const bonusRow = () => {
      const w = lvl.bonusRows;
      const r = Math.random() * (w.front + w.middle + w.top);
      const row = r < w.front ? ROWS - 1 : r < w.front + w.middle ? 1 : 0;
      return g.britten && row === ROWS - 1 ? 1 : row; // Britten Battle keeps the front row all instruments
    };
    const place = (item, row) => {
      const open = cells.filter(c => c.row === row && !c.inst.bonus);
      if (open.length) pick(open).inst = item;
    };
    if (Math.random() < lvl.bonusChance) place(BONUS, bonusRow());
    if (TEST_FORCE_REST) place(REST, ROWS - 1);
    else if (Math.random() < lvl.restChance) place(REST, bonusRow());
    if (TEST_FORCE_FERMATA) place(FERMATA, ROWS - 1);
    else if (Math.random() < lvl.restChance) place(FERMATA, bonusRow());
    g.invaders = cells;
    g.dir = 1;
    g.bullet = null;
    g.bombs = [];
    g.bombTimer = 1.8;
    resetFormation();
    pickTarget();
    if (g.britten) addMessage('Clear the front row!', INK, 1.5, 0.8, 12);
    else addMessage('Wave ' + g.wave, INK, 0.7, 0.7, 12);
  }

  function resetFormation() {
    game.fx = (W - COLS * CELL_W) / 2;
    game.fy = TOP_BAND + 6 + (game.britten && game.britten.phase !== 'front' ? BRITTEN_LANE : 0);
    game.stepTimer = 0.6;
  }

  const aliveInvaders = () => game.invaders.filter(v => v.alive);

  // Only the front instrument in each column has a clear shot
  function frontInvaders() {
    const front = {};
    for (const v of game.invaders) {
      if (v.alive && (!front[v.col] || v.row > front[v.col].row)) front[v.col] = v;
    }
    return Object.values(front);
  }
  const invX = v => game.fx + v.col * CELL_W + CELL_W / 2;
  const invY = v => game.fy + v.row * CELL_H + CELL_H / 2;

  function pickTarget() {
    const g = game;
    if (g.britten) { pickBrittenTarget(); return; }
    const front = frontInvaders();
    if (!front.length) { g.target = null; return; }
    const alive = front.filter(v => !v.inst.bonus);
    if (!alive.length) { g.target = { type: 'bonus', inst: front[0].inst }; return; } // only bonuses are left in front
    const lvl = LEVELS[difficulty];
    if (lvl.familyChance && g.wave >= 2 && Math.random() < lvl.familyChance) {
      const fams = [...new Set(alive.flatMap(v => familiesOf(v.inst)))].filter(f => f !== 'keyboard');
      if (fams.length) { g.target = { type: 'family', family: pick(fams) }; return; }
    }
    let options = alive.map(v => v.inst).filter(i => i.name !== g.lastInstName);
    if (!options.length) options = alive.map(v => v.inst);
    const inst = pick(options);
    g.lastInstName = inst.name;
    g.target = { type: 'inst', inst };
  }

  function isCorrect(v) {
    const t = game.target;
    if (!t) return false;
    if (t.type === 'bonus') return !!v.inst.bonus;
    if (t.type === 'britten') return false;
    if (v.inst.bonus) return false;
    return t.type === 'inst' ? v.inst.name === t.inst.name : familiesOf(v.inst).includes(t.family);
  }
  function targetStillThere() {
    return frontInvaders().some(isCorrect);
  }

  // Difficulty ramps up every wave until RAMP_LAST_WAVE, then holds steady.
  // Early waves ramp quickly; later waves creep up in smaller steps.
  const RAMP_LAST_WAVE = 15;
  const WAVE_POINTS_STEP = 0.10; // correct hits are worth 10% more each wave
  const rampWave = () => Math.min(game.wave, RAMP_LAST_WAVE);

  function stepInterval() {
    const g = game, w = rampWave();
    const frac = aliveInvaders().length / (ROWS * COLS);
    // 0.62s at wave 1, -0.06 per wave to 0.20s at wave 8, then -0.01 per wave to 0.13s at wave 15
    const base = (w <= 8 ? 0.62 - (w - 1) * 0.06 : 0.20 - (w - 8) * 0.01) * LEVELS[difficulty].stepTime;
    return base * (0.35 + 0.65 * frac);
  }
  function bombInterval() {
    const w = rampWave();
    // 2.4s at wave 1, -0.18 per wave to 0.96s at wave 9, then -0.03 per wave to 0.78s at wave 15
    const base = w <= 9 ? 2.4 - (w - 1) * 0.18 : 0.96 - (w - 9) * 0.03;
    return base * LEVELS[difficulty].bombTime;
  }
  function bombSpeed() {
    const lvl = LEVELS[difficulty], w = rampWave();
    // 95 at wave 1, +10 per wave to 185 at wave 10, then +4 per wave to 205 at wave 15
    const base = w <= 10 ? 85 + w * 10 : 185 + (w - 10) * 4;
    return base * lvl.bombSpeed + lvl.bombSpeedAdd;
  }

  function stepFormation() {
    const g = game;
    const STEP = 8, DROP = 12, MARGIN = 10;
    let minC = COLS, maxC = -1, maxR = -1;
    for (const v of g.invaders) {
      if (!v.alive) continue;
      if (v.col < minC) minC = v.col;
      if (v.col > maxC) maxC = v.col;
      if (v.row > maxR) maxR = v.row;
    }
    if (maxC < 0) return;
    const left = g.fx + minC * CELL_W + (CELL_W - SPR) / 2;
    const right = g.fx + maxC * CELL_W + (CELL_W + SPR) / 2;
    if ((g.dir > 0 && right + STEP > W - MARGIN) || (g.dir < 0 && left - STEP < MARGIN)) {
      g.fy += DROP;
      g.dir *= -1;
    } else {
      g.fx += g.dir * STEP;
    }
    // Marching notes (silent in Britten Battle's front-row phase, where only the drums play)
    if (!(g.britten && g.britten.phase === 'front')) sfx.march(g.marchNote);
    g.marchNote++;
    const bottom = g.fy + maxR * CELL_H + (CELL_H + SPR) / 2;
    if (bottom >= INVADE_Y) loseLife('They reached the stage!', { invasion: true });
  }

  function dropBomb() {
    const alive = aliveInvaders();
    if (!alive.length) return;
    const col = pick(alive).col;
    let low = null;
    for (const v of alive) if (v.col === col && (!low || v.row > low.row)) low = v;
    if (low.inst.bonus) return;
    game.bombs.push({ x: invX(low), y: invY(low) + SPR / 2, t: 0 });
  }

  function fire() {
    pendingFire = false;
    if (state !== 'playing' || game.bullet) return;
    game.bullet = { x: game.player.x + CONDUCTOR.tipX, y: FEET_Y + CONDUCTOR.tipY + 6 };
    game.player.cue = CUE_TIME;
    sfx.shoot();
  }

  // Adds points with the level's multiplier and returns what was actually added.
  // Extra lives count base (unmultiplied) points, so harder levels don't get more lives.
  function addScore(pts) {
    const g = game;
    const got = Math.round(pts * (LEVELS[difficulty].points || 1) / 25) * 25;
    g.score += got;
    g.basePoints += pts;
    if (!g.britten && !g.testStart && g.score >= BRITTEN_UNLOCK_SCORE && !brittenUnlocked) {
      unlockBritten(true);
      addMessage('Britten Battle unlocked!', '#c9d1e8', 1.5, 1);
    }
    while (g.basePoints >= g.nextLifeAt) {
      g.nextLifeAt += EXTRA_LIFE_EVERY;
      gainLife();
    }
    return got;
  }
  function gainLife() {
    const g = game;
    if (g.lives >= MAX_LIVES) return false;
    g.lives++;
    addMessage('Extra life!', GOLD, 0.7, 0.7);
    sfx.oneUp();
    return true;
  }

  function resolveHit(v) {
    const g = game;
    v.alive = false;
    const x = invX(v), y = invY(v);
    if (v.inst.kind === 'rest') {
      addScore(REST_POINTS);
      g.restT = REST_SECONDS; // a second rest resets the timer
      burst(x, y, REST_COLOR, 24);
      addMessage('Quarter rest! Shhh...', REST_COLOR, 0.9 + MESSAGE_EXTRA, 0.9);
      sfx.rest();
    }
    if (v.inst.kind === 'fermata') {
      addScore(FERMATA_POINTS);
      g.holdT = FERMATA_SECONDS; // a second fermata resets the timer
      burst(x, y, FERMATA_COLOR, 24);
      addMessage('Fermata! Invaders are holding...', FERMATA_COLOR, 0.9 + MESSAGE_EXTRA, 0.9);
      sfx.fermata();
    }
    if (v.inst.bonus) {
      if (v.inst.kind === 'sticker') {
        const got = addScore(BONUS_POINTS);
        burst(x, y, GOLD, 24);
        addMessage('Gold sticker! +' + got, GOLD, 0.8 + MESSAGE_EXTRA, 0.8);
        sfx.bonus();
        gainLife();
        g.hits++; // only the gold sticker counts toward clearing the wave
      }
      if (g.hits >= g.hitsNeeded || !aliveInvaders().length) waveClear();
      else if (!targetStillThere()) pickTarget();
      return;
    }
    if (isCorrect(v)) {
      g.streak++;
      // Base 100 + 25 per hit in a row, then worth 10% more per wave (up to RAMP_LAST_WAVE),
      // rounded to a multiple of 25 so the leaderboard accepts it
      const base = 100 + Math.min(g.streak - 1, 8) * 25;
      const pts = Math.round(base * (1 + WAVE_POINTS_STEP * (rampWave() - 1)) / 25) * 25;
      const got = addScore(pts);
      burst(x, y, colorOf(v.inst), 14);
      addText('+' + got, x, y, INK, 0.9, 8);
      sfx.correct();
      g.hits++;
      if (g.hits >= g.hitsNeeded || !aliveInvaders().length) waveClear();
      else pickTarget();
    } else {
      burst(x, y, DIM, 10);
      addMessage("That's the " + v.inst.name + '!', colorOf(v.inst), 1, 1);
      sfx.wrong();
      loseLife(null, { quiet: true });
      if (state === 'playing') {
        if (!aliveInvaders().length) waveClear();
        else if (!targetStillThere()) pickTarget();
      }
    }
  }

  function waveClear() {
    const g = game;
    if (g.britten) { pickTarget(); return; }
    const clearPts = addScore(500);
    for (const v of g.invaders) {
      if (v.alive) { v.alive = false; burst(invX(v), invY(v), DIM, 4); }
    }
    g.bullet = null;
    g.bombs = [];
    g.target = null;
    addMessage('Wave ' + g.wave + ' clear! +' + clearPts, GOLD, 1, 1);
    sfx.wave();
    state = 'wavebreak';
    g.breakTimer = 2.2;
  }

  function loseLife(msg, opts = {}) {
    const g = game;
    if (g.clefs) g.clefs = [];
    g.lives--;
    g.streak = 0;
    g.player.invuln = 1.6;
    g.bombs = [];
    if (!opts.quiet) { sfx.hurt(); burst(g.player.x, FEET_Y - 30, GOLD, 16); }
    if (msg) addMessage(msg, BOMB, 0.9, 0.9);
    if (opts.invasion) resetFormation();
    if (g.lives <= 0) {
      g.lives = 0;
      g.bullet = null;
      state = 'dying';
      g.dieTimer = g.britten ? 3.2 : 1.4; // Britten Battle waits for the defeat fanfare
      musicStop(g.britten ? 0.4 : 0.8);
      if (g.britten) sfx.defeat(); else sfx.over();
    }
  }

  /* ===== Effects ===== */

  function burst(x, y, color, n) {
    const ps = game.particles;
    for (let i = 0; i < n && ps.length < 160; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 110;
      ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, color });
    }
  }
  function addText(text, x, y, color, life, size) {
    game.texts.push({ text, x, y, color, life, max: life, size });
  }
  // Centered messages (waves, power-ups, extra lives, wrong hits...) share one stack
  // just above the conductor: the newest sits on the bottom row and older ones slide
  // up a row, so they never overlap. Each one holds, then fades.
  const MESSAGE_Y = HEAD_TOP - 16;   // bottom row
  const MESSAGE_ROW = 17;            // row height
  const MESSAGE_MAX = 4;             // most rows shown at once (oldest drops off)
  const MESSAGE_EXTRA = 1;           // extra seconds power-up messages stay before fading
  function addMessage(text, color, hold, fade, size = 10) {
    const list = game.messages;
    list.unshift({ text, color, life: hold + fade, fade, size, y: MESSAGE_Y + MESSAGE_ROW });
    if (list.length > MESSAGE_MAX) list.length = MESSAGE_MAX;
  }
  function updateEffects(dt) {
    const g = game;
    g.starY = (g.starY + dt * 6) % H;
    g.time += dt;
    for (let i = g.particles.length - 1; i >= 0; i--) {
      const p = g.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) g.particles.splice(i, 1);
    }
    for (let i = g.texts.length - 1; i >= 0; i--) {
      const t = g.texts[i];
      t.y -= 12 * dt;
      t.life -= dt;
      if (t.life <= 0) g.texts.splice(i, 1);
    }
    for (let i = g.messages.length - 1; i >= 0; i--) {
      g.messages[i].life -= dt;
      if (g.messages[i].life <= 0) g.messages.splice(i, 1);
    }
    // Slide each message toward its row
    g.messages.forEach((m, i) => {
      const target = MESSAGE_Y - i * MESSAGE_ROW;
      m.y += (target - m.y) * Math.min(1, dt * 12);
    });
  }

  /* ===== Update ===== */

  function update(dt) {
    const g = game;
    updateEffects(dt);
    if (g.britten && g.britten.phase !== 'won') g.britten.time += dt;

    if (g.britten && (g.britten.phase === 'enter' || g.britten.phase === 'won')) {
      updateBrittenScene(dt);
      return;
    }
    if (state === 'wavebreak') {
      g.breakTimer -= dt;
      if (g.breakTimer <= 0) { state = 'playing'; startWave(); }
      return;
    }

    // Player movement
    const p = g.player;
    const KEY_SPEED = 280, POINTER_SPEED = 900;
    if (keys.left && !keys.right) p.x -= KEY_SPEED * dt;
    else if (keys.right && !keys.left) p.x += KEY_SPEED * dt;
    else if (pointerX !== null) {
      const d = clamp(pointerX - CONDUCTOR.tipX, PX_MIN, PX_MAX) - p.x, m = POINTER_SPEED * dt;
      p.x += Math.abs(d) <= m ? d : Math.sign(d) * m;
    }
    p.x = clamp(p.x, PX_MIN, PX_MAX);
    if (p.invuln > 0) p.invuln -= dt;
    if (p.cue > 0) p.cue -= dt;
    if (pendingFire && (pointerX === null || Math.abs(clamp(pointerX - CONDUCTOR.tipX, PX_MIN, PX_MAX) - p.x) < 2)) fire();

    // Player shot
    const b = g.bullet;
    if (b) {
      b.y -= 430 * dt;
      if (b.y < TOP_BAND) g.bullet = null;
      else {
        for (const v of g.invaders) {
          if (v.alive && Math.abs(b.x - invX(v)) < SPR / 2 && Math.abs(b.y - invY(v)) < SPR / 2) {
            g.bullet = null;
            resolveHit(v);
            break;
          }
        }
        // Britten can only be hit through an open lane (the shot stops at any instrument first)
        if (g.bullet && g.britten && brittenHitTest(b.x, b.y)) {
          g.bullet = null;
          hitBritten();
        }
      }
    }
    if (state !== 'playing') return;

    // Formation march (paused while a fermata is holding)
    if (g.holdT > 0) g.holdT = Math.max(0, g.holdT - dt);
    else g.stepTimer -= dt;
    if (g.stepTimer <= 0 && g.holdT <= 0) {
      stepFormation();
      g.stepTimer += stepInterval();
    }
    if (state !== 'playing') return;

    // Bombs
    if (g.restT > 0) g.restT = Math.max(0, g.restT - dt); // quarter rest: no new bombs
    else g.bombTimer -= dt;
    if (g.bombTimer <= 0 && g.restT <= 0) {
      dropBomb();
      g.bombTimer = bombInterval() * (0.6 + Math.random() * 0.8);
    }
    const bs = bombSpeed();
    for (let i = g.bombs.length - 1; i >= 0; i--) {
      const bo = g.bombs[i];
      bo.y += bs * dt;
      bo.t += dt;
      if (bo.y > GROUND_Y) { g.bombs.splice(i, 1); continue; }
      if (p.invuln <= 0 && Math.abs(bo.x - p.x) < 8 && bo.y > HEAD_TOP + 10 && bo.y < FEET_Y) {
        g.bombs.splice(i, 1);
        loseLife('Ouch!');
        if (state !== 'playing') return;
      }
    }
    if (g.britten) updateBritten(dt);
  }

  /* ===== Benjamin Britten Battle: behavior ===== */
  const BRITTEN_Y = TOP_BAND + 62;   // where his feet sit in his lane at the top
  const BRITTEN_LANE = CELL_H;       // room the instruments make for him
  // Player shots stop at the first instrument they touch, so Britten can only be hit
  // through an empty column. His treble clefs fly through instruments.
  const BRITTEN_THROW_SEQ = [0, 1, 2, 1, 0]; // sprite 1 > 2 > 3 > 2 > 1
  const BRITTEN_FRAME_TIME = 0.12;

  function unlockBritten(persist) {
    brittenUnlocked = true;
    if (persist) storeSet(BRITTEN_UNLOCK_KEY, '1');
    const btn = screens.title.querySelector('[data-diff="britten"]');
    btn.classList.remove('locked');
    $('britten-sub').textContent = 'boss battle';
    const ready = !screens.title.querySelector('[data-diff="easy"]').disabled;
    if (ready) btn.disabled = false;
  }

  const clockText = secs => Math.floor(secs / 60) + ':' + String(Math.floor(secs % 60)).padStart(2, '0');

  function relockBritten() {
    brittenUnlocked = false;
    storeSet(BRITTEN_UNLOCK_KEY, '0');
    const btn = screens.title.querySelector('[data-diff="britten"]');
    btn.classList.add('locked');
    btn.disabled = true;
    $('britten-sub').textContent = 'score 10000 to unlock';
  }

  // Short confirmation in the corner after an admin code
  let adminNoteTimer = 0;
  function adminNote(text) {
    const n = $('admin-note');
    n.textContent = text;
    n.classList.add('show');
    clearTimeout(adminNoteTimer);
    adminNoteTimer = setTimeout(() => n.classList.remove('show'), 2000);
  }

  function frontRowLeft() {
    return game.invaders.filter(v => v.alive && v.row === ROWS - 1 && !v.inst.bonus);
  }
  function brittenProgress() {
    const b = game.britten;
    if (b.phase === 'front') return (COLS - frontRowLeft().length) / COLS;
    return (BRITTEN_HP - b.hp) / BRITTEN_HP;
  }

  function pickBrittenTarget() {
    const g = game, b = g.britten;
    // Only call instruments with a clear shot: the front row in phase 1, then the front one in each column
    const front = frontInvaders();
    const pool = b.phase === 'front' ? frontRowLeft() : front.filter(v => !v.inst.bonus);
    if (!pool.length) {
      if (b.phase === 'front') g.target = null;
      else if (front.length) g.target = { type: 'bonus', inst: front[0].inst }; // only power-ups are in front
      else g.target = { type: 'britten' };                                       // every instrument is gone
      return;
    }
    let options = pool.map(v => v.inst).filter(i => i.name !== g.lastInstName);
    if (!options.length) options = pool.map(v => v.inst);
    const inst = pick(options);
    g.lastInstName = inst.name;
    g.target = { type: 'inst', inst };
  }

  function startBrittenEntrance() {
    const g = game, b = g.britten;
    b.phase = 'enter';
    b.introT = 0;
    b.fromFy = g.fy;
    const maxFy = INVADE_Y - 30 - (CELL_H + (CELL_H + SPR) / 2); // keep the two rows clear of the stage
    b.toFy = clamp(g.fy + BRITTEN_LANE, TOP_BAND + 6 + BRITTEN_LANE, maxFy);
    b.x = W / 2;
    b.y = -70;
    g.bullet = null;
    g.bombs = [];
    g.clefs = [];
    g.target = null;
    addMessage('Benjamin Britten has arrived!', '#c9d1e8', 1.6, 0.8, 12);
    musicStart(); // the full Rondeau begins as he arrives (replacing the drums)
  }

  // Entrance and victory scenes (the rest of the game waits)
  function updateBrittenScene(dt) {
    const g = game, b = g.britten;
    b.introT += dt;
    if (b.phase === 'enter') {
      const t = Math.min(1, b.introT / 1.6), ease = t * t * (3 - 2 * t);
      g.fy = b.fromFy + (b.toFy - b.fromFy) * ease;
      b.y = -70 + (BRITTEN_Y + 70) * ease;
      if (b.introT >= 2.2) {
        b.phase = 'fight';
        b.throwT = 1.2;
        pickTarget();
      }
    } else if (b.phase === 'won') {
      if (b.introT < 1.2 && Math.random() < 0.5) burst(b.x + (Math.random() - 0.5) * 40, b.y - 30 + (Math.random() - 0.5) * 40, pick([GOLD, '#c9d1e8', CLEF_COLOR]), 6);
      if (b.introT >= 3.2) showOver();
    }
  }

  function updateBritten(dt) {
    const g = game, b = g.britten;
    if (b.phase === 'front') {
      if (!frontRowLeft().length) startBrittenEntrance();
      return;
    }
    if (b.phase !== 'fight') return;
    const p = g.player;

    // Float side to side (a fermata freezes him too)
    if (g.holdT <= 0) {
      b.x += b.dir * BRITTEN_SPEED * dt;
      const margin = 34;
      if (b.x < margin) { b.x = margin; b.dir = 1; }
      if (b.x > W - margin) { b.x = W - margin; b.dir = -1; }
    }
    b.y = BRITTEN_Y + Math.sin(g.time * 2.2) * 3;
    if (b.flash > 0) b.flash -= dt;

    // Throwing: sprite 1 > 2 > 3 > 2 > 1, releasing the clef on sprite 3
    if (b.anim >= 0) {
      b.anim += dt;
      const idx = Math.floor(b.anim / BRITTEN_FRAME_TIME);
      if (idx >= 2 && !b.released) { b.released = true; throwClef(); }
      if (idx >= BRITTEN_THROW_SEQ.length) b.anim = -1;
    } else if (g.restT <= 0) { // a quarter rest stops his throws too
      b.throwT -= dt;
      if (b.throwT <= 0) {
        b.anim = 0;
        b.released = false;
        b.throwT = BRITTEN_THROW_MIN + (BRITTEN_THROW_EVERY - BRITTEN_THROW_MIN) * (b.hp / BRITTEN_HP);
      }
    }

    // Clefs fly toward where the conductor was standing
    for (let i = g.clefs.length - 1; i >= 0; i--) {
      const c = g.clefs[i];
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.rot += dt * 5;
      if (c.y > GROUND_Y || c.x < -20 || c.x > W + 20) { g.clefs.splice(i, 1); continue; }
      if (p.invuln <= 0 && Math.abs(c.x - p.x) < 10 && c.y > HEAD_TOP + 6 && c.y < FEET_Y) {
        g.clefs.splice(i, 1);
        loseLife('Ouch!');
        if (state !== 'playing') return;
      }
    }
  }

  function throwClef() {
    const g = game, b = g.britten;
    const sx = b.x + BRITTEN_SPRITE.tipX, sy = b.y + BRITTEN_SPRITE.tipY;
    const dx = g.player.x - sx, dy = (FEET_Y - 30) - sy, d = Math.hypot(dx, dy) || 1;
    g.clefs.push({ x: sx, y: sy, vx: dx / d * CLEF_SPEED, vy: dy / d * CLEF_SPEED, rot: 0 });
    sfx.clef();
  }

  function brittenHitTest(x, y) {
    const b = game.britten;
    return b.phase === 'fight' && Math.abs(x - b.x) < 13 && y > b.y - 56 && y < b.y;
  }

  function hitBritten() {
    const g = game, b = g.britten;
    b.hp--;
    b.flash = 0.3;
    addScore(BRITTEN_HIT_POINTS);
    burst(b.x, b.y - 30, '#c9d1e8', 18);
    addText('+' + BRITTEN_HIT_POINTS, b.x, b.y - 62, INK, 0.9, 8);
    sfx.brittenHit();
    if (b.hp <= 0) {
      b.phase = 'won';
      b.introT = 0;
      const secs = Math.floor(b.time);
      const timeBonus = Math.max(0, BRITTEN_TIME_BONUS - secs * BRITTEN_TIME_RATE);
      b.finalTime = secs;
      const bonus = BRITTEN_WIN_POINTS + g.lives * BRITTEN_LIFE_POINTS + timeBonus;
      addScore(bonus);
      g.bullet = null;
      g.bombs = [];
      g.clefs = [];
      g.target = null;
      musicStop(0.4); // fade the music out under the victory fanfare
      addMessage('You defeated Benjamin Britten!', GOLD, 2.2, 0.8, 12);
      addMessage('Time ' + clockText(secs) + '  time bonus +' + timeBonus, GOLD, 2, 0.8);
      addMessage('Victory bonus +' + (bonus - timeBonus), GOLD, 2, 0.8);
      sfx.fanfare();
    }
  }

  function drawBritten() {
    const g = game, b = g.britten;
    for (const c of g.clefs || []) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(Math.sin(c.rot) * 0.5);
      if (clefSprite) ctx.drawImage(clefSprite, -8.25, -13.2, 16.5, 26.4);
      ctx.restore();
    }
    if (b.phase === 'front') return;
    let alpha = 1;
    if (b.phase === 'won') alpha = Math.max(0, 1 - b.introT / 1.2);
    if (b.flash > 0 && Math.floor(b.flash * 20) % 2 === 0) alpha *= 0.3;
    const idx = b.anim >= 0 ? BRITTEN_THROW_SEQ[Math.min(BRITTEN_THROW_SEQ.length - 1, Math.floor(b.anim / BRITTEN_FRAME_TIME))] : 0;
    const fr = brittenFrames[idx];
    if (!fr || alpha <= 0) return;
    ctx.globalAlpha = alpha;
    ctx.drawImage(fr, b.x - BRITTEN_SPRITE.ax, b.y - BRITTEN_SPRITE.ay, BRITTEN_SPRITE.frameW, BRITTEN_SPRITE.frameH);
    ctx.globalAlpha = 1;
  }

  // Bottom bar: "Britten" plus one pip per hit he has left
  function drawBrittenHealth(y) {
    const b = game.britten;
    setFont(8);
    ctx.textBaseline = 'middle';
    if (b.phase === 'front') {
      ctx.textAlign = 'center';
      ctx.fillStyle = DIM;
      ctx.fillText('Britten Battle', W / 2, y);
      return;
    }
    const label = 'Britten', lw = ctx.measureText(label).width, pip = 7, gap = 2;
    const total = lw + 8 + BRITTEN_HP * (pip + gap);
    let x = W / 2 - total / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#c9d1e8';
    ctx.fillText(label, x, y);
    x += lw + 8;
    for (let i = 0; i < BRITTEN_HP; i++) {
      ctx.fillStyle = i < b.hp ? '#c9d1e8' : '#2a2152';
      ctx.fillRect(x + i * (pip + gap), y - 4, pip, 8);
    }
  }

  /* ===== Drawing ===== */

  // Treble clef that Britten throws
  function drawClef(g, x, y, h, color) {
    // Treble clef drawn from strokes; (x, y) = center, h = height
    const s = h, P = (u, v) => [x + (u - 0.5) * s * 0.5, y + (v - 0.5) * s];
    g.lineCap = 'round'; g.lineJoin = 'round';
    const path = () => {
      g.beginPath();
      g.moveTo(...P(0.58, 0.92));                                // bottom of stem
      g.bezierCurveTo(...P(0.62, 0.70), ...P(0.40, 0.25), ...P(0.52, 0.06)); // stem up to the top
      g.bezierCurveTo(...P(0.72, 0.14), ...P(0.70, 0.30), ...P(0.40, 0.44)); // top loop curving back down
      g.bezierCurveTo(...P(0.06, 0.58), ...P(0.18, 0.84), ...P(0.52, 0.80)); // big lower curve
      g.bezierCurveTo(...P(0.88, 0.76), ...P(0.84, 0.52), ...P(0.56, 0.54)); // around the right side
      g.bezierCurveTo(...P(0.36, 0.56), ...P(0.38, 0.70), ...P(0.52, 0.68)); // inner curl
    };
    path(); g.strokeStyle = 'rgba(7, 4, 24, 0.95)'; g.lineWidth = s * 0.16; g.stroke();
    path(); g.strokeStyle = color; g.lineWidth = s * 0.08; g.stroke();
    g.beginPath(); g.arc(...P(0.40, 0.94), s * 0.07, 0, Math.PI * 2);
    g.fillStyle = 'rgba(7, 4, 24, 0.95)'; g.fill();
    g.beginPath(); g.arc(...P(0.40, 0.94), s * 0.05, 0, Math.PI * 2);
    g.fillStyle = color; g.fill();
  }
  function buildClefSprite() {
    const h = 22, c = makeCanvas(Math.round(h * 0.75 * SPRITE_RES), Math.round(h * 1.2 * SPRITE_RES)), g = c.getContext('2d');
    g.scale(SPRITE_RES, SPRITE_RES);
    drawClef(g, h * 0.375, h * 0.6, h, CLEF_COLOR);
    return c;
  }

  function drawConductor(x, feetY, scale, alpha, cue) {
    const fr = conductorFrames[cue ? 1 : 0];
    if (!fr) return;
    ctx.globalAlpha = alpha;
    ctx.drawImage(fr, x - CONDUCTOR.ax * scale, feetY - CONDUCTOR.ay * scale,
      CONDUCTOR.frameW * scale, CONDUCTOR.frameH * scale);
    ctx.globalAlpha = 1;
  }

  function drawNote(x, y) {
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.ellipse(x - 2, y + 5, 3.4, 2.5, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x + 0.6, y - 6, 1.6, 11);
    ctx.beginPath();
    ctx.moveTo(x + 2.2, y - 6);
    ctx.lineTo(x + 6.5, y - 0.5);
    ctx.lineTo(x + 2.2, y - 2.5);
    ctx.fill();
  }

  function drawBomb(bo) {
    const f = Math.floor(bo.t * 10) % 2 ? 1 : -1;
    ctx.strokeStyle = BOMB;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bo.x, bo.y - 10);
    ctx.lineTo(bo.x + 3 * f, bo.y - 6);
    ctx.lineTo(bo.x - 3 * f, bo.y - 2);
    ctx.lineTo(bo.x, bo.y + 2);
    ctx.stroke();
  }

  function setFont(size) { ctx.font = size + 'px ' + FONT; }

  function drawPrompt() {
    const g = game;
    ctx.fillStyle = '#120b2e';
    ctx.fillRect(0, 0, W, TOP_BAND);
    ctx.fillStyle = '#2a2152';
    ctx.fillRect(0, TOP_BAND - 3, W, 3);
    ctx.fillStyle = GOLD;
    ctx.fillRect(0, TOP_BAND - 3, W * Math.min(1, g.britten ? brittenProgress() : g.hits / g.hitsNeeded), 3);

    const y = (TOP_BAND - 3) / 2;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    if (g.britten) { // battle clock in the top-left corner
      setFont(8);
      ctx.fillStyle = DIM;
      ctx.fillText('Time ' + clockText(g.britten.finalTime ?? g.britten.time), 10, y + 1);
    }
    const t = g.target;
    if (!t) {
      setFont(10);
      ctx.fillStyle = DIM;
      ctx.textAlign = 'center';
      ctx.fillText(state === 'wavebreak' ? 'Get ready...' : '', W / 2, y);
      return;
    }
    const segs = [];
    if (t.type === 'britten') {
      segs.push({ text: 'Blast', size: 8, color: DIM });
      segs.push({ text: 'Benjamin Britten!', size: 14, color: '#c9d1e8' });
    } else if (t.type === 'bonus') {
      segs.push({ text: 'Blast the', size: 8, color: DIM });
      segs.push({ text: t.inst.name, size: 14, color: t.inst === REST ? REST_COLOR : t.inst === FERMATA ? FERMATA_COLOR : GOLD });
      segs.push({ img: t.inst.sprite });
    } else if (t.type === 'inst') {
      segs.push({ text: 'Blast the', size: 8, color: DIM });
      segs.push({ text: t.inst.name, size: 14, color: LEVELS[difficulty].colorClue ? colorOf(t.inst) : INK });
      if (LEVELS[difficulty].pictureClue) segs.push({ img: t.inst.sprite });
    } else {
      segs.push({ text: 'Blast any', size: 8, color: DIM });
      segs.push({ text: FAMILIES[t.family].label, size: 14, color: FAMILIES[t.family].color });
      segs.push({ text: 'instrument', size: 8, color: DIM });
    }
    const GAP = 10, IMG = 34;
    let total = 0;
    for (const s of segs) {
      if (s.img) s.w = IMG;
      else { setFont(s.size); s.w = ctx.measureText(s.text).width; }
      total += s.w;
    }
    total += GAP * (segs.length - 1);
    let x = (W - total) / 2;
    for (const s of segs) {
      if (s.img) ctx.drawImage(s.img, x, y - IMG / 2, IMG, IMG);
      else { setFont(s.size); ctx.fillStyle = s.color; ctx.fillText(s.text, x, y + 1); }
      x += s.w + GAP;
    }
  }

  function drawHud() {
    const g = game;
    const y = (GROUND_Y + H) / 2 + 1;
    ctx.fillStyle = '#3d3270';
    ctx.fillRect(0, GROUND_Y, W, 2);
    setFont(8);
    ctx.textBaseline = 'middle';
    ctx.fillStyle = INK;
    ctx.textAlign = 'left';
    ctx.fillText('Score ' + g.score, 10, y);
    // Power-up countdowns: first one left of the wave label, second one to its right
    const timers = [];
    if (g.restT > 0) timers.push([REST, g.restT, REST_SECONDS, REST_COLOR]);
    if (g.holdT > 0) timers.push([FERMATA, g.holdT, FERMATA_SECONDS, FERMATA_COLOR]);
    timers.forEach(([item, left, total, color], i) => {
      const x0 = i === 0 ? 132 : 400, barW = 56;
      if (item.sprite) ctx.drawImage(item.sprite, x0 - 9, y - 9, 18, 18);
      ctx.fillStyle = '#2a2152';
      ctx.fillRect(x0 + 6, y - 3, barW, 6);
      ctx.fillStyle = color;
      ctx.fillRect(x0 + 6, y - 3, barW * left / total, 6);
      ctx.fillText(Math.ceil(left) + 's', x0 + barW + 12, y);
    });
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.fillStyle = DIM;
    if (g.britten) drawBrittenHealth(y);
    else ctx.fillText('Wave ' + g.wave, W / 2, y);
    for (let i = 0; i < g.lives; i++) drawConductor(W - 12 - i * 13, H - 3, 0.3, 1, false);
  }

  function render() {
    ctx.drawImage(bg, 0, game ? game.starY : 0, W, H);
    ctx.drawImage(bg, 0, (game ? game.starY : 0) - H, W, H);
    if (!game) return;
    const g = game;

    // Invaders (two-frame bob, like the arcade)
    const bob = (g.marchNote % 2) * 2;
    for (const v of g.invaders) {
      if (!v.alive) continue;
      if (v.inst.bonus) drawGlow(invX(v), invY(v) + bob, g.time, v.inst.color);
      ctx.drawImage(v.inst.sprite, invX(v) - SPR / 2, invY(v) - SPR / 2 + bob, SPR, SPR);
    }

    for (const bo of g.bombs) drawBomb(bo);
    if (g.bullet) drawNote(g.bullet.x, g.bullet.y);

    if (g.britten) drawBritten();
    if (state !== 'dying' && state !== 'over') {
      const blink = g.player.invuln > 0 && Math.floor(g.player.invuln * 10) % 2 === 0;
      drawConductor(g.player.x, FEET_Y, 1, blink ? 0.25 : 1, g.player.cue > 0);
    }

    for (const p of g.particles) {
      ctx.globalAlpha = clamp(p.life * 2, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    // Centered message stack, with a dark outline for readability
    const placed = [];
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(7, 4, 24, 0.9)';
    for (const m of g.messages) {
      setFont(m.size);
      const w = ctx.measureText(m.text).width;
      placed.push({ x: W / 2 - w / 2 - 3, y: m.y - m.size / 2 - 3, w: w + 6, h: m.size + 6 });
      ctx.globalAlpha = clamp(m.life / m.fade, 0, 1);
      ctx.strokeText(m.text, W / 2, m.y);
      ctx.fillStyle = m.color;
      ctx.fillText(m.text, W / 2, m.y);
    }
    // Small score pop-ups at the hit spot, nudged upward if they would touch other text
    const hits = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    for (const t of g.texts) {
      setFont(t.size);
      const w = ctx.measureText(t.text).width;
      const tx = clamp(t.x, w / 2 + 6, W - w / 2 - 6);
      t.dy = t.dy || 0;
      let box = { x: tx - w / 2 - 2, y: t.y + t.dy - t.size / 2 - 2, w: w + 4, h: t.size + 4 };
      for (let tries = 0; tries < 40 && placed.some(p => hits(box, p)); tries++) {
        t.dy -= 3;
        box.y -= 3;
      }
      placed.push(box);
      ctx.globalAlpha = clamp(t.life / t.max * 2, 0, 1);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, tx, t.y + t.dy);
    }
    ctx.globalAlpha = 1;

    drawPrompt();
    drawHud();
  }

  /* ===== Screens ===== */

  function setScreen(name) {
    for (const k in screens) screens[k].classList.toggle('show', k === name);
  }

  function showTitle() {
    musicStop();
    music.paused = false;
    state = 'title';
    game = null;
    renderScores();
    setScreen('title');
    needsRender = true;
    const btn = screens.title.querySelector('[data-diff="' + difficulty + '"]');
    if (btn) btn.focus({ preventScroll: true });
    refreshBoard().then(() => { if (state === 'title') renderScores(); });
  }

  function pause() {
    if (state !== 'playing' && state !== 'wavebreak') return;
    pausedFrom = state;
    state = 'paused';
    musicPause();
    keys.left = keys.right = false;
    pendingFire = false;
    setScreen('pause');
    $('resume').focus({ preventScroll: true });
  }
  function resume() {
    if (state !== 'paused') return;
    initAudio();
    state = pausedFrom;
    musicResume();
    setScreen(null);
    last = performance.now();
    stage.focus({ preventScroll: true });
  }

  function qualifies(score) {
    const list = shownScores();
    return score > 0 && (list.length < 5 || score > list[list.length - 1].score);
  }
  function showList() {
    $('hs').classList.remove('show');
    $('over-list').style.display = '';
    fillList($('scores-over'), shownScores());
    $('again').focus({ preventScroll: true });
  }
  function showOver() {
    state = 'over';
    $('final-score').textContent = game.score;
    $('over-title').textContent = game.britten && game.britten.phase === 'won' ? 'Victory!' : 'Game over';
    const winNote = game.britten && game.britten.phase === 'won'
      ? 'You defeated Benjamin Britten in ' + clockText(game.britten.finalTime) + '!' : '';
    $('over-list-title').textContent = 'Top 5';
    $('hs').classList.remove('show');
    $('over-list').style.display = 'none';
    $('over-note').textContent = LEADERBOARD_URL ? 'Checking the leaderboard...' : '';
    setScreen('over');
    needsRender = true;
    $('again').focus({ preventScroll: true });
    refreshBoard().then(() => {
      if (state !== 'over') return;
      $('over-note').textContent = winNote;
      if (game.testStart) {
        $('over-note').textContent = 'Test game (started past wave 1). Score not saved.';
        showList();
      } else if (game.britten) {
        showList(); // Britten Battle scores aren't saved
      } else if (qualifies(game.score)) {
        $('hs').classList.add('show');
        $('initials').value = '';
        $('initials').focus({ preventScroll: true });
      } else {
        showList();
      }
    });
  }

  const NOT_ALLOWED = "Those initials aren't allowed. Try different ones.";
  let saving = false;
  function rejectInitials(msg) {
    $('over-note').textContent = msg;
    $('initials').value = '';
    $('initials').focus({ preventScroll: true });
  }
  function saveScore() {
    if (saving || !game) return;
    const name = $('initials').value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3);
    if (!name) { rejectInitials('Type 1 to 3 letters.'); return; }
    if (isBlocked(name)) { rejectInitials(NOT_ALLOWED); return; }
    const entry = { name, score: game.score, level: difficulty };

    if (!LEADERBOARD_URL) {
      saveLocal(entry);
      $('over-note').textContent = '';
      showList();
      return;
    }

    const offline = err => {
      console.warn('Leaderboard save failed:', err);
      saveLocal(entry);
      boardScores = null;
      $('over-note').textContent = err && err.name === 'AbortError'
        ? 'The leaderboard is slow right now. Your score may still show up there soon.'
        : "Couldn't reach the class leaderboard. Saved on this device.";
      showList();
    };
    saving = true;
    $('save').disabled = true;
    $('over-note').textContent = 'Saving... this can take a few seconds.';
    fetchJSON(LEADERBOARD_URL, { method: 'POST', body: JSON.stringify(entry) }, 30000)
      .then(d => {
        if (d && d.ok) { applyBoards(d); $('over-note').textContent = 'Saved!'; showList(); }
        else if (d && (d.error === 'blocked' || d.error === 'name')) rejectInitials(NOT_ALLOWED);
        else offline(d);
      })
      .catch(offline)
      .finally(() => { saving = false; $('save').disabled = false; });
  }

  /* ===== Input ===== */

  window.addEventListener('keydown', e => {
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT') {
      if (e.key === 'Enter' && e.target.id === 'initials') { e.preventDefault(); saveScore(); }
      return;
    }
    const k = e.key;
    if (k === 'p' || k === 'P' || k === 'Escape') {
      if (state === 'playing' || state === 'wavebreak') { e.preventDefault(); pause(); }
      else if (state === 'paused') { e.preventDefault(); resume(); }
      return;
    }
    if (k === 'm' || k === 'M') { toggleMute(); return; }
    if (state !== 'playing' && state !== 'wavebreak') return;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; pointerX = null; pendingFire = false; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; pointerX = null; pendingFire = false; e.preventDefault(); }
    else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); if (!e.repeat) { pointerX = null; fire(); } }
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });

  function logicalX(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) / r.width * W;
  }
  canvas.addEventListener('pointerdown', e => {
    if (state === 'paused') { resume(); return; }
    if (state !== 'playing') return;
    e.preventDefault();
    stage.focus({ preventScroll: true });
    pointerX = logicalX(e);
    pendingFire = true; // fires once the ship slides under the click
  });
  canvas.addEventListener('pointermove', e => {
    if (state !== 'playing' && state !== 'wavebreak') return;
    if (e.pointerType === 'mouse' || e.buttons) pointerX = logicalX(e);
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', pause);

  screens.title.querySelectorAll('[data-diff]').forEach(btn => {
    btn.addEventListener('click', () => newGame(btn.dataset.diff));
  });
  $('resume').addEventListener('click', resume);
  $('quit').addEventListener('click', showTitle);
  $('again').addEventListener('click', () => newGame(difficulty));
  $('menu').addEventListener('click', showTitle);
  $('save').addEventListener('click', saveScore);
  $('initials').addEventListener('input', e => {
    const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3);
    if (v !== e.target.value) e.target.value = v;
  });
  // Pause button: only shown during a game, and switches to Resume while paused
  const pauseBtn = $('pause-btn');
  let pauseBtnState = '';
  function updatePauseBtn() {
    const show = state === 'playing' || state === 'wavebreak' || state === 'paused';
    const label = state === 'paused' ? 'Resume' : 'Pause';
    const key = show + label;
    if (key === pauseBtnState) return;
    pauseBtnState = key;
    pauseBtn.hidden = !show;
    pauseBtn.textContent = label;
  }
  pauseBtn.addEventListener('click', () => {
    if (state === 'paused') resume();
    else pause();
  });

  $('mute').addEventListener('click', () => {
    toggleMute();
    if (state === 'playing' || state === 'wavebreak') stage.focus({ preventScroll: true });
  });

  const fsBtn = $('fs');
  if (document.fullscreenEnabled) {
    fsBtn.hidden = false;
    fsBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else stage.requestFullscreen().catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
      if (state === 'playing' || state === 'wavebreak') stage.focus({ preventScroll: true });
    });
  }

  /* ===== Main loop ===== */

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    updatePauseBtn();
    musicSchedule();
    if (state === 'playing' || state === 'wavebreak') {
      update(dt);
      render();
    } else if (state === 'dying') {
      updateEffects(dt);
      render();
      game.dieTimer -= dt;
      if (game.dieTimer <= 0) showOver();
    } else if (needsRender && bg) {
      render();
      needsRender = false;
    }
    requestAnimationFrame(frame);
  }

  /* ===== Start up ===== */

  function buildLogo() {
    const colors = ['#ff6b7a', '#5ee08a', '#ffcc3d', '#b48cff'];
    const logo = $('logo');
    let n = 0;
    for (const word of ['INSTRUMENT', 'INVADERS']) {
      const line = document.createElement('span');
      line.className = 'line';
      line.setAttribute('aria-hidden', 'true');
      for (const ch of word) {
        const s = document.createElement('span');
        s.textContent = ch;
        s.style.color = colors[n++ % colors.length];
        line.appendChild(s);
      }
      logo.appendChild(line);
    }
  }

  buildLogo();
  // '1' = unlocked, '0' = locked from the admin box (stays locked even with old high scores)
  const brittenFlag = storeGet(BRITTEN_UNLOCK_KEY);
  if (brittenFlag === '1' || (brittenFlag !== '0' && localScores.some(e => e.score >= BRITTEN_UNLOCK_SCORE))) unlockBritten(false);
  // Hidden test mode: double-click the title, then type "test" + Enter
  if (TEST_WAVE_PICKER) {
    const unlock = $('unlock');
    $('logo').addEventListener('dblclick', () => {
      if (state !== 'title') return;
      unlock.hidden = false;
      unlock.value = '';
      unlock.focus({ preventScroll: true });
    });
    unlock.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const code = unlock.value.trim().toLowerCase();
        if (code === 'test') {              // toggles the "start at wave" box
          const show = $('test-wave').hidden;
          $('test-wave').hidden = !show;
          adminNote(show ? 'Test mode on' : 'Test mode off');
        } else if (code === 'britten') {    // toggles Britten Battle on this device
          if (brittenUnlocked) { relockBritten(); adminNote('Britten Battle locked'); }
          else { unlockBritten(true); adminNote('Britten Battle unlocked'); }
        }
        unlock.value = '';
        unlock.hidden = true;
      } else if (e.key === 'Escape') {
        unlock.value = '';
        unlock.hidden = true;
      }
    });
    unlock.addEventListener('blur', () => { unlock.value = ''; unlock.hidden = true; });
  }
  updateMuteLabel();
  renderScores();
  new ResizeObserver(resize).observe(stage);
  resize();
  requestAnimationFrame(frame);

  const fontReady = document.fonts
    ? Promise.race([document.fonts.load('16px "Press Start 2P"'), new Promise(r => setTimeout(r, 2500))]).catch(() => {})
    : Promise.resolve();

  // Wait until the built-in images at the end of the file have been read
  function startLoading() {
    Promise.all([loadSprites(), fontReady]).then(() => {
      screens.title.querySelectorAll('[data-diff]').forEach(b => { b.disabled = b.dataset.diff === 'britten' && !brittenUnlocked; });
      showTitle();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startLoading);
  else startLoading();
})();
</script>
