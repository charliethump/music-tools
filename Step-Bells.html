<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step Bells</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%94%3C/text%3E%3C/svg%3E">
<style>
:root{
  --stage:#f3f3f3;
  --stage-ink:#23262d;
  --accent:#a3222a;
  --accent-ink:#ffffff;
  --hl:#ffe9a8;
  --panel:#ffffff;
  --panel-2:#f6f6f7;
  --ink:#23262d;
  --muted:#686c75;
  --line:#d8d9dc;
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --panel:#1f2126;
    --panel-2:#272a30;
    --ink:#eceef2;
    --muted:#a3a7b0;
    --line:#3a3d44;
    --accent:#c4333b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ink);background:var(--stage);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#stageWrap{flex:1 1 auto;min-height:0;background:var(--stage);position:relative}
#fsBtn{position:absolute;top:14px;right:16px;z-index:5;background:rgba(255,255,255,.85);color:#23262d;border-color:#cfd0d3;backdrop-filter:blur(4px)}
#fsBtn:hover{background:#fff}
#stage{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#notation{flex:0 0 auto;height:clamp(110px,25vh,270px);background:var(--stage);padding:0 2vw 1vh;display:flex;gap:3vw}
#notation[hidden]{display:none}
#notation .nbox{flex:1 1 0;min-width:0;height:100%;display:flex}
#notation svg{width:100%;height:100%;display:block}
body.duet #notation{gap:4vw;padding-top:6px}
body.duet .nbox{background:#ffffff;border:2px solid #d4d5d9;border-radius:18px;padding:6px 10px}
.duetDiv{stroke:#cfd0d4;stroke-width:5;stroke-linecap:round;display:none}
body.duet .duetDiv{display:inline}
.duetOnly{display:none}
body.duet .duetOnly{display:inline-flex;align-items:center}
body.duet select{max-width:180px}
body.duet .restartLabel{display:none}

/* stage */
.bell{cursor:pointer}
.bell polygon,.bell ellipse{stroke:#4a4a4a;stroke-width:1.5}
.bellLetter{display:none;font-family:var(--display);font-weight:800;font-size:44px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#stage.letters .bellLetter{display:block}
.titleText{font-family:var(--display);font-weight:750;font-size:62px;fill:var(--stage-ink)}
.countText{font-family:var(--display);font-weight:850;font-size:160px;fill:var(--accent);text-anchor:middle;dominant-baseline:central;stroke:var(--stage);stroke-width:14px;paint-order:stroke;stroke-linejoin:round}
.mallet,.shadow{pointer-events:none}

/* notation */
.stk{stroke:var(--stage-ink);stroke-width:9;fill:none;stroke-linejoin:miter}
.beam{fill:var(--stage-ink)}
.hl{fill:var(--hl)}
.chip{stroke:rgba(0,0,0,.35);stroke-width:1.5}
.nm{font-family:var(--display);font-weight:800;text-anchor:middle;dominant-baseline:central}
.ball{stroke:#23262d;stroke-width:2.5}
body.ballOn #notation{height:clamp(130px,30vh,320px)}
.fx{pointer-events:none}
.lyr{font-family:var(--display);font-weight:600;font-size:25px;text-anchor:middle;dominant-baseline:central;fill:var(--stage-ink)}

/* control bar */
#bar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:8px}
.grp.right{margin-left:auto}
button,select,input{font:inherit;color:inherit}
button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
button svg{width:18px;height:18px;fill:currentColor}
#playBtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:104px;font-weight:650}
select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);padding:0 10px;max-width:260px}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
#tempo{width:170px;accent-color:var(--accent)}
#tempoOut{min-width:66px;font-variant-numeric:tabular-nums;color:var(--muted)}

/* display panel */
#displayPanel{position:fixed;right:16px;bottom:72px;z-index:20;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:grid;gap:10px}
#displayPanel[hidden]{display:none}
#displayPanel h2{font-size:15px;margin:0 0 2px;font-weight:650}
#displayPanel .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
#displayPanel select{height:34px}
body:not(.duet) #displayPanel .duetRow{display:none}
#displayPanel hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}

/* editor */
#editor{position:fixed;inset:0;z-index:30;background:var(--panel);display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;overflow:hidden}
#editor[hidden]{display:none}
#edHead{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
#edHead h1{font-family:var(--display);font-size:22px;margin:0;font-weight:750}
#edStatus{color:var(--muted);font-size:14px;margin-left:auto}
#edSide{border-right:1px solid var(--line);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
#edList{display:flex;flex-direction:column;gap:4px}
.edSong{justify-content:flex-start;height:auto;min-height:38px;padding:7px 10px;text-align:left;white-space:normal;background:transparent;border-color:transparent}
.edSong.on{background:var(--panel);border-color:var(--accent);font-weight:650}
.sideBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sideBtns button{height:34px;padding:0 8px;justify-content:center;font-size:14px}
#edMain{overflow:auto;padding:0 20px 30px;display:flex;flex-direction:column;gap:16px}
#edMain>*{flex-shrink:0}
.fields{padding-top:16px}
.fields{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.fields label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.fields input{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);padding:0 10px;color:var(--ink)}
#edTitle{width:340px}
#edTempo,#edPer{width:90px}
.inputRow{position:sticky;top:0;z-index:2;box-shadow:0 6px 12px -8px rgba(0,0,0,.25);display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;height:44px;font-size:17px;font-weight:650;background:var(--panel)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#restBtn{height:44px;font-size:17px;font-weight:650}
#palette{display:flex;gap:6px}
.pal{width:52px;height:52px;padding:0;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;border:1.5px solid rgba(0,0,0,.4);border-radius:8px}
.pal.oval{border-radius:50%}
#edHint{color:var(--muted);font-size:14px;flex-basis:100%}
.seqTools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seqTools button{height:36px}
#edSelInfo{color:var(--muted);font-size:14px}
#edSeq{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--stage);color:var(--stage-ink);min-height:120px}
#edSeq .br{flex-basis:100%;height:6px;border-bottom:1px dashed #c4c4c4;margin-bottom:6px}
.card{position:relative;width:96px;border:2px solid transparent;border-radius:12px;background:#fff;padding:4px 4px 6px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(163,34,42,.18)}
.card svg{width:100%;height:auto;display:block}
.card .num{position:absolute;top:3px;left:6px;font-size:11px;color:#8a8d94}
.lyrs{display:flex;gap:3px}
.lyrs input{flex:1;min-width:0;height:26px;border:1px solid #d3d3d3;border-radius:6px;padding:0 4px;font-size:13px;text-align:center;background:#fafafa;color:#23262d}
.caret{width:6px;border-radius:3px;background:var(--accent);align-self:stretch;min-height:100px}
.empty{color:#7a7d84;margin:auto 8px}
.keys{color:var(--muted);font-size:13px}
.save{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
.save .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}

/* code modal */
#codeModal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
#codeModal[hidden]{display:none}
#codeBox{background:var(--panel);border-radius:14px;padding:18px;width:min(760px,100%);display:grid;gap:10px}
#codeBox p{margin:0;line-height:1.45}
#codeText{width:100%;height:46vh;font:13px/1.4 Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel-2);color:var(--ink)}
#codeBox .btns{display:flex;gap:8px;justify-content:flex-end}

@media (max-width:760px){
  #editor{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  #edHead{grid-column:1}
  #edSide{max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}
  #edTitle{width:100%}
}
</style>
</head>

  $("#edLeft").disabled = !has || ed.sel === 0;
  $("#edRight").disabled = !has || ed.sel >= n - 1;
  $("#edSelInfo").textContent = ed.sel === null ? "New beats go at the end."
    : ed.sel < 0 ? "New beats go at the start." : `Beat ${ed.sel + 1} selected. New beats go after it.`;
  const c = $("#edSeq .caret"); if (c) c.scrollIntoView({block:"nearest"});
}
function insertBeat(beat) {
  const s = S();
  const pos = ed.sel === null ? s.beats.length : ed.sel + 1;
  s.beats.splice(pos, 0, beat);
  ed.sel = pos;
  markDirty(); renderSeq();
}
function palette(i) {
  ensureAudio(); strike(i, ac.currentTime + 0.01);
  const k = KEYS[i];
  if (ed.mode === "du") insertBeat({n:[k]});
  else if (!ed.pending) { ed.pending = k; renderMode(); }
  else { insertBeat({n:[ed.pending, k]}); ed.pending = null; renderMode(); }
}
function addRest() { ed.pending = null; renderMode(); insertBeat({n:[]}); }
function delBeat() {
  const s = S();
  if (ed.sel === null || ed.sel < 0) return;
  s.beats.splice(ed.sel, 1);
  ed.sel = ed.sel - 1;
  if (ed.sel < 0) ed.sel = s.beats.length ? -1 : null;
  markDirty(); renderSeq();
}
function moveBeat(d) {
  const s = S(), k = ed.sel, j = k + d;
  if (k === null || k < 0 || j < 0 || j >= s.beats.length) return;
  [s.beats[k], s.beats[j]] = [s.beats[j], s.beats[k]];
  ed.sel = j; markDirty(); renderSeq();
}
function editorKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-8]$/.test(e.key)) { e.preventDefault(); palette(+e.key - 1); }
  else if (e.key === "s" || e.key === "S") { e.preventDefault(); addRest(); }
  else if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); delBeat(); }
}

$("#editBtn").addEventListener("click", openEditor);
$("#edDone").addEventListener("click", closeEditor);
$("#modeDu").addEventListener("click", () => { ed.mode = "du"; ed.pending = null; renderMode(); });
$("#modeDude").addEventListener("click", () => { ed.mode = "dude"; ed.pending = null; renderMode(); });
$("#restBtn").addEventListener("click", addRest);
$("#edRemove").addEventListener("click", delBeat);
$("#edLeft").addEventListener("click", () => moveBeat(-1));
$("#edRight").addEventListener("click", () => moveBeat(1));
$("#edSeq").addEventListener("click", e => {
  if (e.target.tagName === "INPUT") return;
  const c = e.target.closest(".card"); if (!c) return;
  const k = +c.dataset.k;
  ed.sel = ed.sel === k ? null : k;
  renderSeq();
});
$("#edSeq").addEventListener("input", e => {
  const t = e.target; if (t.tagName !== "INPUT") return;
  const b = S().beats[+t.dataset.k];
  if (!b.l) b.l = b.n.map(() => "");
  b.l[+t.dataset.j] = t.value;
  if (!b.l.some(x => x)) delete b.l;
  markDirty();
});
$("#edTitle").addEventListener("input", e => { S().title = e.target.value; markDirty(); renderSongList(); });
$("#edTempo").addEventListener("change", e => { S().tempo = clamp(Math.round(+e.target.value || 100), 40, 200); e.target.value = S().tempo; markDirty(); });
$("#edPer").addEventListener("change", e => { S().perLine = clamp(Math.round(+e.target.value || 8), 1, 16); e.target.value = S().perLine; markDirty(); renderSeq(); });
$("#edList").addEventListener("click", e => {
  const b = e.target.closest(".edSong"); if (!b) return;
  ed.song = +b.dataset.i; ed.sel = null; ed.pending = null; renderEditor();
});
$("#edNew").addEventListener("click", () => {
  songs.push(blankSong()); ed.song = songs.length - 1; ed.sel = null; markDirty(); renderEditor();
  $("#edTitle").select();
});
$("#edDup").addEventListener("click", () => {
  const c = JSON.parse(JSON.stringify(S())); c.title += " copy";
  songs.splice(ed.song + 1, 0, c); ed.song++; ed.sel = null; markDirty(); renderEditor();
});
$("#edDel").addEventListener("click", () => {
  if (!confirm(`Delete "${S().title}"?`)) return;
  songs.splice(ed.song, 1);
  if (!songs.length) songs.push(blankSong());
  ed.song = Math.min(ed.song, songs.length - 1); ed.sel = null; markDirty(); renderEditor();
});
function moveSong(d) {
  const j = ed.song + d; if (j < 0 || j >= songs.length) return;
  [songs[ed.song], songs[j]] = [songs[j], songs[ed.song]]; ed.song = j; markDirty(); renderSongList();
}
$("#edUp").addEventListener("click", () => moveSong(-1));
$("#edDown").addEventListener("click", () => moveSong(1));

/* ---------- saving ---------- */
function serialize() {
  const J = x => JSON.stringify(x).replace(/</g, "\\u003c");
  return "[\n" + songs.map(s => {
    const beats = s.beats.map(b => { const o = {n:b.n}; if (b.l && b.l.some(x => x)) o.l = b.l; return "      " + J(o); }).join(",\n");
    return `  {\n    "title": ${J(s.title)},\n    "tempo": ${s.tempo},\n    "perLine": ${s.perLine},\n    "beats": [\n${beats}\n    ]\n  }`;
  }).join(",\n") + "\n]";
}
const DATA_RE = /(<script type="application\/json" id="song-data">)[\s\S]*?(<\/script>)/;
async function downloadFile() {
  const json = serialize();
  const src = PRISTINE;
  if (!DATA_RE.test(src)) { showCode(json, "The file couldn't be rebuilt automatically. Copy this code, open Step-Bells.html in a text editor and replace everything between the song-data script tags."); return; }
  const out = src.replace(DATA_RE, (m, a, b) => a + "\n" + json + "\n" + b);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type:"text/html"}));
  a.download = "Step-Bells.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  dirty = false;
  $("#edStatus").textContent = "Downloaded Step-Bells.html. Upload it to your repo to replace the old copy.";
}
function showCode(text, msg) {
  $("#codeMsg").textContent = msg;
  $("#codeText").value = text;
  $("#codeModal").hidden = false;
  $("#codeText").select();
}
$("#edDownload").addEventListener("click", downloadFile);
$("#edCopy").addEventListener("click", () => {
  const json = serialize();
  const msg = "Paste this between the song-data script tags in Step-Bells.html.";
  if (navigator.clipboard) navigator.clipboard.writeText(json).then(() => { $("#edStatus").textContent = "Song code copied. " + msg; }, () => showCode(json, msg));
  else showCode(json, msg);
});
$("#codeCopy").addEventListener("click", () => {
  const t = $("#codeText"); t.select();
  if (navigator.clipboard) navigator.clipboard.writeText(t.value).catch(() => document.execCommand("copy"));
  else document.execCommand("copy");
  $("#codeCopy").textContent = "Copied";
  setTimeout(() => { $("#codeCopy").textContent = "Copy"; }, 1500);
});
$("#codeClose").addEventListener("click", () => { $("#codeModal").hidden = true; });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- start ---------- */
buildSelect(); syncTempoUI(); applyOpts(); updatePlayBtn();
requestAnimationFrame(frame);
})();
</script>
</body>
