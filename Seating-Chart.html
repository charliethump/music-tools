<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating Charts</title>
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.google.com">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='10' fill='%231b2a4a'/%3E%3Cg stroke='%231b2a4a' stroke-width='2'%3E%3Crect x='8' y='8' width='16' height='16' fill='%23c0392b'/%3E%3Crect x='24' y='8' width='16' height='16' fill='%231e7a46'/%3E%3Crect x='40' y='8' width='16' height='16' fill='%23e67e22'/%3E%3Crect x='8' y='24' width='16' height='16' fill='%2385b33f'/%3E%3Crect x='24' y='24' width='16' height='16' fill='%237d3c98'/%3E%3Crect x='40' y='24' width='16' height='16' fill='%232f6fd6'/%3E%3C/g%3E%3Crect x='10' y='44' width='12' height='12' rx='2' fill='%23f2b632'/%3E%3Crect x='26' y='44' width='12' height='12' rx='2' fill='%23f2b632'/%3E%3Crect x='42' y='44' width='12' height='12' rx='2' fill='%23f2b632'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#1b1e24; --bg2:#23272f; --panel:#f6f5f2; --ink:#1d2129; --muted:#6b7280; --line:#d9d6cf;
  --accent:#2f6fd6; --accent2:#e2ecfb; --warn:#b45309; --warnbg:#fef3c7; --bad:#b42318; --badbg:#fde8e7; --ok:#15803d; --okbg:#dcfce7;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#e8eaee;font-family:var(--ui);font-size:14px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#111318;border-bottom:1px solid #2c313a}
#bar .brand{font-weight:700;letter-spacing:.2px;margin-right:6px;white-space:nowrap}
.tb{background:#262b34;color:#e8eaee;border:1px solid #363c47;border-radius:7px;padding:6px 11px;white-space:nowrap}
.tb:hover{background:#2f3540}
.tb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tb.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tb.primary:hover{background:#2a62bf}
.tb:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
#status{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid #3a404b;color:#c8ccd4;white-space:nowrap;cursor:pointer;background:#1b1f26}
#status.ok{border-color:#2f6b45;color:#9fe0b4}
#status.warn{border-color:#8a6116;color:#f6d38b}
#status.bad{border-color:#8f2a22;color:#f4b0aa}
body.viewer .editor-only{display:none!important}
body.viewer [data-act="importRoster"],body.viewer [data-act="slidesImport"],body.viewer [data-act="addClass"],body.viewer [data-act="newYear"],body.viewer [data-act="weekly"],body.viewer [data-act="deleteClass"],body.viewer [data-act="addStudent"]{display:none!important}
#viewBanner{background:#0f766e;color:#fff;text-align:center;font-size:13px;padding:5px;font-weight:600}
body.viewer.vtemp #viewBanner{background:#b45309}
body.viewer #main{top:73px}
body.present #viewBanner{display:none}
textarea.code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1px solid #c7c3ba;border-radius:6px;padding:6px;word-break:break-all}
#demoBanner{background:#7c3aed;color:#fff;text-align:center;font-size:13px;padding:5px;font-weight:600}

/* ---------- layout ---------- */
#main{position:absolute;top:46px;left:0;right:0;bottom:0;display:flex}
body.demo #main{top:73px}
#viewArea{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
#drawer{width:430px;background:var(--panel);color:var(--ink);border-left:1px solid #c9c5bc;display:flex;flex-direction:column;min-height:0}
#drawer .tabs{display:flex;flex-wrap:wrap;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);background:#ecebe6}
#drawer .tabs button{border:1px solid transparent;border-bottom:none;background:none;padding:7px 9px;border-radius:7px 7px 0 0;color:#4b5260;font-size:13px}
#drawer .tabs button.on{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600;margin-bottom:-1px}
#drawer .tabs .x{margin-left:auto;font-size:18px;line-height:1;padding:4px 8px}
#drawerBody{flex:1;overflow:auto;padding:14px}

/* ---------- home ---------- */
#home{flex:1;overflow:auto;padding:22px 26px 40px}
#home h1{font-size:22px;margin:0 0 4px}
#home .sub{color:#a3a9b5;margin-bottom:18px}
.school{margin-bottom:26px}
.school h2{font-size:15px;text-transform:uppercase;letter-spacing:1.2px;color:#9aa3b2;margin:0 0 10px;border-bottom:1px solid #2f343d;padding-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--bg2);border:1px solid #333944;border-radius:11px;overflow:hidden;cursor:pointer;transition:border-color .12s}
.card:hover{border-color:#5a7fc0}
.card .thumb{background:#0f1115;display:flex;justify-content:center}
.card .meta{padding:9px 11px 11px}
.card .t{font-weight:650;font-size:14px;margin-bottom:3px}
.card .d{color:#a3a9b5;font-size:12px;line-height:1.5}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#323844;color:#cfd4dc;margin-right:4px}
.pill.warn{background:#4a3a12;color:#f6d38b}
.pill.now{background:#1d4ed8;color:#fff}
.welcome{max-width:640px;margin:50px auto;background:var(--bg2);border:1px solid #333944;border-radius:14px;padding:26px 28px}
.welcome h1{margin-top:0}
.welcome p{color:#c3c8d1;line-height:1.55}
.welcome .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* ---------- class view ---------- */
#classView{flex:1;display:flex;flex-direction:column;min-height:0}
#classTools{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#171a20;border-bottom:1px solid #2a2f37;flex-wrap:wrap}
#classTools .ct{font-weight:650;width:300px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 4px}
#classTools .fixed-w{min-width:92px;text-align:center}
#classTools .bopT{margin-left:auto;min-width:150px;text-align:center}
#classTools .sep{width:1px;height:22px;background:#333a45;margin:0 4px}
#verBanner{background:var(--warnbg);color:#5b3b05;padding:6px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
#verBanner button{border:1px solid #c9a253;background:#fff8e6;border-radius:6px;padding:3px 9px}
#stageWrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#tray{background:#171a20;border-top:1px solid #2a2f37;padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
#tray .chip{background:#2b313b;border:1px solid #3b4250;color:#e8eaee;border-radius:999px;padding:3px 10px}
#tray .chip.on{background:var(--accent);border-color:var(--accent)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;background:rgba(15,17,21,.85);color:#e8eaee;padding:6px 12px;border-radius:8px;font-size:13px;pointer-events:none;white-space:nowrap}

/* fullscreen / presenting */
body.present #bar, body.present #classTools, body.present #tray, body.present #drawer, body.present #verBanner, body.present #hint{display:none!important}
body.present #main{top:0!important}
body.present #demoBanner{display:none}
body.present{background:#000}
body.present #stageWrap{background:#000}

/* ---------- stage ---------- */
.stage{position:relative;background-size:100% 100%;background-repeat:no-repeat;overflow:hidden;font-family:Arial,Helvetica,sans-serif;user-select:none;flex:none}
.st-title{position:absolute;left:2.1%;top:1.6%;font-weight:700;color:#000;font-size:calc(var(--sw)*0.046);line-height:1.15;white-space:nowrap}
.st-ver,.st-rev{position:absolute;bottom:1.1%;font-weight:700;font-style:italic;font-size:calc(var(--sw)*0.0185)}
.st-ver{left:1.4%}
.st-rev{right:1.4%}
.st-cap{position:absolute;left:8.6%;top:85.3%;font-size:calc(var(--sw)*0.0245);color:#111}
.spot{position:absolute;transform:translate(-50%,-50%);text-align:center;color:#fff;font-weight:700;line-height:1.05;
  text-shadow:0 0 calc(var(--sw)*0.003) rgba(0,0,0,.65),0 0 calc(var(--sw)*0.006) rgba(0,0,0,.35);white-space:nowrap;display:flex;align-items:center;justify-content:center}
.spot .nm{display:block}
.stage.editing .spot{cursor:pointer}
.stage.editing .spot::before{content:"";position:absolute;inset:-14% -6%;border-radius:calc(var(--sw)*0.008);border:1.5px dashed rgba(255,255,255,.55);background:rgba(0,0,0,.12)}
.stage .spot.empty .nm{opacity:.75}
.stage .spot.off{opacity:.55}
.stage .spot.off::before{border-style:dotted;background:rgba(0,0,0,.28)}
.stage .spot.sel::before{border:2.5px solid #ffd54a;background:rgba(255,213,74,.25)}
.stage .spot.pick::before{border:2.5px solid #4ade80;background:rgba(74,222,128,.3)}
.stage .spot.nb::before{border:2.5px solid #60a5fa;background:rgba(96,165,250,.3)}
.stage .spot.hl::before{content:"";position:absolute;inset:-22% -10%;border-radius:calc(var(--sw)*0.01);border:calc(var(--sw)*0.004) solid #ffd54a;background:rgba(255,213,74,.25);display:block}
.stage .badges{position:absolute;top:100%;left:50%;transform:translateX(-50%);display:flex;gap:2px;margin-top:2px;pointer-events:none}
.stage .badge{font-family:var(--ui);font-size:max(9px,calc(var(--sw)*0.0105));font-weight:700;background:#111;color:#ffd54a;border-radius:3px;padding:0 3px;text-shadow:none;line-height:1.35}
.stage .badge.lock{color:#fff;background:#b42318}

/* Bop or Flop */
.bopStage{position:relative;display:flex;background:#cfcfcf;flex:none;overflow:hidden}
.bopPanel{flex:1;min-width:0;display:flex;flex-direction:column;gap:2.2%;padding:2.4% 2.2%;background:linear-gradient(180deg,#1d2230,#151924);font-family:Arial,Helvetica,sans-serif;color:#fff}
.bopVideo{position:relative;width:100%;aspect-ratio:16/9;background:#05070b;border-radius:calc(var(--bh)*0.012);overflow:hidden;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.bopVideo iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#bopPlayer{position:fixed;z-index:5;background:#000;overflow:hidden;border-radius:6px}
#bopPlayer iframe{width:100%;height:100%;border:0;display:block}
.bopCover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;background:radial-gradient(circle at 50% 40%,#2b3550,#0b0e15)}
.bopCover .big{font-weight:800;font-size:calc(var(--bh)*0.052);letter-spacing:.5px}
.bopCover .big .b{color:#4ade80}.bopCover .big .f{color:#f87171}
.bopCover .small{font-size:calc(var(--bh)*0.022);color:#9aa3b2}
.bopCard{background:#f3f3f1;color:#111;border-radius:calc(var(--bh)*0.012);padding:4% 6%;flex:none}
.bopCard .row{display:flex;gap:4%;font-size:calc(var(--bh)*0.03);line-height:1.25;margin:2.2% 0;align-items:baseline}
.bopCard .k{font-weight:700;flex:none;width:36%;text-align:right;color:#333}
.bopCard .v{flex:1;min-width:0}
.bopCard .v.hid{color:#9aa0a6;letter-spacing:2px}
.bopBy{text-align:center}
.bopBy .k{font-weight:700;font-size:calc(var(--bh)*0.032);width:auto;text-align:center;color:#111}
.bopBy .v{font-weight:800;font-size:calc(var(--bh)*0.05);margin-top:1%;min-height:1.2em}
.bopBy .v.hid{color:#9aa0a6}
.bopStep{margin-top:auto;font-size:calc(var(--bh)*0.018);color:#7e8796;text-align:center}
body.present .bopStep{visibility:hidden}

/* ---------- drawer content ---------- */
.dsec{margin-bottom:18px}
.dsec h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:#5b6270;margin:0 0 8px}
.dsec p.note{color:var(--muted);font-size:12.5px;line-height:1.45;margin:6px 0}
.btn{background:#fff;border:1px solid #c7c3ba;border-radius:7px;padding:6px 11px;color:var(--ink)}
.btn:hover{background:#f0eee9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2a62bf}
.btn.danger{color:var(--bad);border-color:#e3b2ad}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.on{background:var(--accent2);border-color:var(--accent);color:#1e4fa3}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.field label{font-size:12px;color:#5b6270;font-weight:600}
.inp{border:1px solid #c7c3ba;border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink);min-width:0}
.inp:focus{outline:2px solid #9cc0f5;outline-offset:0}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:#5b6270;font-weight:600;border-bottom:1px solid var(--line);padding:5px 4px}
table.t td{border-bottom:1px solid #e7e4dd;padding:4px;vertical-align:middle}
table.t input.inp{padding:3px 6px;width:100%}
.msg{padding:8px 10px;border-radius:7px;font-size:13px;line-height:1.4;margin:6px 0}
.msg.warn{background:var(--warnbg);color:#6b4407}
.msg.bad{background:var(--badbg);color:#7a1b13}
.msg.ok{background:var(--okbg);color:#14532d}
.msg.info{background:var(--accent2);color:#1e3a6b}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.zchip{border:1px solid #c7c3ba;border-radius:999px;padding:2px 9px;font-size:12.5px;background:#fff}
.muted{color:var(--muted)}
.small{font-size:12px}
.rule{display:flex;gap:8px;align-items:center;border-bottom:1px solid #e7e4dd;padding:6px 0}
.rule span{flex:1}
.vlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vitem{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:pointer}
.vitem:hover{border-color:var(--accent)}
.vitem .cap{padding:4px 7px;font-size:12px;display:flex;justify-content:space-between}
.vitem.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* ---------- modal ---------- */
#modalBack{position:fixed;inset:0;background:rgba(5,7,10,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal{background:var(--panel);color:var(--ink);border-radius:12px;max-width:960px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modal .mh{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
#modal .mh h2{margin:0;font-size:17px;flex:1}
#modal .mb{padding:16px;overflow:auto}
#modal .mf{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
details.cls{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
details.cls summary{padding:8px 11px;cursor:pointer;font-weight:600}
details.cls .inner{padding:4px 12px 12px}
@media (max-width:900px){#drawer{width:100%;position:absolute;inset:0;z-index:20}}
.rc{display:inline-block;min-width:20px;text-align:center;font-size:12px;font-weight:700;padding:1px 6px;border-radius:999px;background:#e8e1f7;color:#4c2a8a}
.rc.wait{background:var(--warnbg);color:#6b4407;font-weight:600}
.pend{border:1px solid #e9cf8f;background:#fffaf0;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.pend .rule{border-bottom-color:#f1e2bd}
#printArea{display:none}
@media print{
  @page{margin:0.6in}
  html,body{background:#fff!important;color:#000!important;height:auto}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:Arial,Helvetica,sans-serif;color:#000}
  #printArea h1{font-size:20pt;margin:0 0 2pt}
  #printArea .pmeta{font-size:10pt;color:#444;margin-bottom:12pt}
  #printArea table{width:100%;border-collapse:collapse;font-size:11pt}
  #printArea th{text-align:left;border-bottom:1.5pt solid #000;padding:4pt 6pt;font-size:10pt}
  #printArea td{border-bottom:0.5pt solid #999;padding:5pt 6pt}
  #printArea td.n{color:#666;width:22pt}
}
</style>
</head>
<body>
<div id="demoBanner" class="hidden">DEMO MODE - fake names - nothing here is saved. <button class="tb" style="margin-left:8px;padding:2px 9px" data-act="exitDemo">Exit demo</button></div>
<div id="viewBanner" class="hidden"></div>
<div id="bar">
  <span class="brand">Seating Charts</span>
  <button class="tb" data-act="home">Classes</button>
  <button class="tb" data-act="now" title="Jump to the class the schedule says is on now">Now</button>
  <button class="tb" id="autoBtn" data-act="toggleAuto" title="Automatically show the scheduled class">Auto: on</button>
  <span style="width:1px;height:22px;background:#333a45;margin:0 2px"></span>
  <button class="tb" id="undoBtn" data-act="undo" disabled title="Undo (Ctrl+Z / Cmd+Z)"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-3px"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg> Undo</button>
  <button class="tb" id="redoBtn" data-act="redo" disabled title="Redo (Ctrl+Y / Cmd+Shift+Z)"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-3px"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg> Redo</button>
  <span class="spacer"></span>
  <span id="status" data-act="dataMenu">Loading...</span>
  <button class="tb" data-act="dataMenu">Data and settings</button>
  <button class="tb" data-act="present" title="Full screen (F)">Full screen</button>
</div>
<div id="main">
  <div id="viewArea">
    <div id="home"></div>
    <div id="classView" class="hidden">
      <div id="classTools"></div>
      <div id="verBanner" class="hidden"></div>
      <div id="stageWrap"></div>
      <div id="tray" class="hidden"></div>
    </div>
  </div>
  <div id="drawer" class="hidden">
    <div class="tabs" id="drawerTabs"></div>
    <div id="drawerBody"></div>
  </div>
</div>
<div id="modalBack" class="hidden"><div id="modal"><div class="mh"><h2 id="mTitle"></h2><button class="btn sm" data-act="closeModal">Close</button></div><div class="mb" id="mBody"></div><div class="mf" id="mFoot"></div></div></div>
<input type="file" id="fileInput" accept=".json,application/json" class="hidden">
<input type="file" id="csvInput" accept=".csv,text/csv" class="hidden">
<div id="printArea"></div>

<script>
"use strict";
/* =====================================================================
   Seating Charts - standalone classroom seating tool
   All student data stays on this computer: in a JSON data file you pick
   and in this browser's storage. Nothing is sent anywhere.
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 10);
const norm = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
const DAYS = ['', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const DAYS_LONG = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
const GRADE_ORDER = {'5': 0, '4': 1, '3': 2, '2': 3, '1': 4, 'K': 5};
const NAME_FONT = 0.0215;       // name size as a fraction of chart width
const DEFAULT_FACTOR = 2.3;

let DATA = null;          // the live data
let REAL = null;          // real data parked while demo mode is on
let DEMO = false;

const UI = {
  view: 'home', classId: null, viewVersion: null, drawer: null,
  tool: 'none', sel: new Set(), pick: null, nbSpot: null,
  bopView: {}, bopStep: 0, override: null, histStudent: null
};

/* ---------------- browser storage (IndexedDB) ---------------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('seatingCharts', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async del(k) { const db = await this.open(); return new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); }); }
};

/* ---------------- data file ---------------- */
const FILE = {
  supported: 'showOpenFilePicker' in window,
  handle: null, connected: false, needsReconnect: false, dirty: false, saving: false, lastError: '',
  name() { return this.handle ? this.handle.name : ''; },
  async init() {
    try { this.handle = await IDB.get('fileHandle') || null; } catch (e) { this.handle = null; }
    try { this.dirty = !!(await IDB.get('dirty')); } catch (e) {}
    if (!this.handle) return;
    try {
      const p = await this.handle.queryPermission({mode: 'readwrite'});
      if (p === 'granted') await this.afterPermission();
      else this.needsReconnect = true;
    } catch (e) { this.needsReconnect = true; }
  },
  async reconnect() {
    if (!this.handle) return this.openPicker();
    try {
      const p = await this.handle.requestPermission({mode: 'readwrite'});
      if (p !== 'granted') { toast('Permission was not granted, so changes stay in this browser for now.'); return; }
      await this.afterPermission();
      renderAll();
    } catch (e) { toast('Could not reconnect: ' + e.message); }
  },
  async readFile() {
    const f = await this.handle.getFile();
    const txt = await f.text();
    return JSON.parse(txt);
  },
  async afterPermission() {
    this.needsReconnect = false;
    let fileData = null;
    try { fileData = await this.readFile(); } catch (e) { fileData = null; }
    this.connected = true;
    if (fileData && fileData.app === 'seating-chart') {
      if (!DATA) { DATA = upgrade(fileData); await IDB.set('data', DATA); }
      else {
        const fileT = Date.parse(fileData.savedAt || 0), cacheT = Date.parse(DATA.savedAt || 0);
        if (this.dirty && cacheT > fileT) {
          await this.write();      // local edits are newer: push them to the file
        } else if (fileT > cacheT && this.dirty) {
          if (confirm('The data file was changed somewhere else, and this browser also has changes that were never saved to the file.\n\nOK = use the data file (lose this browser\'s unsaved changes)\nCancel = keep this browser\'s version and overwrite the file')) {
            DATA = upgrade(fileData); await IDB.set('data', DATA); this.setDirty(false);
          } else await this.write();
        } else if (fileT >= cacheT) {
          DATA = upgrade(fileData); await IDB.set('data', DATA); this.setDirty(false);
        } else await this.write();
      }
      if (!this.known) this.known = fileData.savedAt || '';
    } else if (DATA) {
      await this.write();
    }
  },
  /* pick up changes Drive synced in from another computer */
  async refresh() {
    if (!this.handle || !this.connected || this.dirty || this.saving || DEMO || !DATA) return;
    if (!$('#modalBack').classList.contains('hidden')) return;
    let f; try { f = await this.readFile(); } catch (e) { return; }
    if (!f || f.app !== 'seating-chart' || !f.savedAt || f.savedAt === this.known || f.savedAt === DATA.savedAt) { if (f && f.savedAt) this.known = f.savedAt; return; }
    if (Date.parse(f.savedAt) < Date.parse(DATA.savedAt || 0)) return;
    DATA = upgrade(f); this.known = f.savedAt; await IDB.set('data', DATA);
    renderAll(); if (UI.drawer && curClass()) renderDrawer();
    toast('Loaded the newest changes from your data file.');
    if (syncOn()) { SYNC.dirty = true; schedulePush(); }
  },
  async openPicker() {
    if (!this.supported) { $('#fileInput').click(); return; }
    try {
      const [h] = await window.showOpenFilePicker({types: [{description: 'Seating chart data', accept: {'application/json': ['.json']}}]});
      const p = await h.requestPermission({mode: 'readwrite'});
      const txt = await (await h.getFile()).text();
      const d = JSON.parse(txt);
      if (d.app !== 'seating-chart') throw new Error('That file is not a seating chart data file.');
      this.handle = h; await IDB.set('fileHandle', h);
      DATA = upgrade(d); await IDB.set('data', DATA); this.known = d.savedAt || '';
      this.connected = p === 'granted'; this.needsReconnect = !this.connected; this.setDirty(false);
      if (this.connected && !d.savedAt) await this.write();
      afterDataLoaded();
    } catch (e) { if (e.name !== 'AbortError') toast('Could not open: ' + e.message); }
  },
  async createNew(seed) {
    if (!this.supported) { DATA = seed; await IDB.set('data', DATA); download(); afterDataLoaded(); return; }
    try {
      const h = await window.showSaveFilePicker({suggestedName: 'seating-data.json', types: [{description: 'Seating chart data', accept: {'application/json': ['.json']}}]});
      this.handle = h; await IDB.set('fileHandle', h);
      DATA = seed; this.connected = true; this.needsReconnect = false;
      await this.write(); await IDB.set('data', DATA);
      afterDataLoaded();
    } catch (e) { if (e.name !== 'AbortError') toast('Could not create the file: ' + e.message); }
  },
  async write() {
    if (!this.handle || !this.connected || DEMO) return;
    this.saving = true; renderStatus();
    try {

/* ---------------- stage rendering ---------------- */
function renderStage(c, version, opts = {}) {
  const L = layoutOf(c);
  const W = opts.width;
  const H = W * L.aspect[1] / L.aspect[0];
  const el = document.createElement('div');
  el.className = 'stage' + (opts.editing ? ' editing' : '');
  el.style.cssText = `--sw:${W}px;width:${W}px;height:${H}px;background-color:#8a8f99;background-image:url("${BG[L.id] || L.bg}")`;
  const names = displayNames(c);
  const assign = version ? version.assign : {};
  const ink = L.footerInk || '#000';
  let html = `<div class="st-title">${esc(c.title)}</div>`;
  const classSpots = new Map(c.spots.map(s => [s.id, s]));
  const nbSet = opts.neighbors || null;
  const list = opts.showAllTemplate ? L.spots : activeSpots(c);
  for (const g of list) {
    const cs = classSpots.get(g.id);
    const on = !!cs;
    const sid = on ? assign[g.id] : null;
    const st = sid ? studentById(c, sid) : null;
    let nm = st ? (names[sid] || '?') : '';

    if (!on) cls += ' off';
    if (on && !st) cls += ' empty';
    if (opts.selected && opts.selected.has(g.id)) cls += ' sel';

    if (nbSet && nbSet.has(g.id)) cls += ' nb';
    if (opts.highlight && opts.highlight === g.id) cls += ' hl';
    if (!st && !opts.editing && !opts.highlight) continue;
    const label = st ? nm : (opts.editing ? (on ? '–' : '+') : '\u00a0');
    const fit = nameFit(label, g.w || 10);
    const fs = `calc(var(--sw) * ${(NAME_FONT * fit.scale).toFixed(5)})`;
    const inner = fit.lines.map(l => `<span class="nm">${esc(l)}</span>`).join('');
    let badges = '';
    if (opts.editing && on) {
      const b = (cs.zones || []).map(z => `<span class="badge">${esc(z)}</span>`).join('') + (cs.lock ? '<span class="badge lock">LOCK</span>' : '');
      if (b) badges = `<span class="badges">${b}</span>`;
    }
    html += `<div class="${cls}" data-spot="${esc(g.id)}" style="left:${g.x}%;top:${g.y}%;min-width:${Math.max(g.w || 8, 5) * .8}%;font-size:${fs};flex-direction:column">${inner}${badges}</div>`;
  }
  if (version) {
    html += `<div class="st-ver" style="color:${ink}">v${version.n}</div><div class="st-rev" style="color:${ink}">Revised ${fmtDate(version.date)}</div>`;

  el.innerHTML = html;
  return el;
}

/* ---- fill song details from a YouTube link ----
   Only the video link, title and artist are sent: to noembed.com (reads the
   video title) and MusicBrainz (an open music database). No student data. */
function cleanSongTitle(t) {
  return String(t)
    .replace(/\s*[\(\[][^\)\]]*(official|video|audio|lyric|visuali[sz]er|remaster|\bhd\b|\b4k\b|\bmv\b|full song|clip)[^\)\]]*[\)\]]/gi, '')

  for (const u of ['https://noembed.com/embed?url=' + encodeURIComponent(watch), 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(watch)]) {
    try { const r = await fetch(u); if (r.ok) { const j = await r.json(); if (j && j.title) { meta = j; break; } } } catch (e) {}
  }
  if (!meta) throw new Error('Could not read the video title. Type the details in by hand.');

  const t = String(meta.title).replace(/[“”"]/g, '');

  out.year = ''; out.country = ''; out.genre = ''; out.found = false;
  try {
    const q = `recording:"${out.song.replace(/"/g, '')}" AND artist:"${out.artist.replace(/"/g, '')}"`;
    const r = await fetch('https://musicbrainz.org/ws/2/recording/?fmt=json&limit=25&query=' + encodeURIComponent(q), {headers: {Accept: 'application/json'}});
    if (r.ok) {
      const j = await r.json();
      const recs = (j.recordings || []).filter(x => (x.score || 0) >= 80);
      const years = recs.map(x => x['first-release-date']).filter(Boolean).map(d => d.slice(0, 4)).sort();
      if (years.length) { out.year = years[0]; out.found = true; }

      if (ac && ac.artist) {
        out.artist = ac.artist.name || ac.name || out.artist;
        await new Promise(res => setTimeout(res, 1100));   // MusicBrainz allows one request per second
        const a = await fetch(`https://musicbrainz.org/ws/2/artist/${ac.artist.id}?fmt=json&inc=genres`, {headers: {Accept: 'application/json'}});
        if (a.ok) {
          const aj = await a.json();
          let country = '';
          try { if (aj.country) country = new Intl.DisplayNames(['en'], {type: 'region'}).of(aj.country); } catch (e) {}
          out.country = country || (aj.area && aj.area.name) || '';

}

/* ---------------- adjacency (for keep-apart rules) ---------------- */
/* "Next to" is counted in rug squares, not screen distance (the rug is drawn in
   perspective, so screen distance is misleading). Every rug square knows its
   color band and row. Each chair is placed on that grid just off the edge of the
   rug square it sits beside, and chairs next to each other in the row also count

const GRIDCACHE = {};

  const pos = {};
  for (const s of rug) pos[s.id] = {b: s.band, r: s.row};

  const cand = {};
  for (const s of rug) for (const [db, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {

        if (pool.length >= open - waiting.length) for (const id of lastRound) if (!rot.guaranteed.has(id)) rot.blocked.add(id);

    }
  }
  const eligible = {};
  for (const id of movers) {
    const must = R.must[id], never = R.never[id] || [];
    eligible[id] = free.filter(s => {
      const zs = zonesOf[s.id];
      if (must && !zs.includes(must)) return false;
      if (never.some(z => zs.includes(z))) return false;
      if (rot) {
        if (rot.blocked.has(id) && zs.includes(rot.zone)) return false;
        if (rot.guaranteed.has(id) && !zs.includes(rot.zone)) return false;
      }
      return true;
    }).map(s => s.id);
    if (!eligible[id].length) {
      const nm = displayNames(c)[id];
      return {error: `${nm} has no spot that fits their rules. Check Edit, Rules.`};
    }
  }
  const idx = {}; spots.forEach((s, i) => idx[s.id] = i);
  const {adj} = adjacency(c, spots);
  const apartOk = (assign) => {
    const where = {}; for (const k in assign) where[assign[k]] = k;
    for (const [a, b] of R.apart) { const sa = where[a], sb = where[b]; if (sa && sb && adj[idx[sa]][idx[sb]]) return false; }
    return true;
  };

    for (let attempt = 0; attempt < 5000; attempt++) {
      const order = shuffleArr(movers.slice()).sort((a, b) => eligible[a].length - eligible[b].length);

        let opts = eligible[id].filter(s => !taken.has(s));
        if (pass === 0 && spotOf[id]) opts = opts.filter(s => s !== spotOf[id]);
        if (!opts.length) { ok = false; break; }

        assign[pickS] = id; taken.add(pickS);
      }
      if (!ok || !apartOk(assign)) continue;
      return {assign, relaxed: pass === 1, rot};
    }
  }
  return {error: 'Could not find an arrangement that meets every rule. Try loosening a keep-apart pair, unlocking a spot, adding spots to a required zone or lowering the neighbor factor in Edit, Settings.'};
}

function doShuffle() {
  const c = curClass(); if (!c) return;
  const res = planShuffle(c);

  const rotBefore = c.rotation ? JSON.parse(JSON.stringify(c.rotation)) : null;
  const v = {n: (cur ? cur.n : 0) + 1, date: todayISO(), assign: res.assign, by: 'shuffle', rotBefore};
  const notes = [];

    const z = res.rot.zone, zs = new Set(activeSpots(c).filter(s => (s.zones || []).includes(z) && !s.lock).map(s => s.id));

    if (res.rot.cycled) {
      c.rotation.served = took.filter(id => !res.rot.guaranteed.has(id));
      notes.push(`Everyone has now had a turn in "${z}". A new round started.`);
    } else {
      c.rotation.served = [...new Set([...(c.rotation.served || []), ...took])];

    c.rotation.lastRound = took;
  }
  if (res.relaxed) notes.push('All rules were met, but a few students kept their previous spot because the rules left no other option.');

}

/* ---------------- schedule ---------------- */
function allSlots() {
  const out = [];
  for (const c of DATA.classes) for (const s of c.schedule) out.push({c, day: s.day, s: toMin(s.start), e: toMin(s.end)});
  return out.sort((a, b) => a.day - b.day || a.s - b.s);
}
function autoSlot(now = new Date()) {
  const slots = allSlots(); if (!slots.length) return null;
  const flip = DATA.settings.flipMinutes ?? 5;
  const day = now.getDay(), m = now.getHours() * 60 + now.getMinutes();
  if (day >= 1 && day <= 5) {
    const today = slots.filter(x => x.day === day);
    let cand = null;
    for (const x of today) if (x.s - flip <= m) cand = x;
    const next = today.find(x => x.s - flip > m);
    if (cand && (m < cand.e || next)) return cand;   // during class, or in a gap before the next flip
    if (!cand && next) return next;                    // before the first class of the day
  }
  // after school or weekend: next school day's first class
  for (let k = 1; k <= 7; k++) {
    const d = ((day + k - 1) % 7) + 1; const dd = d === 7 ? 0 : d;
    const f = slots.find(x => x.day === dd);
    if (f) return f;
  }
  return slots[0];
}
function nextFlip(now = new Date()) {
  // the next moment the automatic choice could change
  const slots = allSlots(); const flip = DATA.settings.flipMinutes ?? 5;
  const day = now.getDay(), m = now.getHours() * 60 + now.getMinutes();
  const pts = [];
  for (const x of slots) if (x.day === day) { pts.push(x.s - flip); pts.push(x.e); }
  const fut = pts.filter(p => p > m).sort((a, b) => a - b);
  const d = new Date(now);
  if (fut.length) { d.setHours(0, fut[0], 0, 0); return d; }
  d.setDate(d.getDate() + 1); d.setHours(0, 0, 0, 0); return d;
}
function stepClass(dir) {
  const slots = allSlots(); if (!slots.length) return;
  const c = curClass();
  let i = -1;
  if (c) {
    const mine = slots.map((x, k) => [x, k]).filter(([x]) => x.c === c);
    if (mine.length) {
      // pick the slot of this class closest to the current time in the week
      const now = new Date(); const wm = now.getDay() * 1440 + now.getHours() * 60 + now.getMinutes();
      const auto = autoSlot();
      const hit = mine.find(([x]) => auto && x === auto) || mine.reduce((best, cur) => {
        const d = Math.abs(cur[0].day * 1440 + cur[0].s - wm); return !best || d < best.d ? {d, v: cur} : best;
      }, null).v;
      i = hit[1];
    }
  }
  const n = slots.length;
  const j = i < 0 ? 0 : (i + dir + n) % n;
  openClass(slots[j].c.id, {manual: true});
}
function tick() {
  if (!DATA) return;
  if (UI.override && Date.now() >= UI.override) UI.override = null;
  if (!DATA.settings.autoSchedule || UI.override || UI.view !== 'class' || UI.drawer || UI.tool !== 'none') return;

      <td><input class="inp" data-act="stuField" data-f="preferred" data-id="${s.id}" value="${esc(s.preferred)}" placeholder="${esc(names[s.id])}"></td>

      <td><button class="btn sm" data-act="stuActive" data-id="${s.id}">${s.active ? 'Left' : 'Back'}</button></td></tr>`;

    <table class="t"><thead><tr><th>Aspen name</th><th>Preferred name</th><th>Rules</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">No students yet. Import an Aspen roster.</td></tr>'}</tbody></table>
    ${nw ? `<div class="msg warn" style="margin-top:8px">Rules from earlier years are waiting for your OK. <button class="btn sm" data-act="tab" data-tab="rules">Review them</button></div>` : ''}
    <p class="note">Leave Preferred blank to use the automatic name (shown faintly): first name, plus a last initial or last name only when two students in this class would look the same. A preferred name follows the student to next year.</p>

    <p class="note">"Left" keeps the student's history but takes them off the chart. To pin a student to one spot, lock that spot in Edit, Spots.</p></div>`;
}
function printRoster(c) {

    <table><thead><tr><th></th><th>Aspen name</th><th>Preferred name</th><th>On the chart</th>${incl ? '<th>Rules</th>' : ''}</tr></thead><tbody>
    ${list.map((s, i) => `<tr><td class="n">${i + 1}</td><td>${esc(aspenNameOf(s) || (s.last ? `${s.last}, ${s.first}` : s.first))}</td><td>${esc(s.preferred)}</td><td>${esc(names[s.id])}</td>${incl ? `<td>${ruleCount(c, s.id) || ''}</td>` : ''}</tr>`).join('')}</tbody></table>`;
  window.print();
}

function drSpots(c) {
  const sp = activeSpots(c);
  const zones = {}; for (const s of sp) for (const z of (s.zones || [])) zones[z] = (zones[z] || 0) + 1;
  const locked = sp.filter(s => s.lock).length;
  const selN = UI.sel.size;
  const {adj} = adjacency(c, sp);
  const avg = sp.length ? (adj.flat().filter(Boolean).length / sp.length).toFixed(1) : 0;
  const st = activeStudents(c).length;
  return `<div class="dsec"><h3>Spots for this class</h3>
    <div class="row" style="margin-bottom:8px">
      <button class="btn ${UI.tool === 'spots' ? 'on' : ''}" data-act="setTool" data-tool="spots">Turn spots on or off</button>
      <button class="btn ${UI.tool === 'zones' ? 'on' : ''}" data-act="setTool" data-tool="zones">Select for zones and locks</button>
      <button class="btn ${UI.tool === 'neighbors' ? 'on' : ''}" data-act="setTool" data-tool="neighbors">Show neighbors</button>
    </div>
    <div class="msg ${sp.length < st ? 'bad' : 'info'}">${sp.length} spots on, ${st} students${sp.length < st ? '. Turn on more spots before shuffling.' : '.'}</div>
    <p class="note">Every square and chair of the room is shown while this tab is open. Faded ones are off for this class. This class's spots never affect any other class.</p></div>
    ${UI.tool === 'zones' ? `<div class="dsec"><h3>Selected: ${selN}</h3>
      <div class="field"><label>Zone name</label><input class="inp" id="zoneName" list="zoneList" placeholder="e.g. chairs, front, back"><datalist id="zoneList">${Object.keys(zones).map(z => `<option value="${esc(z)}">`).join('')}<option value="front"><option value="back"><option value="chairs"></datalist></div>
      <div class="row"><button class="btn" data-act="zoneAdd" ${selN ? '' : 'disabled'}>Add zone</button><button class="btn" data-act="zoneRemove" ${selN ? '' : 'disabled'}>Remove zone</button><button class="btn" data-act="lockSel" ${selN ? '' : 'disabled'}>Lock</button><button class="btn" data-act="unlockSel" ${selN ? '' : 'disabled'}>Unlock</button><button class="btn sm" data-act="clearSel" ${selN ? '' : 'disabled'}>Clear selection</button></div>
      <p class="note">A locked spot keeps whoever is in it through every shuffle. Unlocking leaves zones alone.</p></div>` : ''}
    ${UI.tool === 'neighbors' ? `<div class="dsec"><h3>Neighbors</h3><p class="note">${UI.nbSpot ? `${esc(spotGeo(c, UI.nbSpot).label)} has ${nbSet(c) ? nbSet(c).size : 0} neighbors (blue).` : 'Click a spot on the chart.'} Average ${avg} neighbors per spot. Next to means: ${esc(NEIGHBOR_MODES[c.neighborMode] || NEIGHBOR_MODES.touch).toLowerCase()} (change in Settings).</p></div>` : ''}
    <div class="dsec"><h3>Zones</h3>${Object.keys(zones).length ? `<div class="chips">${Object.entries(zones).map(([z, n]) => `<span class="zchip">${esc(z)}: ${n}</span>`).join('')}</div>` : '<p class="note">No zones yet.</p>'}
    <p class="note">${locked} locked spot${locked === 1 ? '' : 's'}.</p></div>`;
}

function studentOptions(c, sel, excludeId) {
  const names = displayNames(c);
  return activeStudents(c).filter(s => s.id !== excludeId).sort((a, b) => names[a.id].localeCompare(names[b.id])).map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(names[s.id])}</option>`).join('');
}
function classZones(c) { return [...new Set(activeSpots(c).flatMap(s => s.zones || []))].sort(); }
function ruleProblems(c) {
  const out = []; const R = rulesFor(c); const sp = activeSpots(c); const names = displayNames(c);
  const free = z => sp.filter(s => !s.lock && (s.zones || []).includes(z)).length;
  const need = {};
  for (const id in R.must) { const z = R.must[id]; need[z] = (need[z] || 0) + 1; if (!free(z)) out.push(`${names[id]} must sit in "${z}", but this class has no unlocked "${z}" spots.`); }
  for (const z in need) if (need[z] > free(z) && free(z)) out.push(`${need[z]} students must sit in "${z}", but it only has ${free(z)} unlocked spots.`);
  if (sp.length < activeStudents(c).length) out.push(`${activeStudents(c).length} students but only ${sp.length} spots are on.`);
  return out;
}
function drRules(c) {
  const names = displayNames(c);
  const zones = classZones(c);
  const t = UI.ruleType || 'must';
  const first = activeStudents(c).sort((a, b) => names[a.id].localeCompare(names[b.id]))[0];
  const sSel = UI.ruleStudent && studentById(c, UI.ruleStudent) ? UI.ruleStudent : (first && first.id);
  const target = t === 'apart' ? studentOptions(c, null, sSel) : zones.map(z => `<option>${esc(z)}</option>`).join('');
  const rules = c.rules.map(r => {
    const a = names[r.s] || '(removed student)';
    const txt = r.type === 'must' ? `${a} must sit in ${r.zone}` : r.type === 'never' ? `${a} must never sit in ${r.zone}` : `${a} not next to ${names[r.t] || '(removed)'}`;
    const inactive = !(studentById(c, r.s) || {}).active || (r.type === 'apart' && !(studentById(c, r.t) || {}).active);
    return `<div class="rule"><span style="${inactive ? 'opacity:.5' : ''}">${esc(txt)}${inactive ? ' <span class="small muted">(not active)</span>' : ''}</span><button class="btn sm danger" data-act="ruleDel" data-id="${r.id}">Remove</button></div>`;
  }).join('') || '<p class="note">No rules for this class.</p>';
  const probs = ruleProblems(c);
  const pend = pendingFor(c);
  const pendHTML = pend.length ? `<div class="dsec pend"><h3 style="color:#6b4407">From earlier years: waiting for your OK (${pend.length})</h3>
    ${pend.map(p => { const miss = p.b.type !== 'apart' && !zones.includes(p.b.zone);
      return `<div class="rule"><span>${esc(bankText(p, names))}<div class="small muted">from ${esc(p.b.fromYear)}${miss ? ` - this class has no "${esc(p.b.zone)}" zone yet` : ''}</div></span><button class="btn sm primary" data-act="bankOk" data-id="${p.b.id}" ${miss ? 'disabled' : ''}>Approve</button><button class="btn sm" data-act="bankNo" data-id="${p.b.id}">Dismiss</button></div>`; }).join('')}
    <p class="note">Approved rules start working right away. Dismissed ones are forgotten. Anything you leave here waits, and comes back next year if you still haven't decided.</p>
    ${pend.filter(p => p.b.type === 'apart' || zones.includes(p.b.zone)).length > 1 ? '<button class="btn sm" data-act="bankOkAll">Approve all</button>' : ''}</div>` : '';
  return pendHTML + `<div class="dsec"><h3>Add a rule</h3>
    <div class="field"><label>Student</label><select class="inp" id="ruleS" data-act="ruleStudent">${studentOptions(c, sSel)}</select></div>
    <div class="field"><label>Rule</label><select class="inp" id="ruleT" data-act="ruleType">
      <option value="must" ${t === 'must' ? 'selected' : ''}>must sit in...</option>
      <option value="never" ${t === 'never' ? 'selected' : ''}>must never sit in...</option>
      <option value="apart" ${t === 'apart' ? 'selected' : ''}>must not sit next to...</option></select></div>
    <div class="field"><label>${t === 'apart' ? 'Student' : 'Zone'}</label><select class="inp" id="ruleX">${target || '<option value="">No zones yet. Make one in the Spots tab.</option>'}</select></div>
    <button class="btn primary" data-act="ruleAdd">Add rule</button></div>
    <div class="dsec"><h3>Rules for this class</h3>${rules}</div>
    ${probs.length ? `<div class="dsec">${probs.map(p => `<div class="msg bad">${esc(p)}</div>`).join('')}</div>` : (c.rules.length ? '<div class="msg ok">Every rule can be met on this layout.</div>' : '')}
    <p class="note">Rules belong to the student, not their name, so nickname changes and duplicate names never break them. Rules for students linked to Aspen are remembered into next year. For real distance between two students, zones work better than keep-apart.</p>`;
}

function drRotation(c) {
  const zones = classZones(c);
  const r = c.rotation;
  const names = displayNames(c);
  let body = '';
  if (r && r.zone) {
    const served = new Set(r.served || []);
    const list = activeStudents(c).filter(s => {
      const R = rulesFor(c); return !(R.never[s.id] || []).includes(r.zone) && !(R.must[s.id] && R.must[s.id] !== r.zone);
    }).sort((a, b) => names[a.id].localeCompare(names[b.id]));
    const waiting = list.filter(s => !served.has(s.id));
    body = `<div class="msg info">${waiting.length} of ${list.length} students are still waiting for a turn in "${esc(r.zone)}".</div>
      <table class="t"><thead><tr><th>Student</th><th>Had a turn this round</th></tr></thead><tbody>
      ${list.map(s => `<tr><td>${esc(names[s.id])}</td><td><input type="checkbox" data-act="rotServed" data-id="${s.id}" ${served.has(s.id) ? 'checked' : ''}></td></tr>`).join('')}</tbody></table>
      <div class="row" style="margin-top:10px"><button class="btn" data-act="rotReset">Start a new round</button></div>
      <p class="note">When fewer students are waiting than there are spots in the zone, everyone waiting is guaranteed a turn, and the rest of the spots go to students who did not just have one. Tick a box to mark a new student as already served.</p>`;
  }
  return `<div class="dsec"><h3>Take turns in a zone</h3>
    <div class="field"><label>Rotating zone</label><select class="inp" data-act="rotZone"><option value="">None</option>${zones.map(z => `<option ${r && r.zone === z ? 'selected' : ''}>${esc(z)}</option>`).join('')}</select></div>
    ${body}</div>`;
}

function drHistory(c) {
  const names = displayNames(c);
  const cur = latest(c);
  const vs = c.versions.slice().reverse();
  let stu = '';
  if (UI.histStudent && studentById(c, UI.histStudent)) {
    const id = UI.histStudent;
    const rows = []; const zoneCount = {}; const bandCount = {};
    let seatedIn = 0;
    for (const v of vs) {
      const sp = Object.keys(v.assign).find(k => v.assign[k] === id);
      const g = sp ? spotGeo(c, sp) : null;
      const zs = sp ? ((c.spots.find(s => s.id === sp) || {}).zones || []) : [];
      if (g) { seatedIn++; for (const z of zs) zoneCount[z] = (zoneCount[z] || 0) + 1; const b = g.chair ? 'Chair' : g.label.replace(/ \d+$/, ''); bandCount[b] = (bandCount[b] || 0) + 1; }
      rows.push({v, g, zs, sp});

    const songs = c.bop ? c.bop.songs.filter(s => s.suggestedBy && s.suggestedBy.kind === 'student' && s.suggestedBy.id === id) : [];
    stu = `<div class="dsec"><h3>${esc(names[id])}: where they have sat</h3>
      <div class="chips" style="margin-bottom:8px">${Object.entries(zoneCount).map(([z, n]) => `<span class="zchip"><b>${esc(z)}</b>: ${n}</span>`).join('')}${Object.entries(bandCount).map(([z, n]) => `<span class="zchip">${esc(z)}: ${n}</span>`).join('')}</div>
      <div class="vlist">${rows.map(r => `<div class="vitem" data-act="viewVersion" data-n="${r.v.n}"><div data-hthumb="${r.v.n}" data-hl="${r.sp || ''}"></div><div class="cap"><b>v${r.v.n}</b><span>${r.g ? esc(r.g.label) : 'not seated'}</span></div></div>`).join('')}</div>
      ${songs.length ? `<h3 style="margin-top:14px">Songs suggested</h3>${songs.map(s => `<div class="small">${fmtDate(s.date)}: "${esc(s.song)}" by ${esc(s.artist)}</div>`).join('')}` : ''}
      <div class="row" style="margin-top:10px"><button class="btn sm" data-act="histStudent" data-id="">Back to all versions</button></div></div>`;
  }
  const versions = `<div class="dsec"><h3>All versions (${c.versions.length})</h3>
    <div class="vlist">${vs.map(v => `<div class="vitem ${UI.viewVersion === v.n || (UI.viewVersion == null && v === cur) ? 'cur' : ''}" data-act="viewVersion" data-n="${v.n}"><div data-hthumb="${v.n}"></div><div class="cap"><b>v${v.n}</b><span>${fmtDate(v.date)}${v.edited ? ' &middot; edited' : ''}</span></div></div>`).join('')}</div>
    <p class="note">Click a version to show it on the big chart.</p></div>`;
  return `<div class="dsec"><h3>Student history</h3><select class="inp" data-act="histStudent" style="width:100%"><option value="">Pick a student...</option>${c.students.slice().sort((a, b) => names[a.id].localeCompare(names[b.id])).map(s => `<option value="${s.id}" ${UI.histStudent === s.id ? 'selected' : ''}>${esc(names[s.id])}${s.active ? '' : ' (left)'}</option>`).join('')}</select></div>` + (stu || versions);
}

}

}

/* ---------------- roster import ---------------- */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }

/* Hungarian algorithm: rows (seats) to columns (spots), lowest total distance */

/* ---------------- rules from earlier years ---------------- */

function doRollover() {
  const ny = UI.ny; const old = DATA.year;
  const sum = rolloverSummary();
  // 1. rules: earlier entries applied this year are replaced by this year's class rules
  let bank = DATA.ruleBank.filter(b => b.appliedIn !== old);
  for (const c of DATA.classes) {
    if (c.grade === '5') continue;
    for (const r of c.rules) {
      const a = studentById(c, r.s), b = r.t ? studentById(c, r.t) : null;
      if (!a || !a.pid || (r.type === 'apart' && (!b || !b.pid))) continue;
      const e = {type: r.type, pid: a.pid, tpid: b ? b.pid : null, zone: r.zone || null};
      const dup = bank.find(x => x.type === e.type && (e.type === 'apart' ? ((x.pid === e.pid && x.tpid === e.tpid) || (x.pid === e.tpid && x.tpid === e.pid)) : (x.pid === e.pid && x.zone === e.zone)));
      if (dup) { dup.appliedIn = null; dup.fromYear = old; } else bank.push(Object.assign({id: uid('b'), fromYear: old, appliedIn: null}, e));
    }
  }
  bank = bank.filter(b => !sum.grads.has(b.pid) && !sum.grads.has(b.tpid));
  DATA.ruleBank = bank;
  for (const pid of sum.grads) delete DATA.people[pid];
  // 2. classes
  DATA.classes = DATA.classes.filter(c => ny.keep.has(c.id));
  for (const c of DATA.classes) {
    c.students = []; c.versions = []; c.rules = [];
    for (const sp of c.spots) sp.lock = false;
    if (c.rotation) c.rotation = {zone: c.rotation.zone, served: [], lastRound: []};
    if (c.bop) { c.bop.songs = []; c.bop.currentSongId = null; }
    if (!ny.keepSchedule) c.schedule = [];
  }
  DATA.year = ny.year;
  UI.classId = null; UI.viewVersion = null; UI.bopView = {};
  save(); closeDrawer(true); renderHome();
  openModal(`${DATA.year} is ready`, `<p>Next steps:</p><ol style="line-height:1.7"><li>Import the new Aspen roster. Choose "Create a new class" for any new teacher.</li><li>Set the new class times in the weekly schedule.</li><li>Review the rules from earlier years in each class's Rules tab.</li><li>Shuffle each class to make its first chart.</li></ol>`,
    `<button class="btn" data-act="weekly">Weekly schedule</button><button class="btn primary" data-act="importRoster">Import Aspen roster</button>`);
}

      else if (s.leftSpot && v && !v.assign[s.leftSpot] && c.spots.some(x => x.id === s.leftSpot)) { v.assign[s.leftSpot] = s.id; s.leftSpot = null; }
      save(); renderDrawer(); renderStageArea(); renderTray();
      toast(s.active ? `${nm} is back${unseated(c).some(x => x.id === s.id) ? ' (not seated yet)' : ' in their old spot'}.` : `${nm} marked as left. Undo with Ctrl+Z / Cmd+Z.`);
      break;
    }
    case 'ruleAdd': {
      const s = $('#ruleS').value, t = $('#ruleT').value, x = $('#ruleX').value;
      if (!s || !x) { alert('Pick a student and a target.'); return; }
      if (t === 'apart') { if (c.rules.some(r => r.type === 'apart' && ((r.s === s && r.t === x) || (r.s === x && r.t === s)))) { alert('That pair is already listed.'); return; } c.rules.push({id: uid('r'), type: 'apart', s, t: x}); }
      else {
        if (t === 'must') { c.rules = c.rules.filter(r => !(r.type === 'must' && r.s === s) && !(r.type === 'never' && r.s === s && r.zone === x)); }
        else { if (c.rules.some(r => r.type === 'must' && r.s === s && r.zone === x)) { alert('That student is already required to sit there.'); return; } if (c.rules.some(r => r.type === 'never' && r.s === s && r.zone === x)) return; }
        c.rules.push({id: uid('r'), type: t, s, zone: x});
      }
      save(); renderDrawer(); break;
    }
    case 'ruleDel': c.rules = c.rules.filter(r => r.id !== a.dataset.id); save(); renderDrawer(); break;
    case 'rotReset': if (confirm('Start a new round? Everyone becomes eligible again.')) { c.rotation.served = []; c.rotation.lastRound = []; save(); renderDrawer(); } break;
    case 'songSave': {
      const by = $('#sgBy').value, other = $('#sgOther').value.trim();
      const song = {song: $('#sgSong').value.trim(), artist: $('#sgArtist').value.trim(), year: $('#sgYear').value.trim(), country: $('#sgCountry').value.trim(), genre: $('#sgGenre').value.trim(), youtube: $('#sgYt').value.trim(),
        suggestedBy: by && by !== '__other' ? {kind: 'student', id: by} : (other ? {kind: 'other', name: other} : null)};
      if (!song.song && !song.youtube) { alert('Add at least a song title or a YouTube link.'); return; }
      if (song.youtube && !ytInfo(song.youtube)) { alert('That does not look like a YouTube link.'); return; }
      const e2 = UI.songEdit && c.bop.songs.find(s => s.id === UI.songEdit);
      if (e2) Object.assign(e2, song); else { const n = Object.assign({id: uid('g'), date: todayISO()}, song); c.bop.songs.push(n); c.bop.currentSongId = n.id; }
      UI.songEdit = null; UI.bopStep = 0; save(); renderDrawer(); renderStageArea(); break;
    }
    case 'songEdit': UI.songEdit = a.dataset.id || null; renderDrawer(); break;
    case 'songCurrent': c.bop.currentSongId = a.dataset.id; UI.bopStep = 0; save(); renderDrawer(); renderStageArea(); break;
    case 'songDel': if (confirm('Delete this song from the history?')) { c.bop.songs = c.bop.songs.filter(s => s.id !== a.dataset.id); if (c.bop.currentSongId === a.dataset.id) c.bop.currentSongId = null; save(); renderDrawer(); renderStageArea(); } break;
    case 'schedAdd': c.schedule.push({day: 1, start: '09:00', end: '09:45'}); save(); renderDrawer(); break;
    case 'schedDel': c.schedule.splice(Number(a.dataset.i), 1); save(); renderDrawer(); break;
    case 'deleteClass': if (confirm(`Delete ${c.title} and all its history? This cannot be undone (unless you have a backup).`)) { DATA.classes = DATA.classes.filter(x => x !== c); UI.classId = null; save(); closeDrawer(true); renderHome(); } break;
    case 'importRoster': closeModal(); startImport(); break;
    case 'impApply': applyImport(); break;
    case 'addClass': addClassDialog(); break;
    case 'addClassGo': {
      const L = DATA.layouts[$('#ncLayout').value]; if (!L) return;
      const school = $('#ncSchool').value.trim() || 'School';
      const nc = makeClass({title: $('#ncTitle').value.trim() || 'New class', school, grade: $('#ncGrade').value, hrKeys: $('#ncHr').value.split(',').map(x => x.trim()).filter(Boolean), layout: L.id});
      DATA.classes.push(nc); if (!(DATA.settings.schools || []).includes(school)) DATA.settings.schools.push(school);
      save(); closeModal(); openClass(nc.id, {manual: true}); openDrawer('settings'); break;
    }
    case 'printRoster': printRoster(c); break;
    case 'impUndo': impUndo(); break;
    case 'impChoose': $('#csvInput').value = ''; $('#csvInput').click(); break;
    case 'slidesImport': closeModal(); slidesImportDialog(); break;
    case 'slRead': await slidesRead(); break;
    case 'slApply': slidesApply(); break;
    case 'sgFill': fillSongFromLink(false); break;
    case 'viewerSetup': viewerSetupDialog(); break;
    case 'vsGo': {
      let cfg; try { cfg = parseSetupCode($('#vsCode').value); } catch (err) { alert(err.message); return; }
      await IDB.set('sync', cfg); await IDB.del('syncBase'); await IDB.del('data'); await IDB.del('fileHandle'); await IDB.del('publish'); await IDB.del('viewer'); await IDB.del('viewerCache');
      FILE.handle = null; FILE.connected = false; FILE.needsReconnect = false;
      DATA = null; VIEWER = true; SYNC.cfg = cfg; SYNC.sha = null; SYNC.base = null; SYNC.dirty = false; SYNC.readOnly = cfg.readOnly; SYNC.err = '';
      applySchoolLook(); closeModal();
      await syncPull({force: true});
      if (SYNC.err) alert('Set up, but the first sync failed:\n' + SYNC.err);
      else { toast('This PC now shares your seating data.'); afterDataLoaded(); }
      break;
    }
    case 'vsCheck': await syncPull({force: true}); await syncPush(); schoolMenu(); break;
    case 'vsDiscard': SYNC.sha = null; SYNC.dirty = false; await syncPull({force: true}); schoolMenu(); break;
    case 'vsRemove': if (confirm('Remove the setup from this PC? The seating data is deleted from this browser. Your Mac and the shared copy are not affected.')) { await IDB.del('sync'); await IDB.del('syncBase'); await IDB.del('data'); location.reload(); } break;
    case 'pbGen': if (!$('#pbPass').value || confirm('Make a new passphrase? School PCs will need a new setup code.')) $('#pbPass').value = newPassphrase(); break;
    case 'pbSave': {
      const prev = SYNC.cfg || {};
      const pass = $('#pbPass').value.trim(), repo = $('#pbRepo').value.trim();
      const cfg = Object.assign({}, prev, {repo, path: prev.path || 'seating-data.enc.json', token: $('#pbToken').value.trim(), pass, on: $('#pbOn').checked, school: false, readOnly: false});
      if (!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo)) { alert('Type the repository as owner/name, e.g. charliethump/seating-data'); return; }
      if (!cfg.token || !cfg.pass) { alert('The token and passphrase are both needed.'); return; }
      if (pass.length < 12) { alert('Use a longer passphrase (the New button makes a strong one).'); return; }
      if (prev.pass !== pass || prev.repo !== repo) { cfg.salt = b64(crypto.getRandomValues(new Uint8Array(16))); cfg.sha = null; SYNC.sha = null; await setBase(null); }
      SYNC.cfg = cfg; await IDB.set('sync', cfg);
      if (cfg.on) {
        SYNC.dirty = true;
        if (prev.pass !== pass && prev.pass) {   // new passphrase: overwrite the shared copy with this Mac's data
          const g = await GH.req(cfg, cfg.token); SYNC.sha = g.ok ? (await g.json()).sha : null;
          try { SYNC.busy = true; await pushCore(); } catch (err) { SYNC.err = err.message; } SYNC.busy = false;
        } else { await syncPull({force: true}); await syncPush(); }
      }
      dataMenu(); break;
    }
    case 'pbCode': {
      const code = setupCode(); if (!code) return;
      try { await navigator.clipboard.writeText(code); toast('Setup code copied.'); } catch (err) {}
      $('#pbCodeBox').innerHTML = `<div class="field" style="margin-top:8px"><label>Setup code (copied). Paste it once on each school PC.</label><textarea class="code" rows="4" readonly>${esc(code)}</textarea><span class="small muted">It unlocks and can change the seating data, so treat it like a password. Delete it from wherever you send it after setup.</span></div>`;
      break;
    }
    case 'bankOk': approveBank(c, a.dataset.id); save(); renderDrawer(); renderClass(); break;
    case 'bankOkAll': { const zs = classZones(c); for (const p of pendingFor(c)) if (p.b.type === 'apart' || zs.includes(p.b.zone)) approveBank(c, p.b.id); save(); renderDrawer(); renderClass(); break; }
    case 'bankNo': if (confirm('Forget this rule? It will not come back in later years.')) { DATA.ruleBank = DATA.ruleBank.filter(b => b.id !== a.dataset.id); save(); renderDrawer(); renderClass(); } break;
    case 'newYear': UI.ny = {backup: false, year: nextYearLabel(DATA.year), keep: new Set(DATA.classes.map(x => x.id)), keepSchedule: false}; newYearDialog(); break;
    case 'nyBackup': download(`seating-data-${DATA.year}-backup.json`); UI.ny.backup = true; newYearDialog(); break;
    case 'nyAll': UI.ny.keep = new Set(DATA.classes.map(x => x.id)); newYearDialog(); break;
    case 'nyNone': UI.ny.keep = new Set(); newYearDialog(); break;
    case 'nyGo': if (confirm(`Start ${UI.ny.year}? ${DATA.classes.length - UI.ny.keep.size} classes will be removed and every roster and chart cleared. Your backup is the way back.`)) doRollover(); break;
    case 'weekly': weekDialog(); break;
    case 'wkDel': { const cc = getClass(a.dataset.c); cc.schedule.splice(Number(a.dataset.i), 1); save(); weekDialog(); break; }
    case 'closeModalRender': closeModal(); renderAll(); break;
    case 'closeModal': closeModal(); break;
  }
});
document.addEventListener('change', (e) => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const c = curClass(); const act = a.dataset.act;
  undoPrime(actionLabel(act, a, c));
  switch (act) {
    case 'stuField': { const s = studentById(c, a.dataset.id); s[a.dataset.f] = a.value.trim(); if (a.dataset.f === 'first') s.given = s.first; if (a.dataset.f === 'preferred' && s.pid && DATA.people[s.pid]) DATA.people[s.pid].preferred = s.preferred; save(); renderDrawer(); renderStageArea(); renderTray(); break; }
    case 'printRules': UI.printRules = a.checked; break;
    case 'slMap': SLX.map[a.dataset.k] = a.value; slidesPlan(); slidesShow(); break;
    case 'slPick': { const P = SLX.plans[a.dataset.c]; (SLX.pick[a.dataset.c] = SLX.pick[a.dataset.c] || {})[norm(a.dataset.t)] = a.value; slidesPlan(); slidesShow(); break; }
    case 'sgYtChange': if (!$('#sgSong').value.trim() && !$('#sgArtist').value.trim() && a.value.trim()) fillSongFromLink(true); break;
    case 'rosterLeft': UI.rosterLeft = a.checked; renderDrawer(); break;
    case 'impSchool': { impSnap(); const raw = IMPORT.groups[a.dataset.k].schoolRaw; for (const k in IMPORT.groups) if (IMPORT.groups[k].schoolRaw === raw) { IMPORT.school[k] = a.value; if (IMPORT.newCls[k]) IMPORT.newCls[k].school = a.value; } buildPlans(); showImport(); break; }
    case 'impNew': {
      impSnap();
      const sp = newSpec(a.dataset.k); const f = a.dataset.f;
      if (f === 'title') { sp.title = a.value; sp.autoTitle = false; }
      else sp[f] = a.value;
      if (f === 'grade') { if (sp.autoTitle) sp.title = `Grade ${sp.grade} – ${sp.last}`; sp.layout = defaultLayout(sp.school, sp.grade); }
      if (f === 'school') sp.layout = defaultLayout(sp.school, sp.grade);
      buildPlans(); showImport(); break;
    }
    case 'nyYear': UI.ny.year = a.value.trim() || UI.ny.year; newYearDialog(); break;
    case 'nyKeep': a.checked ? UI.ny.keep.add(a.dataset.id) : UI.ny.keep.delete(a.dataset.id); break;
    case 'nySched': UI.ny.keepSchedule = a.checked; break;
    case 'wkF': { const cc = getClass(a.dataset.c); const sl = cc.schedule[Number(a.dataset.i)]; sl[a.dataset.f] = a.value; if (sl.end <= sl.start) sl.end = addMin(sl.start, 45); cc.schedule.sort((x, y) => x.day - y.day || x.start.localeCompare(y.start)); save(); weekDialog(); break; }
    case 'wkClass': { const from = getClass(a.dataset.c), to = getClass(a.value); const [sl] = from.schedule.splice(Number(a.dataset.i), 1); to.schedule.push(sl); to.schedule.sort((x, y) => x.day - y.day || x.start.localeCompare(y.start)); save(); weekDialog(); break; }
    case 'wkAdd': {
      if (!a.value) break; const d = Number(a.dataset.day); const to = getClass(a.value);
      const ends = DATA.classes.flatMap(x => x.schedule.filter(s => s.day === d).map(s => s.end)).sort();
      const start = ends.length ? ends[ends.length - 1] : '09:00';
      to.schedule.push({day: d, start, end: addMin(start, 45)}); to.schedule.sort((x, y) => x.day - y.day || x.start.localeCompare(y.start));
      save(); weekDialog(); break;
    }
    case 'ruleType': UI.ruleType = a.value; UI.ruleStudent = $('#ruleS').value; renderDrawer(); break;
    case 'ruleStudent': UI.ruleStudent = a.value; if ((UI.ruleType || 'must') === 'apart') renderDrawer(); break;
    case 'rotZone': c.rotation = a.value ? {zone: a.value, served: currentlyIn(c, a.value), lastRound: []} : null; save(); renderDrawer(); break;
    case 'rotServed': { const s = new Set(c.rotation.served || []); a.checked ? s.add(a.dataset.id) : s.delete(a.dataset.id); c.rotation.served = [...s]; save(); renderDrawer(); break; }
    case 'histStudent': UI.histStudent = a.value || null; renderDrawer(); break;
    case 'bopEnabled': c.bop.enabled = a.checked; save(); renderClass(); renderDrawer(); break;
    case 'bopDefault': c.bop.defaultView = a.checked ? 'bop' : 'chart'; delete UI.bopView[c.id]; save(); renderClass(); break;
    case 'clsField': c[a.dataset.f] = a.value; save(); renderClass(); break;
    case 'clsHr': c.hrKeys = a.value.split(',').map(x => x.trim()).filter(Boolean); save(); break;
    case 'clsNeighbor': c.neighborMode = a.value; save(); renderDrawer(); renderStageArea(); break;
    case 'schedF': { const s = c.schedule[Number(a.dataset.i)]; s[a.dataset.f] = a.dataset.f === 'day' ? Number(a.value) : a.value; c.schedule.sort((x, y) => x.day - y.day || x.start.localeCompare(y.start)); save(); renderDrawer(); break; }
    case 'clsLayout': {
      if (!confirm('Change the room layout? This class\'s spots, zones and current seating will be cleared. History stays.')) { a.value = c.layout; return; }
      const L = DATA.layouts[a.value]; c.layout = L.id;
      c.spots = L.spots.map(s => ({id: s.id, zones: s.chair ? ['chairs'] : [], lock: false}));
      const cur = latest(c); c.versions.push({n: (cur ? cur.n : 0) + 1, date: todayISO(), assign: {}, by: 'manual', note: 'Layout changed'});
      save(); renderClass(); renderDrawer(); break;
    }
    case 'setAuto': DATA.settings.autoSchedule = a.checked; UI.override = null; save(); renderAutoBtn(); break;
    case 'setFlip': DATA.settings.flipMinutes = Math.max(0, Number(a.value) || 0); save(); break;
    case 'impMap': impSnap(); IMPORT.map[a.dataset.k] = a.value; if (a.value === '__new') newSpec(a.dataset.k); buildPlans(); showImport(); break;
    case 'impLink': {
      impSnap();
      (IMPORT.manual[a.dataset.c] = IMPORT.manual[a.dataset.c] || {})[a.dataset.s] = a.value;
      buildPlans(); showImport(); break;
    }
    case 'impLeave': impSnap(); (IMPORT.leave[a.dataset.c] = IMPORT.leave[a.dataset.c] || {})[a.dataset.s] = a.checked; buildPlans(); showImport(); break;
  }
});
function currentlyIn(c, z) {
  const v = latest(c); if (!v) return [];
  const zs = new Set(activeSpots(c).filter(s => (s.zones || []).includes(z)).map(s => s.id));
  return Object.entries(v.assign).filter(([sp]) => zs.has(sp)).map(([, id]) => id);
}
$('#fileInput').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (d.app !== 'seating-chart') throw new Error('not a seating chart data file'); DATA = upgrade(d); await IDB.set('data', DATA); afterDataLoaded(); }
  catch (err) { alert('Could not open: ' + err.message); }
});
$('#csvInput').addEventListener('change', (e) => { const f = e.target.files[0]; if (f && DATA) onCSV(f); });

/* keyboard: clicker sends Page Up / Page Down; the foot pedal may send arrows */
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (!$('#modalBack').classList.contains('hidden')) {
    if (e.key === 'Escape') closeModal();
    else if ((e.metaKey || e.ctrlKey) && (e.key || '').toLowerCase() === 'z' && IMPORT && $('#mTitle').textContent === 'Import Aspen roster') { e.preventDefault(); impUndo(); }
    return;
  }
  const k = (e.key || '').toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (e.ctrlKey && k === 'y') { e.preventDefault(); redo(); return; }
  const c = curClass();
  const next = ['PageDown', 'ArrowRight', 'ArrowDown'].includes(e.key);
  const prev = ['PageUp', 'ArrowLeft', 'ArrowUp'].includes(e.key);
  if ((next || prev) && DATA) {
    e.preventDefault();
    if (UI.view === 'class' && c && bopActive(c) && currentSong(c) && UI.viewVersion == null) {
      if (next && UI.bopStep < 2) { UI.bopStep++; renderStageArea(); return; }
      if (prev && UI.bopStep > 0) { UI.bopStep--; renderStageArea(); return; }
    }
    stepClass(next ? 1 : -1);
    return;
  }
  if (e.key === 'f' || e.key === 'F') togglePresent();
  else if ((e.key === 'b' || e.key === 'B') && c && c.bop && c.bop.enabled && UI.view === 'class') { UI.bopView[c.id] = bopActive(c) ? 'chart' : 'bop'; UI.bopStep = 0; renderClass(); }
  else if (e.key === 'Escape') { if (document.body.classList.contains('present')) togglePresent(false); else if (UI.pick) { UI.pick = null; renderStageArea(); renderTray(); } else if (UI.tool !== 'none') { UI.tool = 'none'; renderClass(); renderDrawer(); } }
});

function togglePresent(force) {
  const on = force ?? !document.body.classList.contains('present');
  if (on && UI.view !== 'class') { const s = DATA && autoSlot(); if (s) openClass(s.c.id); else return; }
  document.body.classList.toggle('present', on);
  if (on) { UI.tool = 'none'; UI.pick = null; if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); }
  else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  setTimeout(renderStageArea, 60);
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('present')) { document.body.classList.remove('present'); setTimeout(renderClass, 60); } });
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (UI.view === 'class') renderStageArea(); }, 80); });
// the YouTube frame can grab keyboard focus if clicked; take it back so the clicker keeps working
window.addEventListener('blur', () => setTimeout(() => { if (document.activeElement && document.activeElement.tagName === 'IFRAME') { window.focus(); document.activeElement.blur(); } }, 400));

/* ---------------- startup ---------------- */
function afterDataLoaded() {
  renderUndo();
  renderStatus(); renderAutoBtn();
  const s = DATA.settings.autoSchedule && autoSlot();
  if (s) openClass(s.c.id); else renderHome();
}
(async function init() {
  // a school PC set up with the earlier view-only version
  try {
    const old = await IDB.get('viewer');
    if (old && !(await IDB.get('sync'))) {
      await IDB.set('sync', {repo: old.r, path: old.p, token: old.t, pass: old.k, on: true, school: true, readOnly: true});
      try { const env = await IDB.get('viewerCache'); if (env) await IDB.set('data', await decryptData(env, old.k)); } catch (e) {}
      await IDB.del('viewer'); await IDB.del('viewerCache');
    }
  } catch (e) {}
  let sc = null; try { sc = await IDB.get('sync'); } catch (e) {}
  VIEWER = !!(sc && sc.school);
  try { const d = await IDB.get('data'); if (d && d.app === 'seating-chart') DATA = upgrade(d); } catch (e) {}
  if (!VIEWER) await FILE.init();
  await syncLoad();
  applySchoolLook();
  if (DATA) afterDataLoaded(); else { renderStatus(); renderHome(); }
  if (syncOn()) { await syncPull({force: true}); if (DATA && UI.view === 'home' && DATA.settings.autoSchedule) afterDataLoaded(); }
  setInterval(tick, 15000);
  setInterval(() => syncPull(), VIEWER ? 90000 : 120000);
  setInterval(renderStatus, 60000);
  if (!VIEWER) setInterval(() => FILE.refresh(), 60000);
  const onBack = () => { if (!VIEWER) FILE.refresh(); if (Date.now() - SYNC.checked > 20000) syncPull(); };
  window.addEventListener('focus', onBack);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') onBack(); });
})();
</script>
