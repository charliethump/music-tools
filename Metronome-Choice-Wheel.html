<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metronome Choice Wheel</title>
<style>
  :root {
    --paper: #f5f6f8;
    --card: #ffffff;
    --ink: #1f2328;
    --ink-soft: #5b6470;
    --line: #d9dde3;
    --orange: #f4622a;
    --orange-deep: #c94b1a;
    --blue: #3369e8;
    --radius: 14px;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Nunito", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.4;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    flex: 1;
  }
  header h1 span { color: var(--orange); }
  .status { color: var(--ink-soft); font-size: 0.9rem; }

  button {
    font: inherit;
    font-weight: 700;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--ink-soft); }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 2px;
  }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.primary:hover { background: #2a58c4; }
  button.icon {
    width: 34px; height: 34px; padding: 0;
    border-radius: 50%;
    font-size: 1.1rem; line-height: 1;
    color: var(--ink-soft);
  }
  button.icon:hover { color: #b3261e; border-color: #b3261e; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
    gap: 24px;
    padding: 24px;
    align-items: stretch;
    min-height: 0;
  }

  /* Wheel */
  .wheel-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 0;
  }
  .wheel-wrap {
    position: relative;
    width: min(100%, calc(100vh - 170px));
    aspect-ratio: 1;
  }
  #wheel {
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
    border-radius: 50%;
    filter: drop-shadow(0 10px 22px rgba(31, 35, 40, 0.18));
  }
  #wheel.spinning { cursor: wait; }
  .pointer {
    position: absolute;
    right: -4.5%;
    top: 50%;
    width: 12%;
    height: 12%;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .clef {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 12%;
    height: 12%;
    pointer-events: none;
    will-change: transform;
  }
  .wheel-hint {
    color: var(--ink-soft);
    font-size: 0.95rem;
    min-height: 1.4em;
  }

  /* Entry panel */
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
    overflow: auto;
  }
  .panel h2 { margin: 0; font-size: 1.05rem; font-weight: 800; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .col-labels {
    display: grid;
    grid-template-columns: 26px 44px 1fr 92px 34px;
    gap: 10px;
    color: var(--ink-soft);
    font-size: 0.85rem;
    padding: 0 2px;
  }
  .entries { display: flex; flex-direction: column; gap: 8px; }
  .entry {
    display: grid;
    grid-template-columns: 26px 44px 1fr 92px 34px;
    gap: 10px;
    align-items: center;
  }
  .entry input[type="text"], .entry input[type="number"], select {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    width: 100%;
    min-width: 0;
  }
  .entry .num { color: var(--ink-soft); font-weight: 800; text-align: right; }
  .entry input[type="number"] { text-align: center; }
  .entry input[type="number"].missing { border-color: var(--orange); background: #fff4ee; }
  .entry input[type="color"] {
    width: 44px; height: 40px;
    padding: 0; border: 1px solid var(--line); border-radius: 10px;
    background: none; cursor: pointer;
  }
  .entry input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  .entry input[type="color"]::-webkit-color-swatch { border: none; border-radius: 7px; }
  .entry input[type="color"]::-moz-color-swatch { border: none; border-radius: 7px; }

  .settings {
    border-top: 1px solid var(--line);
    padding-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px 22px;
    align-items: center;
  }
  .settings label { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .settings select { width: auto; }
  .settings input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--blue); }
  .note { color: var(--ink-soft); font-size: 0.85rem; margin: 0; }

  /* Metronome */
  .metronome-area {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 0;
  }
  #metronome {
    height: min(100%, calc(100vh - 190px));
    max-width: 100%;
    cursor: pointer;
    filter: drop-shadow(0 12px 24px rgba(31, 35, 40, 0.16));
    transition: transform 120ms ease;
  }
  #metronome:active { transform: scale(0.99); }
  #metronome.disabled { cursor: default; opacity: 0.55; }
  .metro-hint { color: var(--ink-soft); font-size: 0.95rem; min-height: 1.4em; }
  .metro-hint.live { color: var(--orange-deep); font-weight: 700; }

  .pulse {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: var(--orange);
    opacity: 0;
    z-index: 50;
  }
  .pulse.beat { animation: beat 180ms ease-out; }
  .pulse.beat-accent { animation: beatAccent 320ms ease-out; }
  @keyframes beat { from { opacity: 0.14; } to { opacity: 0; } }
  @keyframes beatAccent { from { opacity: 0.55; } to { opacity: 0; } }

  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 60;
  }
  .result {
    position: fixed;
    top: 4vh;
    left: 50%;
    transform: translateX(-50%) scale(0.6);
    opacity: 0;
    z-index: 70;
    pointer-events: none;
    padding: 0.1em 0.5em;
    border-radius: 0.25em;
    background: var(--card);
    color: var(--ink);
    font-size: clamp(2.5rem, 9vw, 8rem);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.1;
    white-space: nowrap;
    max-width: 94vw;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 14px 40px rgba(31, 35, 40, 0.22);
    border-bottom: 0.12em solid var(--orange);
  }
  .result.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
    transition: transform 380ms cubic-bezier(0.2, 1.4, 0.4, 1), opacity 200ms ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .result.show { transition: none; }
  }

  body[data-mode="play"] .panel { display: none; }
  body[data-mode="play"] .metronome-area { display: flex; }
  body[data-mode="edit"] #back { display: none; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    .wheel-wrap { width: min(100%, 78vh); }
    #metronome { height: 60vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    #metronome { transition: none; }
  }
</style>
</head>
<body data-mode="edit">

<div class="pulse" id="pulse" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="result" id="result" role="status" aria-live="polite"></div>

<header>
  <h1>Metronome <span>Choice Wheel</span></h1>
  <span class="status" id="status"></span>
  <button id="copy">Copy link</button>
  <button id="back">Back to edit</button>
</header>

<main>
  <section class="wheel-area">
    <div class="wheel-wrap">
      <canvas id="wheel" width="900" height="900" aria-label="Choice wheel. Click to spin."></canvas>
      <svg class="clef" viewBox="0 0 100 100" aria-hidden="true">
        <clipPath id="clefClip"><circle cx="50" cy="50" r="46"/></clipPath>
        <circle cx="50" cy="50" r="48" fill="#fff"/>
        <text clip-path="url(#clefClip)" x="50" y="63" text-anchor="middle" font-size="46"
              font-family="'Noto Music','Bravura','Apple Symbols','Segoe UI Symbol','Symbola','DejaVu Sans',serif"
              fill="#111">&#x1D11E;</text>
      </svg>
      <svg class="pointer" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="96,10 96,90 20,50" fill="#e6e8ec" stroke="#8a919c" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="wheel-hint" id="wheelHint">Click the wheel to open the metronome view</div>
  </section>

  <aside class="panel" aria-label="Wheel choices">
    <div class="panel-head">
      <h2>Choices</h2>
      <button id="add" class="primary">Add choice</button>
    </div>
    <div class="col-labels"><span></span><span>Color</span><span>Name on wheel</span><span>BPM</span><span></span></div>
    <div class="entries" id="entries"></div>
    <div class="settings">
      <label><input type="checkbox" id="accent"> Accent first beat</label>
      <label>Meter
        <select id="meter">
          <option value="2">2/4</option>
          <option value="3">3/4</option>
          <option value="4" selected>4/4</option>
          <option value="6">6/8</option>
        </select>
      </label>
    </div>
    <p class="note">BPM is never shown on the wheel or metronome. Changes save on this device; use Copy link to open the same wheel elsewhere.</p>
  </aside>

  <section class="metronome-area">
    <svg id="metronome" viewBox="0 0 300 500" role="button" tabindex="0" aria-label="Metronome. Click to start or stop.">
      <defs>
        <linearGradient id="bodyShade" x1="0" x2="1">
          <stop offset="0" stop-color="#ff7a3d"/>
          <stop offset="0.55" stop-color="#f4622a"/>
          <stop offset="1" stop-color="#d9531f"/>
        </linearGradient>
      </defs>
      <!-- feet -->
      <rect x="40" y="462" width="18" height="16" rx="3" fill="#161616"/>
      <rect x="242" y="462" width="18" height="16" rx="3" fill="#161616"/>
      <!-- body -->
      <path d="M100 30 L200 30 L272 420 L28 420 Z" fill="url(#bodyShade)" stroke="#161616" stroke-width="4" stroke-linejoin="round"/>
      <rect x="20" y="420" width="260" height="44" rx="4" fill="#f4622a" stroke="#161616" stroke-width="4"/>
      <!-- winding key -->
      <rect x="272" y="392" width="16" height="12" rx="3" fill="#161616"/>
      <!-- scale slot -->
      <path d="M126 60 L174 60 L184 330 L116 330 Z" fill="#f7f1e8" stroke="#161616" stroke-width="3"/>
      <rect x="141" y="66" width="18" height="258" fill="#161616"/>
      <g id="ticks" stroke="#161616" stroke-width="2"></g>
      <!-- arm: pivot at (150,360) -->
      <g id="arm" transform="rotate(0 150 360)">
        <line x1="150" y1="360" x2="150" y2="42" stroke="#161616" stroke-width="7" stroke-linecap="round"/>
        <g id="weight" transform="translate(0 200)">
          <path d="M136 -18 L164 -18 L160 20 L140 20 Z" fill="#f4622a" stroke="#161616" stroke-width="3" stroke-linejoin="round"/>
          <rect x="130" y="-4" width="40" height="8" rx="2" fill="#161616"/>
        </g>
      </g>
      <circle cx="150" cy="360" r="11" fill="#161616"/>
      <circle cx="150" cy="360" r="4" fill="#f4622a"/>
    </svg>
    <div class="metro-hint" id="metroHint">Spinning...</div>
  </section>
</main>

<script>
(() => {
  'use strict';

  // ---------- Data ----------
  const PRESET_COLORS = ['#3369e8', '#d50f25', '#eeb211', '#009925', '#7b3fe4', '#ff7a00', '#00a6b4', '#e0459b', '#6b8e23', '#8b5a2b'];
  const STORAGE_KEY = 'metronome-choice-wheel-v1';
  const BPM_MIN = 30, BPM_MAX = 300;
  const TAU = Math.PI * 2;

  const defaults = () => ({
    entries: [
      { name: 'Adagio', color: '#3369e8', bpm: 70 },
      { name: 'Moderato', color: '#d50f25', bpm: 110 },
      { name: 'Allegro', color: '#eeb211', bpm: 140 },
    ],
    accent: false,
    meter: 4,
  });

  let state = loadState();

  function loadState() {
    const fromHash = decodeHash();
    if (fromHash) return fromHash;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return sanitize(JSON.parse(raw));
    } catch (e) { /* ignore */ }
    return defaults();
  }

  function sanitize(obj) {
    const d = defaults();
    if (!obj || typeof obj !== 'object') return d;
    const entries = Array.isArray(obj.entries) ? obj.entries.map((e, i) => ({
      name: typeof e.name === 'string' ? e.name.slice(0, 40) : '',
      color: /^#[0-9a-f]{6}$/i.test(e.color || '') ? e.color : PRESET_COLORS[i % PRESET_COLORS.length],
      bpm: Number.isFinite(+e.bpm) && e.bpm !== '' && e.bpm !== null ? clampBpm(+e.bpm) : '',
    })) : d.entries;
    return {
      entries: entries.length ? entries : d.entries,
      accent: !!obj.accent,
      meter: [2, 3, 4, 6].includes(+obj.meter) ? +obj.meter : 4,
    };
  }

  function clampBpm(n) { return Math.min(BPM_MAX, Math.max(BPM_MIN, Math.round(n))); }

  function encodeState() {
    const json = JSON.stringify(state);
    return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeHash() {
    const m = location.hash.match(/^#w=([A-Za-z0-9\-_]+)$/);
    if (!m) return null;
    try {
      let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      return sanitize(JSON.parse(decodeURIComponent(escape(atob(b64)))));
    } catch (e) { return null; }
  }

  let saveTimer = null;
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    // Keep the URL in sync so a bookmark or refresh keeps the current wheel.
    // Some embedded previews forbid this; the wheel must keep working either way.
    try { history.replaceState(null, '', '#w=' + encodeState()); } catch (e) { /* ignore */ }
    setStatus('Saved on this device');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => setStatus(''), 1800);
  }
  function setStatus(msg) { document.getElementById('status').textContent = msg; }

  let clickBuffer = null, accentBuffer = null, selectionBuffer = null;

  function base64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  function loadSamples(c) {
    const decode = b64 => new Promise((resolve, reject) => {
      // Callback form works in every browser that has decodeAudioData at all.
      c.decodeAudioData(base64ToBytes(b64), resolve, reject);
    });
    decode(SAMPLE_CLICK).then(b => { clickBuffer = b; }).catch(() => {});
    decode(SAMPLE_ACCENT).then(b => { accentBuffer = b; }).catch(() => {});
    decode(SAMPLE_SELECTION).then(b => { selectionBuffer = b; }).catch(() => {});
  }

  // Played once when the wheel lands on a choice.
  function playSelection() {
    if (!ctx || !selectionBuffer) return;
    const src = ctx.createBufferSource();
    src.buffer = selectionBuffer;
    const g = ctx.createGain();
    g.gain.value = 0.25;  // selection sound volume
    src.connect(g).connect(master);
    src.start(ctx.currentTime);
  }

  let ctx = null, master = null, noiseBuffer = null;
  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 0.03);
      noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      loadSamples(ctx);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Wheel ticking sound: a tiny filtered noise burst.
  function tick() {
    const c = audio();
    const t = c.currentTime;
    const src = c.createBufferSource();
    src.buffer = noiseBuffer;
    const filter = c.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 2600;
    filter.Q.value = 1.2;
    const g = c.createGain();
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    src.connect(filter).connect(g).connect(master);
    src.start(t);
    src.stop(t + 0.035);
  }

  // Metronome beat: the uploaded samples when decoded, otherwise a synthesized woodblock.
  function beat(time, accent) {
    const buf = accent ? accentBuffer : clickBuffer;
    if (buf) {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(master);
      src.start(time);
      return;
    }
    woodblock(time, accent);
  }

  // Woodblock fallback: two short sine partials with a fast pitch drop plus a click of noise.
  function woodblock(time, accent) {
    const c = ctx;
    const base = accent ? 1250 : 880;
    const vol = accent ? 1.0 : 0.7;
    [[1, 1], [2.4, 0.35]].forEach(([ratio, amp]) => {
      const osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(base * ratio, time);
      osc.frequency.exponentialRampToValueAtTime(base * ratio * 0.6, time + 0.06);
      const g = c.createGain();
      g.gain.setValueAtTime(vol * amp, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.09);
      osc.connect(g).connect(master);
      osc.start(time);
      osc.stop(time + 0.1);
    });
    const src = c.createBufferSource();
    src.buffer = noiseBuffer;
    const hp = c.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 3000;
    const g = c.createGain();
    g.gain.setValueAtTime(vol * 0.5, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.02);
    src.connect(hp).connect(g).connect(master);
    src.start(time);
    src.stop(time + 0.025);
  }

  // ---------- Wheel ----------
  const canvas = document.getElementById('wheel');
  const cx2d = canvas.getContext('2d');
  const wheelHint = document.getElementById('wheelHint');
  const clefEl = document.querySelector('.clef');
  const R = canvas.width / 2;
  let angle = 0;             // current rotation in radians (canvas coords, clockwise positive)
  let spinning = false;
  let winner = null;         // entry object the pointer landed on
  let lastTickIndex = -1;
  let spinToken = 0;         // bumped to cancel an in-progress spin

  function activeEntries() {
    return state.entries.filter(e => e.name.trim() !== '');
  }

  function textColorFor(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return lum > 150 ? '#1a1a1a' : '#ffffff';
  }

  function drawWheel() {
    const entries = activeEntries();
    const n = entries.length;
    const c = cx2d;
    c.clearRect(0, 0, canvas.width, canvas.height);
    c.save();
    c.translate(R, R);
    if (n === 0) {
      c.fillStyle = '#e3e6ea';
      c.beginPath(); c.arc(0, 0, R - 6, 0, TAU); c.fill();
      c.restore();
      return;
    }
    const slice = TAU / n;
    for (let i = 0; i < n; i++) {
      const start = angle + i * slice;
      c.beginPath();
      c.moveTo(0, 0);
      c.arc(0, 0, R - 6, start, start + slice);
      c.closePath();
      c.fillStyle = entries[i].color;
      c.fill();
      if (n > 1) {
        c.strokeStyle = 'rgba(0,0,0,0.12)';
        c.lineWidth = 2;
        c.stroke();
      }
    }
    // labels
    for (let i = 0; i < n; i++) {
      const mid = angle + (i + 0.5) * slice;
      c.save();
      c.rotate(mid);
      const label = entries[i].name.trim();
      let size = n <= 4 ? 64 : n <= 8 ? 50 : n <= 12 ? 40 : 32;
      c.textAlign = 'right';
      c.textBaseline = 'middle';
      const maxWidth = R - 6 - 40 - R * 0.15;
      do {
        c.font = `800 ${size}px Nunito, "Avenir Next", "Segoe UI", system-ui, sans-serif`;
        size -= 2;
      } while (c.measureText(label).width > maxWidth && size > 14);
      c.fillStyle = textColorFor(entries[i].color);
      c.shadowColor = 'rgba(0,0,0,0.25)';
      c.shadowBlur = 4;
      c.fillText(label, R - 40, 0);
      c.restore();
    }
    c.restore();
    clefEl.style.transform = `translate(-50%, -50%) rotate(${angle}rad)`;
    // rim
    c.beginPath();
    c.arc(R, R, R - 6, 0, TAU);
    c.strokeStyle = 'rgba(0,0,0,0.25)';
    c.lineWidth = 3;
    c.stroke();
  }

  function pointerIndex(n) {
    const p = ((-angle) % TAU + TAU) % TAU;
    return Math.min(n - 1, Math.floor(p / (TAU / n)));
  }

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  // Edit page -> play page. Checks the entries, then idles until the user spins.
  function enterPlay() {
    const entries = activeEntries();
    if (entries.length < 2) {
      alert('Add at least two named choices to spin the wheel.');
      return false;
    }
    // Any blank BPM must be filled in before we spin.
    for (const e of state.entries) {
      if (e.name.trim() === '') continue;
      if (e.bpm === '' || !Number.isFinite(+e.bpm)) {
        const answer = prompt(`Enter a BPM for "${e.name.trim()}" (${BPM_MIN}-${BPM_MAX}):`);
        if (answer === null) return false;
        const v = parseInt(answer, 10);
        if (!Number.isFinite(v)) { alert('That is not a number.'); return false; }
        e.bpm = clampBpm(v);
      }
    }
    persist();
    renderEntries();
    stopMetronome();
    winner = null;
    hideResult();
    audio();
    setMode('play');
    setMetroHint('Spin the wheel to pick a tempo');
    metroSvg.classList.add('disabled');
    wheelHint.textContent = 'Click the wheel to spin';
    startIdle();
    return true;
  }

  // Slow rotation while the wheel waits for a spin (play page, nothing chosen yet).
  let idling = false;
  const IDLE_SPEED = 0.22;   // radians per second
  function startIdle() {
    if (idling) return;
    idling = true;
    let last = performance.now();
    function frame(now) {
      if (document.body.dataset.mode !== 'play' || spinning || winner) { idling = false; return; }
      angle += IDLE_SPEED * (now - last) / 1000;
      last = now;
      drawWheel();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // forced: an entry the wheel must land on (number keys). Omitted = truly random.
  function spin(forced) {
    if (spinning) return;
    const entries = activeEntries();
    if (entries.length < 2) return;
    stopMetronome();
    winner = null;
    hideResult();
    audio();
    setMetroHint('Spinning...');
    metroSvg.classList.add('disabled');

    const n = entries.length;
    const slice = TAU / n;
    let pick = forced ? entries.indexOf(forced) : -1;
    if (pick < 0) pick = Math.floor(Math.random() * n);
    const target = (pick + 0.15 + Math.random() * 0.7) * slice;     // pointer position on the wheel
    const desired = ((-target) % TAU + TAU) % TAU;                  // rotation that puts target under pointer
    const current = ((angle) % TAU + TAU) % TAU;
    const turns = 5 + Math.floor(Math.random() * 3);
    const delta = turns * TAU + ((desired - current) % TAU + TAU) % TAU;
    const from = angle;
    const duration = 5200 + Math.random() * 1600;
    const t0 = performance.now();
    spinning = true;
    canvas.classList.add('spinning');
    wheelHint.textContent = '';
    lastTickIndex = pointerIndex(n);
    const myToken = ++spinToken;

    function frame(now) {
      if (myToken !== spinToken) return;   // cancelled
      const t = Math.min(1, (now - t0) / duration);
      angle = from + delta * easeOut(t);
      const idx = pointerIndex(n);
      if (idx !== lastTickIndex) { tick(); lastTickIndex = idx; }
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        canvas.classList.remove('spinning');
        winner = entries[pointerIndex(n)];
        setMetronomeTempo(winner.bpm);
        pulseEl.style.background = winner.color;
        playSelection();
        showResult(winner);
        launchConfetti(winner.color);
        metroSvg.classList.remove('disabled');
        setMetroHint('Click the metronome to start');
        wheelHint.textContent = 'Click the wheel to spin again';
      }
    }
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('click', () => {
    if (document.body.dataset.mode === 'edit') enterPlay();
    else spin();
  });

  // ---------- Entries UI ----------
  const entriesEl = document.getElementById('entries');

  function renderEntries() {
    entriesEl.innerHTML = '';
    state.entries.forEach((e, i) => {
      const row = document.createElement('div');
      row.className = 'entry';

      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = (i + 1) + '.';

      const color = document.createElement('input');
      color.type = 'color';
      color.value = e.color;
      color.title = 'Slice color';
      color.addEventListener('input', () => { e.color = color.value; drawWheel(); persist(); });

      const name = document.createElement('input');
      name.type = 'text';
      name.value = e.name;
      name.placeholder = 'Name on wheel';
      name.maxLength = 40;
      name.setAttribute('aria-label', 'Name on wheel');
      name.addEventListener('input', () => { e.name = name.value; drawWheel(); persist(); });

      const bpm = document.createElement('input');
      bpm.type = 'number';
      bpm.min = BPM_MIN; bpm.max = BPM_MAX; bpm.step = 1;
      bpm.value = e.bpm;
      bpm.placeholder = 'BPM';
      bpm.setAttribute('aria-label', 'Beats per minute');
      if (e.bpm === '') bpm.classList.add('missing');
      bpm.addEventListener('input', () => {
        e.bpm = bpm.value === '' ? '' : bpm.value;
        bpm.classList.toggle('missing', bpm.value === '');
        persist();
      });
      bpm.addEventListener('change', () => {
        if (bpm.value !== '') { e.bpm = clampBpm(+bpm.value); bpm.value = e.bpm; persist(); }
      });

      const del = document.createElement('button');
      del.className = 'icon';
      del.type = 'button';
      del.textContent = '\u00D7';
      del.title = 'Remove choice';
      del.setAttribute('aria-label', 'Remove ' + (e.name || 'choice'));
      del.addEventListener('click', () => {
        state.entries.splice(i, 1);
        renderEntries(); drawWheel(); persist();
      });

      row.append(num, color, name, bpm, del);
      entriesEl.appendChild(row);
    });
  }

  document.getElementById('add').addEventListener('click', () => {
    const used = new Set(state.entries.map(e => e.color.toLowerCase()));
    const color = PRESET_COLORS.find(c => !used.has(c)) || PRESET_COLORS[state.entries.length % PRESET_COLORS.length];
    state.entries.push({ name: '', color, bpm: '' });
    renderEntries(); drawWheel(); persist();
    const inputs = entriesEl.querySelectorAll('input[type="text"]');
    inputs[inputs.length - 1].focus();
  });

  const accentEl = document.getElementById('accent');
  const meterEl = document.getElementById('meter');
  accentEl.checked = state.accent;
  meterEl.value = String(state.meter);
  accentEl.addEventListener('change', () => { state.accent = accentEl.checked; persist(); });
  meterEl.addEventListener('change', () => { state.meter = +meterEl.value; persist(); });

  document.getElementById('copy').addEventListener('click', async () => {
    const url = location.origin + location.pathname + '#w=' + encodeState();
    try {
      await navigator.clipboard.writeText(url);
      setStatus('Link copied');
    } catch (e) {
      prompt('Copy this link:', url);
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => setStatus(''), 2200);
  });

  // Number keys 1-9 spin the wheel and land it on that spot in the choices list.
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!/^[1-9]$/.test(e.key) || spinning) return;
    const entry = state.entries[+e.key - 1];
    if (!entry || entry.name.trim() === '') return;
    if (document.body.dataset.mode === 'edit' && !enterPlay()) return;
    spin(entry);
  });

  function cancelSpin() {
    if (!spinning) return;
    spinToken++;
    spinning = false;
    canvas.classList.remove('spinning');
  }

  document.getElementById('back').addEventListener('click', () => {
    cancelSpin();
    stopMetronome();
    hideResult();
    winner = null;
    setMode('edit');
    wheelHint.textContent = 'Click the wheel to open the metronome view';
  });

  function setMode(mode) {
    document.body.dataset.mode = mode;
    // Canvas size may change with layout; redraw next frame.
    requestAnimationFrame(drawWheel);
  }

  // ---------- Metronome ----------
  const metroSvg = document.getElementById('metronome');
  const armEl = document.getElementById('arm');
  const weightEl = document.getElementById('weight');
  const metroHint = document.getElementById('metroHint');
  const MAX_ARM = 27;                 // degrees each side
  const WEIGHT_TOP = 80, WEIGHT_BOTTOM = 318;   // y positions along the arm (SVG units)
  let running = false;
  let bpm = 100;
  let beatDur = 0.6;
  let startTime = 0;
  let nextTime = 0;
  let beatCount = 0;
  let schedTimer = null;
  let armAngle = 0;
  const pulseEl = document.getElementById('pulse');
  let pendingBeats = [];   // beats scheduled in audio but not yet shown on screen

  // Tick marks on the scale slot, purely decorative (no BPM numbers on purpose).
  (function drawTicks() {
    const g = document.getElementById('ticks');
    let html = '';
    for (let y = 76; y <= 320; y += 8) {
      const long = ((y - 76) / 8) % 5 === 0;
      html += `<line x1="${long ? 128 : 134}" y1="${y}" x2="141" y2="${y}"/>`;
      html += `<line x1="159" y1="${y}" x2="${long ? 172 : 166}" y2="${y}"/>`;
    }
    g.innerHTML = html;
  })();

  function setMetronomeTempo(value) {
    bpm = clampBpm(+value);
    beatDur = 60 / bpm;
    // Slower tempo = weight higher on the arm, like a real metronome.
    const f = (bpm - BPM_MIN) / (BPM_MAX - BPM_MIN);
    const y = WEIGHT_TOP + (WEIGHT_BOTTOM - WEIGHT_TOP) * f;
    weightEl.setAttribute('transform', `translate(0 ${y.toFixed(1)})`);
  }

  function setMetroHint(text, live) {
    metroHint.textContent = text;
    metroHint.classList.toggle('live', !!live);
  }

  function scheduler() {
    const c = ctx;
    while (nextTime < c.currentTime + 0.12) {
      const accent = state.accent && beatCount % state.meter === 0;
      beat(nextTime, accent);
      pendingBeats.push({ time: nextTime, accent });
      beatCount++;
      nextTime += beatDur;
    }
    schedTimer = setTimeout(scheduler, 25);
  }

  function startMetronome() {
    if (!winner) return;
    const c = audio();
    // Arm starts at center and swings out to the first click.
    startTime = c.currentTime + 0.5 * beatDur + 0.05;
    nextTime = startTime;
    beatCount = 0;
    pendingBeats = [];
    running = true;
    scheduler();
    setMetroHint('Click the metronome to stop', true);
  }

  function stopMetronome() {
    if (!running) return;
    running = false;
    clearTimeout(schedTimer);
    pendingBeats = [];
    if (winner) setMetroHint('Click the metronome to start');
  }

  function toggleMetronome() {
    if (spinning || !winner) return;
    running ? stopMetronome() : startMetronome();
  }
  metroSvg.addEventListener('click', toggleMetronome);
  metroSvg.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleMetronome(); }
  });

  // Arm animation: cosine motion so the arm is at an extreme exactly on each click.
  function flash(accent) {
    pulseEl.classList.remove('beat', 'beat-accent');
    void pulseEl.offsetWidth;   // restart the animation even if the previous one is still running
    pulseEl.classList.add(accent ? 'beat-accent' : 'beat');
  }

  function animateArm() {
    if (running && ctx) {
      const now = ctx.currentTime;
      const phase = (now - startTime) / beatDur;
      armAngle = phase < -0.5 ? 0 : MAX_ARM * Math.cos(Math.PI * phase);
      while (pendingBeats.length && pendingBeats[0].time <= now) {
        flash(pendingBeats.shift().accent);
      }
    } else {
      armAngle += (0 - armAngle) * 0.12;
      if (Math.abs(armAngle) < 0.05) armAngle = 0;
    }
    armEl.setAttribute('transform', `rotate(${armAngle.toFixed(2)} 150 360)`);
    requestAnimationFrame(animateArm);
  }

  // ---------- Result banner + confetti ----------
  const resultEl = document.getElementById('result');
  const confettiCanvas = document.getElementById('confetti');
  const confettiCtx = confettiCanvas.getContext('2d');
  let confettiPieces = [];
  let confettiRunning = false;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function showResult(entry) {
    resultEl.textContent = entry.name.trim();
    resultEl.style.borderBottomColor = entry.color;
    resultEl.style.color = entry.color;
    resultEl.classList.remove('show');
    void resultEl.offsetWidth;
    resultEl.classList.add('show');
  }
  function hideResult() {
    resultEl.classList.remove('show');
  }

  function sizeConfetti() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    confettiCanvas.width = Math.floor(window.innerWidth * dpr);
    confettiCanvas.height = Math.floor(window.innerHeight * dpr);
    confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', sizeConfetti);

  function launchConfetti(mainColor) {
    if (reducedMotion) return;
    sizeConfetti();
    const W = window.innerWidth, H = window.innerHeight;
    const palette = [mainColor, mainColor, '#ffffff', '#ffd23f', '#3369e8', '#d50f25', '#009925'];
    const sources = [
      { x: W * 0.12, y: H * 0.9, dir: -1.1 },
      { x: W * 0.88, y: H * 0.9, dir: -2.0 },
      { x: W * 0.5, y: H * 0.35, dir: -1.57 },
    ];
    sources.forEach(src => {
      for (let i = 0; i < 70; i++) {
        const a = src.dir + (Math.random() - 0.5) * 1.1;
        const speed = 9 + Math.random() * 11;
        confettiPieces.push({
          x: src.x, y: src.y,
          vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
          w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
          rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.3,
          color: palette[Math.floor(Math.random() * palette.length)],
          life: 1,
        });
      }
    });
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiFrame); }
  }

  function confettiFrame() {
    const W = window.innerWidth, H = window.innerHeight;
    confettiCtx.clearRect(0, 0, W, H);
    confettiPieces = confettiPieces.filter(p => p.y < H + 20 && p.life > 0);
    for (const p of confettiPieces) {
      p.vy += 0.35;             // gravity
      p.vx *= 0.985;            // drag
      p.vy *= 0.985;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      p.life -= 0.004;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)) + 1);
      confettiCtx.restore();
    }
    if (confettiPieces.length) {
      requestAnimationFrame(confettiFrame);
    } else {
      confettiRunning = false;
      confettiCtx.clearRect(0, 0, W, H);
    }
  }

  // ---------- Init ----------
  renderEntries();
  drawWheel();
  setMetronomeTempo(100);
  requestAnimationFrame(animateArm);
  window.addEventListener('hashchange', () => {
    const s = decodeHash();
    if (s) { state = s; renderEntries(); accentEl.checked = state.accent; meterEl.value = String(state.meter); drawWheel(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopMetronome(); });
})();
</script>
</body>
</html>
